<!doctype html>
<html lang="ru">

<title>Halloween — фон домашки</title>
<style>
:root{--m:https://classroom.wowteach.ru/media/halloween/}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#1a1b2e;background:#17151f}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;background:#17151f;border-bottom:1px solid #2e2a3d}
.tabs button{background:#1f1c2a;border:1px solid #2e2a3d;color:#ecebf3;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:#7b5cf0;border-color:#7b5cf0}
.cap{color:#c9c5d8;font-size:14px;padding:8px 16px 0;max-width:900px;margin:0 auto}
.page{min-height:calc(100vh - 60px);padding:0 0 30px;background-size:cover;background-position:center bottom;background-attachment:fixed}
.top{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(0,0,0,.06)}
.top-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.top b{font-size:16px}.top span{font-size:13px;color:#666}
.steps{max-width:900px;margin:0 auto;display:flex;gap:6px;padding:8px 16px;flex-wrap:wrap}
.st{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgba(255,255,255,.85);color:#7a7f92}
.st.ok{background:#dff3ec;color:#0d6155}.st.cur{background:#6b5ad6;color:#fff}
.card{max-width:860px;margin:14px auto 0;background:#fff;border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.35);padding:20px 22px}
.card h3{margin:0 0 4px;font-size:19px}.card .sub{color:#777;font-size:14px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.opt{border:2px solid #e3e1ec;border-radius:14px;padding:10px;text-align:center;font-weight:600}
.opt img{width:100%;height:110px;object-fit:contain;display:block;margin-bottom:6px}
.opt.sel{border-color:#6b5ad6;background:#f3f0ff}
.bar{max-width:860px;margin:12px auto 0;display:flex;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px}
.btn.g{background:rgba(255,255,255,.9);color:#333}.btn.p{background:#ff7a1a;color:#fff}
/* варианты */
.v1{background-image:url(https://classroom.wowteach.ru/media/halloween/4-6/bg_night.webp)}
.v2{background-image:linear-gradient(rgba(23,14,40,.55),rgba(23,14,40,.55)),url(https://classroom.wowteach.ru/media/halloween/10-12/bg10.webp)}

</head>
<body>
<div class="tabs" id="tabs">
  <button data-k="0">Как сейчас</button>
  <button data-k="1" class="on">А · Ночь с тыквами</button>
  <button data-k="2">Б · Улица, затемнённая</button>
  <button data-k="3">В · Светлый с узором</button>
</div>
<div id="views"></div>
<script>
const cap=['Сейчас: светлый бежевый фон, как у всех домашек.',
'А: ночной фон из урока Halloween 4–6 (луна, тыквы). Карточка задания — белая, как обычно, читается так же. Фон стоит на месте, задание прокручивается поверх.',
'Б: улица с фонарями из урока 10–12, притемнённая, чтобы не спорила с заданием. Для старших.',
'В: светлый, почти как сейчас, но с бледным узором — тыквы и летучие мыши. Самый спокойный вариант.'];
const imgs=['t_pumpkin','cy_bat','cy_ghost','cy_cat'],names=['pumpkin','bat','ghost','cat'];
const page=k=>`<div class="sw ${k==1?'on':''}" data-k="${k}"><div class="cap">${cap[k]}</div><div class="page v${k}" style="${k==0?'background:#FFF6EC':''}">
<div class="top"><div class="top-in"><b>Halloween · Homework 1</b><span>до 31.10</span></div></div>
<div class="steps"><span class="st ok">✓</span><span class="st ok">✓</span><span class="st cur">3</span><span class="st">4</span><span class="st">5</span><span class="st">6</span></div>
<div class="card"><h3>🎧 Послушай и выбери картинку</h3><div class="sub">Нажми 🔊, послушай слово и выбери правильную картинку</div>
<div class="opts">${imgs.map((m,i)=>`<div class="opt ${i==1?'sel':''}"><img src="https://classroom.wowteach.ru/media/halloween/10-12/${m}.webp" alt="">${names[i]}</div>`).join('')}</div></div>
<div class="bar"><button class="btn g">← Назад</button><button class="btn p">Дальше →</button></div>
<div class="card"><h3>✍️ Впиши слово</h3><div class="sub">It's Halloween! I'm wearing a scary ______ .</div></div>
</div></div>`;
views.innerHTML=[0,1,2,3].map(page).join('');
tabs.onclick=e=>{const k=e.target.dataset.k;if(!k)return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.k===k))};
</script>
</body>
</html>
