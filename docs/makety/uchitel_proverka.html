<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учитель: проверка, задать, карточка — макет</title>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Цвета и шрифт — как в index.html */
:root{
  --brand:#5B4BE0; --brand-d:#3A2FA8; --brand-soft:#F0EEFD;
  --ink:#1A1B2E; --mut:#7A7F92; --faint:#A6AAB9; --line:#E8E7EE; --bg:#F7F6F9;
  --ok:#0D6155; --ok-soft:#E2F1EE; --warn:#A9660B; --warn-soft:#FBF0DE; --bad:#B3261E; --bad-soft:#FBE9E7;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Golos Text',-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{width:100%;resize:vertical;min-height:60px}

/* панель макета */
.panel{position:sticky;top:0;z-index:100;background:#1D1A29;color:#fff;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:8px 12px;font-size:13px}
.grp{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.grp>span{opacity:.5;margin-right:4px}
.grp button{color:#fff;opacity:.6;padding:5px 10px;border-radius:8px;font-size:13px;border:0;background:none}
.grp button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:700}
.note{opacity:.6;font-size:12px;flex-basis:100%}

/* оболочка как в classroom */
.app{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 44px)}
.side{background:#fff;border-right:1px solid var(--line);padding-bottom:16px}
.logo{font-weight:700;font-size:16px;height:58px;display:flex;align-items:center;gap:10px;padding:0 18px}
.logo:before{content:"C";width:25px;height:25px;border-radius:8px;background:var(--brand);color:#fff;font-size:12px;display:grid;place-items:center}
.tab{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 10px;border-radius:10px;color:#3d4052;font-size:14.5px;cursor:pointer}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--brand-soft);color:var(--brand-d);font-weight:600}
.tab .cnt{margin-left:auto;background:var(--warn-soft);color:var(--warn);border-radius:99px;padding:0 8px;font-size:12px;font-weight:700}
.main{min-width:0}
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:relative}
.topbar h1{font-size:18px;margin:0;flex:1}
.bell{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px}
.bell i{position:absolute;top:-5px;right:-5px;background:#E5484D;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px}
.who{font-size:13px;color:var(--mut)}
.page{padding:22px 24px 120px;max-width:1100px}

.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{background:var(--brand-d)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--ink);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:9px}
.btn.warn{background:#fff;border-color:#E9C58F;color:var(--warn)}
.btn.big{padding:11px 20px;font-size:15px}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.g{background:var(--ok-soft);color:var(--ok)} .pill.y{background:var(--warn-soft);color:var(--warn)}
.pill.r{background:var(--bad-soft);color:var(--bad)} .pill.n{background:#EFEEF3;color:var(--mut)} .pill.b{background:var(--brand-soft);color:var(--brand-d)}
.muted{color:var(--mut)} .small{font-size:13px}
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:600;color:var(--mut);text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click:hover td{background:#FBFAFD;cursor:pointer}
.ava{width:34px;height:34px;border-radius:50%;display:inline-grid;place-items:center;font-weight:700;font-size:13px;color:#fff;margin-right:10px;vertical-align:middle}
.seg{display:inline-flex;background:#EFEEF3;border-radius:11px;padding:3px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:9px;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.h2{font-size:16px;font-weight:700;margin:0 0 10px}

/* колокольчик */
.drop{position:absolute;right:20px;top:54px;width:380px;z-index:40;box-shadow:0 18px 50px rgba(30,20,80,.16)}
.drop .it{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.drop .it:hover{background:#FBFAFD}
.drop .it.new{background:#FBFAFF}
.drop .it .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:8px;flex:0 0 auto}
.drop .it .dot.off{background:transparent}

/* проверка */
.rv{display:grid;grid-template-columns:220px 1fr;gap:18px;align-items:start}
.toc{position:sticky;top:120px}
.toc a{display:flex;gap:8px;align-items:center;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--ink);text-decoration:none}
.toc a:hover{background:#fff}
.toc .sc{margin-left:auto;font-size:12px;font-weight:700}
.task{padding:16px 18px;margin-bottom:14px}
.task.ret{outline:2px solid #E9C58F;background:#FFFCF6}
.thd{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.thd b{flex:1}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;margin:2px 0}
.item:hover{background:#FAF9FC}
.item .q{flex:1;min-width:0}
.ans{font-weight:600}
.right{font-size:12.5px;color:var(--mut)}
.mark{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:16px;flex:0 0 auto}
.mark.ok{background:var(--ok-soft);border-color:#BFE0D9;color:var(--ok)}
.mark.no{background:var(--bad-soft);border-color:#F2C6C1;color:var(--bad)}
.mark.fixed{box-shadow:0 0 0 2px var(--brand)}
.cm{border:0;background:none;color:var(--faint);font-size:16px;padding:4px 6px;border-radius:8px}
.cm:hover{background:#EFEEF3;color:var(--brand)}
.cm.has{color:var(--brand)}
.cbox{display:flex;gap:8px;margin:4px 0 6px 44px}
.cbox textarea{min-height:44px}
.cshow{margin:4px 0 6px 44px;background:#FFF8E8;border-radius:10px;padding:8px 12px;font-size:14px}
.cshow b{font-size:11.5px;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;display:block}
.fixednote{font-size:11.5px;color:var(--brand);font-weight:600}
.img{width:62px;height:62px;object-fit:contain;border-radius:8px;background:#FAF9FC}
.player{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 12px}
.player .pb{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0}
.player .wave{flex:1;height:26px;background:repeating-linear-gradient(90deg,#B9B1F3 0 3px,transparent 3px 6px);-webkit-mask:linear-gradient(transparent 20%,#000 20% 80%,transparent 80%)}
.score5{display:inline-flex;gap:4px}
.score5 button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 10px;font-weight:600;font-size:13px}
.score5 button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.bar{position:fixed;left:236px;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:30}
.bar-in{max-width:none;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.bar-in .btn{white-space:nowrap}
.total{display:flex;align-items:center;gap:8px}
.total input{width:70px;font-size:18px;font-weight:700;text-align:center;padding:6px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;white-space:nowrap}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.rtcheck{width:20px;height:20px;accent-color:var(--warn)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1A1B2E;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;z-index:200}

/* карточка ученика */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--mut)}
.unit td.u{background:#FAF9FC;font-weight:700;font-size:13px;color:var(--mut);padding:8px 14px}

/* задать */
.steps3{display:grid;grid-template-columns:1fr 1.3fr .9fr;gap:14px;align-items:start}
.lst{max-height:430px;overflow:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.lrow input{width:17px;height:17px;accent-color:var(--brand)}
.lrow .grow{flex:1;min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;font-size:13px}
.cal div{padding:6px 0;border-radius:8px}
.cal .h{color:var(--faint);font-size:11.5px}
.cal .d{cursor:pointer}
.cal .d:hover{background:var(--bg)}
.cal .d.on{background:var(--brand);color:#fff;font-weight:700}
.cal .d.today{box-shadow:0 0 0 1px var(--brand) inset}
.cal .d.past{color:#cfcfd8}

/* библиотека */
.tree .c{font-weight:700;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.tree .c i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tree .u{padding:8px 14px 8px 34px;border-bottom:1px solid var(--line);font-weight:600;font-size:14px;color:#3d4052}
.tree .l{padding:7px 14px 7px 56px;border-bottom:1px solid var(--line);font-size:14px;display:flex;gap:10px;align-items:center}
.tree .l .grow{flex:1}
</style>
</head>
<body>
<div class="panel" id="panel"></div>
<div class="app">
  <div class="side" id="side"></div>
  <div class="main"><div class="topbar" id="top"></div><div id="page"></div></div>
</div>
<div id="bar"></div>

function itemOk(t,i){ const k=t.id+':'+i; return k in S.ov ? S.ov[k] : t.items[i].auto; }
function taskScore(t){
  if(t.noscore) return null;
  if(t.items){ const ok=t.items.filter((_,i)=>itemOk(t,i)).length; return Math.round(ok*100/t.items.length); }
  return S.sc[t.id]!=null ? S.sc[t.id] : null;
}
function autoTotal(){
  const xs=HW.map(taskScore).filter(x=>x!=null); return xs.length ? Math.round(xs.reduce((a,b)=>a+b,0)/xs.length) : null;
}
function needManual(){ return HW.filter(t=>(t.oral||t.text) && S.sc[t.id]==null); }

  else if(t.oral) body=`<div class="player"><button class="pb">▶</button><span class="wave"></span><span class="muted small">${t.len}</span></div>`;
  else body=`<div style="background:var(--bg);border-radius:12px;padding:10px 14px">${t.text}</div>`;
  const manual = (t.oral||t.text) ? `<div class="row" style="margin-top:10px"><span class="small muted">Балл:</span>
      <input type="number" min="0" max="100" value="${S.sc[t.id]??''}" placeholder="0–100" style="width:90px;font-size:16px;font-weight:700;text-align:center"

}

        <div class="lst">${STU.filter(s=>s.course==='SM2').map(s=>`<label class="lrow"><input type="checkbox" ${S.asg.stu[s.id]?'checked':''} onchange="S.asg.stu['${s.id}']=this.checked; render()">${ava(s)}<span class="grow">${s.name}</span><span class="muted small">SM2 · Unit 1</span></label>`).join('')}</div></div>
      <div class="card"><div style="padding:12px 14px;border-bottom:1px solid var(--line)"><div class="h2">2. Что</div>
        <div class="row"><select style="flex:1"><option>Super Minds 2</option></select><select style="flex:1"><option>Unit 1 · My day</option></select></div>
        <div class="seg" style="margin-top:8px"><button>Планы уроков</button><button class="on">Домашки и тесты</button></div></div>
        <label class="lrow" style="background:#FAF9FC"><input type="checkbox" ${L.every(([id])=>S.asg.les[id])?'checked':''} onchange="${L.map(([id])=>`S.asg.les['${id}']=this.checked;`).join('')} render()"><b class="grow">Весь юнит</b></label>
        <div class="lst">${L.map(([id,t,has])=>{ const who=picked.filter(p=>has[p]); return `<label class="lrow"><input type="checkbox" ${S.asg.les[id]?'checked':''} onchange="S.asg.les['${id}']=this.checked; render()"><span class="grow"><b>${t}</b>
            ${who.length?`<div class="small" style="color:var(--warn)">уже задано: ${who.map(w=>stuById(w).name).join(', ')}</div>`:''}</span>
            ${Object.keys(has).length?`<span class="muted small">задано ${Object.keys(has).length}</span>`:''}</label>`; }).join('')}</div></div>
      <div class="card" style="padding:12px 14px"><div class="h2">3. Срок сдачи</div>
        <div class="row" style="gap:6px;margin-bottom:10px">${[[16,'Завтра'],[18,'Через 3 дня'],[22,'Через неделю']].map(([d,t])=>`<button class="pill ${day===d?'b':'n'}" style="border:0;cursor:pointer" onclick="S.asg.day=${d}; render()">${t}</button>`).join('')}</div>
        <div class="muted small" style="margin-bottom:8px">Октябрь 2026</div>${cal}
        <div class="row" style="margin-top:10px">${day?`<span class="pill b">до ${day} окт, 23:59</span>`:(S.due==='manual'?'<span class="pill y">выберите день</span>':'<span class="pill n">без срока</span>')}
</div><div class="muted small" style="margin-top:6px">Без срока задать нельзя — день выбирается каждый раз.</div></div>
    </div>
    <div class="card" style="margin-top:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span>Задать <b>${les.length}</b> ${les.length===1?'урок':'урока'} · <b>${picked.length}</b> ${picked.length===1?'ученику':'ученикам'}${day?` · до ${day} окт`:''}</span>
      <span class="muted small">Уже заданное повторно не задаётся — у этих учеников останутся их ответы.</span><span style="flex:1"></span>
      <button class="btn big" ${can?'':'disabled style="opacity:.45"'} onclick="done('Задано. Ученики увидят домашку в кабинете')">Задать</button></div></div>`;
}

/* ── 5. библиотека ── */
// Данные: курс → юниты → уроки (kind: plan / hw), опубликован или нет
const LIB = [
  {c:'Super Minds 2', cc:'SM2', col:'#5B4BE0', units:[
    {u:'Unit 1 · My day', n:1, ls:[['p11','Lesson 1 · Vocabulary 1','plan',1],['p12','Lesson 2 · Grammar','plan',1],['h11','Homework 1','hw',1],['h12','Homework 2','hw',1],['h13','Homework 3','hw',0],['t1','Unit 1 Test','hw',0]]},
    {u:'Unit 2 · Free time', n:2, ls:[['p21','Lesson 1 · Vocabulary 1','plan',0],['h21','Homework 1','hw',0],['h22','Homework 2','hw',0],['h23','Homework 3','hw',0],['t2','Unit 2 Test','hw',0]]},
    {u:'Final Test', n:null, ls:[['ft','Final Test','hw',0]]},
  ]},
  {c:'Wow Dragon 1', cc:'WD1', col:'#0D8A6A', units:[
    {u:'Module 1', ls:[['w1','Homework 1','hw',1],['w2','Homework 2','hw',1],['w3','Homework 3','hw',0],['wp1','Lesson 1','plan',0]]},
  ]},
];
function libVisible(l, kind){
  const [id,t,k,p]=l;
  if((kind==='plans')!==(k==='plan')) return false;
  if(S.pub==='pub' && !p) return false;
  if(S.pub==='draft' && p) return false;
  if(S.q && !t.toLowerCase().includes(S.q.toLowerCase().replace(/^(sm|wd|gg)\d+\s*/,'').replace(/^unit \d+\s*/,''))) return false;
  return true;
}
function libToggle(ids, on){ ids.forEach(id=>{ if(on) S.sel[id]=1; else delete S.sel[id]; }); render(); }
function libPublish(on){
  const ids=Object.keys(S.sel); let n=0;
  LIB.forEach(c=>c.units.forEach(u=>u.ls.forEach(l=>{ if(ids.includes(l[0]) && l[3]!==(on?1:0)){ l[3]=on?1:0; n++; } })));
  S.sel={}; S.toast=(on?'Опубликовано: ':'Снято с публикации: ')+n; render(); setTimeout(()=>{ S.toast=''; render(); },2600);
}
function libOpen(k){ if(S.open[k]) delete S.open[k]; else S.open[k]=1; render(); }
function libAll(on){ S.open={}; if(on) LIB.forEach((c,ci)=>{ S.open['c'+ci]=1; c.units.forEach((_,ui)=>S.open['c'+ci+':u'+ui]=1); }); render(); }
function pgLibrary(){
  const pubSeg = `<div class="seg">${[['all','Все'],['pub','Опубликованные'],['draft','Неопубликованные']].map(([k,t])=>`<button class="${S.pub===k?'on':''}" onclick="S.pub='${k}'; render()">${t}</button>`).join('')}</div>`;
  const box=(ids,on,title)=>`<input type="checkbox" style="width:17px;height:17px;accent-color:var(--brand)" ${on?'checked':''} ${ids.length?'':'disabled'} title="${title}" onclick="event.stopPropagation()" onchange="libToggle(${JSON.stringify(ids).replace(/"/g,"'")}, this.checked)">`;
  const arrow=o=>`<span style="width:16px;color:var(--mut);display:inline-block">${o?'▾':'▸'}</span>`;
  let html='', all=[];
  LIB.forEach((c,ci)=>{
    const ck='c'+ci, copen=!!S.open[ck];
    const units=c.units.map((u,ui)=>{ const uk=ck+':u'+ui, kind=S.ukind[uk]||'hw';
      return {u, uk, kind, ls:u.ls.filter(l=>libVisible(l,kind)), plans:u.ls.filter(l=>l[2]==='plan').length, hws:u.ls.filter(l=>l[2]!=='plan').length,
              drafts:u.ls.filter(l=>!l[3]).length}; });
    const cids=units.flatMap(x=>x.ls.map(l=>l[0])); all.push(...cids);
    const cdrafts=units.reduce((a,x)=>a+x.drafts,0);
    html += `<div class="c" style="cursor:pointer" onclick="libOpen('${ck}')">${arrow(copen)}${box(cids, cids.length&&cids.every(id=>S.sel[id]), 'Выбрать видимое в курсе')}<i style="background:${c.col}"></i>${c.c}
      <span style="margin-left:auto">${cdrafts?`<span class="pill y">черновиков: ${cdrafts}</span>`:'<span class="pill g">всё опубликовано</span>'}</span></div>`;
    if(!copen) return;
    units.forEach(x=>{
      const uopen=!!S.open[x.uk], uids=x.ls.map(l=>l[0]);
      html += `<div class="u" style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="libOpen('${x.uk}')">${arrow(uopen)}${box(uids, uids.length&&uids.every(id=>S.sel[id]), 'Выбрать видимое в юните')}${x.u.u}
        <span class="muted small" style="font-weight:400">планов ${x.plans} · домашек и тестов ${x.hws}</span>
        <span style="margin-left:auto">${x.drafts?`<span class="pill y">черновиков: ${x.drafts}</span>`:'<span class="pill g">всё опубликовано</span>'}</span></div>`;
      if(!uopen) return;
      html += `<div class="l" style="padding-left:56px;background:#FCFBFE"><div class="seg">${[['plans','Планы уроков'],['hw','Домашки и тесты']].map(([k,t])=>`<button class="${x.kind===k?'on':''}" onclick="S.ukind['${x.uk}']='${k}'; render()">${t}</button>`).join('')}</div></div>`;
      html += x.ls.map(([id,t,k,p])=>`<div class="l" style="padding-left:72px;${S.sel[id]?'background:#F7F5FF':''}">${box([id], S.sel[id], '')}<span class="grow">${code(c.cc,x.u.n,t)}</span>
          ${/Test/.test(t)?'<span class="pill n">тест</span>':''}${p?'<span class="pill g">опубликован</span>':'<span class="pill y">черновик</span>'}<button class="btn sec sm">Открыть</button></div>`).join('')
        || `<div class="l muted small" style="padding-left:72px">ничего не подходит под фильтр</div>`;
    });
  });
  const n=Object.keys(S.sel).length;
  return `<div class="page"><div class="row" style="margin-bottom:14px">${pubSeg}
      <input placeholder="Поиск по названию" value="${S.q}" onchange="S.q=this.value; render()" style="width:200px">
      <a href="#" class="small" onclick="libAll(true);return false">развернуть всё</a><a href="#" class="small" onclick="libAll(false);return false">свернуть всё</a>
      <span style="flex:1"></span><button class="btn">+ Материал</button></div>
    <div class="row" style="margin-bottom:8px"><label class="chk small">${box(all, all.length && all.every(id=>S.sel[id]), '')} Выбрать всё видимое (${all.length})</label>
      <span class="muted small">Галочка у курса или юнита выбирает всё, что сейчас видно внутри.</span></div>
    <div class="card tree">${html}</div>
    ${n?`<div class="bar"><div class="bar-in"><b>Выбрано: ${n}</b><a href="#" class="small" onclick="S.sel={}; render(); return false">снять выбор</a><span style="flex:1"></span>
      <button class="btn sec big" onclick="libPublish(false)">Снять с публикации</button><button class="btn big" onclick="libPublish(true)">✓ Опубликовать</button></div></div>`:''}</div>`;
}

/* ── сборка ── */
function render(){
  panel(); side();
  const T={queue:'Проверка',review:'Проверка домашки',student:'Карточка ученика',assign:'Задать материал',library:'Библиотека'};
  document.getElementById('top').innerHTML = topBar(T[S.scr]);
  const P={queue:pgQueue,review:pgReview,student:pgStudent,assign:pgAssign,library:pgLibrary};
  document.getElementById('page').innerHTML = P[S.scr]();
  document.getElementById('bar').innerHTML = (S.scr==='review'?barReview():'') + (S.toast?`<div class="toast">${S.toast}</div>`:'');
}
render();
</script>
</body>
</html>
