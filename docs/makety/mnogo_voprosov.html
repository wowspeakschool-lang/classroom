<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Много вопросов в задании</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box} body{margin:0;font-family:Montserrat,system-ui,sans-serif;color:#1F1A3D;background:linear-gradient(180deg,#FFF7EC,#FBEFF7);min-height:100vh}
button{font-family:inherit;cursor:pointer}
.panel{position:sticky;top:0;z-index:5;background:#1D1A29;color:#fff;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:8px 12px;font-size:13px}
.panel button{color:#fff;opacity:.6;padding:6px 11px;border-radius:8px;border:0;background:none;font-size:13px}
.panel button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:700}
.panel .note{opacity:.65;font-size:12px;flex-basis:100%}
.wrap{max-width:900px;margin:0 auto;padding:16px}
.task{background:#fff;border-radius:26px;padding:20px;box-shadow:0 10px 30px rgba(80,40,90,.08)}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:12px} .hd .em{font-size:34px} .hd small{display:block;color:#ABA6C2;font-size:12px;font-weight:700} .hd h3{margin:0;font-size:22px}
.q{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin:4px 0 12px}
.no{width:28px;height:28px;border-radius:50%;background:#EEE9FF;color:#5B3FD6;display:grid;place-items:center;font-size:13px;flex:0 0 auto}
.snd{width:40px;height:40px;border-radius:50%;border:0;background:#EEE9FF;font-size:18px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opt{background:#fff;border:2px solid #ECE8F3;border-radius:18px;padding:8px;display:grid;place-items:center}
.opt img{width:100%;max-width:150px}
.opt.on{border-color:#7C5CFA;background:#F6F3FF;box-shadow:0 0 0 3px #E4DCFF}
.opt.sm img{max-width:92px} .opt.sm{border-radius:14px;padding:6px}
.dots{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #ECE8F3;background:#fff;font-weight:800;color:#8C86A8}
.dot.cur{border-color:#7C5CFA;color:#5B3FD6} .dot.ok{background:#22B07D;border-color:#22B07D;color:#fff}
.nav{display:flex;justify-content:space-between;margin-top:16px} .ghost{background:#fff;border:2px solid #ECE8F3;border-radius:14px;padding:10px 16px;font-weight:700}
.line{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid #F0ECF6;border-radius:16px;margin-bottom:8px;cursor:pointer;font-weight:700}
.line img{width:44px} .line .ch{margin-left:auto;color:#7C5CFA;font-size:13px}
.sep{border-top:1px dashed #EEE;margin:14px 0}
.done{color:#22B07D;font-weight:800;font-size:13px;background:#E3F6EE;border-radius:99px;padding:4px 10px;margin-left:auto}
.verdict{margin-top:16px;background:#fff;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.5;color:#4b4668}
.verdict b{color:#1F1A3D}
@media(max-width:600px){.opts{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div class="panel"><button data-v="now" class="on">Как сейчас</button><button data-v="a">А. По одному вопросу</button><button data-v="b">Б. Отвеченные сворачиваются</button><button data-v="c">В. Гармошка</button>
<div class="note">Пример — WD2 «Послушай и выбери, куда лететь», 5 вопросов. Нажимайте на компасы. Всё это остаётся ОДНИМ заданием — новых блоков нет.</div></div>

const Q=[['s','n','w','e'],['w','e','n','s'],['e','n','w','s'],['n','s','e','w'],['w','s','n','e']];
const S={v:'now',ans:{},cur:0,open:0};
function opt(qi,k,sm){ return `<button class="opt ${sm?'sm':''} ${S.ans[qi]===k?'on':''}" onclick="pick(${qi},'${k}')"><img src="${IMG[k]}"></button>`; }
function qhead(i){ return `<div class="q"><span class="no">${i+1}</span>Послушай и выбери, куда лететь.<button class="snd">🔊</button></div>`; }
function pick(qi,k){ S.ans[qi]=k;
  if(S.v==='a'){ R(); if(qi<Q.length-1) setTimeout(()=>{ S.cur=qi+1; R(); },600); return; }
  if(S.v==='c'){ const nx=Q.findIndex((_,i)=>S.ans[i]==null); S.open=nx<0?-1:nx; }
  R(); }
const head=()=>`<div class="hd"><span class="em">✅</span><div><small>Задание 3 из 9</small><h3>Выбери ответ</h3></div>${Object.keys(S.ans).length===Q.length?'<span class="done">✓ готово</span>':''}</div>`;
function vNow(){ return Q.map((q,i)=>qhead(i)+`<div class="opts">${q.map(k=>opt(i,k)).join('')}</div>`).join('<div class="sep"></div>'); }
function vA(){ const i=S.cur;
  return `<div class="dots">${Q.map((_,j)=>`<button class="dot ${j===i?'cur':''} ${S.ans[j]!=null?'ok':''}" onclick="S.cur=${j};R()">${S.ans[j]!=null&&j!==i?'✓':j+1}</button>`).join('')}<span style="margin-left:6px;color:#8C86A8;font-size:13px;font-weight:700">Вопрос ${i+1} из ${Q.length}</span></div>`
   + qhead(i)+`<div class="opts">${Q[i].map(k=>opt(i,k)).join('')}</div>`
   + `<div class="nav"><button class="ghost" ${i?'':'disabled style="opacity:.4"'} onclick="S.cur--;R()">← Предыдущий</button><button class="ghost" ${i<Q.length-1?'':'disabled style="opacity:.4"'} onclick="S.cur++;R()">Следующий →</button></div>`; }
function vB(){ return Q.map((q,i)=> S.ans[i]!=null && S.edit!==i
   ? `<div class="line" onclick="S.edit=${i};R()"><span class="no">${i+1}</span>✓ Ответ выбран<img src="${IMG[S.ans[i]]}"><span class="ch">изменить</span></div>`
   : qhead(i)+`<div class="opts">${q.map(k=>opt(i,k,true)).join('')}</div><div class="sep"></div>`).join(''); }
function vC(){ return Q.map((q,i)=> S.open===i
   ? `<div style="border:2px solid #E4DCFF;border-radius:18px;padding:12px;margin-bottom:8px">${qhead(i)}<div class="opts">${q.map(k=>opt(i,k)).join('')}</div></div>`
   : `<div class="line" onclick="S.open=${i};R()"><span class="no">${i+1}</span>${S.ans[i]!=null?`✓ <img src="${IMG[S.ans[i]]}">`:'<span style="color:#8C86A8">не отвечено</span>'}<span class="ch">${S.ans[i]!=null?'изменить':'открыть'}</span></div>`).join(''); }
const V={now:['Все вопросы друг под другом, картинки крупные — длинная лента, легко потеряться.',vNow],
 a:['<b>А. По одному вопросу.</b> Внутри задания — кружки 1…5, на экране один вопрос. Выбрал ответ — через полсекунды следующий. Можно вернуться кружком или стрелкой. Самое спокойное для детей; похоже на то, как задания идут по экранам.',vA],
 b:['<b>Б. Отвеченные сворачиваются.</b> Картинки меньше, все вопросы видны; ответил — вопрос сжимается в строку с выбранной картинкой, «изменить» раскрывает обратно. Лента укорачивается по мере ответов.',vB],
 c:['<b>В. Гармошка.</b> Открыт один вопрос, остальные — строками «не отвечено / ✓». После ответа сам открывается следующий неотвеченный.',vC]};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{ S.v=b.dataset.v; S.ans={}; S.cur=0; S.open=0; S.edit=null; document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x===b)); R(); });
function R(){ document.getElementById('root').innerHTML=`<div class="task">${head()}${V[S.v][1]()}</div><div class="verdict">${V[S.v][0]}</div>`; }
R();
</script></body></html>
