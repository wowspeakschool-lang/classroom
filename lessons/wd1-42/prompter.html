<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C3DE0">
<title>Суфлёр · Wow Dragon 1 · Lesson 42</title>
<style>
:root{--purple:#6C3DE0;--purple-d:#4A24A8;--gold:#FBC91B;--gold-d:#C98F00;
  --ink:#2B2140;--line:#E4D9F7;
  /* ЦВЕТА БЛОКОВ — единые для всех уроков */
  --c-tl:#6C3DE0;      --bg-tl:#F5F1FF;    /* фиолетовый · речь по-английски  */
  --c-ru:#E08A00;      --bg-ru:#FFF7E8;    /* оранжевый  · речь по-русски     */
  --c-note:#7A8BA6;    --bg-note:#F2F5F9;  /* серый      · заметка, не вслух  */
  --c-strong:#3E7BD8;  --bg-strong:#EEF4FF;/* синий      · сильный ученик     */
  --c-ans:#4FA83D;     --bg-ans:#EEFBE9;   /* зелёный    · ожидаемый ответ    */
  --ok:#4FA83D}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--ink);
  background:#f6f2fd;line-height:1.5;padding-bottom:5.5rem}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--line);
  padding:.6rem .9rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
header h1{font-size:.95rem;color:var(--purple-d);flex:1;min-width:150px}
#timer{font-variant-numeric:tabular-nums;font-size:1.35rem;font-weight:800;color:var(--purple)}
.btn{border:none;border-radius:10px;padding:.5rem .85rem;cursor:pointer;font-weight:700;
  font-size:.85rem;background:#ece3fb;color:var(--purple-d);font-family:inherit}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--purple);color:#fff}
.btn.warn{background:#ffe6b8;color:#8a5a00}

main{max-width:820px;margin:0 auto;padding:.9rem}
.card{background:#fff;border-radius:14px;padding:1rem 1.1rem;margin-bottom:.9rem;
  box-shadow:0 1px 3px rgba(80,50,150,.08)}
h2{font-size:1.2rem;color:var(--purple-d)}
.meta{color:#8b7fa6;font-size:.82rem;margin:.15rem 0 .8rem}
.scored{display:inline-block;background:var(--gold);color:#6a4a00;border-radius:99px;
  padding:.15rem .7rem;font-size:.75rem;font-weight:800;margin-bottom:.7rem}
.blk{border-left:5px solid;border-radius:0 10px 10px 0;padding:.8rem .9rem;
  margin-bottom:.7rem;font-size:.94rem}
.blk::before{display:block;font-size:.68rem;font-weight:800;letter-spacing:.07em;
  text-transform:uppercase;margin-bottom:.3rem;opacity:.95}
.tl{background:var(--bg-tl);border-color:var(--c-tl);color:#2c1a5c}
.tl::before{content:'Говорим по-английски';color:var(--c-tl)}
.tl b{color:var(--c-tl)}
.ru{background:var(--bg-ru);border-color:var(--c-ru);color:#5a4318}
.ru::before{content:'Говорим по-русски';color:#B36B00}
.ru b{color:#8a5a00}
.note{background:var(--bg-note);border-color:var(--c-note);color:#3c4a5c}
.note::before{content:'Заметка преподавателю · не вслух';color:#5d6f88}
.note b{color:#243447}
.strong{background:var(--bg-strong);border-color:var(--c-strong);color:#22406e}
.strong::before{content:'For strong students';color:var(--c-strong)}
.strong b{color:#1b3559}
.ans{background:var(--bg-ans);border-color:var(--c-ans);color:#28451f}
.ans::before{content:'Ожидаемый ответ';color:var(--c-ans)}
.ans b{color:#1d3517}

/* список этапов */
#toc{display:none}
#toc.on{display:block}
#toc button{display:flex;width:100%;gap:.6rem;align-items:baseline;text-align:left;
  padding:.6rem .7rem;border:none;border-bottom:1px solid #f2edfa;background:#fff;
  font-family:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
#toc button.cur{background:var(--purple);color:#fff}
#toc button.skip{opacity:.5;text-decoration:line-through}
#toc .n{opacity:.55;min-width:1.7rem;font-variant-numeric:tabular-nums}
#toc .m{margin-left:auto;font-size:.75rem;opacity:.75}

/* оценка */
details#gradebox{padding:.7rem .9rem}
details#gradebox summary{cursor:pointer;font-weight:800;color:var(--purple-d);font-size:.95rem;
  list-style:none;display:flex;align-items:center;gap:.4rem}
details#gradebox summary::-webkit-details-marker{display:none}
details#gradebox summary::before{content:'▸';transition:transform .2s;display:inline-block}
details#gradebox[open] summary::before{transform:rotate(90deg)}
details#gradebox #gsum{margin-left:auto;font-weight:700;color:var(--gold-d);font-size:.85rem}
details#gradebox > *:not(summary){margin-top:.6rem}
.gtask{display:flex;align-items:center;gap:.4rem;margin-bottom:.35rem;flex-wrap:wrap}
.gtask .lbl{font-size:.8rem;flex:1;min-width:8.5rem}
.gbtns{display:flex;gap:.15rem}
.gbtns button{width:1.75rem;height:1.75rem;border:none;border-radius:6px;
  background:#ece3fb;color:var(--purple-d);font-weight:700;font-size:.72rem;cursor:pointer;
  font-family:inherit;padding:0}
.gbtns button.on{background:var(--purple);color:#fff}
#gtotal{font-size:.92rem;font-weight:800;color:var(--purple-d);margin:.6rem 0 .4rem}
#gtext{width:100%;min-height:110px;border:2px solid var(--line);border-radius:10px;
  padding:.7rem;font-family:inherit;font-size:.9rem;resize:vertical;line-height:1.5}
#crit{display:none;margin-top:.6rem}
#crit.on{display:block}
#crit table{border-collapse:collapse;width:100%;font-size:.83rem}
#crit td{border:1px solid var(--line);padding:.35rem .5rem;vertical-align:top}
#crit td:first-child{white-space:nowrap;font-weight:700;color:var(--purple-d)}

/* нижняя панель */
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;
  border-top:2px solid var(--line);padding:.6rem .9rem;
  padding-bottom:calc(.6rem + env(safe-area-inset-bottom));
  display:flex;gap:.5rem;align-items:center}
#bar .btn{flex:1;padding:.75rem .5rem;font-size:.95rem}
#pos{font-size:.8rem;color:#8b7fa6;min-width:3.2rem;text-align:center;font-variant-numeric:tabular-nums}
audio{display:none}
@media(max-width:560px){header h1{font-size:.85rem}main{padding:.6rem}.card{padding:.85rem}}
</style>
</head>
<body>

<header>
  <h1>Суфлёр · Wow Dragon 1 · Lesson 42 · I like my uniform!</h1>
  <span id="timer">00:00</span>
  <button class="btn" id="ttoggle">Пауза</button>
  <button class="btn" id="treset">Сброс</button>
  <button class="btn" id="toctoggle">Этапы</button>
</header>

<div id="toc" class="card" style="margin:.9rem;padding:0;overflow:hidden"></div>

<main>
  <div class="card" id="stagecard"></div>

  <div class="card" id="chantcard" hidden>
    <h2>Чант — образец напева</h2>
    <div class="meta">Только для преподавателя. Ученику не включаем.</div>
    <button class="btn primary" id="chantbtn" style="width:100%;padding:.7rem">▶ Прослушать</button>
    <audio id="chantaudio"></audio>
  </div>
  <details class="card" id="gradebox">
    <summary>Оценка speaking · <span id="gsum">— из 10</span></summary>
    <div id="gtasks"></div>
    <div id="gtotal">Итог: — из 10</div>
    <button class="btn" id="critbtn" style="font-size:.75rem;padding:.3rem .6rem">Критерии</button>
    <div id="crit"></div>
    <textarea id="gtext" placeholder="Текст для родителя соберётся, когда выставите все пять баллов"></textarea>
    <button class="btn primary" id="gcopy" style="margin-top:.5rem;width:100%;padding:.65rem">Скопировать текст для родителя</button>
  </details>

</main>

<div id="bar">
  <button class="btn" id="prev">← Назад</button>
  <span id="pos"></span>
  <button class="btn warn" id="skip">Пропустить</button>
  <button class="btn primary" id="next">Дальше →</button>
</div>

<script>
const STAGES = [{"type": "chars", "title": "Приветствие", "min": "5", "limit": 5, "tl": "<b>Hello!</b> — wave. “Hello, little dragon! Let's fly high!” <b>(TPR: wave)</b><br>“How are you today? Happy or sad?” <b>(TPR: show with your face)</b><br>“Show me happy!” — “Repeat: happy!”<br>Пальчиковая кукла: “How are you today? I'm happy!” — ученик отвечает <b>I'm happy.</b>", "note": "Пальчиковая кукла Дракоши — на распечатку, подготовьте до урока.", "strong": "Ученик отвечает двумя словами: <b>I'm happy. I'm Anna!</b>"}, {"type": "wheel", "title": "Колесо эмоций", "min": "1-2", "limit": 2, "tl": "“Look! Spin!”<br>“Is Dragon happy or sad?” — “Repeat: happy!”<br>“Show me!” <b>(TPR: happy, sad, scared, angry, excited, funny)</b>", "strong": "Две эмоции подряд: “Show me happy and sad!”"}, {"type": "chars", "title": "Проверка домашнего задания", "min": "1", "limit": 1, "note": "Не забудьте перед уроком проверить домашнее задание.<br><br>Если ученик не выполнил — напомните, как важно его делать.<br>Если выполнено — похвалите: «Молодец, ты отлично справился!» или отметьте, что получилось особенно хорошо: «Мне понравилось, как ты правильно назвал все цвета!»<br><br>Спросите, были ли вопросы или сложности, и кратко ответьте, если нужно.", "strong": "“Is it easy?” — <b>Yes! It's easy.</b>"}, {"type": "chars", "title": "История: идём в Magic School", "min": "1-2", "limit": 2, "ru": "Ура! Мы с вами собрали всю нужную одежду — теперь мы полностью готовы! Теперь самое время позвать наших друзей и отправиться в волшебную школу — Magic School. Впереди столько интересного и нового! Готов к приключениям?", "note": "Сегодня урок Speaking Project, поэтому нужно провести небольшую оценку навыков говорения. Заранее ознакомьтесь с критериями и делайте пометки после каждого задания. Пять заданий помечены ★, панель оценки — внизу этой страницы.", "strong": "“Are you ready?” — <b>Yes, I'm ready!</b>"}, {"type": "halves", "title": "Соедини половинки", "min": "1-2", "limit": 2, "slide": 3, "tl": "“Look! Point!”<br>“What is it?” — <b>It's a red jacket.</b><br>“Good job!”", "ru": "Посмотрите, одежда разделилась пополам, давайте соединим половинки.", "strong": "Две вещи подряд: <b>It's a red jacket and a pink T-shirt.</b>", "ans": "It's a blue skirt · It's a red jacket · It's a pink T-shirt"}, {"type": "chars", "title": "Первая монетка", "min": "1-2", "limit": 2, "slide": 4, "tl": "“Look! It is a coin! You have one coin now — hooray! Let's collect more coins!”", "ru": "За монетки вы сможете купить остальную одежду для наших героев.", "note": "В этом уроке есть система мотивации с монетками. За выполнение заданий ученик получает монетки, и распределяете их вы. За плохо сделанные задания давайте поменьше, за хорошо сделанные — побольше, чтобы это была мотивация. Не нужно за каждое задание давать тупо по 1–2 монетки: неравное количество мотивирует сильнее.<br><br>Монетки — кнопка «+» в колонке слева или клавиша C. Клик по лишней монетке убирает её.", "strong": "“How many coins?” — <b>One coin!</b>"}, {"type": "grid", "title": "Найди одинаковые", "min": "1-2", "limit": 2, "slide": 5, "tl": "“Look! Point! What is it?”<br>“How many?” — <b>Three green skirts.</b><br>“Good job!”", "ru": "Чтобы найти следующую монетку, нужно очистить поле от всех картинок. Они исчезают, когда вы обводите одинаковые.", "note": "Подготовьте лист А4 с большой яркой буквой <b>S</b> — показывайте его, когда ученик забывает прибавлять окончание множественного числа.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "“Count all the skirts!” — <b>Five skirts.</b>", "ans": "3 green skirts · 2 purple skirts · 3 red jackets · 2 blue T-shirts · 2 yellow T-shirts"}, {"type": "chant", "title": "Чант", "min": "5", "limit": 5, "slide": "6-7", "tl": "Сначала произносите сами:<br><b>I have clothes: shoes and a skirt;</b><br><b>I have clothes: jeans and a T-shirt.</b><br>“Listen! Repeat!” <b>(TPR: clap the rhythm)</b><br>“What's missing?”", "note": "Чант — это не песня, а ритм. Образец напева — кнопка ниже, ученик его не слышит.<br><br>Клик по картинке прячет её под вопросик, клик по вопросику возвращает. Прячьте по одной вещи, пока ученик не расскажет чант наизусть.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "“Your turn! Hide one!” — ученик сам выбирает, что спрятать."}, {"type": "wardrobes", "title": "★ Угадай, что в шкафу", "min": "1-2", "limit": 2, "slide": 8, "score": 1, "tl": "“Look! Choose one. Don't tell me!”<br>Ученик описывает: <b>I have a red skirt. I don't have jeans.</b><br>Вы угадываете: “One, two or three?” — “Good job!”", "note": "Прячет ученик, угадываете вы — так говорит он, а не вы. Клик по шкафу открывает и закрывает дверь.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "“Now you guess! One, two or three?” — угадывает ученик, прячете вы.", "ans": "1: a mint T-shirt, a blue skirt · 2: jeans, a yellow T-shirt, a red skirt · 3: a blue jacket"}, {"type": "wardrobes", "title": "★ Назови одежду", "min": "1-2", "limit": 2, "slide": 9, "score": 2, "tl": "“Look! What is it?” — <b>A purple T-shirt.</b><br>“What colour?” — “Whose is it?”", "note": "<b>NB!</b> Не забудьте дать монетки за задание.", "strong": "Две вещи в одном ответе: <b>a purple T-shirt and blue shoes.</b>", "ans": "a purple T-shirt · blue shoes · a yellow jacket · yellow shoes · a blue skirt · pink shoes"}, {"type": "pairs", "title": "Чья это одежда?", "min": "1-2", "limit": 2, "slide": 10, "tl": "“Look! Who is it?” — Princess, Dragon, Unicorn.<br>“Point! Whose is it?” — <b>It's Dragon's jacket.</b>", "note": "Клик по герою подсвечивает его вещи.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "Обе вещи сразу: <b>It's Dragon's. A yellow jacket and yellow shoes.</b>"}, {"type": "dragonsays", "title": "Разминка: Dragon says", "min": "2-3", "limit": 3, "tl": "<b>“Dragon says — show jeans!”</b> <b>(TPR: stand up, point, jump)</b><br>Голова Дракоши сверху — команду выполняем. Головы нет — не двигаемся.<br>“Stop! Sit down!”", "note": "Обязательно встаём. Это единственная двигательная пауза в уроке.", "strong": "Пусть ученик сам говорит <b>“Dragon says”</b>, а вы выполняете команды."}, {"type": "wind", "title": "Ветер унёс одежду", "min": "1-2", "limit": 2, "slide": "11-12", "tl": "“Oh no! Look!”<br>“What is it?” — “Whose is it?”", "ru": "О нет, ветер унёс одежду, нужно теперь её рассортировать.", "note": "<b>NB!</b> Не забудьте дать монетки за задание.", "strong": "“Whose is it? One, two or three?”", "ans": "Единорожка: a purple T-shirt, blue shoes · Дракоша: a yellow jacket, yellow shoes · Принцесса: a blue skirt, pink shoes"}, {"type": "yesno", "title": "★ Yes-No игра", "min": "2-4", "limit": 4, "slide": 13, "score": 3, "tl": "“Look! Listen!” — клик по динамику.<br>“Repeat!” — “Yes or no?”<br><b>(TPR: yes — clap, no — close your eyes)</b><br>Затем клик по ✓ или ✗ вместе с учеником.", "ru": "Давайте посмотрим, что осталось купить для наших друзей, кому чего не хватает.", "note": "<b>NB!</b> Не забудьте дать монетки за задание.", "strong": "“No! Why?” — <b>The skirt is blue.</b> Ученик называет цвет.", "ans": "<b>Единорожка</b> (футболка + голубые ботинки)<br>&nbsp;&nbsp;1 I don't have a blue jacket — <b>YES</b><br>&nbsp;&nbsp;2 I don't have blue shoes — <b>NO</b>, ботинки у неё есть<br><b>Дракоша</b> (жёлтая куртка + жёлтые туфли)<br>&nbsp;&nbsp;1 I have yellow shoes — <b>YES</b><br>&nbsp;&nbsp;2 I don't have jeans — <b>YES</b><br><b>Принцесса</b> (сине-фиолетовая юбка + розовые кеды)<br>&nbsp;&nbsp;1 I have a purple T-shirt — <b>NO</b>, футболки нет<br>&nbsp;&nbsp;2 I have a green skirt — <b>NO</b>, юбка синяя"}, {"type": "suitcases", "title": "★ Собери чемоданы", "min": "5-8", "limit": 8, "slide": 14, "score": 4, "tl": "“You are Unicorn! What do you have?”<br><b>I have blue shoes. I don't have jeans.</b><br>“Now you are Dragon!”", "ru": "Давайте посмотрим, что осталось купить для наших друзей, кому чего не хватает.", "note": "Клик по вещи кладёт её в чемодан, повторный клик достаёт.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "Обе фразы подряд: <b>I have blue shoes. I don't have jeans.</b>"}, {"type": "chest", "title": "Сундук", "min": "1-2", "limit": 2, "slide": 15, "tl": "“Great job! You've completed all the tasks! Let's count our coins. One, two, three…”", "ru": "Пришло время покупать одежду.<br><br>«Oh no! К сожалению, чтобы купить всё необходимое, нам не хватает всего одной монетки. Но к счастью, я знаю, где её найти.»", "note": "Считаем монетки в колонке слева вслух вместе с учеником. Клик по сундуку открывает его.", "strong": "“Count the coins!” — <b>One, two, three… ten coins!</b>"}, {"type": "path", "title": "Прыжки за монеткой", "min": "1-2", "limit": 2, "slide": 16, "tl": "“Look! Draw the way!”<br>“Jump!”<br>На каждом прыжке: “What do you like?” — <b>I like a red jacket.</b>", "ru": "Давайте поможем Дракоше дойти до монетки.", "note": "Ученик рисует маршрут аннотацией Zoom, затем вы кликаете по Дракоше — он прыгает на шаг вперёд.<br><br><b>NB!</b> Не забудьте дать монетки за задание.", "strong": "Две вещи за прыжок: <b>I like a red jacket and blue shoes.</b>"}, {"type": "likes", "title": "★ Витрина: I like / I don't like", "min": "2-5", "limit": 5, "slide": 17, "score": 5, "tl": "“Look! You are Unicorn. What do you like?”<br><b>I like jeans. I don't like a red jacket.</b><br>Затем лично: <b>“And what clothes do YOU like?”</b>", "ru": "Ура, теперь вам хватает монеток. Давайте посмотрим, какая одежда нравится нашим друзьям.<br><br>Отлично! Наши друзья выбрали свою любимую одежду. Впереди волшебное путешествие, полное новых знаний, игр и друзей.", "note": "Ученик говорит за каждого героя, вы отмечаете пальцем то, что он сказал. Клик по вещи ставит палец: пусто → 👍 → 👎.", "strong": "С цветом: <b>I like the blue jeans. I don't like the red jacket.</b>", "ans": "<b>Единорожка</b> 👍 jeans · 👎 a red jacket · 👍 a blue jacket<br><b>Дракоша</b> 👍 a purple T-shirt · 👍 jeans · 👎 a yellow T-shirt<br><b>Принцесса</b> 👍 const S = { i:-1, scores:{}, skipped:new Set() };
const $ = id => document.getElementById(id);

/* ── этапы ── */
const LEGEND = `
  <h2>Обозначения</h2>
  <div class="meta">Цвета одинаковые во всех уроках Wow Dragon</div>
  <div class="blk tl">Точные фразы, которые вы произносите ученику <b>по-английски</b>.
    В скобках подсказки движений: <b>(TPR: wave)</b>.</div>
  <div class="blk ru">Текст, который произносится <b>по-русски</b>: история, связки между
    заданиями, обратная связь. Читайте почти дословно — история сквозная.</div>
  <div class="blk note">Инструкция <b>вам</b>, вслух не произносится: что подготовить,
    как работает интерактив, когда дать монетки.</div>
  <div class="blk strong">Усложнение для сильного ученика. Грамматика та же — больше объём:
    две вещи вместо одной, цвет к предмету, ведущая роль в игре.</div>
  <div class="blk ans">Что должен ответить ученик. Нужен вам для сверки и для оценки.</div>
  <p style="margin-top:1rem;font-size:.9rem;line-height:1.6">
    <b>★</b> у названия — задание с оценкой. Таких пять, каждое по 10 баллов.
    Ставьте балл сразу после задания в панели внизу: в конце урока итог и текст
    для родителя соберутся сами.<br><br>
    <b>⏱</b> — рекомендованное время этапа. Таймер краснеет, когда вы вышли за него.<br><br>
    Листайте кнопками внизу или стрелками на клавиатуре. Кнопка <b>«Этапы»</b> вверху —
    переход к любому этапу.
  </p>`;

function paint(){
  if(S.i < 0){
    $('stagecard').innerHTML = LEGEND;
    $('pos').textContent = '—';
    $('chantcard').hidden = true;
    $('toc').classList.remove('on');
    window.scrollTo({top:0});
    return;
  }
  const st = STAGES[S.i];
  $('stagecard').innerHTML =
    `<h2>${st.title}</h2>`+
    `<div class="meta">${st.min && st.min!=='—' ? '⏱ '+st.min+' мин' : ''}`+
    `${st.slide ? ' · слайд '+st.slide : ''}</div>`+
    (st.score ? `<div class="scored">★ Оценка · задание ${st.score} из 5</div>` : '')+
    ['tl','ru','note','strong','ans']
      .filter(k=>st[k]).map(k=>`<div class="blk ${k}">${st[k]}</div>`).join('');
  $('pos').textContent = (S.i+1)+' / '+STAGES.length;
  const cc=$('chantcard');
  cc.hidden = st.type!=='chant';
  if(cc.hidden && !ca.paused){ ca.pause(); $('chantbtn').textContent='▶ Прослушать'; }
  paintToc();
  window.scrollTo({top:0,behavior:'smooth'});
}
function paintToc(){
  const t=$('toc');
  t.innerHTML = `<button data-k="-1" class="${S.i<0?'cur':''}">`+
    `<span class="n">·</span><span>Обозначения</span></button>` +
    STAGES.map((st,k)=>
    `<button data-k="${k}" class="${k===S.i?'cur':''}${S.skipped.has(k)?' skip':''}">`+
    `<span class="n">${k+1}</span><span>${st.title}</span>`+
    `<span class="m">${st.score?'★ ':''}${st.min||''}</span></button>`).join('');
  t.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    go(+b.dataset.k); t.classList.remove('on'); });
}
function go(k){ S.i=Math.max(-1,Math.min(STAGES.length-1,k)); reset(); paint(); }

$('next').onclick = ()=>go(S.i+1);
$('prev').onclick = ()=>go(S.i-1);
$('skip').onclick = ()=>{ if(S.i>=0) S.skipped.add(S.i); go(S.i+1); };
$('toctoggle').onclick = ()=>$('toc').classList.toggle('on');

/* ── таймер этапа ── */
let sec=0, run=true;
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function reset(){ sec=0; run=true; $('ttoggle').textContent='Пауза'; $('timer').textContent='00:00';
  $('timer').style.color=''; }
setInterval(()=>{ if(!run)return; sec++; $('timer').textContent=fmt(sec);
  const lim=(S.i>=0 ? (STAGES[S.i].limit||0) : 0)*60;
  $('timer').style.color = (lim && sec>lim) ? '#E8352E' : ''; },1000);
$('ttoggle').onclick = e=>{ run=!run; e.target.textContent = run?'Пауза':'Пуск'; };
$('treset').onclick = reset;

/* ── оценка ── */
const GT = STAGES.filter(s=>s.score).sort((a,b)=>a.score-b.score);
function paintGrade(){
  $('gtasks').innerHTML = GT.map(st=>
    `<div class="gtask"><span class="lbl">${st.title.replace('★ ','')}</span><div class="gbtns">`+
    Array.from({length:10},(_,j)=>
      `<button data-s="${st.score}" data-v="${j+1}" class="${S.scores[st.score]===j+1?'on':''}">${j+1}</button>`
    ).join('')+`</div></div>`).join('');
  $('gtasks').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    S.scores[+b.dataset.s]=+b.dataset.v; paintGrade(); });

  const vals = GT.map(s=>S.scores[s.score]).filter(v=>v!=null);
  if(vals.length===GT.length){
    const avg=Math.round(vals.reduce((a,b)=>a+b,0)/GT.length);
    $('gtotal').textContent=`Итог: ${avg} из 10 (${GT.map(s=>S.scores[s.score]).join(' + ')} ÷ 5)`;
    $('gsum').textContent=`${avg} из 10`;
    $('gtext').value=parentText(avg);
  } else {
    $('gtotal').textContent=`Итог: — из 10 (выставлено ${vals.length} из ${GT.length})`;
    $('gsum').textContent=`${vals.length}/${GT.length}`;
  }
}
function parentText(avg){
  const band =
    avg>=9 ? 'справился с заданием на высшем уровне: отвечал быстро и уверенно, правильно произносил слова и использовал верную грамматику. Ошибки минимальны и не мешали пониманию.' :
    avg>=7 ? 'правильно понял задание, но допустил несколько ошибок в произношении и грамматике. Ответы были уверенные, но требовали времени на формулировку.' :
    avg>=5 ? 'выполнил задание, но допустил несколько ошибок и нуждался в помощи преподавателя. Ответы были менее уверенными.' :
    avg>=3 ? 'испытывал заметные трудности с заданием, было много ошибок, требовалась значительная поддержка преподавателя.' :
             'пока с трудом справляется с заданием, ответы неточные, нужна постоянная помощь. Продолжаем работать над этой темой.';
  return `На этом уроке мы повторили названия одежды, фразы «I like / I don't like», «I have / I don't have».\n\n`+
    `Сегодня на уроке была небольшая оценка навыков говорения вашего ребёнка.\n`+
    `Результат: ${avg} из 10. [Имя ученика] ${band}`;
}
$('gcopy').onclick = ()=>{
  const t=$('gtext'); t.select(); t.setSelectionRange(0,99999);
  navigator.clipboard?.writeText(t.value);
  $('gcopy').textContent='Скопировано';
  setTimeout(()=>$('gcopy').textContent='Скопировать текст для родителя',1600);
};

const CRIT=[['9–10','Ученик правильно выполнил задание без ошибок или с минимальными ошибками, которые не мешают пониманию.'],
['7–8','Есть небольшие ошибки, но общее понимание задания хорошее. Требуется незначительная помощь преподавателя.'],
['5–6','Ученик делает несколько ошибок, требуется помощь преподавателя. Ответы менее уверенные.'],
['3–4','Большие трудности с выполнением задания, множество ошибок, необходима значительная поддержка.'],
['1–2','Ученик практически не справляется с заданием, ответы крайне неточные, требуется постоянная помощь.']];
$('critbtn').onclick = ()=>{
  const c=$('crit');
  if(!c.innerHTML) c.innerHTML='<table>'+CRIT.map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')+'</table>';
  c.classList.toggle('on');
};

const ca=$('chantaudio');
let chantBytes=null;
try{
  const b64=CHANT.slice(CHANT.indexOf(',')+1), bin=atob(b64);
  chantBytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) chantBytes[i]=bin.charCodeAt(i);
  ca.src=URL.createObjectURL(new Blob([chantBytes],{type:'audio/mpeg'}));
}catch(e){}
let AC=null, cnode=null, cbuf=null;
$('chantbtn').onclick = async e=>{
  if(cnode){ try{cnode.stop();}catch(_){}; cnode=null; e.target.textContent='▶ Прослушать'; return; }
  if(!ca.paused){ ca.pause(); e.target.textContent='▶ Прослушать'; return; }
  try{ await ca.play(); e.target.textContent='⏸ Пауза'; return; }catch(_){}
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') await AC.resume();
    if(!cbuf && chantBytes) cbuf = await AC.decodeAudioData(chantBytes.buffer.slice(0));
    cnode=AC.createBufferSource(); cnode.buffer=cbuf;
    cnode.connect(AC.destination);
    cnode.onended=()=>{ cnode=null; $('chantbtn').textContent='▶ Прослушать'; };
    cnode.start(); e.target.textContent='⏸ Стоп';
  }catch(_){ e.target.textContent='Звук недоступен'; }
};
ca.onended = ()=>$('chantbtn').textContent='▶ Прослушать';

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(S.i+1); }
  if(e.key==='ArrowLeft') go(S.i-1);
});

paint(); paintGrade();
