<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Club 10+ · Lesson 3 · The Red Cup</title>
<style>
:root{--ink:#20313B;--navy:#0A5C86;--blue:#1CA3DE;--purple:#6C3DE0;--orange:#EE9A2B;--red:#E8553E;--green:#5FB81F;--mut:#5C6B73;--line:#CFE6F4;--soft:#F2FAFE;--lilac:#EDE6FF;--bg:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Calibri,Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header .logo{font-weight:800;color:var(--navy);font-size:18px}
header .stage{color:var(--mut);font-size:14px;flex:1;min-width:150px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;color:var(--navy);font-weight:700}
.seg button.on{background:var(--navy);color:#fff}
.xbtn{border:1.5px solid var(--orange);background:#fff;color:var(--orange);border-radius:10px;padding:6px 12px;font-weight:700}
.xbtn.on{background:var(--orange);color:#fff}
main{flex:1;overflow:auto;padding:18px 16px 10px}
.screen{max-width:1080px;margin:0 auto}
h1{font-size:30px;margin:0 0 4px;color:var(--navy)}
.sub{color:var(--mut);margin:0 0 16px;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--blue);border-radius:6px;padding:3px 8px;margin-bottom:8px}
.tag.plus{background:var(--purple)}.tag.extra{background:var(--orange)}
.teacher{background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:14px;margin-top:14px}
.teacher b{color:var(--navy)}
footer{border-top:1px solid var(--line);padding:8px 16px}
.keybar{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.k{width:40px;border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:3px 0 1px;background:#fff}
.k b{display:block;font-size:14px;line-height:16px}
.k.off{background:var(--soft);border-style:dashed;color:#9aa8b0}
.k.new{border-color:var(--orange);box-shadow:0 0 0 2px #fde3bd}
.nav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav button{border:0;border-radius:12px;padding:10px 18px;font-weight:700;font-size:16px}
.prev{background:var(--soft);color:var(--navy)}.next{background:var(--navy);color:#fff}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--navy)}.dots i.p{outline:2px solid var(--purple);outline-offset:1px}
.grid{display:grid;gap:12px}
.card{border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px;text-align:center}
.big{font-size:64px;font-weight:800;line-height:1;color:var(--ink)}
.word{font-size:40px;font-weight:800;letter-spacing:.02em}
.pic{width:100%;max-width:200px;aspect-ratio:1;object-fit:contain;margin:0 auto;display:block}
.ph{width:100%;max-width:200px;aspect-ratio:1;margin:0 auto;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#9aa8b0;font-size:14px;padding:6px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--blue);color:#fff;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--navy)}.btn.ok{background:var(--green)}.btn.no{background:var(--red)}.btn.or{background:var(--orange)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center}
.phone{width:min(360px,100%);border:10px solid var(--ink);border-radius:30px;padding:16px 14px;background:#fff;margin:0 auto}
.bubble{background:var(--lilac);border-radius:14px 14px 14px 4px;padding:12px}
.from{font-size:13px;color:var(--purple);font-weight:700;margin-bottom:6px}
.coded{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center}
.coded .w{display:inline-flex;gap:3px;align-items:center}
.coded .p{font-size:26px;font-weight:800}
.gl{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer}
.gl .lt{font-size:18px;font-weight:800;height:22px;color:var(--purple)}
.chant{font-size:clamp(26px,4.4vw,44px);font-weight:800;line-height:1.35;text-align:center}
.chant span{transition:color .15s}.chant span.hl{color:var(--orange)}
.story{font-size:clamp(22px,3.2vw,32px);line-height:1.6;background:var(--soft);border-radius:14px;padding:16px 20px}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.tile{width:64px;height:72px;border-radius:12px;border:0;font-size:38px;font-weight:800;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.slot{width:64px;height:72px;border-radius:12px;border:2.5px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800}
.sbtn{min-width:64px;height:72px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:42px;font-weight:800;color:var(--ink)}
.sbtn.hit{background:#fff3df;border-color:var(--orange)}
.fb{min-height:28px;font-weight:700;text-align:center;margin-top:8px}
.good{color:var(--green)}.bad{color:var(--red)}
.tf{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:6px 0;font-size:20px}
.ws{display:grid;gap:4px;justify-content:center}
.ws button{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800}
.ws button.sel{background:#fff3df;border-color:var(--orange)}.ws button.found{background:#dff3c8;border-color:var(--green)}
.timer{font-size:28px;font-weight:800;color:var(--purple)}
@media (max-width:640px){h1{font-size:24px}.big{font-size:48px}.tile,.slot{width:52px;height:60px;font-size:30px}.k{width:32px}}
</style>
</head>
<body>
<div id="app">
 <header>
  <span class="logo">Reading Club 10+</span>
  <span class="stage" id="stage"></span>
  <span class="seg" id="mode"><button data-m="30">30 мин</button><button data-m="40">40 мин</button></span>
  <button class="xbtn" id="extra">⭐ Extra</button>
 </header>
 <main><div class="screen" id="scr"></div></main>
 <footer>
  <div class="keybar" id="key"></div>
  <div class="nav"><button class="prev" id="prev">← Назад</button><div class="dots" id="dots"></div><button class="next" id="next">Дальше →</button></div>
 </footer>
</div>
<script>
// ===== данные урока =====
const SND = 'https://vtcxghsqymwkyiogpndf.supabase.co/storage/v1/object/public/classroom-media/reading10/zvuki/';
const IMG = '../../media/reading10/u3/';
const OLD = 'satpinmdog'.split(''), NEW = 'ckeur'.split('');
const ALPHA = 'abcdefghijklmnopqrstuvwxyz'.split('');
const ANCHOR = {c:['cat','кошка','c и k — две буквы, один звук /k/.'],k:['kid','малыш','Тот же звук /k/, что у c.'],e:['egg','яйцо','Короткое «э» — без «й» в начале.'],u:['umbrella','зонт','Ближе к русскому «а»: up, cup, sun.'],r:['red','красный','Без раската: язык не дрожит.']};
const PIC = {cat:'cat',kid:'kid',egg:'egg',umbrella:'umbrella',red:'red_paint',pen:'pen',ten:'ten',sun:'sun',cup:'cup',run:'run',rat:'rat',kit:'kit',map:'map',mat:'mat',dog:'dog',pot:'pot',pan:'pan',pig:'pig'};
const EMO = {cat:'🐈',kid:'🧒',egg:'🥚',umbrella:'☂️',red:'🟥',pen:'🖊️',ten:'🔟',sun:'☀️',cup:'☕',run:'🏃',rat:'🐀',kit:'🩹',map:'🗺️',mat:'🟫',dog:'🐕',pot:'🍲',pan:'🍳',pig:'🐖'};
let mode = 40, extra = false, i = 0;
try { mode = +(localStorage.getItem('rc10_mode') || 40); } catch (e) {}
let opened = new Set(OLD);

// ===== шифр (pigpen) =====
function glyph(ch, s = 30, col = '#20313B') {
  ch = ch.toLowerCase(); const m = 4, a = m, b = s - m, c = s / 2; let L = '', dot = '';
  const ln = (x1, y1, x2, y2) => L += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
  const g1 = 'abcdefghi', g2 = 'jklmnopqr', x1 = 'stuv', x2 = 'wxyz';
  let d = false, k = ch;
  if (g1.includes(k) || g2.includes(k)) {
    if (g2.includes(k)) { d = true; k = g1[g2.indexOf(k)]; }
    const n = g1.indexOf(k), r = Math.floor(n / 3), q = n % 3;
    if (r > 0) ln(a, a, b, a); if (r < 2) ln(a, b, b, b); if (q > 0) ln(a, a, a, b); if (q < 2) ln(b, a, b, b);
    if (d) dot = `<circle cx="${c}" cy="${c}" r="2.6" fill="${col}"/>`;
  } else if (x1.includes(k) || x2.includes(k)) {
    if (x2.includes(k)) { d = true; k = x1[x2.indexOf(k)]; }
    if (k === 's') { ln(a, a, c, c); ln(c, c, b, a); if (d) dot = `<circle cx="${c}" cy="${s*0.7}" r="2.6" fill="${col}"/>`; }
    if (k === 't') { ln(a, a, c, c); ln(c, c, a, b); if (d) dot = `<circle cx="${s*0.3}" cy="${c}" r="2.6" fill="${col}"/>`; }
    if (k === 'u') { ln(b, a, c, c); ln(c, c, b, b); if (d) dot = `<circle cx="${s*0.7}" cy="${c}" r="2.6" fill="${col}"/>`; }
    if (k === 'v') { ln(a, b, c, c); ln(c, c, b, b); if (d) dot = `<circle cx="${c}" cy="${s*0.3}" r="2.6" fill="${col}"/>`; }
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}" stroke="${col}" stroke-width="2.6" stroke-linecap="round" fill="none">${L}${dot}</svg>`;
}
function renderKey(fresh = []) {
  document.getElementById('key').innerHTML = ALPHA.map(ch => opened.has(ch)
    ? `<div class="k ${fresh.includes(ch) ? 'new' : ''}">${glyph(ch, 26)}<b>${ch}</b></div>`
    : `<div class="k off"><div style="height:26px;line-height:26px">?</div><b>&nbsp;</b></div>`).join('');
}
function coded(text, reveal = false, id = 'cd') {
  return `<div class="coded" id="${id}">` + text.split(' ').map(w => `<span class="w">` + [...w].map(ch => /[a-z]/i.test(ch)
    ? `<span class="gl" data-l="${ch}"><span class="lt">${reveal ? ch : ''}</span>${glyph(ch, 32)}</span>` : `<span class="p">${ch}</span>`).join('') + `</span>`).join('') + `</div>`;
}

// ===== звук =====
let cur;
function play(src) { try { if (cur) cur.pause(); cur = new Audio(src); cur.play().catch(() => {}); } catch (e) {} }
function sound(l) { play(SND + (l === 'q' ? 'qu' : l) + '.mp3'); }
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = .85; const v = speechSynthesis.getVoices().find(v => /en-GB/.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
function pic(w, cls = 'pic') { const f = PIC[w] || w; return `<img class="${cls}" src="${IMG}${f}.webp" alt="${w}" onerror="this.outerHTML='<div class=&quot;ph&quot;><span style=&quot;font-size:56px&quot;>${EMO[w] || '🖼️'}</span></div>'">`; }

// ===== экраны =====
const S = [];
const add = (o) => S.push(o);

add({ t: 'Mission briefing', min: 1, html: () => `
 <span class="tag">Mission 3</span><h1>The Red Cup</h1><p class="sub">Агент X прислал новое сообщение. Часть значков мы ещё не знаем.</p>
 <div class="row" style="align-items:flex-start;gap:18px">
  <div style="flex:1;min-width:260px">${'<img class="pic" style="max-width:420px;aspect-ratio:16/10;object-fit:cover;border-radius:14px" src="' + IMG + 'scene_phone.webp" alt="" onerror="this.outerHTML=\'<div class=&quot;ph&quot; style=&quot;max-width:420px;aspect-ratio:16/10&quot;>Sam и Dan смотрят в телефон (картинка)</div>\'">'}</div>
  <div class="phone"><div class="from">Agent X · сейчас</div><div class="bubble">${coded('Run! Get the red cup.', false, 'brief')}</div></div>
 </div>
 <div class="teacher"><b>Учитель:</b> «Здесь есть значки, которых нет в нашем ключе. Сегодня откроем пять новых — и прочитаем сообщение в конце урока».</div>`,
 after: () => { document.querySelectorAll('#brief .gl').forEach(g => { if (opened.has(g.dataset.l.toLowerCase())) g.querySelector('.lt').textContent = ''; else g.style.opacity = .35; }); } });

add({ t: 'Code review', min: 2, html: () => `
 <span class="tag">Code review</span><h1>Кодовая колода</h1><p class="sub">Нажми на символ: назови букву и её <b>звук</b>. Потом проверь.</p>
 <div class="row">${OLD.map(l => `<button class="card" style="width:92px" onclick="this.querySelector('.lt').textContent='${l}';sound('${l}')">${glyph(l, 46)}<div class="lt" style="font-size:30px;font-weight:800;height:36px;color:var(--purple)"></div></button>`).join('')}</div>
 <p class="sub" style="margin-top:16px">Слова-исключения: читаем целиком.</p>
 <div class="row">${['I', 'the', 'a'].map(w => `<span class="card word" style="min-width:90px">${w}</span>`).join('')}</div>
 <p class="sub" style="margin-top:16px">Скороговорка прошлого урока — новые строчки. Сначала медленно, потом быстрее.</p>
 <div class="chant" id="ch2">A dog, a pot, a map, a pan —<br>Dig it, Sam! Dig it, Dan!</div>
 <div class="row" style="margin-top:8px"><button class="btn ghost" onclick="beat('ch2',650)">🐢 медленно</button><button class="btn or" onclick="beat('ch2',330)">⚡ быстро</button></div>` });

add({ t: 'Speed run', min: 3, plus: true, html: () => {
  const W = ['sat', 'pin', 'dog', 'map', 'top', 'dig', 'tap', 'sit', 'mop', 'pan', 'nod', 'pig', 'man', 'tin', 'dot', 'gap', 'sad', 'pot'];
  return `<span class="tag plus">+ 40 мин · Speed run</span><h1>Читай на скорость</h1><p class="sub">${W.length} слов. Нажми «Старт», читай вслух, жми «Дальше» после каждого слова. Соревнуешься только с собой.</p>
 <div class="card" style="max-width:520px;margin:0 auto"><div class="word" id="sr" style="font-size:64px;min-height:80px">—</div><div class="timer" id="srt">0.0 с</div>
 <div class="row" style="margin-top:10px"><button class="btn" id="srb">Старт</button></div><div class="fb" id="srf"></div></div>`; },
 after: () => {
  const W = ['sat', 'pin', 'dog', 'map', 'top', 'dig', 'tap', 'sit', 'mop', 'pan', 'nod', 'pig', 'man', 'tin', 'dot', 'gap', 'sad', 'pot'];
  let n = -1, t0, tm; const b = document.getElementById('srb'), w = document.getElementById('sr'), tt = document.getElementById('srt'), f = document.getElementById('srf');
  let best = null; try { best = +localStorage.getItem('rc10_best_u3') || null; } catch (e) {}
  if (best) f.textContent = 'Твой рекорд: ' + best.toFixed(1) + ' с';
  b.onclick = () => {
   if (n < 0) { t0 = Date.now(); tm = setInterval(() => tt.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' с', 100); b.textContent = 'Дальше'; }
   n++; if (n < W.length) { w.textContent = W[n]; return; }
   clearInterval(tm); const sec = (Date.now() - t0) / 1000; w.textContent = '🏁';
   if (!best || sec < best) { best = sec; try { localStorage.setItem('rc10_best_u3', sec); } catch (e) {} f.innerHTML = '<span class="good">Новый рекорд: ' + sec.toFixed(1) + ' с!</span>'; } else f.textContent = sec.toFixed(1) + ' с · рекорд ' + best.toFixed(1) + ' с';
   b.textContent = 'Ещё раз'; n = -1;
  }; } });

add({ t: 'HW check', min: 1, html: () => `<span class="tag">HW check</span><h1>Проверим домашку</h1><p class="sub">1–2 слова, где были ошибки. Прочитай их ещё раз.</p>
 <div class="teacher"><b>Учитель:</b> откройте журнал ДЗ («Контент» → «Журнал ДЗ»), выберите 1–2 слова с ошибками и попросите прочитать их по звукам, потом целиком.</div>` });

add({ t: 'New code', min: 4, html: () => `
 <span class="tag">New code</span><h1>Пять новых символов</h1><p class="sub">Нажми на карточку — символ откроется, прозвучит звук. Повтори звук 2–3 раза.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">${NEW.map(l => `
  <div class="card nc" data-l="${l}" style="cursor:pointer">
   <div>${glyph(l, 54)}</div><div class="big nl" style="visibility:hidden">${l}</div>
   <div class="nb" style="visibility:hidden"><div style="font-size:17px;margin:6px 0">This is <b>${l}</b>. Sound <b>/${l === 'c' || l === 'k' ? 'k' : l === 'u' ? 'ʌ' : l}/</b>.</div>
   ${pic(ANCHOR[l][0])}<div style="font-size:22px;font-weight:800;margin-top:4px"><span style="color:var(--orange)">${l}</span>${ANCHOR[l][0].slice(1)}</div>
   <div style="font-size:13px;color:var(--mut);margin-top:4px">${ANCHOR[l][2]}</div></div>
  </div>`).join('')}</div>`,
 after: () => document.querySelectorAll('.nc').forEach(c => c.onclick = () => { const l = c.dataset.l; c.querySelector('.nl').style.visibility = 'visible'; c.querySelector('.nb').style.visibility = 'visible'; sound(l); opened.add(l); renderKey([l]); }) });

add({ t: 'Hear it', min: 2, html: () => {
  const W = [['pen', 1], ['pin', 0], ['ten', 1], ['tan', 0], ['net', 1], ['nut', 0]];
  return `<span class="tag">Hear it</span><h1>Поймай звук /e/</h1><p class="sub">Нажми ▶ и послушай слово. Если слышишь /e/ — жми «Есть!», если нет — «Нет».</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${W.map(([w, y], k) => `<div class="card"><button class="btn ghost" onclick="say('${w}')">▶ слово ${k + 1}</button>
  <div class="row" style="margin-top:8px"><button class="btn ok" onclick="hearAns(this,${y},1,'${w}')">Есть!</button><button class="btn no" onclick="hearAns(this,${y},0,'${w}')">Нет</button></div><div class="fb"></div></div>`).join('')}</div>
 <div class="teacher"><b>Учитель:</b> можно произносить слова самому вместо кнопки ▶. Потом устно: «Раздели слово на звуки» — c-a-t, r-e-d, s-u-n.</div>`; } });

add({ t: 'Write it', min: 3, html: () => `<span class="tag">Write it</span><h1>Пишем новые буквы</h1><p class="sub">Смотри, как пишется буква. Напиши каждую 3 раза в тетради. Потом спиши слова <b>cat</b> и <b>red</b> и покажи в камеру.</p>
 <div class="row">${NEW.map(l => `<div class="card" style="width:150px"><svg viewBox="0 0 100 120" width="110" height="132" class="wr" data-l="${l}"></svg><button class="btn ghost" onclick="drawL(this.previousElementSibling)">↻</button></div>`).join('')}</div>
 <div class="row" style="margin-top:14px"><span class="card word" style="min-width:140px">cat</span><span class="card word" style="min-width:140px">red</span></div>`,
 after: () => document.querySelectorAll('.wr').forEach(drawL) });

add({ t: 'Copy & check', min: 2, plus: true, html: () => `<span class="tag plus">+ 40 мин · Copy & check</span><h1>Спиши и сверь</h1><p class="sub">Спиши слова в тетрадь и сверь с экраном букву за буквой.</p>
 <div class="row">${['sun', 'kid', 'pen'].map(w => `<div class="card" style="width:200px">${pic(w)}<div class="word">${w}</div></div>`).join('')}</div>` });

add({ t: 'Blending', min: 4, html: () => {
  const W = ['cat', 'kid', 'pen', 'ten', 'sun', 'cup', 'red', 'run'];
  return `<span class="tag">Blending</span><h1>Звуки → слово</h1><p class="sub">Нажимай буквы по одной — звучат звуки. Потом прочитай слово целиком и нажми «Прочитал!» — откроется картинка.</p>
 <div class="card" style="max-width:560px;margin:0 auto"><div class="row" id="bl"></div><div id="blp" style="min-height:210px;margin-top:10px"></div>
 <div class="row"><button class="btn ok" id="blr">Прочитал!</button><button class="btn ghost" id="bln">Следующее слово →</button></div><div class="fb" id="blc"></div></div>`; },
 after: () => {
  const W = ['cat', 'kid', 'pen', 'ten', 'sun', 'cup', 'red', 'run']; let n = 0;
  const show = () => { document.getElementById('bl').innerHTML = [...W[n]].map(l => `<button class="sbtn" onclick="this.classList.add('hit');sound('${l}')">${l}</button>`).join(''); document.getElementById('blp').innerHTML = ''; document.getElementById('blc').textContent = `Слово ${n + 1} из ${W.length}`; };
  document.getElementById('blr').onclick = () => { document.getElementById('blp').innerHTML = pic(W[n]); say(W[n]); };
  document.getElementById('bln').onclick = () => { n = (n + 1) % W.length; show(); }; show(); } });

add({ t: 'Real or fake?', min: 3, plus: true, html: () => `<span class="tag plus">+ 40 мин · Real or fake?</span><h1>Настоящее слово или фейк?</h1><p class="sub">Прочитай слово вслух — даже выдуманное. Потом реши: есть такое слово в английском или нет?</p>
 <div class="card" style="max-width:480px;margin:0 auto"><div class="word" id="rf" style="font-size:64px">—</div>
 <div class="row" style="margin-top:10px"><button class="btn ok" onclick="rfAns(1)">✔ Real</button><button class="btn no" onclick="rfAns(0)">✘ Fake</button></div><div class="fb" id="rff"></div></div>`,
 after: () => { window.RF = [['cup', 1], ['dut', 0], ['red', 1], ['kep', 0], ['sun', 1], ['mip', 0], ['ten', 1], ['gog', 0]]; window.rfN = 0; window.rfOk = 0; document.getElementById('rf').textContent = RF[0][0]; } });

add({ t: 'Word building', min: 2, html: () => `<span class="tag">Word building</span><h1>Буквы-магниты</h1><p class="sub">Посмотри на картинку и собери слово: нажимай на магниты по порядку. Ошибся — нажми на букву в слове, она вернётся.</p>
 <div class="card" style="max-width:560px;margin:0 auto"><div id="wbp"></div><div class="row" id="wbs"></div><div class="tiles" id="wbt"></div><div class="fb" id="wbf"></div>
 <div class="row"><button class="btn ghost" id="wbn">Следующее →</button></div></div>`,
 after: () => {
  const W = ['cat', 'sun', 'red', 'kid'], C = ['#E8553E', '#1CA3DE', '#EE9A2B', '#6C3DE0', '#5FB81F']; let n = 0, got = [];
  const draw = () => {
   const w = W[n]; document.getElementById('wbp').innerHTML = pic(w);
   const pool = [...w, ...'mpo'.split('').filter(x => !w.includes(x)).slice(0, 2)].sort(() => Math.random() - .5);
   document.getElementById('wbs').innerHTML = [...w].map((_, k) => `<div class="slot" data-k="${k}">${got[k] || ''}</div>`).join('');
   document.getElementById('wbt').innerHTML = pool.map((l, k) => `<button class="tile" data-l="${l}" style="background:${C[k % 5]}">${l}</button>`).join('');
   document.querySelectorAll('#wbt .tile').forEach(t => t.onclick = () => { if (got.length >= w.length) return; got.push(t.dataset.l); t.style.visibility = 'hidden'; t.dataset.used = got.length - 1; upd(); sound(t.dataset.l); });
   document.querySelectorAll('#wbs .slot').forEach(s => s.onclick = () => { const k = +s.dataset.k; if (k !== got.length - 1) return; got.pop(); const t = [...document.querySelectorAll('#wbt .tile')].find(t => t.dataset.used == k); if (t) { t.style.visibility = 'visible'; delete t.dataset.used; } upd(); });
   upd();
  };
  const upd = () => { const w = W[n]; document.querySelectorAll('#wbs .slot').forEach((s, k) => s.textContent = got[k] || ''); const f = document.getElementById('wbf');
   if (got.length === w.length) { if (got.join('') === w) { f.innerHTML = '<span class="good">✔ ' + w + '</span>'; say(w); } else f.innerHTML = '<span class="bad">Почти! Нажми на последнюю букву и попробуй ещё.</span>'; } else f.textContent = ''; };
  document.getElementById('wbn').onclick = () => { n = (n + 1) % W.length; got = []; draw(); }; draw(); } });

add({ t: 'Tricky words', min: 2, html: () => `<span class="tag">Tricky words</span><h1>Слова-исключения</h1><p class="sub">Эти слова читаются не по правилам — запоминаем их целиком. Нажми, чтобы услышать.</p>
 <div class="row">${['said', 'are', 'you'].map(w => `<button class="card word" style="min-width:150px;color:var(--purple)" onclick="say('${w}')">${w}</button>`).join('')}</div>
 <p class="sub" style="margin-top:18px">Найди их во фразе и прочитай всю фразу:</p>
 <div class="row" style="gap:14px"><div style="width:150px">${pic('sam_surprised','pic" style="max-width:150px;aspect-ratio:auto')}</div><div class="story" style="text-align:center;flex:1;min-width:240px">“<b>You</b> <b>are</b> a cat!” <b>said</b> Sam.</div></div>` });

add({ t: 'Dictation', min: 3, html: () => `<span class="tag">Dictation</span><h1>Диктант</h1><p class="sub">Послушай слово и напиши его в тетради. Потом нажми «Показать» и сверь.</p>
 <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${['pen', 'cup', 'rat', 'kit'].map((w, k) => `<div class="card"><div style="font-weight:700;color:var(--mut)">слово ${k + 1}</div><button class="btn ghost" onclick="say('${w}')">▶ слушать</button><div class="dw" style="min-height:220px;margin-top:8px"></div><button class="btn" onclick="this.previousElementSibling.innerHTML=pic('${w}')+'<div class=&quot;word&quot;>${w}</div>'">Показать</button></div>`).join('')}</div>` });

add({ t: 'Фраза на слух', min: 2, plus: true, html: () => `<span class="tag plus">+ 40 мин · Фраза</span><h1>Напиши фразу</h1><p class="sub">Послушай и напиши три слова.</p>
 <div class="card" style="max-width:480px;margin:0 auto"><button class="btn ghost" onclick="say('a red cup')">▶ слушать</button><div id="ph" style="min-height:70px"></div><button class="btn" onclick="document.getElementById('ph').innerHTML='<div class=&quot;word&quot;>a red cup</div>'">Показать</button></div>` });

add({ t: 'Decode the message', min: 4, html: () => `<span class="tag">Decode the message</span><h1>Расшифруй сообщение</h1>
 <p class="sub">Сначала разминка — прочитай фразы:</p>
 <div class="row">${['a red cup', 'Sam and Dan', 'a pet rat'].map(p => `<span class="card" style="font-size:26px;font-weight:800">${p}</span>`).join('')}</div>
 <p class="sub" style="margin-top:16px">Теперь сообщение Агента X. Все символы уже в ключе внизу. Называй буквы по порядку — нажимай на символ, чтобы проверить.</p>
 <div class="card" style="background:var(--lilac)">${coded('Run! Get the red cup.', false, 'msg')}</div>
 <div class="row" style="margin-top:8px"><button class="btn ghost" onclick="document.querySelectorAll('#msg .gl').forEach(g=>g.querySelector('.lt').textContent=g.dataset.l)">Открыть всё</button></div>
 <p class="sub" style="margin-top:16px">Что было дальше? Прочитай:</p>
 <div class="row" style="align-items:center;gap:16px"><div style="flex:1;min-width:260px" class="story">“Run! Get the red cup!” said Sam.<br>The red cup sits on a mat.<br>Dan gets it. In the cup — a map!<br>Sam and Dan run.</div>
 <div style="width:240px">${'<img class="pic" style="max-width:240px;border-radius:12px" src="' + IMG + 'scene_cup.webp" alt="" onerror="this.outerHTML=\'<div class=&quot;ph&quot;>красная чашка с картой (картинка)</div>\'">'}</div></div>
 <p class="sub" style="margin-top:14px">Верно или неверно?</p>
 ${[['The cup is red.', 1], ['The cup sits on a pen.', 0], ['In the cup — a map.', 1]].map(([q, y]) => `<div class="tf"><span>${q}</span><button class="btn ok" onclick="tfAns(this,${y},1)">Верно</button><button class="btn no" onclick="tfAns(this,${y},0)">Неверно</button></div>`).join('')}`,
 after: () => document.querySelectorAll('#msg .gl').forEach(g => g.onclick = () => { g.querySelector('.lt').textContent = g.dataset.l; sound(g.dataset.l.toLowerCase()); }) });

add({ t: 'Code chant', min: 1, html: () => `<span class="tag">Code chant</span><h1>Скороговорка урока</h1><p class="sub">Прочитай медленно, потом быстрее. Вторую половину прочитаем в начале следующего урока.</p>
 <div class="chant" id="ch3">Run, run, run in the sun!<br>Get a cup, get a nut!</div>
 <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="beat('ch3',650)">🐢 медленно</button><button class="btn or" onclick="beat('ch3',330)">⚡ быстро</button></div>` });

add({ t: 'Mission complete', min: 1, html: () => `<span class="tag" style="background:var(--green)">Mission complete</span><h1>Миссия 3 выполнена!</h1>
 <div class="row" style="gap:16px;margin-top:10px">
  <div style="display:flex;gap:4px;align-items:flex-end">${pic('sam_wave','pic" style="max-width:120px;aspect-ratio:auto')}${pic('dan_wave','pic" style="max-width:130px;aspect-ratio:auto')}</div>
  <div class="card" style="width:260px"><div style="color:var(--mut)">Теперь ты читаешь</div><div class="big" style="color:var(--blue)">70+</div><div style="color:var(--mut)">слов</div></div>
  <div class="card" style="width:300px;text-align:left"><b>Сегодня ты:</b><br>• открыл 5 символов: c k e u r<br>• прочитал слова cat, sun, red, cup…<br>• написал диктант<br>• расшифровал сообщение Агента X</div>
 </div>
 <div class="teacher"><b>Учитель:</b> выдайте монетки на платформе и задайте ДЗ «Reading Club 10+ · Lesson 3».</div>` });

// ----- If time -----
const X = [];
X.push({ t: 'Code breaker', html: () => `<span class="tag extra">⭐ Extra · Code breaker</span><h1>Взломщик</h1><p class="sub">Расшифруй слово как можно быстрее. Таймер пошёл!</p>
 <div class="card" style="max-width:520px;margin:0 auto"><div id="cbw"></div><div class="timer" id="cbt">0.0 с</div><input id="cbi" autocomplete="off" style="font-size:30px;width:200px;text-align:center;border:2px solid var(--line);border-radius:10px;padding:6px;margin-top:8px"><div class="fb" id="cbf"></div></div>`,
 after: () => { const W = ['cat', 'sun', 'pen', 'red', 'kid', 'cup']; let n = 0, t0 = Date.now(), tm = setInterval(() => document.getElementById('cbt').textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' с', 100); window._tm = tm;
  const show = () => { document.getElementById('cbw').innerHTML = coded(W[n], false, 'cbx'); document.getElementById('cbi').value = ''; document.getElementById('cbi').focus(); };
  document.getElementById('cbi').oninput = e => { if (e.target.value.trim().toLowerCase() === W[n]) { say(W[n]); n++; if (n >= W.length) { clearInterval(tm); document.getElementById('cbw').innerHTML = '🏁'; document.getElementById('cbf').innerHTML = '<span class="good">Все 6 слов взломаны!</span>'; } else show(); } }; show(); } });
X.push({ t: 'Missing letter', html: () => `<span class="tag extra">⭐ Extra · Missing letter</span><h1>Вставь букву</h1><p class="sub">Какой буквы не хватает? Нажми на неё.</p>
 ${[['c_t', 'a', 'cat'], ['s_n', 'u', 'sun'], ['r_d', 'e', 'red'], ['p_n', 'e', 'pen'], ['k_d', 'i', 'kid']].map(([m, a, w]) => `<div class="tf" style="grid-template-columns:auto 1fr;gap:16px"><span class="word" style="min-width:120px">${m.replace('_', '<u>&nbsp;?&nbsp;</u>')}</span><span class="row" style="justify-content:flex-start">${['a', 'e', 'i', 'o', 'u'].map(o => `<button class="btn ghost" onclick="mlAns(this,'${o}','${a}','${w}')">${o}</button>`).join('')}</span></div>`).join('')}` });
X.push({ t: 'Word search', html: () => `<span class="tag extra">⭐ Extra · Word search</span><h1>Найди слова</h1><p class="sub">В сетке спрятаны 5 слов урока: <b>cat, sun, red, cup, pen</b>. Нажми на первую и последнюю букву слова.</p><div class="ws" id="ws"></div><div class="fb" id="wsf"></div>`,
 after: () => wsInit() });

// ===== помощники =====
function beat(id, ms) { const el = document.getElementById(id); if (!el.dataset.w) { el.innerHTML = el.innerHTML.split('<br>').map(l => l.split(' ').map(w => `<span>${w}</span>`).join(' ')).join('<br>'); el.dataset.w = 1; } const sp = [...el.querySelectorAll('span')]; let k = 0; const t = setInterval(() => { sp.forEach(s => s.classList.remove('hl')); if (k >= sp.length) { clearInterval(t); return; } sp[k++].classList.add('hl'); }, ms); }
function hearAns(b, y, a, w) { const f = b.closest('.card').querySelector('.fb'); f.innerHTML = y === a ? `<span class="good">✔ ${w}</span>` : `<span class="bad">✘ ${w}</span>`; }
function tfAns(b, y, a) { const r = b.parentElement; r.querySelectorAll('button').forEach(x => x.style.opacity = .4); b.style.opacity = 1; b.textContent = (y === a ? '✔ ' : '✘ ') + b.textContent.replace(/^[✔✘] /, ''); }
function rfAns(a) { const [w, y] = RF[rfN]; if (a === y) rfOk++; document.getElementById('rff').innerHTML = (a === y ? '<span class="good">✔ ' : '<span class="bad">✘ ') + w + (y ? ' — настоящее слово' : ' — такого слова нет') + '</span>'; rfN++; setTimeout(() => { if (rfN < RF.length) document.getElementById('rf').textContent = RF[rfN][0]; else { document.getElementById('rf').textContent = '🏁'; document.getElementById('rff').innerHTML = `<span class="good">Верно: ${rfOk} из ${RF.length}</span>`; } }, 900); }
function mlAns(b, o, a, w) { const row = b.closest('.tf'); if (o === a) { row.querySelector('.word').textContent = w; say(w); row.querySelectorAll('button').forEach(x => x.disabled = true); b.style.background = '#dff3c8'; } else b.style.background = '#fde0db'; }
function wsInit() { const G = ['catpo', 'mupen', 'cupso', 'sunig', 'redmt']; const words = { cat: [[0, 0], [0, 2]], pen: [[1, 2], [1, 4]], sun: [[3, 0], [3, 2]], red: [[4, 0], [4, 2]], cup: [[0, 0], [2, 0]] };
 const el = document.getElementById('ws'); el.style.gridTemplateColumns = 'repeat(5,44px)'; let first = null, found = 0;
 el.innerHTML = G.map((r, y) => [...r].map((c, x) => `<button data-x="${x}" data-y="${y}">${c}</button>`).join('')).join('');
 const cell = (x, y) => el.querySelector(`button[data-x="${x}"][data-y="${y}"]`);
 const line = (a, b) => { const dx = Math.sign(b[0] - a[0]), dy = Math.sign(b[1] - a[1]); const n = Math.max(Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1])); let s = ''; const cs = []; for (let k = 0; k <= n; k++) { const c = cell(a[0] + dx * k, a[1] + dy * k); s += c.textContent; cs.push(c); } return [s, cs]; };
 el.querySelectorAll('button').forEach(b => b.onclick = () => { const p = [+b.dataset.x, +b.dataset.y]; if (!first) { first = p; b.classList.add('sel'); return; } const [s, cs] = line(first, p); cell(...first).classList.remove('sel'); first = null; const w = ['cat', 'pen', 'sun', 'red', 'cup'].find(w => w === s || w === [...s].reverse().join('')); if (w) { cs.forEach(c => c.classList.add('found')); found++; say(w); document.getElementById('wsf').innerHTML = `<span class="good">${w}! Найдено ${found} из 5</span>`; } }); }
// буквы со стрелками: штрихи в координатах 100×120
const STROKES = { c: ['M72 52 C60 38 30 40 28 70 C28 98 60 104 74 88'], k: ['M30 10 L30 110', 'M72 50 L30 84', 'M44 74 L76 110'], e: ['M28 74 L74 74 C74 46 30 42 28 72 C28 100 62 106 76 92'], u: ['M28 46 L28 88 C28 108 70 108 72 84', 'M72 46 L72 110'], r: ['M32 46 L32 110', 'M32 70 C36 50 56 44 72 50'] };
function drawL(svg) { const l = svg.dataset.l; svg.innerHTML = `<line x1="0" y1="46" x2="100" y2="46" stroke="#CFE6F4" stroke-dasharray="4 4"/><line x1="0" y1="110" x2="100" y2="110" stroke="#CFE6F4"/>` + STROKES[l].map((d, k) => `<path d="${d}" fill="none" stroke="#1CA3DE" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.1s ${k * 1.1}s forwards"/>`).join(''); }
document.head.insertAdjacentHTML('beforeend', '<style>@keyframes dr{to{stroke-dashoffset:0}}</style>');

// ===== навигация =====
const list = () => extra ? X : S.filter(s => mode === 40 || !s.plus);
function go(n) {
 if (window._tm) { clearInterval(window._tm); window._tm = null; }
 const L = list(); i = Math.max(0, Math.min(L.length - 1, n)); const s = L[i];
 opened = new Set(OLD); const nc = S.findIndex(x => x.t === 'New code'); if (extra || S.indexOf(s) > nc) NEW.forEach(l => opened.add(l));
 document.getElementById('scr').innerHTML = s.html(); if (s.after) s.after();
 document.getElementById('stage').textContent = (extra ? 'If time' : `Этап ${i + 1} из ${L.length}`) + ' · ' + s.t + (s.min ? ` · ${s.plus ? '+' : ''}${s.min} мин` : '');
 document.getElementById('dots').innerHTML = L.map((x, k) => `<i class="${k === i ? 'on' : ''} ${x.plus ? 'p' : ''}"></i>`).join('');
 document.getElementById('prev').style.visibility = i ? 'visible' : 'hidden';
 document.getElementById('next').textContent = i === L.length - 1 ? (extra ? '← К уроку' : '🏁 Конец') : 'Дальше →';
 renderKey(); document.querySelector('main').scrollTop = 0;
}
document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => { const L = list(); if (i === L.length - 1) { if (extra) { extra = false; document.getElementById('extra').classList.remove('on'); go(0); } } else go(i + 1); };
document.getElementById('extra').onclick = (e) => { extra = !extra; e.target.classList.toggle('on', extra); go(0); };
document.querySelectorAll('#mode button').forEach(b => { b.classList.toggle('on', +b.dataset.m === mode); b.onclick = () => { const cur = list()[i]; mode = +b.dataset.m; try { localStorage.setItem('rc10_mode', mode); } catch (e) {} document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); const L = list(); go(Math.max(0, L.indexOf(cur))); }; });
go(0);
</script>
</body>
