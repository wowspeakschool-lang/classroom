<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reading Club 10+ · Mission 3 · The Red Cup</title>
<style>
@font-face{font-family:Montserrat;font-weight:800;src:url(../../media/reading10/fonts/montserrat-latin-800-normal.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:900;src:url(../../media/reading10/fonts/montserrat-latin-900-normal.woff2) format("woff2")}
@font-face{font-family:Golos;font-weight:500;src:url(../../media/reading10/fonts/golos-text-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Golos;font-weight:700;src:url(../../media/reading10/fonts/golos-text-latin-700-normal.woff2) format("woff2")}
:root{--ink:#1F1A3D;--mute:#6F6A8A;--line:#EEEAF3;--pink:#F7628C;--pink-s:#FFE6EE;--pur:#6A4DF4;--pur-d:#5236DB;--pur-s:#EFEBFF;--ok:#2FB57C;--ok-s:#E3F7EE;--or:#E8862A;--or-s:#FFF0DE;--red:#E5484D;--red-s:#FFE8E8;--sh:0 10px 30px rgba(43,37,69,.09)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Golos,'Golos Text',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#FFF8EF 0%,#FFF1E6 45%,#FFF6DF 100%);overflow:hidden}
body::before,body::after{content:"";position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;z-index:0;pointer-events:none}
body::before{width:420px;height:420px;background:#FFD3E1;top:-140px;right:-120px}
body::after{width:460px;height:460px;background:#E4DCFF;bottom:-200px;left:-160px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .09s,box-shadow .12s,background .15s,opacity .15s}
button:active{transform:scale(.96)}
img{display:block;max-width:100%}
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;gap:10px;padding:12px 18px}
.brand{display:flex;align-items:center;gap:8px;font-family:Montserrat;font-weight:900;font-size:17px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--pur),var(--pink));display:grid;place-items:center;color:#fff;font-size:16px}
.pill{background:rgba(255,255,255,.8);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13px;box-shadow:var(--sh)}
.sp{flex:1}
.ctl{display:inline-flex;background:rgba(255,255,255,.8);border-radius:99px;padding:3px;box-shadow:var(--sh)}
.ctl button{padding:5px 11px;border-radius:99px;font-weight:700;font-size:12px;color:var(--mute)}
.ctl button.on{background:var(--pur);color:#fff}
.xb{padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px;background:rgba(255,255,255,.8);color:var(--or);box-shadow:var(--sh)}
.xb.on{background:var(--or);color:#fff}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 18px}
.card{background:#fff;border-radius:30px;box-shadow:var(--sh);width:min(1080px,100%);max-height:100%;overflow:auto;padding:26px 30px 28px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lab{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:5px 12px;font-family:Montserrat;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;background:var(--pur-s);color:var(--pur-d)}
.lab.plus{background:var(--pink-s);color:#C7346A}.lab.x{background:var(--or-s);color:#B8621A}.lab.ok{background:var(--ok-s);color:#1E8A5C}
h1{font-family:Montserrat;font-weight:900;font-size:clamp(28px,3.6vw,44px);line-height:1.1;margin:12px 0 20px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}
.tile{background:#FAF8FE;border:2px solid var(--line);border-radius:22px;padding:14px;text-align:center}
.big{font-family:Montserrat;font-weight:900;font-size:clamp(64px,9vw,120px);line-height:1}
.word{font-family:Montserrat;font-weight:900;font-size:clamp(34px,4.6vw,56px);letter-spacing:.01em}
.pic{width:100%;max-width:220px;aspect-ratio:1;object-fit:contain;margin:0 auto}
.btn{border-radius:99px;padding:12px 22px;font-family:Montserrat;font-weight:800;font-size:16px;background:var(--pur);color:#fff;box-shadow:0 6px 16px rgba(106,77,244,.28)}
.btn.soft{background:var(--pur-s);color:var(--pur-d);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 6px 16px rgba(47,181,124,.28)}.btn.no{background:var(--red);box-shadow:0 6px 16px rgba(229,72,77,.25)}
.btn.or{background:var(--or);box-shadow:0 6px 16px rgba(232,134,42,.28)}
.em{width:44px;height:44px}
.coded{display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:center}
.coded .w{display:inline-flex;gap:4px;align-items:flex-end}
.gl{display:inline-flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.gl .lt{font-family:Montserrat;font-weight:900;font-size:22px;height:26px;color:var(--pur)}
.gl.dim img{opacity:.25;filter:grayscale(1)}
.p{font-family:Montserrat;font-weight:900;font-size:34px}
.chant{font-family:Montserrat;font-weight:900;font-size:clamp(28px,4vw,50px);line-height:1.4;text-align:center}
.chant span{transition:color .12s}.chant span.hl{color:var(--pink)}
.story{font-size:clamp(22px,2.8vw,32px);line-height:1.6;font-weight:700}
.sbtn{min-width:78px;height:92px;border-radius:20px;background:#FAF8FE;border:2.5px solid var(--line);font-family:Montserrat;font-weight:900;font-size:52px}
.sbtn.hit{background:var(--pink-s);border-color:var(--pink)}
.mag{width:72px;height:84px;border-radius:18px;font-family:Montserrat;font-weight:900;font-size:44px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.slot{width:72px;height:84px;border-radius:18px;border:3px dashed #D9D3EA;display:grid;place-items:center;font-family:Montserrat;font-weight:900;font-size:44px;cursor:pointer}
.fb{min-height:30px;font-family:Montserrat;font-weight:800;text-align:center;margin-top:10px;font-size:18px}
.good{color:var(--ok)}.bad{color:var(--red)}
.tf{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;margin:10px 0;font-size:24px;font-weight:700}
.ws{display:grid;gap:6px;justify-content:center}
.ws button{width:52px;height:52px;border-radius:14px;background:#FAF8FE;border:2px solid var(--line);font-family:Montserrat;font-weight:900;font-size:24px}
.ws button.sel{background:var(--or-s);border-color:var(--or)}.ws button.found{background:var(--ok-s);border-color:var(--ok)}
.timer{font-family:Montserrat;font-weight:900;font-size:30px;color:var(--pur)}
.phone{width:min(340px,100%);border:12px solid #1F1A3D;border-radius:36px;padding:16px 12px;background:#fff}
.bub{background:var(--pur-s);border-radius:18px 18px 18px 6px;padding:14px}
.from{font-family:Montserrat;font-weight:800;font-size:13px;color:var(--pur-d);margin-bottom:8px}
.newcode .sym{width:150px;height:150px;margin:0 auto}
.newcode .reveal{opacity:0;transform:scale(.9);transition:.35s}
.newcode.open .reveal{opacity:1;transform:none}
.unlock{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg)}60%{transform:scale(1.12) rotate(4deg)}100%{transform:none}}
.bot{padding:8px 18px 14px}
.keybar{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;background:rgba(255,255,255,.8);border-radius:22px;padding:8px 10px;box-shadow:var(--sh);margin:0 auto 10px;width:fit-content;max-width:100%}
.k{width:40px;text-align:center}
.k img{width:28px;height:28px;margin:0 auto}
.k b{display:block;font-family:Montserrat;font-weight:900;font-size:13px;line-height:16px}
.k.off .q{width:28px;height:28px;margin:0 auto;border-radius:8px;background:#F1EEF7;color:#B7B0CC;font-weight:900;line-height:28px}
.k.new img{animation:pop .6s ease}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nb{width:54px;height:54px;border-radius:50%;background:#fff;box-shadow:var(--sh);font-size:24px;font-weight:900;color:var(--pur-d)}
.nb.go{background:var(--pur);color:#fff;width:auto;padding:0 22px;border-radius:99px;font-family:Montserrat;font-size:16px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#E4DFF0}.dots i.on{background:var(--pur);transform:scale(1.25)}.dots i.p{background:#FFC2D4}.dots i.p.on{background:var(--pink)}
.ph{width:100%;max-width:220px;aspect-ratio:1;margin:0 auto;border:2px dashed #D9D3EA;border-radius:18px;display:grid;place-items:center;font-size:56px}
@media (max-width:700px){.card{padding:18px}.k{width:30px}.k img{width:22px;height:22px}.mag,.slot{width:56px;height:66px;font-size:34px}.sbtn{min-width:60px;height:72px;font-size:40px}.brand span{display:none}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="brand"><div class="dot">🔐</div><span>Reading Club 10+</span></div>
  <span class="pill">Mission 3</span>
  <div class="sp"></div>
  <span class="ctl" id="mode"><button data-m="30">30</button><button data-m="40">40</button></span>
  <button class="xb" id="extra">⭐ Extra</button>
 </div>
 <main><div class="card" id="scr"></div></main>
 <div class="bot">
  <div class="keybar" id="key"></div>
  <div class="nav"><button class="nb" id="prev">←</button><div class="dots" id="dots"></div><button class="nb go" id="next">Next →</button></div>
 </div>
</div>
<script>
const SND = 'https://vtcxghsqymwkyiogpndf.supabase.co/storage/v1/object/public/classroom-media/reading10/zvuki/';
const IMG = '../../media/reading10/u3/';
const CIP = '../../media/reading10/cipher/';
const OLD = 'satpinmdog'.split(''), NEW = 'ckeur'.split(''), ALPHA = 'abcdefghijklmnopqrstuvwxyz'.split('');
const ANCHOR = { c: ['cat', null, 'k'], k: ['key', null, 'k'], e: ['egg', null, 'e'], u: ['umbrella', null, 'ʌ'], r: ['rocket', null, 'r'] };
const PIC = { red: 'red_paint' };
let mode = 40, extra = false, i = 0, opened = new Set(OLD);
try { mode = +(localStorage.getItem('rc10_mode') || 40); } catch (e) {}

const glyph = (ch, s = 44) => `<img src="${CIP}${ch.toLowerCase()}.webp" alt="" style="width:${s}px;height:${s}px;object-fit:contain">`;
function coded(text, id, size = 46) {
  return `<div class="coded" id="${id}">` + text.split(' ').map(w => `<span class="w">` + [...w].map(ch => /[a-z]/i.test(ch)
    ? `<span class="gl" data-l="${ch.toLowerCase()}"><span class="lt"></span>${glyph(ch, size)}</span>` : `<span class="p">${ch}</span>`).join('') + `</span>`).join('') + `</div>`;
}
function renderKey(fresh = []) {
  document.getElementById('key').innerHTML = ALPHA.map(ch => opened.has(ch)
    ? `<div class="k ${fresh.includes(ch) ? 'new' : ''}">${glyph(ch, 28)}<b>${ch}</b></div>`
    : `<div class="k off"><div class="q">?</div><b>&nbsp;</b></div>`).join('');
}
let cur;
function play(src) { try { if (cur) cur.pause(); cur = new Audio(src); cur.play().catch(() => {}); } catch (e) {} }
const sound = l => play(SND + (l === 'q' ? 'qu' : l) + '.mp3');
function say(t) { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-GB'; u.rate = .85; const v = speechSynthesis.getVoices().find(v => /en-GB/.test(v.lang)); if (v) u.voice = v; speechSynthesis.speak(u); } catch (e) {} }
const pic = (w, st = '') => `<img class="pic" style="${st}" src="${IMG}${PIC[w] || w}.webp" alt="" onerror="this.outerHTML='<div class=&quot;ph&quot;>🖼️</div>'">`;
const lab = (t, c = '') => `<span class="lab ${c}">${t}</span>`;
function beat(id, ms) { const el = document.getElementById(id); if (!el.dataset.w) { el.innerHTML = el.innerHTML.split('<br>').map(l => l.split(' ').map(w => `<span>${w}</span>`).join(' ')).join('<br>'); el.dataset.w = 1; } const sp = [...el.querySelectorAll('span')]; let k = 0; clearInterval(window._bt); window._bt = setInterval(() => { sp.forEach(s => s.classList.remove('hl')); if (k >= sp.length) { clearInterval(window._bt); return; } sp[k++].classList.add('hl'); }, ms); }
const chantBtns = id => `<div class="row" style="margin-top:18px"><button class="btn soft" onclick="beat('${id}',650)">🐢 Slow</button><button class="btn or" onclick="beat('${id}',330)">⚡ Fast</button></div>`;

const S = [], add = o => S.push(o);
// 1
add({ t: 'Mission', html: () => `${lab('🔐 Mission 3')}<h1>New message from Agent X!</h1>
 <div class="row" style="gap:26px;align-items:center">
  <img src="${IMG}scene_phone.webp" alt="" style="width:min(460px,100%);border-radius:24px;box-shadow:var(--sh)">
  <div class="phone"><div class="from">Agent X · now</div><div class="bub">${coded('Run! Get the red cup.', 'brief', 34)}</div></div>
 </div>`, after: () => document.querySelectorAll('#brief .gl').forEach(g => { if (!OLD.includes(g.dataset.l)) g.classList.add('dim'); }) });
// 2
add({ t: 'Code check', html: () => `${lab('Code check')}<h1>Look. Say the sound.</h1>
 <div class="row">${OLD.map(l => `<button class="tile" style="width:104px" onclick="this.querySelector('.lt').textContent='${l}';sound('${l}')">${glyph(l, 56)}<div class="lt big" style="font-size:40px;height:46px;color:var(--pur)"></div></button>`).join('')}</div>` });
// 3
add({ t: 'Tricky words', html: () => `${lab('Tricky words')}<h1>Read.</h1>
 <div class="row" style="gap:20px">${['I', 'the', 'a'].map(w => `<button class="tile word" style="min-width:170px;padding:26px" onclick="say('${w}')">${w}</button>`).join('')}</div>` });
// 4
add({ t: 'Chant', html: () => `${lab('Chant')}<h1>Read. Slow… then fast!</h1>
 <div class="chant" id="ch2">A dog, a pot, a map, a pan —<br>Dig it, Sam! Dig it, Dan!</div>${chantBtns('ch2')}` });
// + speed run
const SR = ['sat', 'pin', 'dog', 'map', 'top', 'dig', 'tap', 'sit', 'mop', 'pan', 'nod', 'pig', 'man', 'tin', 'dot', 'gap', 'sad', 'pot'];
add({ t: 'Speed run', plus: true, html: () => `${lab('+ Speed run', 'plus')}<h1>Read fast!</h1>
 <div class="tile" style="max-width:520px;margin:0 auto;padding:24px"><div class="big" id="sr" style="min-height:120px">⏱</div><div class="timer" id="srt">0.0 s</div>
 <div class="row" style="margin-top:14px"><button class="btn" id="srb">Start</button></div><div class="fb" id="srf"></div></div>`,
 after: () => { let n = -1, t0; const b = document.getElementById('srb'), w = document.getElementById('sr'), tt = document.getElementById('srt'), f = document.getElementById('srf');
  let best = null; try { best = +localStorage.getItem('rc10_best_u3') || null; } catch (e) {} if (best) f.textContent = '🏆 Best: ' + best.toFixed(1) + ' s';
  b.onclick = () => { if (n < 0) { t0 = Date.now(); window._tm = setInterval(() => tt.textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s', 100); b.textContent = 'Next'; }
   n++; if (n < SR.length) { w.textContent = SR[n]; return; }
   clearInterval(window._tm); const sec = (Date.now() - t0) / 1000; w.textContent = '🏁';
   if (!best || sec < best) { best = sec; try { localStorage.setItem('rc10_best_u3', sec); } catch (e) {} f.innerHTML = `<span class="good">🏆 New record: ${sec.toFixed(1)} s!</span>`; } else f.textContent = `${sec.toFixed(1)} s · best ${best.toFixed(1)} s`;
   b.textContent = 'Again'; n = -1; }; } });
// 5
add({ t: 'Homework', html: () => `${lab('Homework')}<h1>Homework check ✔</h1><div class="row"><div style="font-size:120px">📝</div></div>` });
// 6–10 new code
NEW.forEach((l, n) => add({ t: 'New code · ' + l, newl: l, html: () => `${lab(`New code · ${n + 1} / 5`)}<h1>Tap to unlock!</h1>
 <div class="row newcode" id="nc" style="gap:34px;cursor:pointer">
  <div class="tile" style="width:280px;padding:22px"><div class="sym" id="sym" style="width:210px;height:210px">${glyph(l, 210)}</div><div class="big reveal" style="margin-top:10px">${l}</div></div>
  <div class="reveal" style="text-align:center"><div style="font-size:22px;font-weight:700;margin-bottom:8px">This is <b>${l}</b>. Sound <b>/${ANCHOR[l][2]}/</b>.</div>
   <div class="word" style="margin-top:6px;font-size:clamp(44px,6vw,72px)"><span style="color:var(--pink)">${ANCHOR[l][0][0]}</span>${ANCHOR[l][0].slice(1)}</div>
   <button class="btn soft" style="margin-top:10px" onclick="event.stopPropagation();sound('${l}')">🔊 /${ANCHOR[l][2]}/</button></div>
 </div>`, after: () => { const nc = document.getElementById('nc'); nc.onclick = () => { if (nc.classList.contains('open')) return; nc.classList.add('open'); document.getElementById('sym').classList.add('unlock'); sound(l); opened.add(l); renderKey([l]); }; } }));
// 11
add({ t: 'Hear it', html: () => { const W = [['pen', 1], ['pin', 0], ['ten', 1], ['tan', 0], ['net', 1], ['nut', 0]];
  return `${lab('Hear it')}<h1>Catch the sound /e/!</h1>
 <div class="row">${W.map(([w, y], k) => `<div class="tile" style="width:150px"><button class="btn soft" onclick="say('${w}')">🔊 ${k + 1}</button>
  <div class="row" style="margin-top:10px;gap:8px"><button class="btn ok" style="padding:10px 14px" onclick="hearAns(this,${y},1,'${w}')">✔</button><button class="btn no" style="padding:10px 14px" onclick="hearAns(this,${y},0,'${w}')">✘</button></div><div class="fb"></div></div>`).join('')}</div>`; } });
// 12
add({ t: 'Write it', html: () => `${lab('Write it')}<h1>Watch. Write.</h1>
 <div class="row">${NEW.map(l => `<div class="tile" style="width:150px"><svg viewBox="0 0 100 120" width="116" height="140" class="wr" data-l="${l}"></svg><button class="btn soft" style="padding:6px 14px" onclick="drawL(this.previousElementSibling)">↻</button></div>`).join('')}</div>`,
 after: () => document.querySelectorAll('.wr').forEach(drawL) });
// 13
add({ t: 'Copy', html: () => `${lab('Write it')}<h1>Copy.</h1><div class="row" style="gap:26px">${['cat', 'red'].map(w => `<div class="tile" style="width:260px">${pic(w)}<div class="word">${w}</div></div>`).join('')}</div>` });
add({ t: 'Copy more', plus: true, html: () => `${lab('+ Write it', 'plus')}<h1>Copy. Check.</h1><div class="row" style="gap:20px">${['sun', 'kid', 'pen'].map(w => `<div class="tile" style="width:220px">${pic(w)}<div class="word">${w}</div></div>`).join('')}</div>` });
// 14
const BW = ['cat', 'kid', 'pen', 'ten', 'sun', 'cup', 'red', 'run'];
add({ t: 'Blending', html: () => `${lab('Blending')}<h1>Tap. Blend. Read.</h1>
 <div class="tile" style="max-width:620px;margin:0 auto;padding:22px"><div class="row" id="bl"></div><div id="blp" style="min-height:190px;margin-top:10px;display:grid;place-items:center"></div>
 <div class="row"><button class="btn ok" id="blr">✔ I can read it!</button><button class="btn soft" id="bln">Next word →</button></div><div class="fb" id="blc"></div></div>`,
 after: () => { let n = 0; const show = () => { document.getElementById('bl').innerHTML = [...BW[n]].map(l => `<button class="sbtn" onclick="this.classList.add('hit');sound('${l}')">${l}</button>`).join(''); document.getElementById('blp').innerHTML = ''; document.getElementById('blc').textContent = `${n + 1} / ${BW.length}`; };
  document.getElementById('blr').onclick = () => { document.getElementById('blp').innerHTML = pic(BW[n], 'max-width:180px'); say(BW[n]); };
  document.getElementById('bln').onclick = () => { n = (n + 1) % BW.length; show(); }; show(); } });
add({ t: 'Real or fake?', plus: true, html: () => `${lab('+ Real or fake?', 'plus')}<h1>Read. Real or fake?</h1>
 <div class="tile" style="max-width:520px;margin:0 auto;padding:24px"><div class="big" id="rf">—</div>
 <div class="row" style="margin-top:16px"><button class="btn ok" onclick="rfAns(1)">✔ Real</button><button class="btn no" onclick="rfAns(0)">✘ Fake</button></div><div class="fb" id="rff"></div></div>`,
 after: () => { window.RF = [['cup', 1], ['dut', 0], ['red', 1], ['kep', 0], ['sun', 1], ['mip', 0], ['ten', 1], ['gog', 0]]; window.rfN = 0; window.rfOk = 0; document.getElementById('rf').textContent = RF[0][0]; } });
// 15
add({ t: 'Word building', html: () => `${lab('Word building')}<h1>Make the word.</h1>
 <div class="row" style="gap:30px"><div id="wbp" style="width:220px"></div><div><div class="row" id="wbs"></div><div class="row" id="wbt" style="margin-top:16px"></div><div class="fb" id="wbf"></div>
 <div class="row"><button class="btn soft" id="wbn">Next →</button></div></div></div>`,
 after: () => { const W = ['cat', 'sun', 'red', 'kid'], C = ['#F7628C', '#6A4DF4', '#E8862A', '#2FB57C', '#3BA4E8']; let n = 0, got = [];
  const draw = () => { const w = W[n]; document.getElementById('wbp').innerHTML = pic(w); got = [];
   const pool = [...w, ...'mpo'.split('').filter(x => !w.includes(x)).slice(0, 2)].sort(() => Math.random() - .5);
   document.getElementById('wbt').innerHTML = pool.map((l, k) => `<button class="mag" data-l="${l}" style="background:${C[k % 5]}">${l}</button>`).join('');
   document.querySelectorAll('#wbt .mag').forEach(t => t.onclick = () => { if (got.length >= w.length) return; t.dataset.used = got.length; got.push(t.dataset.l); t.style.visibility = 'hidden'; sound(t.dataset.l); upd(); }); upd(); };
  const upd = () => { const w = W[n]; document.getElementById('wbs').innerHTML = [...w].map((_, k) => `<div class="slot" data-k="${k}">${got[k] || ''}</div>`).join('');
   document.querySelectorAll('#wbs .slot').forEach(s => s.onclick = () => { const k = +s.dataset.k; if (k !== got.length - 1) return; got.pop(); const t = [...document.querySelectorAll('#wbt .mag')].find(t => t.dataset.used == k); if (t) { t.style.visibility = 'visible'; delete t.dataset.used; } upd(); });
   const f = document.getElementById('wbf'); if (got.length === w.length) f.innerHTML = got.join('') === w ? `<span class="good">✔ ${w}!</span>` : '<span class="bad">Try again ↺</span>'; else f.textContent = ''; if (got.join('') === w) say(w); };
  document.getElementById('wbn').onclick = () => { n = (n + 1) % W.length; draw(); }; draw(); } });
// 16–17
add({ t: 'Tricky words', html: () => `${lab('New tricky words')}<h1>Remember!</h1>
 <div class="row" style="gap:20px">${['said', 'are', 'you'].map(w => `<button class="tile word" style="min-width:190px;padding:26px;color:var(--pur-d)" onclick="say('${w}')">${w}</button>`).join('')}</div>` });
add({ t: 'Read', html: () => `${lab('New tricky words')}<h1>Read.</h1>
 <div class="row" style="gap:26px"><img src="${IMG}sam_surprised.webp" alt="" style="height:300px"><div class="story" style="font-size:clamp(28px,3.6vw,44px)">“<b style="color:var(--pur-d)">You</b> <b style="color:var(--pur-d)">are</b> a cat!”<br><b style="color:var(--pur-d)">said</b> Sam.</div></div>` });
// 18
add({ t: 'Dictation', html: () => `${lab('Dictation')}<h1>Listen and write.</h1>
 <div class="row">${['pen', 'cup', 'rat', 'kit'].map((w, k) => `<div class="tile" style="width:210px"><button class="btn soft" onclick="say('${w}')">🔊 ${k + 1}</button><div class="dw" style="min-height:220px;margin-top:10px"></div><button class="btn" onclick="this.previousElementSibling.innerHTML=pic('${w}')+'<div class=&quot;word&quot;>${w}</div>'">Check</button></div>`).join('')}</div>` });
add({ t: 'Dictation +', plus: true, html: () => `${lab('+ Dictation', 'plus')}<h1>Listen and write.</h1>
 <div class="tile" style="max-width:520px;margin:0 auto;padding:24px"><button class="btn soft" onclick="say('a red cup')">🔊</button><div id="phr" style="min-height:90px;display:grid;place-items:center"></div><button class="btn" onclick="document.getElementById('phr').innerHTML='<div class=&quot;word&quot;>a red cup</div>'">Check</button></div>` });
// 19–22
add({ t: 'Phrases', html: () => `${lab('Reading')}<h1>Read.</h1>
 <div class="row" style="gap:18px">${[['a red cup', 'cup'], ['a pet rat', 'rat'], ['Sam and Dan', null]].map(([p, im]) => `<div class="tile" style="width:290px">${im ? pic(im, 'max-width:170px') : `<div style="display:flex;justify-content:center;gap:4px"><img src="${IMG}sam_stand.webp" alt="" style="height:170px"><img src="${IMG}dan_stand.webp" alt="" style="height:170px"></div>`}<div class="word" style="font-size:36px">${p}</div></div>`).join('')}</div>` });
add({ t: 'Decode', html: () => `${lab('🔐 Decode')}<h1>Decode the message!</h1>
 <div class="tile" style="padding:30px;background:var(--pur-s);border-color:#DCD3FF">${coded('Run! Get the red cup.', 'msg', 58)}</div>
 <div class="row" style="margin-top:16px"><button class="btn soft" onclick="document.querySelectorAll('#msg .gl').forEach(g=>g.querySelector('.lt').textContent=g.dataset.l)">Show all</button></div>`,
 after: () => document.querySelectorAll('#msg .gl').forEach(g => g.onclick = () => { g.querySelector('.lt').textContent = g.dataset.l; sound(g.dataset.l); }) });
add({ t: 'Story', html: () => `${lab('Story')}<h1>Read the story.</h1>
 <div class="row" style="gap:28px;align-items:center"><img src="${IMG}scene_cup.webp" alt="" style="width:min(420px,100%);border-radius:22px;box-shadow:var(--sh)">
 <div class="story" style="flex:1;min-width:280px">“Run! Get the red cup!” said Sam.<br>The red cup sits on a mat.<br>Dan gets it. In the cup — a map!<br>Sam and Dan run.</div></div>` });
add({ t: 'True or false?', html: () => `${lab('Story')}<h1>True or false?</h1><div style="max-width:760px;margin:0 auto">
 ${[['The cup is red.', 1], ['The cup sits on a pen.', 0], ['In the cup — a map.', 1]].map(([q, y]) => `<div class="tf"><span>${q}</span><button class="btn ok" onclick="tfAns(this,${y},1)">True</button><button class="btn no" onclick="tfAns(this,${y},0)">False</button></div>`).join('')}</div>` });
// 23–24
add({ t: 'Chant', html: () => `${lab('Chant')}<h1>Read. Slow… then fast!</h1><div class="chant" id="ch3">Run, run, run in the sun!<br>Get a cup, get a nut!</div>${chantBtns('ch3')}` });
add({ t: 'Mission complete', html: () => `${lab('✔ Mission complete', 'ok')}<h1>Mission 3 complete!</h1>
 <div class="row" style="gap:26px;align-items:flex-end"><img src="${IMG}sam_wave.webp" alt="" style="height:290px"><div class="tile" style="padding:26px 34px"><div style="font-weight:700;color:var(--mute)">Now you can read</div><div class="big" style="color:var(--pur)">70+</div><div style="font-weight:700;color:var(--mute)">words</div><div class="row" style="margin-top:12px;gap:6px">${NEW.map(l => glyph(l, 40)).join('')}</div></div><img src="${IMG}dan_wave.webp" alt="" style="height:290px"></div>` });

const X = [];
X.push({ t: 'Code breaker', html: () => `${lab('⭐ Extra', 'x')}<h1>Code breaker!</h1>
 <div class="tile" style="max-width:560px;margin:0 auto;padding:24px"><div id="cbw" style="min-height:80px"></div><div class="timer" id="cbt">0.0 s</div><input id="cbi" autocomplete="off" style="font:900 34px Montserrat;width:220px;text-align:center;border:3px solid var(--line);border-radius:18px;padding:8px;margin-top:10px"><div class="fb" id="cbf"></div></div>`,
 after: () => { const W = ['cat', 'sun', 'pen', 'red', 'kid', 'cup']; let n = 0, t0 = Date.now(); window._tm = setInterval(() => document.getElementById('cbt').textContent = ((Date.now() - t0) / 1000).toFixed(1) + ' s', 100);
  const show = () => { document.getElementById('cbw').innerHTML = coded(W[n], 'cbx', 58); const inp = document.getElementById('cbi'); inp.value = ''; inp.focus(); };
  document.getElementById('cbi').oninput = e => { if (e.target.value.trim().toLowerCase() === W[n]) { say(W[n]); n++; if (n >= W.length) { clearInterval(window._tm); document.getElementById('cbw').innerHTML = '<div class="big">🏁</div>'; document.getElementById('cbf').innerHTML = '<span class="good">6 / 6 — cracked!</span>'; } else show(); } }; show(); } });
X.push({ t: 'Missing letter', html: () => `${lab('⭐ Extra', 'x')}<h1>What's missing?</h1><div style="max-width:720px;margin:0 auto">
 ${[['c_t', 'a', 'cat'], ['s_n', 'u', 'sun'], ['r_d', 'e', 'red'], ['p_n', 'e', 'pen'], ['k_d', 'i', 'kid']].map(([m, a, w]) => `<div class="tf" style="grid-template-columns:200px 1fr"><span class="word" style="font-size:40px">${m.replace('_', '<span style="color:var(--pink)">_</span>')}</span><span class="row" style="justify-content:flex-start;gap:8px">${['a', 'e', 'i', 'o', 'u'].map(o => `<button class="btn soft" style="padding:10px 16px" onclick="mlAns(this,'${o}','${a}','${w}')">${o}</button>`).join('')}</span></div>`).join('')}</div>` });
X.push({ t: 'Word search', html: () => `${lab('⭐ Extra', 'x')}<h1>Find 5 words!</h1><div class="row" style="gap:30px"><div class="ws" id="ws"></div><div class="word" style="font-size:28px;line-height:1.5" id="wsl">cat<br>sun<br>red<br>cup<br>pen</div></div><div class="fb" id="wsf"></div>`, after: () => wsInit() });

function hearAns(b, y, a, w) { b.closest('.tile').querySelector('.fb').innerHTML = y === a ? `<span class="good">✔ ${w}</span>` : `<span class="bad">✘ ${w}</span>`; }
function tfAns(b, y, a) { b.parentElement.querySelectorAll('button').forEach(x => x.style.opacity = .35); b.style.opacity = 1; b.textContent = (y === a ? '✔ ' : '✘ ') + b.textContent.replace(/^[✔✘] /, ''); }
function rfAns(a) { if (rfN >= RF.length) return; const [w, y] = RF[rfN]; if (a === y) rfOk++; document.getElementById('rff').innerHTML = (a === y ? '<span class="good">✔ ' : '<span class="bad">✘ ') + w + (y ? ' — real' : ' — fake') + '</span>'; rfN++; setTimeout(() => { if (rfN < RF.length) document.getElementById('rf').textContent = RF[rfN][0]; else { document.getElementById('rf').textContent = '🏁'; document.getElementById('rff').innerHTML = `<span class="good">${rfOk} / ${RF.length}</span>`; } }, 900); }
function mlAns(b, o, a, w) { const row = b.closest('.tf'); if (o === a) { row.querySelector('.word').textContent = w; say(w); row.querySelectorAll('button').forEach(x => x.disabled = true); b.style.background = 'var(--ok-s)'; } else b.style.background = 'var(--red-s)'; }
function wsInit() { const G = ['catpo', 'mupen', 'cupso', 'sunig', 'redmt']; const el = document.getElementById('ws'); el.style.gridTemplateColumns = 'repeat(5,52px)'; let first = null, found = new Set();
 el.innerHTML = G.map((r, y) => [...r].map((c, x) => `<button data-x="${x}" data-y="${y}">${c}</button>`).join('')).join('');
 const cell = (x, y) => el.querySelector(`button[data-x="${x}"][data-y="${y}"]`);
 el.querySelectorAll('button').forEach(b => b.onclick = () => { const p = [+b.dataset.x, +b.dataset.y]; if (!first) { first = p; b.classList.add('sel'); return; }
  cell(...first).classList.remove('sel'); const dx = Math.sign(p[0] - first[0]), dy = Math.sign(p[1] - first[1]), n = Math.max(Math.abs(p[0] - first[0]), Math.abs(p[1] - first[1])); let s = '', cs = [];
  if (dx && dy && Math.abs(p[0] - first[0]) !== Math.abs(p[1] - first[1])) { first = null; return; }
  for (let k = 0; k <= n; k++) { const c = cell(first[0] + dx * k, first[1] + dy * k); s += c.textContent; cs.push(c); } first = null;
  const w = ['cat', 'pen', 'sun', 'red', 'cup'].find(w => w === s || w === [...s].reverse().join(''));
  if (w && !found.has(w)) { found.add(w); cs.forEach(c => c.classList.add('found')); say(w); document.getElementById('wsl').innerHTML = ['cat', 'sun', 'red', 'cup', 'pen'].map(x => found.has(x) ? `<s style="color:var(--ok)">${x}</s>` : x).join('<br>'); document.getElementById('wsf').innerHTML = `<span class="good">${found.size} / 5</span>`; } }); }
const STROKES = { c: ['M72 52 C60 38 30 40 28 70 C28 98 60 104 74 88'], k: ['M30 10 L30 110', 'M72 50 L30 84', 'M44 74 L76 110'], e: ['M28 74 L74 74 C74 46 30 42 28 72 C28 100 62 106 76 92'], u: ['M28 46 L28 88 C28 108 70 108 72 84', 'M72 46 L72 110'], r: ['M32 46 L32 110', 'M32 70 C36 50 56 44 72 50'] };
function drawL(svg) { const l = svg.dataset.l; svg.innerHTML = `<line x1="0" y1="46" x2="100" y2="46" stroke="#E4DFF0" stroke-dasharray="4 4"/><line x1="0" y1="110" x2="100" y2="110" stroke="#E4DFF0"/>` + STROKES[l].map((d, k) => `<path d="${d}" fill="none" stroke="#6A4DF4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:400;stroke-dashoffset:400;animation:dr 1.1s ${k * 1.1}s forwards"/>`).join(''); }
document.head.insertAdjacentHTML('beforeend', '<style>@keyframes dr{to{stroke-dashoffset:0}}</style>');

const list = () => extra ? X : S.filter(s => mode === 40 || !s.plus);
function go(n) {
 clearInterval(window._tm); clearInterval(window._bt);
 const L = list(); i = Math.max(0, Math.min(L.length - 1, n)); const s = L[i];
 opened = new Set(OLD); const si = S.indexOf(s); if (extra) NEW.forEach(l => opened.add(l)); else S.forEach((x, k) => { if (x.newl && k < si) opened.add(x.newl); });
 const sc = document.getElementById('scr'); sc.style.animation = 'none'; sc.offsetHeight; sc.style.animation = ''; sc.innerHTML = s.html(); if (s.after) s.after();
 document.getElementById('dots').innerHTML = L.map((x, k) => `<i class="${k === i ? 'on' : ''} ${x.plus ? 'p' : ''}" title="${x.t}"></i>`).join('');
 document.getElementById('prev').style.visibility = i ? 'visible' : 'hidden';
 document.getElementById('next').textContent = i === L.length - 1 ? (extra ? '← Back' : '🏁 Finish') : 'Next →';
 renderKey(); sc.scrollTop = 0;
}
document.getElementById('prev').onclick = () => go(i - 1);
document.getElementById('next').onclick = () => { const L = list(); if (i === L.length - 1) { if (extra) { extra = false; document.getElementById('extra').classList.remove('on'); go(0); } } else go(i + 1); };
document.getElementById('extra').onclick = e => { extra = !extra; e.currentTarget.classList.toggle('on', extra); go(0); };
document.querySelectorAll('#mode button').forEach(b => { b.classList.toggle('on', +b.dataset.m === mode); b.onclick = () => { const c = list()[i]; mode = +b.dataset.m; try { localStorage.setItem('rc10_mode', mode); } catch (e) {} document.querySelectorAll('#mode button').forEach(x => x.classList.toggle('on', x === b)); go(Math.max(0, list().indexOf(c))); }; });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft' && i) go(i - 1); });
go(0);
</script>
