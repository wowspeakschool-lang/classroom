<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WowSpeak Escape Room — 13+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a24;--gold:#f2b544;--gold2:#ffd889;--panel:rgba(20,16,30,.86);--ok:#3fbf6a;--bad:#e25555;--txt:#fff6e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0b12;color:var(--txt);font-family:Montserrat,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*1.5));height:min(100vh,calc(100vw/1.5));background:#000;overflow:hidden;border-radius:6px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.75));z-index:1}
.box{position:relative;z-index:2;background:var(--panel);border:1px solid rgba(242,181,68,.45);border-radius:22px;padding:2.4vh 3vw;max-width:88%;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
h1{font-weight:800;font-size:5vh;margin:.3em 0;color:var(--gold2);letter-spacing:.02em}
h2{font-weight:800;font-size:3.6vh;margin:.2em 0 .5em;color:var(--gold2)}
.ru{font-size:2.4vh;line-height:1.45;color:#f1e7d6}
.en{font-size:2.2vh;color:#c9bda8;font-style:italic;margin-top:.6em}
.brand{position:absolute;left:2vw;top:2vh;z-index:5;font-weight:800;font-size:2.2vh;color:var(--gold2);letter-spacing:.06em;text-shadow:0 2px 6px #000}
.brand small{display:block;font-weight:500;font-size:1.5vh;color:#d9cbb4;letter-spacing:.02em}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border:0;border-radius:14px;padding:1.4vh 2.6vw;font-size:2.4vh;font-weight:800;box-shadow:0 4px 0 #a36f12}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a36f12}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
/* верхняя панель */
#topbar{position:absolute;right:1.2vw;top:1.4vh;z-index:20;display:flex;gap:.6vw}
.tb{background:rgba(20,16,30,.8);border:1px solid rgba(242,181,68,.5);color:var(--txt);border-radius:12px;padding:.8vh 1vw;font-size:2.2vh;font-weight:700}
.tb.plan{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
#parts{position:absolute;left:50%;transform:translateX(-50%);top:1.4vh;z-index:20;display:none;gap:.4vw}
#parts button{background:rgba(20,16,30,.8);border:1px solid rgba(255,255,255,.25);color:#d8ccb8;border-radius:10px;padding:.5vh .9vw;font-size:1.7vh;font-weight:700}
#parts button.cur{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#nav{position:absolute;right:1.2vw;bottom:1.6vh;z-index:20;display:flex;gap:.6vw}
#nav button{font-size:2.3vh}
.hint{position:absolute;left:1.2vw;bottom:1.6vh;z-index:20}
/* комната */
.room .obj{position:absolute;z-index:3;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s,filter .2s}
.room .obj img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.room .obj.live img{animation:glow 2.2s ease-in-out infinite}
.room .obj:hover{transform:translate(-50%,-100%) scale(1.08)}
.room .obj.done{cursor:default;opacity:.55}
.room .obj.done:hover{transform:translate(-50%,-100%)}
.room .obj .shd{position:absolute;left:8%;right:8%;bottom:-5%;height:14%;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,0) 70%);z-index:-1;pointer-events:none}
.room .obj .tick{position:absolute;right:-.6vw;top:-.6vh;background:var(--ok);color:#fff;border-radius:50%;width:3.2vh;height:3.2vh;font-size:2vh;display:none;align-items:center;justify-content:center;font-weight:800}
.room .obj.done .tick{display:flex}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,216,137,0)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 1.4vh rgba(255,216,137,.95)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}}
.roomTitle{pointer-events:none;position:absolute;left:50%;top:7vh;transform:translateX(-50%);z-index:4;background:var(--panel);border-radius:14px;padding:.8vh 1.6vw;font-weight:800;font-size:2.4vh;color:var(--gold2);white-space:nowrap}
.roomTip{pointer-events:none;position:absolute;left:50%;top:13vh;transform:translateX(-50%);z-index:4;background:var(--panel);border-radius:14px;padding:.8vh 1.6vw;font-size:2vh;white-space:nowrap}
/* лоток с обрывками */
#tray{pointer-events:none;position:absolute;left:1.2vw;top:1.2vh;z-index:15;display:none;align-items:flex-start;gap:.3vw;max-width:34%;flex-wrap:wrap}
#tray canvas{width:5.2vh;height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));transition:transform .4s}
#notes{pointer-events:none;position:absolute;left:1.2vw;top:9vh;z-index:15;display:none;gap:.6vw}
#notes .n{background:#f3e3bf;color:#3a2410;border-radius:6px;padding:.4vh .8vw;font-family:Caveat,cursive;font-size:3.2vh;box-shadow:0 3px 6px rgba(0,0,0,.6)}
/* задание */
.task{position:relative;z-index:2;width:92%;height:82%;background:var(--panel);border:1px solid rgba(242,181,68,.4);border-radius:22px;padding:2vh 2vw;display:flex;flex-direction:column}
.task .head{display:flex;align-items:center;gap:1vw;margin-bottom:1vh}
.task .head img{height:6vh}
.task .head .ttl{font-size:2.5vh;font-weight:800;color:var(--gold2);text-align:left}
.task .head .cnt{margin-left:auto;font-size:1.9vh;color:#bfb39e;white-space:nowrap}
.task .body{flex:1;display:flex;gap:2vw;align-items:center;justify-content:center;min-height:0}
.task .pic{flex:0 0 auto;max-width:48%;max-height:100%;display:flex;align-items:center;justify-content:center}
.task .pic img{max-width:100%;max-height:58vh;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.task .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.6vh;min-width:0}
.q{font-size:3.1vh;font-weight:700;text-align:center;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center}
.opt{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:14px;padding:1.2vh 1.6vw;font-size:2.6vh;font-weight:700;min-width:10vw}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}.opt.show{border-color:var(--ok)}
.opt[disabled]{cursor:default}
.fix{font-size:2.4vh;color:#9ff0b6;min-height:3vh}
.imgs2{display:flex;gap:2vw;align-items:flex-end;justify-content:center}
.imgs2 img{height:22vh}
.flag{width:22vh;height:14.6vh;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.6);overflow:hidden}
.family{display:grid;grid-template-columns:repeat(3,auto);gap:.6vh 1.6vw;justify-items:center;align-items:end}
.family .p{text-align:center;font-size:1.8vh;font-weight:700}
.family .p img{height:11vh;display:block;margin:0 auto}
.family .p small{display:block;color:#bfb39e;font-weight:500}
/* сортировка, пары, порядок */
.chips{display:flex;flex-wrap:wrap;gap:.8vw;justify-content:center}
.chip{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:12px;padding:.8vh 1vw;font-size:2.2vh;font-weight:700;display:flex;align-items:center;gap:.5vw}
.chip img{height:6vh}
.chip.sel{border-color:var(--gold)}
.chip.ok{background:#d9f5df}.chip.bad{background:#ffd9d9}
.groups{display:flex;gap:1.2vw;width:100%;justify-content:center}
.grp{flex:1;max-width:30vw;min-height:20vh;border:2px dashed rgba(242,181,68,.6);border-radius:16px;padding:1vh .8vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;cursor:pointer}
.grp .gt{font-size:2.3vh;font-weight:800;color:var(--gold2)}
.grp .chips{gap:.5vw}
.match{display:flex;gap:3vw;width:100%;justify-content:center;align-items:flex-start}
.match .col{display:flex;flex-direction:column;gap:1vh;align-items:stretch}
.match .col.imgs{display:grid;grid-template-columns:repeat(3,auto);gap:1vh 1vw}
.mi{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:12px;padding:.9vh 1vw;font-size:2.2vh;font-weight:700;text-align:left}
.mi img{height:13vh;display:block;border-radius:8px}
.mi.pic{padding:.4vh}
.mi.sel{border-color:var(--gold)}.mi.ok{background:#bfeccb;opacity:.75}.mi.bad{background:#ffc9c9}
.mi .tag{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;padding:0 .4vw;font-size:1.6vh;margin-top:.3vh}
.ord .line{min-height:7vh;border-bottom:3px solid rgba(242,181,68,.7);display:flex;flex-wrap:wrap;gap:.6vw;justify-content:center;align-items:center;padding:.6vh;width:90%}
.hot{position:relative;height:60vh}
.hot img{height:100%}
.hot .arrow{position:absolute;width:5vh;height:5vh;transform:translate(-50%,-50%);border-radius:50%;border:.6vh solid #ff4d4d;box-shadow:0 0 0 .5vh rgba(255,255,255,.8);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
.player{display:flex;align-items:center;gap:1vw;background:rgba(255,255,255,.08);border-radius:40px;padding:1vh 1.4vw}
.player button{width:7vh;height:7vh;border-radius:50%;border:0;background:var(--gold);font-size:3vh}
.player .bar{width:24vw;height:1vh;background:rgba(255,255,255,.2);border-radius:1vh;overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--gold)}
.phone{font-size:8vh}
.sus{display:flex;gap:1vw}
.sus button{border:3px solid transparent;background:#f7efe0;border-radius:14px;padding:.4vh}
.sus img{height:20vh;display:block}
.sus button.ok{border-color:var(--ok);background:#bfeccb}.sus button.bad{border-color:var(--bad);background:#ffc9c9}
/* называем предмет / and you */
.big{height:42vh;filter:drop-shadow(0 10px 20px rgba(0,0,0,.7))}
.ask{font-size:4.2vh;font-weight:800;color:var(--gold2);margin:1vh 0}
.answer{font-size:3vh;font-weight:700;color:#9ff0b6;min-height:4vh}
.card{background:linear-gradient(160deg,#2b2240,#191424);border:2px solid var(--gold);border-radius:22px;padding:3vh 3vw;max-width:70%;text-align:center}
.card .lbl{font-size:2vh;letter-spacing:.2em;color:var(--gold);font-weight:800}
.card .qq{font-size:3.6vh;font-weight:700;margin-top:1vh;line-height:1.35}
/* записка */
#noteStage{position:relative;width:60vh;height:40vh}
#noteStage canvas{position:absolute;left:0;top:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
/* замок */
.lockbox{display:flex;gap:1vw;justify-content:center;margin:2vh 0}
.lockbox span{width:6vh;height:8.4vh;border-radius:10px;background:#111;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:800;color:var(--gold2);transition:transform .3s}
.lockbox span.in{transform:scale(1.15)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
.toast{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:40;background:var(--panel);border:2px solid var(--gold);border-radius:20px;padding:2vh 2.4vw;text-align:center;font-size:2.6vh;font-weight:700;display:none}
.toast canvas{width:16vh;display:block;margin:1vh auto}
#loader{position:fixed;inset:0;z-index:999;background:#0d0b12;color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;font-weight:800;font-size:3vh}
#loader .b{width:40vw;height:1.2vh;background:#2a2238;border-radius:1vh;overflow:hidden}#loader .b i{display:block;height:100%;width:0;background:var(--gold)}
</style>
</head>

or five years.", "o": ["will have worked", "will work", "is working"], "t": ["p3b3t4"]}, {"img": "fut_band", "q": "In four years this band ___ at the biggest stadiums.", "o": ["will be playing", "will have play", "is played"], "t": ["p3b3t4"]}], "en": "Look and choose."}], "you": [["What will you have achieved by the end of this year?", ["p3b3t4", "p3b4t3"]]]}, {"id": "billboard", "img": "billboard", "x": 70.7, "y": 96.7, "h": 17, "wall": 0, "name": "a billboard — and what it is for", "ask": "What's this? What is it for?", "name_t": ["p3b6t2"], "tasks": [{"kind": "sort", "title": "Что бывает на рекламных щитах? Распредели слова по темам", "groups": ["Advertising", "Global issues", "Online & media"], "items": [{"w": "a slogan", "g": 0, "t": ["p3b6t2"]}, {"w": "a brand", "g": 0, "t": ["p3b6t2"]}, {"w": "a commercial", "g": 0, "t": ["p3b6t2"]}, {"w": "pollution", "g": 1, "t": ["p3b6t3"]}, {"w": "poverty", "g": 1, "t": ["p3b6t3"]}, {"w": "climate change", "g": 1, "t": ["p3b6t3"]}, {"w": "to subscribe", "g": 2, "t": ["p3b3t1"]}, {"w": "a podcast", "g": 2, "t": ["p3b3t1"]}, {"w": "to stream", "g": 2, "t": ["p3b3t1"]}], "en": "Sort the words."}, {"kind": "match", "title": "Это слоганы с рекламных щитов. Собери половинки предложений", "halves": true, "items": [{"w": "This new phone is great, but it costs", "d": "an arm and a leg.", "t": ["p3b6t1"]}, {"w": "Our new board game will help you break", "d": "the ice at any party!", "t": ["p3b6t1"]}, {"w": "The company could have chosen", "d": "a better slogan for this advert.", "t": ["p3b6t4"]}, {"w": "If I hadn’t seen that advert,", "d": "I wouldn’t be wearing these trainers now.", "t": ["p3b6t5"]}], "en": "Match the halves."}, {"kind": "choice", "title": "Про рекламу. Выбери артикль (— значит без артикля)", "items": [{"q": "This is ___ best advert of the year!", "o": ["the", "a", "—"], "t": ["p3b6t6"]}, {"q": "It’s ___ advert for a new electric car.", "o": ["an", "a", "the"], "t": ["p3b6t6"]}, {"q": "___ people don’t always trust adverts on social media.", "o": ["—", "The", "A"], "t": ["p3b6t6"]}], "en": "Choose a, an, the or — ."}], "you": [["Have you ever bought something because of an advert? If you hadn’t seen that advert, would you have bought it?", ["p3b6t5", "p3b6t2"]]]}]}], "preload": ["an_cat", "an_chicken", "an_cow", "an_dog", "an_horse", "an_pig", "athlete", "billboard", "binoculars", "bus", "cat", "cinema_tickets", "cl_coat", "cl_gloves", "cl_hat", "cl_sandals", "cl_scarf", "cl_shorts", "cl_sunglasses", "cl_swimsuit", "crime_scene", "dis_earthquake", "dis_flood", "dis_hurricane", "dis_tsunami", "dis_volcano", "dis_wildfire", "door_open", "fam_aunt", "fam_boy", "fam_father", "fam_girl", "fam_grandfather", "fam_grandmother", "fam_mother", "fam_uncle", "family_photo", "first_aid_kit", "food_bitter", "food_crunchy", "food_salty", "food_sour", "food_spicy", "food_sweet", "football", "fridge_open", "fruit_bowl", "fut_band", "fut_doctor", "fut_graduation", "fut_travel", "geo_desert", "geo_island", "geo_mountains", "geo_river", "geo_waterfall", "graduation_cap", "hol_airport", "hol_beach", "hol_castle", "laptop", "magnifying_glass", "map", "microphone", "novel", "passport", "room1_living", "room2_study", "room3_lab", "schoolbag", "schoolbag_open", "scroll", "seismograph", "smartphone", "sport_bike", "sport_swim", "sport_tennis", "stethoscope", "street", "suitcase", "suspect_1", "suspect_2", "suspect_3", "suspect_4", "time_capsule", "tr_camping", "tr_ferry", "tr_sightseeing", "trophy", "umbrella", "w_snowy", "w_sunny", "w_windy", "wallet", "wanted_poster", "wardrobe"], "plan_html": "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>План урока — Escape Room 13+<\/title><style>body{font-family:'Segoe UI',Arial,sans-serif;background:#f6efe2;color:#2a1a10;padding:18px 22px;max-width:1200px;margin:0 auto;font-size:14px}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d9cdb8;padding:5px 8px;vertical-align:top}th{background:#6e3510;color:#fff;text-align:left}.legend{background:#fffaf0;border-left:4px solid #f2b544;padding:8px 12px;margin:8px 0}.dl a{display:inline-block;margin:0 8px 10px 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none}.dl a.pdf{background:#7b4bd6}table.plan td.st{font-weight:700;white-space:nowrap}table.plan td.tl{color:#7a3d10;font-style:italic;width:24%}table.plan td.sa{color:#1f5fa8;width:22%}table.plan tr.part td{background:#2b2240;color:#ffd889;font-weight:700}<\/style><\/head><body><h1 style=\"color:#6e3510;margin:4px 0 10px\">🗝 План урока: Escape Room 13+ (вводный урок)<\/h1><p class=\"dl\"><a href=\"https://classroom.wowteach.ru/lessons/mvu_13plus/plans/mvu_13plus_plan.docx\" download>⬇ Скачать план (Word)<\/a><a class=\"pdf\" href=\"https://classroom.wowteach.ru/lessons/mvu_13plus/plans/mvu_13plus_plan.pdf\" download>⬇ Скачать план (PDF)<\/a><\/p><div class=\"legend\"><b>Длительность:<\/b> 40 мин, из них ~25 на задания, остальное — маркетинговые этапы. <b>Порядок:<\/b> всегда с Part 1; дальше — по результату. Каждый предмет: назвать → задание(я) → вопрос «And you?» → обрывок записки. Ничего не листается само — только Next. <b>✅<\/b> — чек-лист, <b>📋<\/b> — план (отдельные окна). <b>💡<\/b> — облегчённый режим (меньше вариантов, подсказки). <b>🚪<\/b> — сразу к замку. Цифра/обрывок даётся всегда, даже если ученик не справился.<\/div><table class=\"plan\"><tr><th>Шаг<\/th><th>Что делать<\/th><th>Teacher’s language<\/th><th>Ожидаемые ответы<\/th><\/tr><tr><td class=\"st\">Старт<\/td><td>Вверху урока две кнопки: ✅ — чек-лист, 📋 — этот план. Каждая открывает своё окно. В чек-листе впишите имя ученика по-русски, пол и возраст — они попадут в отчёт. Демонстрируйте экран урока, оба окна держите на втором мониторе или рядом.<\/td><td class=\"tl\">—<\/td><td class=\"sa\">—<\/td><\/tr><tr><td class=\"st\">1. Welcome<\/td><td>На экране только «Welcome to WowSpeak School!». Скажите сами (по-русски или по-английски): это не тест — мы просто познакомимся и посмотрим, что ты уже умеешь; отвечай как получается, ошибаться можно и нужно.<\/td><td class=\"tl\">Hi! Welcome to WowSpeak School! This is not a test — it’s a game. Let’s have fun! Are you ready?<\/td><td class=\"sa\">Yes! / I’m ready.<\/td><\/tr><tr><td class=\"st\">2. Get to know you<\/td><td>Три вопроса по одной карточке: следующий — Next (или нажатие на карточку), предыдущий — ←. Баллов нет — смотрим, как ученик держится, и решаем, нужен ли облегчённый режим 💡.<\/td><td class=\"tl\">What’s your name? How old are you? What do you like doing in your free time?<\/td><td class=\"sa\">My name is… I’m 14. I like playing football / drawing…<\/td><\/tr><tr><td class=\"st\">3. Briefing<\/td><td>На экране только название. Расскажите историю сами: дверь закрыта на кодовый замок, в комнате спрятаны кусочки старой записки с кодом; нажимай на предметы, называй их по-английски и выполняй задания — за каждое получишь кусочек записки. Сколько цифр в коде — не говорите.<\/td><td class=\"tl\">You are locked in the escape room! Find the pieces of the secret note to open the door. Click on the glowing objects.<\/td><td class=\"sa\">—<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">PART 1 · 🛋 The Living Room · 9 предметов → записка с 4 цифрами<\/td><\/tr><tr><td class=\"st\">🔎 family photo<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">a family photo<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>семейное дерево, выбор ответа<\/b>. Скажите своими словами: «Посмотри на семью Тома и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">sister<br>grandmother<br>uncle<br>is<br>are<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">Tell me about your family. How many people are there in your family?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 schoolbag<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">a schoolbag (a backpack)<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Это рюкзак Тома. Посмотри, что в нём лежит, и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">are<br>isn’t<br>ruler<br>Has<br>has<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What have you got in your school bag?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 passport<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">a passport<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Это паспорта друзей Тома. Посмотри на флаг и выбери верный вариант». На экране только «Look at the flag and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look at the flag and choose.<\/td><td class=\"sa\">Italy<br>Japan<br>French<br>German<br>are<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">Where are you from? Which country would you like to visit?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 fruit bowl<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">fruit (a bowl of fruit)<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>верно / неверно<\/b>. Скажите своими словами: «Фрукты есть в вазе, а что есть в холодильнике у Тома? Верно или неверно?». На экране только «Look. True or false?». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look. True or false?<\/td><td class=\"sa\">True<br>True<br>False → There is some cheese in the fridge.<br>True<br>False → There isn’t any juice in the fridge.<br>False → There aren’t any apples in the fridge — they are in the bowl.<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What do you usually have for breakfast?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 football<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">a football (a ball)<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>стрелка на картинке, выбрать слово<\/b>. Скажите своими словами: «Это Том, он играет в футбол. Что показывает стрелка? Выбери слово». На экране только «Look and choose one word.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose one word.<\/td><td class=\"sa\">head, arm, hand, knee, foot<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Том очень любит спорт. Посмотри на картинку и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">plays<br>can<br>plays<br>Does<br>can’t<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What sports can you do? How often do you do sport?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 bus<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗).<\/td><td class=\"tl\">What&#x27;s this?<\/td><td class=\"sa\">a bus<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Посмотри в окно и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">bus driver<br>is eating<br>drives<br>doctor<br>a train<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td t like putting things off.<\/td><td class=\"tl\">Listen and choose.<\/td><td class=\"sa\">She had posted a photo online.<br>She had left a comment.<br>recording a video together<br>told<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Ещё немного про телефон Анны. Выбери верный вариант». На экране только «Choose the right answer.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Choose the right answer.<\/td><td class=\"sa\">she had it repaired<br>to become<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">Have you ever had something repaired or done for you? What do you hope to achieve this year?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 graduation cap<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a graduation cap — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Это шапка выпускника. Выбери верный вариант». На экране только «Choose the right answer.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Choose the right answer.<\/td><td class=\"sa\">graduated<br>is<br>starts<br>to have been built<br>on<br>out<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">Do you know what you would like to study in the future? Why?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 seismograph<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a seismograph — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>соединить пары<\/b>. Скажите своими словами: «Сейсмограф следит за природой. Соедини слова с картинками». На экране только «Match the words and the pictures.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Match the words and the pictures.<\/td><td class=\"sa\">a volcanic eruption — dis volcano<br>a flood — dis flood<br>an earthquake — dis earthquake<br>a wildfire — dis wildfire<br>a hurricane — dis hurricane<br>a tsunami — dis tsunami<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Сейсмограф записал землетрясение. Выбери верный вариант». На экране только «Choose the right answer.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Choose the right answer.<\/td><td class=\"sa\">collapsed<br>can<br>were able to<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What could you do to stay safe in an earthquake?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 magnifying glass<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a magnifying glass — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Ты детектив 🕵️ Посмотри на место кражи и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">must have come<br>can’t have come<br>must have known<br>had been<br>denied<br>wouldn’t have got<br>honest<br>burglar<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What would you have done if you had been the detective?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 scroll<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a scroll — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>разложить по группам<\/b>. Скажите своими словами: «Это древний свиток. Распредели слова из него по темам». На экране только «Sort the words.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Sort the words.<\/td><td class=\"sa\"><b>History 🏛:<\/b> ancestor, century, myth, inhabitants<br><b>Abstract nouns 💭:<\/b> freedom, honesty, happiness, knowledge<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «История свитка. Выбери верный вариант». На экране только «Choose the right answer.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Choose the right answer.<\/td><td class=\"sa\">was walking<br>had hidden<br>would<br>is always<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What did your grandparents use to do when they were young?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 time capsule<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a time capsule — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Загляни в будущее и выбери верный вариант». На экране только «Look and choose.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Look and choose.<\/td><td class=\"sa\">will be flying<br>will have graduated<br>will have worked<br>will be playing<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">What will you have achieved by the end of this year?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">🔎 billboard<\/td><td>Ученик выбирает предмет, вы нажимаете. <b>Назвать предмет<\/b> — оцените в чек-листе ✅, панель «Сейчас на экране» (✓ / ~ / ✗). В Part 2 — с двумя прилагательными, в Part 3 — объяснить, что это и зачем.<\/td><td class=\"tl\">What&#x27;s this? What is it for?<\/td><td class=\"sa\">a billboard — and what it is for<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>разложить по группам<\/b>. Скажите своими словами: «Что бывает на рекламных щитах? Распредели слова по темам». На экране только «Sort the words.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Sort the words.<\/td><td class=\"sa\"><b>Advertising:<\/b> a slogan, a brand, a commercial<br><b>Global issues:<\/b> pollution, poverty, climate change<br><b>Online &amp; media:<\/b> to subscribe, a podcast, to stream<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>соединить пары<\/b>. Скажите своими словами: «Это слоганы с рекламных щитов. Собери половинки предложений». На экране только «Match the halves.». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Match the halves.<\/td><td class=\"sa\">This new phone is great, but it costs — an arm and a leg.<br>Our new board game will help you break — the ice at any party!<br>The company could have chosen — a better slogan for this advert.<br>If I hadn’t seen that advert, — I wouldn’t be wearing these trainers now.<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>выбор ответа<\/b>. Скажите своими словами: «Про рекламу. Выбери артикль (— значит без артикля)». На экране только «Choose a, an, the or — .». Ученик отвечает — вы нажимаете. Пункты по одному: следующий — Next, предыдущий — ←.<\/td><td class=\"tl\">Choose a, an, the or — .<\/td><td class=\"sa\">the<br>an<br>—<\/td><\/tr><tr><td class=\"st\"><\/td><td><b>And you?<\/b> Устные вопросы о самом ученике — по одному на карточке, следующий по нажатию или Next — оцените 0/1/2 в чек-листе ✅, панель «Сейчас на экране». После Next ученик получает обрывок записки и возвращается в комнату.<\/td><td class=\"tl\">Have you ever bought something because of an advert? If you hadn’t seen that advert, would you have bought it?<\/td><td class=\"sa\">Полный ответ по теме, без подсказки = 2<\/td><\/tr><tr><td class=\"st\">📜 Записка Part 3<\/td><td>Когда все предметы открыты — «Put the note together»: кусочки слетаются, видны цифры.<\/td><td class=\"tl\">Look! The pieces make a note. What’s the code?<\/td><td class=\"sa\">X X<\/td><\/tr><tr><td class=\"st\">🔐 Замок<\/td><td>Попросите ученика прочитать код вслух по-английски (на экране — только «Read your code in English!»), вы нажимаете «Enter the code». Кнопка 🚪 вверху ведёт сюда в любой момент.<\/td><td class=\"tl\">Read the code in English, please!<\/td><td class=\"sa\">four, seven, two, nine…<\/td><\/tr><tr><td class=\"st\">🎉 Финал<\/td><td>Дверь открыта. Скопируйте отчёт (чек-лист ✅ → «Скопировать отчёт») и переходите к предзакрытию.<\/td><td class=\"tl\">Well done! You escaped! How did you like the game?<\/td><td class=\"sa\">—<\/td><\/tr><\/table><\/body><\/html>", "mw_html": "<!DOCTYPE html>\n<html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>Чек-лист — Escape Room 13+<\/title>\n<style>\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f6efe2;color:#2a1a10;margin:0;font-size:14px}\nheader{position:sticky;top:0;background:#2b2240;color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}\nheader input,header select{padding:5px 8px;border-radius:6px;border:0;font-size:14px}\nheader .tabs button{background:#4a3d68;color:#fff;border:0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}\nheader .tabs button.on{background:#f2b544;color:#2a1a10}\nheader .code{margin-left:auto;font-weight:700;color:#ffd889}\nmain{padding:14px 18px;max-width:1200px;margin:0 auto}\n.now{background:#fff;border:2px solid #f2b544;border-radius:12px;padding:10px 14px;margin-bottom:14px}\n.now h3{margin:0 0 6px;font-size:15px}\n.oral{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}\n.oral .lab{flex:1;min-width:260px}\n.oral .exp{color:#1f7a3a;font-style:italic}\n.mk button{border:1px solid #bbb;background:#fafafa;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer;margin-left:3px}\n.mk button.on2{background:#3fbf6a;color:#fff;border-color:#3fbf6a}.mk button.on1{background:#f2b544;border-color:#f2b544}.mk button.on0{background:#e25555;color:#fff;border-color:#e25555}\ntable{border-collapse:collapse;width:100%;background:#fff;margin:6px 0 14px}\nth,td{border:1px solid #d9cdb8;padding:4px 8px;vertical-align:middle}\nth{background:#6e3510;color:#fff;text-align:left}\ntd.sc{width:150px;white-space:nowrap}\ntr.cur td{background:#fff3cf}\ntr.unset.past td:first-child{box-shadow:inset 4px 0 #f2b544}\n.sum{font-weight:700}.pass{color:#1f7a3a}.fail{color:#b03030}\n.auto{font-size:11px;color:#8a7a66;margin-left:4px}\nh2{margin:14px 0 4px;color:#6e3510;font-size:17px}\n.legend{background:#fffaf0;border-left:4px solid #f2b544;padding:8px 12px;margin:8px 0;font-size:13px}\ntextarea{width:100%;height:220px;font-family:Consolas,monospace;font-size:13px}\n.act button{background:#e8631a;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;margin-right:8px}\n.act button.gray{background:#888}\n#plan table td{font-size:13px}\n.dl a{display:inline-block;margin:0 8px 10px 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none}\n.dl a.pdf{background:#7b4bd6}\n<\/style><\/head><body>\n<header>\n  <b>✅ Чек-лист · Escape Room 13+<\/b>\n  <label>Имя ученика <input id=\"nm\" placeholder=\"Имя по-русски\"><\/label>\n  <label>Пол <select id=\"gd\"><option value=\"m\">мальчик<\/option><option value=\"f\">девочка<\/option><\/select><\/label>\n  <label>Возраст <input id=\"ag\" size=\"3\"><\/label>\n  <span class=\"code\" id=\"code\"><\/span>\n<\/header>\n<main>\n<div id=\"check\">\n  <div class=\"now\" id=\"now\"><\/div>\n  <div class=\"legend\"><b>0 · 1 · 2.<\/b> 2 — сам, верно, полной фразой (в задании с нажатием — всё верно); 1 — после подсказки, исправил себя, ответил словом вместо фразы (в задании — не меньше половины); 0 — не смог и с подсказкой, по-русски, не понял (в задании — меньше половины).\n  Балл по нажатиям ученика ставится сам (серым — «авто»), устные ответы оцениваете вы. Нажатие на 0/1/2 в таблице заменяет авто-балл; повторное нажатие — снять.\n  Часть пройдена, если в каждом блоке ≥ 9 из 12 — это подсказка, решение за вами.<\/div>\n  <div id=\"tables\"><\/div>\n  <h2>Отчёт<\/h2>\n  <textarea id=\"rep\" readonly><\/textarea>\n  <div class=\"act\"><button id=\"cp\">📋 Скопировать отчёт<\/button><button class=\"gray\" id=\"rs\">Новый ученик (сбросить всё)<\/button><\/div>\n<\/div>\n<\/main>\n<script>\nconst A = window.APP;\nfunction $(s){return document.querySelector(s)}\nconst st=A.S.student; $('#nm').value=st.name; $('#gd').value=st.gender; $('#ag').value=st.age;\n$('#nm').oninput=e=>{st.name=e.target.value;A.save();render()}; $('#gd').onchange=e=>{st.gender=e.target.value;A.save();render()}; $('#ag').oninput=e=>{st.age=e.target.value;A.save();render()};\n$('#cp').onclick=()=>{navigator.clipboard.writeText($('#rep').value).then(()=>{$('#cp').textContent='✔ Скопировано';setTimeout(()=>$('#cp').textContent='📋 Скопировать отчёт',1500)})};\n$('#rs').onclick=()=>{if(confirm('Сбросить все баллы и начать с новым учеником?'))A.reset()};\nfunction mk(cur,fn){const d=document.createElement('span');d.className='mk';[2,1,0].forEach(v=>{const b=document.createElement('button');b.textContent=v===2?'✓ 2':v===1?'~ 1':'✗ 0';if(cur===v)b.className='on'+v;b.onclick=()=>fn(cur===v?null:v);d.append(b)});return d}\nfunction screenTopics(s){const t=new Set();if(s.task)(s.task.items||[]).forEach(i=>(i.t||[]).forEach(x=>t.add(x)));(s.oral||[]).forEach(o=>o.topics.forEach(x=>t.add(x)));return t}\nfunction render(){\n  const S=A.S,D=A.D,s=A.screen();\n  // код\n  const ds=[];for(const p of [1,2,3]) ds.push('Part '+p+': '+S.digits[p].join(''));$('#code').textContent='Код: '+ds.join(' · ');\n  // сейчас на экране\n  const now=$('#now');now.innerHTML='';const h=document.createElement('h3');h.textContent='Сейчас на экране: '+(s?s.title:'—');now.append(h);\n  if(s&&s.oral)s.oral.forEach(o=>{const r=document.createElement('div');r.className='oral';const l=document.createElement('div');l.className='lab';l.innerHTML=o.label+(o.expect?' <span class=\"exp\">→ '+o.expect+'<\/span>':'');r.append(l);if(o.topics.length){const cur=S.oral[o.key]?S.oral[o.key].v:null;r.append(mk(cur,v=>{if(v===null)delete S.oral[o.key];else A.oralMark(o.key,o.topics,v);A.save();render()}))}else{const i=document.createElement('i');i.textContent='без балла';r.append(i)}now.append(r)});\n  if(s&&s.task){const p=document.createElement('div');p.style.color='#6a5a46';p.textContent='Задание с нажатием — балл ставится сам по ответам ученика. Темы подсвечены в таблице.';now.append(p)}\n  const curT=s?screenTopics(s):new Set();\n  // таблицы\n  const box=$('#tables');box.innerHTML='';\n  D.checklist.forEach((P,pi)=>{const h2=document.createElement('h2');h2.textContent=P.title;box.append(h2);\n    P.blocks.forEach((b,bi)=>{const t=document.createElement('table');const th=document.createElement('tr');th.innerHTML='<th>'+b[0]+'<\/th><th>балл<\/th>';t.append(th);let sum=0,filled=0;\n      b[1].forEach((name,ti)=>{const id='p'+(pi+1)+'b'+(bi+1)+'t'+(ti+1);const sc=A.topicScore(id);if(sc.v!==null){sum+=sc.v;filled++}\n        const tr=document.createElement('tr');if(curT.has(id))tr.className='cur';const td=document.createElement('td');td.textContent=name;const td2=document.createElement('td');td2.className='sc';\n        td2.append(mk(S.override[id]!==undefined?S.override[id]:null,v=>A.setOverride(id,v)));if(sc.src==='auto'){const a=document.createElement('span');a.className='auto';a.textContent='авто: '+sc.v;td2.append(a)}\n        tr.append(td,td2);t.append(tr)});\n      const tf=document.createElement('tr');tf.innerHTML='<td class=\"sum\">Сумма блока<\/td><td class=\"sum '+(filled?(sum>=9?'pass':'fail'):'')+'\">'+(filled?sum+' из 12 '+(sum>=9?'✔':''):'—')+'<\/td>';t.append(tf);box.append(t)})});\n  $('#rep').value=A.report();\n}\nwindow.render=render;render();\n<\/script><\/body><\/html>\n"};
const M = D.media;
const img = n => M + n + '.webp';
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) { if (k === 'cls') e.className = a[k]; else if (k === 'html') e.innerHTML = a[k]; else if (k.startsWith('on')) e[k] = a[k]; else e.setAttribute(k, a[k]); } kids.flat().forEach(c => c != null && e.append(c)); return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = n => Math.floor(Math.random() * n);

/* ───────── состояние ───────── */
const S = {
  student: { name: '', gender: 'm', age: '' },
  auto: {},    // topic → {ok, n}
  oral: {},    // promptKey → {topics, v}
  override: {},// topic → 0/1/2
  done: {},    // objId → true
  scraps: { 1: 0, 2: 0, 3: 0 },
  part: 1, maxPart: 1,
  digits: { 1: [...Array(4)].map(() => rnd(10)), 2: [...Array(2)].map(() => rnd(10)), 3: [...Array(2)].map(() => rnd(10)) },
  assembled: { 1: false, 2: false, 3: false },
  hint: false,
};
function save() { try { localStorage.setItem('mvu13', JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem('mvu13')); if (s && s.digits) Object.assign(S, s); } catch (e) {} }

/* ───────── оценка ───────── */
function autoMark(topics, ok) { (Array.isArray(topics) ? topics : [topics]).forEach(t => { const a = S.auto[t] || (S.auto[t] = { ok: 0, n: 0 }); a.n++; if (ok) a.ok++; }); save(); MW.refresh(); }
function oralMark(key, topics, v) { S.oral[key] = { topics, v }; save(); MW.refresh(); }
function topicScore(t) {
  if (t in S.override) return { v: S.override[t], src: 'manual' };
  const vals = [];
  const a = S.auto[t]; if (a && a.n) vals.push(a.ok === a.n ? 2 : a.ok * 2 >= a.n ? 1 : 0);
  for (const k in S.oral) if (S.oral[k].topics.includes(t)) vals.push(S.oral[k].v);
  if (!vals.length) return { v: null, src: '' };
  return { v: Math.round(vals.reduce((x, y) => x + y, 0) / vals.length), src: 'auto' };
}

/* ───────── экраны ───────── */
const SCREENS = []; // {id, part, render(el), topics:[], oral:[{key,label,topics,expect}], title, kind}
let cur = 0, history = [];
function addScreen(s) { s.idx = SCREENS.length; SCREENS.push(s); return s; }
function show(i, push = true) {
  if (push && cur !== i) history.push(cur);
  cur = i; const s = SCREENS[i];
  const box = $('#screens'); box.innerHTML = '';
  const node = el('div', { cls: 'screen on ' + (s.cls || '') });
  box.append(node); s.render(node);
  $('#parts').style.display = s.part ? 'flex' : 'none';
  [...$('#parts').children].forEach((b, k) => b.classList.toggle('cur', k + 1 === s.part));
  const showTray = s.part && !s.final && (s.cls === 'room' || /^(note|check|intro)/.test(s.id));
  $('#tray').style.display = showTray ? 'flex' : 'none';
  $('#notes').style.display = showTray ? 'flex' : 'none';
  $('#nextBtn').style.display = s.noNext ? 'none' : '';
  $('#nextBtn').disabled = false;
  renderTray(); MW.refresh();
}
function cardStep(s, label) {
  s.ci = s.ci || 0; const many = s.cards.length > 1;
  const c = el('div', { cls: 'card', style: 'position:relative;z-index:2;cursor:pointer;min-width:40vw' }, el('div', { cls: 'lbl' }, label + (many ? ` · ${s.ci + 1} / ${s.cards.length}` : '')), el('div', { cls: 'qq' }, s.cards[s.ci]), null);
  c.onclick = () => next();
  return c;
}
function next() { const s = SCREENS[cur]; if (s.cards && (s.ci || 0) < s.cards.length - 1) { s.ci = (s.ci || 0) + 1; return show(cur, false); } if (s.onNext) return s.onNext(); if (s.next != null) return show(s.next); if (cur < SCREENS.length - 1) show(cur + 1); }
$('#nextBtn').onclick = () => next();
$('#restartBtn').onclick = () => { if (!confirm('Начать урок заново? Пройденные предметы, обрывки записки и баллы чек-листа будут сброшены.')) return; try { localStorage.removeItem('mvu13'); } catch (e) {} location.reload(); };
$('#backBtn').onclick = () => { const s = SCREENS[cur]; if (s.cards && s.ci > 0) { s.ci--; return show(cur, false); } if (s.step && s.step.i > 0) { s.step.i--; return show(cur, false); } if (history.length) show(history.pop(), false); };
document.addEventListener('keydown', e => { if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') $('#backBtn').click(); });
$('#hintBtn').onclick = () => { S.hint = !S.hint; $('#hintBtn').style.background = S.hint ? 'var(--gold)' : ''; show(cur, false); };
$('#finBtn').onclick = () => show(SCREEN_ID.lock);
const SCREEN_ID = {};

/* ───────── общие куски ───────── */
function taskShell(node, o, t, counter) {
  const sh = el('div', { cls: 'task' },
    el('div', { cls: 'head' }, el('img', { src: img(o.img), crossorigin: 'anonymous' }), el('div', { cls: 'ttl' }, t.en || t.title), el('div', { cls: 'cnt' }, counter || '')),
  );
  const body = el('div', { cls: 'body' }); sh.append(body);
  node.append(el('img', { cls: 'bg', src: img(D.parts[o.part - 1].room) }), el('div', { cls: 'shade' }), sh);
  return body;
}
function flagSvg(c) {
  const f = {
    it: '<rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/>',
    fr: '<rect width="1" height="2" fill="#0055a4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ef4135"/>',
    de: '<rect width="3" height=".667" fill="#000"/><rect y=".667" width="3" height=".667" fill="#dd0000"/><rect y="1.333" width="3" height=".667" fill="#ffce00"/>',
    es: '<rect width="3" height="2" fill="#aa151b"/><rect y=".5" width="3" height="1" fill="#f1bf00"/>',
    jp: '<rect width="3" height="2" fill="#fff"/><circle cx="1.5" cy="1" r=".6" fill="#bc002d"/>',
  }[c];
  return el('div', { cls: 'flag', html: `<svg viewBox="0 0 3 2" width="100%" height="100%" preserveAspectRatio="none">${f}</svg>` });
}
function choiceItem(side, it, onAnswered, hintNote) {
  side.innerHTML = '';
  side.append(el('div', { cls: 'q' }, it.q));
  const opts = el('div', { cls: 'opts' }); const fix = el('div', { cls: 'fix' });
  let order = shuffle(it.o.map((x, i) => i));
  if (S.hint && it.o.length > 2) { const wrong = order.filter(i => i !== 0); order = shuffle([0, wrong[0]]); }
  order.forEach(i => {
    const b = el('button', { cls: 'opt' }, it.o[i]);
    b.onclick = () => {
      [...opts.children].forEach(x => x.disabled = true);
      const ok = i === 0; b.classList.add(ok ? 'ok' : 'bad');
      if (!ok) [...opts.children].find(x => x.textContent === it.o[0]).classList.add('show');
      autoMark(it.t, ok); onAnswered(ok);
    };
    opts.append(b);
  });
  side.append(opts, fix);
  return fix;
}

/* ───────── рендер заданий ───────── */
function renderTask(node, o, t, step, done) {
  const items = t.items || [];
  const k = t.kind;
  if (k === 'choice' || k === 'family' || k === 'listen') {
    let i = step.i || 0; const it = items[i];
    const body = taskShell(node, o, t, items.length > 1 ? `${i + 1} / ${items.length}` : '');
    const pic = el('div', { cls: 'pic' }); const side = el('div', { cls: 'side' });
    if (k === 'family') {
      const fam = el('div', { cls: 'family' });
      D.family.forEach(([im, nm, who]) => fam.append(el('div', { cls: 'p' }, el('img', { src: img(im) }), nm, el('small', {}, S.hint ? who : ''))));
      pic.append(fam); pic.style.maxWidth = '55%';
    } else if (k === 'listen') {
      pic.append(player(t));
      if (t.suspects && it.suspect) { pic.innerHTML = ''; }
    } else if (t.image) pic.append(el('img', { src: img(t.image) }));
    if (it.img) pic.append(el('img', { src: img(it.img) }));
    if (it.img2) pic.append(el('div', { cls: 'imgs2' }, it.img2.map(x => el('img', { src: img(x) }))));
    if (it.flag) pic.append(flagSvg(it.flag));
    if (pic.children.length) body.append(pic);
    body.append(side);
    const advance = () => { if (i < items.length - 1) { step.i = i + 1; show(cur, false); } else done(); };
    if (it.suspect) {
      side.append(el('div', { cls: 'q' }, it.q));
      const row = el('div', { cls: 'sus' });
      shuffle([1, 2, 3, 4]).forEach(n => { const b = el('button', {}, el('img', { src: img('suspect_' + n) })); b.onclick = () => { [...row.children].forEach(x => x.disabled = true); b.classList.add(n === 1 ? 'ok' : 'bad'); if (n !== 1) [...row.children].find(x => x.querySelector('img').src.endsWith('suspect_1.webp')).classList.add('ok'); autoMark(it.t, n === 1); SCREENS[cur].answered = true; }; row.append(b); });
      side.append(row, player(t));
    } else choiceItem(side, it, () => { SCREENS[cur].answered = true; });
    SCREENS[cur].onNext = advance;
  } else if (k === 'tf') {
    let i = step.i || 0; const it = items[i];
    const body = taskShell(node, o, t, `${i + 1} / ${items.length}`);
    if (t.image) body.append(el('div', { cls: 'pic' }, el('img', { src: img(t.image) })));
    const side = el('div', { cls: 'side' }); body.append(side);
    side.append(el('div', { cls: 'q' }, it.q));
    const opts = el('div', { cls: 'opts' }); const fix = el('div', { cls: 'fix' });
    [['✔ True', true], ['✘ False', false]].forEach(([lb, v]) => { const b = el('button', { cls: 'opt' }, lb); b.onclick = () => { [...opts.children].forEach(x => x.disabled = true); const ok = v === it.a; b.classList.add(ok ? 'ok' : 'bad'); autoMark(it.t, ok); if (!it.a) fix.textContent = '✔ ' + it.fix; }; opts.append(b); });
    side.append(opts, fix);
    SCREENS[cur].onNext = () => { if (i < items.length - 1) { step.i = i + 1; show(cur, false); } else done(); };
  } else if (k === 'hotspot') {
    let i = step.i || 0; const it = items[i];
    const body = taskShell(node, o, t, `${i + 1} / ${items.length}`);
    const hot = el('div', { cls: 'hot' }, el('img', { src: img(t.image) }), el('div', { cls: 'arrow', style: `left:${it.x}%;top:${it.y}%` }));
    const side = el('div', { cls: 'side' }); body.append(el('div', { cls: 'pic' }, hot), side);
    side.append(el('div', { cls: 'q' }, 'What is it?'));
    const opts = el('div', { cls: 'opts' });
    (S.hint ? shuffle([it.a, t.words.find(w => w !== it.a)]) : shuffle(t.words)).forEach(w => { const b = el('button', { cls: 'opt' }, w); b.onclick = () => { [...opts.children].forEach(x => x.disabled = true); const ok = w === it.a; b.classList.add(ok ? 'ok' : 'bad'); if (!ok) [...opts.children].find(x => x.textContent === it.a).classList.add('show'); autoMark(it.t, ok); }; opts.append(b); });
    side.append(opts);
    SCREENS[cur].onNext = () => { if (i < items.length - 1) { step.i = i + 1; show(cur, false); } else done(); };
  } else if (k === 'order') {
    let i = step.i || 0; const it = items[i];
    const body = taskShell(node, o, t, `${i + 1} / ${items.length}`);
    const side = el('div', { cls: 'side ord' }); body.append(side);
    const words = it.s.replace(/[.!?]$/, '').split(' '); const end = it.s.slice(-1);
    const line = el('div', { cls: 'line' }); const pool = el('div', { cls: 'chips' }); const fix = el('div', { cls: 'fix' });
    let picked = [];
    const check = () => { const ok = picked.join(' ') === words.join(' '); line.querySelectorAll('.chip').forEach(c => c.classList.add(ok ? 'ok' : 'bad')); if (!ok) fix.textContent = '✔ ' + it.s; autoMark(it.t, ok); };
    let ws = shuffle(words.map((w, j) => ({ w, j }))); if (ws.map(x => x.w).join(' ') === words.join(' ')) ws = ws.reverse();
    if (S.hint) { picked = [words[0]]; line.append(el('span', { cls: 'chip ok' }, words[0])); ws = ws.filter(x => x.j !== 0); }

/* ───────── записка и обрывки ───────── */

  const ds = S.digits[part]; g.font = '700 200px Caveat, cursive'; g.fillText(ds.join(' '), W / 2, 290);
  // обрывки: соседство к случайным центрам
  const seeds = []; for (let i = 0; i < n; i++) seeds.push([60 + Math.random() * (W - 120), 40 + Math.random() * (H - 80)]);
  for (let it = 0; it < 4; it++) { const acc = seeds.map(() => [0, 0, 0]); for (let y = 0; y < H; y += 8) for (let x = 0; x < W; x += 8) { let b = 0, bd = 1e9; seeds.forEach(([sx, sy], k) => { const d = (sx - x) ** 2 + (sy - y) ** 2; if (d < bd) { bd = d; b = k; } }); acc[b][0] += x; acc[b][1] += y; acc[b][2]++; } seeds.forEach((s, k) => { if (acc[k][2]) { s[0] = acc[k][0] / acc[k][2]; s[1] = acc[k][1] / acc[k][2]; } }); }

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { let b = 0, bd = 1e9; const jx = x + jit(x, y), jy = y + jit(y, x); seeds.forEach(([sx, sy], k) => { const d = (sx - jx) ** 2 + (sy - jy) ** 2; if (d < bd) { bd = d; b = k; } }); const o = (y * W + x) * 4; for (let q = 0; q < 4; q++) imgs[b].data[o + q] = src.data[o + q]; }

}
function pieceThumb(part, k) { const p = NOTE[part].pieces[k]; const c = document.createElement('canvas'); c.width = 600; c.height = 400; c.getContext('2d').drawImage(p, 0, 0); c.style.transform = `rotate(${NOTE[part].rot[k]}deg)`; return c; }

function codeDigits() { let d = []; for (let p = 1; p <= 3; p++) if (S.assembled[p]) d = d.concat(S.digits[p]); return d.length ? d : S.digits[1]; }

const MW = {

function report() {
  const st = S.student, f = st.gender === 'f';
  const v = (m, w) => f ? w : m;
  const lines = [];
  lines.push(`${v('Ученик', 'Ученица')}: ${st.name || '—'}${st.age ? ', ' + st.age + ' лет' : ''}`);
  lines.push(`Вводный урок 13+ (escape room), ${new Date().toLocaleDateString('ru-RU')}`);
  let level = null;
  D.checklist.forEach((P, pi) => {
    const blocks = P.blocks.map((b, bi) => { const sc = b[1].map((t, ti) => topicScore(`p${pi + 1}b${bi + 1}t${ti + 1}`).v); return { name: b[0], sc, sum: sc.reduce((x, y) => x + (y || 0), 0), filled: sc.filter(x => x !== null).length }; });
    if (!blocks.some(b => b.filled)) return;
    lines.push('');
    lines.push(P.title);
    blocks.forEach(b => { if (b.filled) lines.push(`  ${b.name}: ${b.sum} из 12${b.sum >= 9 ? ' ✔' : ''}`); });
    const pass = blocks.every(b => b.sum >= 9);
    lines.push(`  Итог части: ${pass ? v('прошёл', 'прошла') : v('не прошёл', 'не прошла')} (порог — 9 из 12 в каждом блоке)`);
    if (pass) level = P.title;
  });
  lines.push('');
  lines.push(`Рекомендованный уровень: ${level ? level.replace(/^ЧАСТЬ \d+\. /, '') + ' (часть пройдена полностью)' : 'ниже A1.2 — начать с базового курса'}`);
  return lines.join('\n');
}
