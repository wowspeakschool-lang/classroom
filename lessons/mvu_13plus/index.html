<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WowSpeak Escape Room — 13+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d1a24;--gold:#f2b544;--gold2:#ffd889;--panel:rgba(20,16,30,.86);--ok:#3fbf6a;--bad:#e25555;--txt:#fff6e6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0d0b12;color:var(--txt);font-family:Montserrat,Arial,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*1.5));height:min(100vh,calc(100vw/1.5));background:#000;overflow:hidden;border-radius:6px}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.on{display:flex}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.75));z-index:1}
.box{position:relative;z-index:2;background:var(--panel);border:1px solid rgba(242,181,68,.45);border-radius:22px;padding:2.4vh 3vw;max-width:88%;box-shadow:0 10px 40px rgba(0,0,0,.6);text-align:center}
h1{font-weight:800;font-size:5vh;margin:.3em 0;color:var(--gold2);letter-spacing:.02em}
h2{font-weight:800;font-size:3.6vh;margin:.2em 0 .5em;color:var(--gold2)}
.ru{font-size:2.4vh;line-height:1.45;color:#f1e7d6}
.en{font-size:2.2vh;color:#c9bda8;font-style:italic;margin-top:.6em}
.brand{position:absolute;left:2vw;top:2vh;z-index:5;font-weight:800;font-size:2.2vh;color:var(--gold2);letter-spacing:.06em;text-shadow:0 2px 6px #000}
.brand small{display:block;font-weight:500;font-size:1.5vh;color:#d9cbb4;letter-spacing:.02em}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink);border:0;border-radius:14px;padding:1.4vh 2.6vw;font-size:2.4vh;font-weight:800;box-shadow:0 4px 0 #a36f12}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a36f12}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--txt);box-shadow:none;border:1px solid rgba(255,255,255,.3)}
/* верхняя панель */
#topbar{position:absolute;right:1.2vw;top:1.4vh;z-index:20;display:flex;gap:.6vw}
.tb{background:rgba(20,16,30,.8);border:1px solid rgba(242,181,68,.5);color:var(--txt);border-radius:12px;padding:.8vh 1vw;font-size:2.2vh;font-weight:700}
.tb.plan{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--ink)}
#parts{position:absolute;left:50%;transform:translateX(-50%);top:1.4vh;z-index:20;display:none;gap:.4vw}
#parts button{background:rgba(20,16,30,.8);border:1px solid rgba(255,255,255,.25);color:#d8ccb8;border-radius:10px;padding:.5vh .9vw;font-size:1.7vh;font-weight:700}
#parts button.cur{background:var(--gold);color:var(--ink);border-color:var(--gold)}
#nav{position:absolute;right:1.2vw;bottom:1.6vh;z-index:45;display:flex;gap:.6vw}
#nav button{font-size:2.3vh}
.hint{position:absolute;left:1.2vw;bottom:1.6vh;z-index:20}
/* комната */
.room .obj{position:absolute;z-index:3;transform:translate(-50%,-100%);cursor:pointer;transition:transform .2s,filter .2s}
.room .obj img{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.6))}
.room .obj.live img{animation:glow 2.2s ease-in-out infinite}
.room .obj:hover{transform:translate(-50%,-100%) scale(1.08)}
.room .obj.done{cursor:default;opacity:.55}
.room .obj.cut{transform:none}
.room img.front{position:absolute;z-index:4;pointer-events:none;object-fit:fill}
.room .obj.cut img{width:100%;height:100%;object-fit:fill;filter:none}
.room .obj.cut.live img{animation:glow2 2.2s ease-in-out infinite}
.room .obj.cut:hover{transform:scale(1.06)}
.room .obj.cut.done{opacity:1}.room .obj.cut.done img{visibility:hidden}.room .obj.cut.done:hover{transform:none}
@keyframes glow2{0%,100%{filter:drop-shadow(0 0 .2vh rgba(255,216,137,.5))}50%{filter:drop-shadow(0 0 1.6vh rgba(255,216,137,1)) drop-shadow(0 0 .5vh rgba(255,240,200,.9)) brightness(1.12)}}
.room .obj.done:hover{transform:translate(-50%,-100%)}
.room .obj .shd{position:absolute;left:8%;right:8%;bottom:-5%;height:14%;background:radial-gradient(ellipse at center,rgba(0,0,0,.6),rgba(0,0,0,0) 70%);z-index:-1;pointer-events:none}
.room .obj .tick{position:absolute;right:-.6vw;top:-.6vh;background:var(--ok);color:#fff;border-radius:50%;width:3.2vh;height:3.2vh;font-size:2vh;display:none;align-items:center;justify-content:center;font-weight:800}
.room .obj.done .tick{display:flex}
.room .obj.cut .tick{right:auto;transform:translate(-50%,-50%)}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 rgba(255,216,137,0)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}50%{filter:drop-shadow(0 0 1.4vh rgba(255,216,137,.95)) drop-shadow(0 6px 8px rgba(0,0,0,.6))}}
.roomTitle{pointer-events:none;position:absolute;left:50%;top:7vh;transform:translateX(-50%);z-index:4;background:var(--panel);border-radius:14px;padding:.8vh 1.6vw;font-weight:800;font-size:2.4vh;color:var(--gold2);white-space:nowrap}
.roomTip{pointer-events:none;position:absolute;left:50%;top:13vh;transform:translateX(-50%);z-index:4;background:var(--panel);border-radius:14px;padding:.8vh 1.6vw;font-size:2vh;white-space:nowrap}
/* конверт с кусками записки (45) */
#env{pointer-events:none;position:absolute;left:1.4vw;top:1.6vh;z-index:15;display:none;align-items:center;gap:.8vw;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
#env svg{width:10vh;height:7.2vh;display:block;transition:transform .25s}
#env.pulse svg{transform:scale(1.18)}
#env .cnt{background:rgba(20,16,30,.85);border:1px solid rgba(242,181,68,.6);color:var(--gold2);font-weight:800;font-size:2.4vh;border-radius:12px;padding:.6vh 1vw;white-space:nowrap}
.fly{position:absolute;z-index:44;pointer-events:none;transition:left .8s cubic-bezier(.5,0,.6,1),top .8s cubic-bezier(.5,0,.6,1),width .8s,opacity .8s;filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}
/* задание */
.task{position:relative;z-index:2;width:92%;height:82%;overflow:hidden;background:var(--panel);border:1px solid rgba(242,181,68,.4);border-radius:22px;padding:2vh 2vw;display:flex;flex-direction:column}
.task .head{display:flex;align-items:center;gap:1vw;margin-bottom:1vh}
.task .head img{height:6vh}
.task .head .ttl{font-size:2.5vh;font-weight:800;color:var(--gold2);text-align:left}
.task .head .cnt{margin-left:auto;font-size:1.9vh;color:#bfb39e;white-space:nowrap}
.task .body{flex:1;display:flex;gap:2vw;align-items:safe center;justify-content:safe center;min-height:0}
.task .pic{flex:0 1 50%;min-width:0;max-width:50%;max-height:100%;display:flex;align-items:center;justify-content:center}
.task .pic img{max-width:100%;max-height:58vh;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.6)}
.task .side{flex:1;display:flex;flex-direction:column;align-items:center;gap:1.6vh;min-width:0}
.q{font-size:3.1vh;font-weight:700;text-align:center;line-height:1.35}
.opts{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center}
.opt{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:14px;padding:1.2vh 1.6vw;font-size:2.6vh;font-weight:700;min-width:10vw}
.opt.ok{background:var(--ok);color:#fff}.opt.bad{background:var(--bad);color:#fff}.opt.show{border-color:var(--ok)}
.opt[disabled]{cursor:default}
.fix{font-size:2.4vh;color:#9ff0b6;min-height:3vh}
.task .pic.wide{flex:1 1 58%;max-width:58%}
.imgs2{display:flex;gap:1vw;width:100%;align-items:stretch;justify-content:center}
.imgs2 .ic{flex:1 1 0;min-width:0;height:34vh;background:rgba(255,255,255,.07);border:1px solid rgba(242,181,68,.3);border-radius:16px;padding:1.2vh;display:flex;align-items:center;justify-content:center}
.task .pic .imgs2 img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:none;border-radius:0}
.listen .pic{flex:0 0 26%;max-width:26%;flex-direction:column}
.listen .player{flex-direction:column;border-radius:20px;padding:2vh 1vw}
.listen .player .bar{width:18vw}
.qlist{align-items:stretch!important;gap:1.6vh!important;overflow:auto;max-height:100%;padding-right:.5vw}
.qblock{background:rgba(255,255,255,.05);border-radius:14px;padding:1vh 1vw}
.qblock .q{font-size:2.5vh;text-align:left}
.qblock .opts{justify-content:flex-start;margin-top:.6vh}
.qblock .opt{font-size:2.1vh;padding:.7vh 1.1vw;min-width:0}
.oralq{max-width:100%!important;width:100%;padding:1.6vh 2vw!important}
.oralq .qq{font-size:3vh;margin:0}
.fixline .chip{font-size:2.8vh}
.chip.pic{padding:.4vh}.chip.pic img{height:12vh}
.dragghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%) scale(1.05);opacity:.92;box-shadow:0 8px 20px rgba(0,0,0,.5)}
.checkb{margin-top:1.2vh}.checkb[disabled]{opacity:.6}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.flag{width:22vh;height:14.6vh;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.6);overflow:hidden}
.family{display:grid;grid-template-columns:repeat(3,auto);gap:.6vh 1.6vw;justify-items:center;align-items:end}
.family .p{text-align:center;font-size:1.8vh;font-weight:700}
.family .p img{height:11vh;display:block;margin:0 auto}
.family .p small{display:block;color:#bfb39e;font-weight:500}
/* сортировка, пары, порядок */
.chips{display:flex;flex-wrap:wrap;gap:.8vw;justify-content:center}
.chip{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:12px;padding:.8vh 1vw;font-size:2.2vh;font-weight:700;display:flex;align-items:center;gap:.5vw}
.chip img{height:6vh}
.chip.sel{border-color:var(--gold)}
.chip.ok{background:#d9f5df}.chip.bad{background:#ffd9d9}
.groups{display:flex;gap:1.2vw;width:100%;justify-content:center}
.grp{flex:1;max-width:30vw;min-height:20vh;border:2px dashed rgba(242,181,68,.6);border-radius:16px;padding:1vh .8vw;display:flex;flex-direction:column;align-items:center;gap:.6vh;cursor:pointer}
.grp .gt{font-size:2.3vh;font-weight:800;color:var(--gold2)}
.grp .chips{gap:.5vw}
.side > .chips{width:100%;flex-shrink:0}
.task .chip.pic,.task .mi.pic{flex:0 0 auto;max-width:none;max-height:none;min-width:0}
.task .chip.pic img{box-shadow:none;border-radius:8px}
.match{display:flex;gap:3vw;width:100%;justify-content:center;align-items:flex-start}
.match .col{display:flex;flex-direction:column;gap:1.2vh;align-items:stretch;justify-content:center}
.match .col .mi{font-size:2.5vh}
.match .col.imgs{display:grid;grid-template-columns:repeat(2,auto);gap:1.2vh 1.2vw}
.mi{background:#f7efe0;color:var(--ink);border:3px solid transparent;border-radius:12px;padding:.9vh 1vw;font-size:2.2vh;font-weight:700;text-align:left}
.mi img{height:17vh;display:block;border-radius:8px}
.mi.pic{padding:.4vh}
.mi.sel{border-color:var(--gold)}.mi.ok{background:#bfeccb}.mi.bad{background:#ffc9c9}
/* значки после Check (замечание 51) */
.chip,.mi,.slot{position:relative}
.chip.ok::after,.mi.ok::after,.slot.ok::after,.chip.bad::after,.mi.bad::after,.slot.bad::after{position:absolute;top:-1.1vh;right:-1.1vh;width:3vh;height:3vh;border-radius:50%;color:#fff;font-size:1.9vh;display:flex;align-items:center;justify-content:center;font-weight:800;box-shadow:0 2px 5px rgba(0,0,0,.45);z-index:2}
.chip.ok::after,.mi.ok::after,.slot.ok::after{content:'✓';background:var(--ok)}
.chip.bad::after,.mi.bad::after,.slot.bad::after{content:'✗';background:var(--bad)}
/* слово → поле под картинкой (замечание 47) */
.mpool{min-height:6vh;width:100%}
.mcards{display:flex;flex-wrap:nowrap;gap:1.4vh 1.4vw;justify-content:center;width:100%}
.mcard{display:flex;flex-direction:column;align-items:center;gap:.8vh;background:rgba(255,255,255,.07);border:2px solid rgba(242,181,68,.35);border-radius:16px;padding:1vh;cursor:pointer}
.mcard{flex:0 1 22%;min-width:0}
.mcard img{height:17vh;max-width:100%;object-fit:contain;display:block;border-radius:10px}
.slot{width:100%;min-width:0;min-height:5.2vh;border:2px dashed rgba(242,181,68,.7);border-radius:30px;display:flex;align-items:center;justify-content:center;padding:.2vh .4vw}
.slot.ok{border:2px solid var(--ok);background:rgba(63,191,106,.18)}.slot.bad{border:2px solid var(--bad);background:rgba(226,85,85,.18)}
.slot .chip{border-radius:30px}
.mright{font-size:1.9vh;color:#9ff0b6;min-height:2.4vh;font-weight:700}
/* стрелки в парах «текст — текст» (замечание 53) */
.match.txt{position:relative;gap:11vw}
.match.txt .col{flex:0 1 36%}
.match.txt svg.arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
/* животные в реальном размере (42–43) */
.zoo{display:flex;align-items:flex-end;justify-content:center;gap:2.4vh;width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(242,181,68,.3);border-radius:16px;padding:2vh 1.6vh 1.6vh;border-bottom:4px solid rgba(242,181,68,.45)}
.task .pic .zoo img{width:auto;max-width:none;max-height:none;box-shadow:none;border-radius:0;display:block}
/* второй шаг вопроса: ответить устно (40) */
.then{margin-top:1.4vh;padding:1.2vh 1.6vw;border:2px solid var(--gold);border-radius:16px;background:rgba(242,181,68,.12);font-size:2.6vh;font-weight:700;text-align:center}
.then .answer{font-size:2.4vh;min-height:0;margin-top:.6vh}
.mi .tag{display:inline-block;background:var(--ok);color:#fff;border-radius:6px;padding:0 .4vw;font-size:1.6vh;margin-top:.3vh}
.ord .line{min-height:7vh;border-bottom:3px solid rgba(242,181,68,.7);display:flex;flex-wrap:wrap;gap:.6vw;justify-content:center;align-items:center;padding:.6vh;width:90%}
.hot{position:relative;height:60vh}
.hot img{height:100%}
.hot .arrow{position:absolute;width:5vh;height:5vh;transform:translate(-50%,-50%);border-radius:50%;border:.6vh solid #ff4d4d;box-shadow:0 0 0 .5vh rgba(255,255,255,.8);animation:pulse 1.2s infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.25)}}
.player{display:flex;align-items:center;gap:1vw;background:rgba(255,255,255,.08);border-radius:40px;padding:1vh 1.4vw}
.player button{width:7vh;height:7vh;border-radius:50%;border:0;background:var(--gold);font-size:3vh}
.player .bar{width:24vw;height:1vh;background:rgba(255,255,255,.2);border-radius:1vh;overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--gold)}
.phone{font-size:8vh}
.sus{display:flex;gap:1vw}
.sus button{border:3px solid transparent;background:#f7efe0;border-radius:14px;padding:.4vh}
.sus img{height:20vh;display:block}
.sus button.ok{border-color:var(--ok);background:#bfeccb}.sus button.bad{border-color:var(--bad);background:#ffc9c9}
/* называем предмет / and you */
.big{height:42vh;filter:drop-shadow(0 10px 20px rgba(0,0,0,.7))}
.ask{font-size:4.2vh;font-weight:800;color:var(--gold2);margin:1vh 0}
.answer{font-size:3vh;font-weight:700;color:#9ff0b6;min-height:4vh}
.card{background:linear-gradient(160deg,#2b2240,#191424);border:2px solid var(--gold);border-radius:22px;padding:3vh 3vw;max-width:70%;text-align:center}
.card .lbl{font-size:2vh;letter-spacing:.2em;color:var(--gold);font-weight:800}
.card .qq{font-size:3.6vh;font-weight:700;margin-top:1vh;line-height:1.35}
/* записка */
#noteStage{position:relative;width:60vh;height:40vh}
#noteStage canvas{position:absolute;left:0;top:0;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
/* замок */
.lockbox{display:flex;gap:1vw;justify-content:center;margin:2vh 0}
.lockbox span{width:6vh;height:8.4vh;border-radius:10px;background:#111;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:800;color:var(--gold2);transition:transform .3s}
.lockbox span.in{transform:scale(1.15)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
.toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:40;background:#1d1830;cursor:pointer;border:2px solid var(--gold);border-radius:20px;padding:2vh 2.4vw;text-align:center;font-size:2.6vh;font-weight:700;display:none}
.toast canvas{max-width:30vh;max-height:24vh;display:block;margin:2.4vh auto 2.6vh}
.toast .btn{display:block;margin:0 auto}
.tbg{position:absolute;inset:0;z-index:39;background:rgba(8,6,14,.82);display:none}
#loader{position:fixed;inset:0;z-index:999;background:#0d0b12;color:var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh;font-weight:800;font-size:3vh}
#loader .b{width:40vw;height:1.2vh;background:#2a2238;border-radius:1vh;overflow:hidden}#loader .b i{display:block;height:100%;width:0;background:var(--gold)}
</style>
</head>

  <div id="parts"></div>

  <div class="tbg" id="tbg"></div><div class="toast" id="toast"></div>
  <canvas id="fx"></canvas>
</div></div>

ing", "trophy", "umbrella", "w_sunny", "wallet", "wanted_poster", "wardrobe"], "plan_html": "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>План урока — Escape Room 13+<\/title><style>body{font-family:'Segoe UI',Arial,sans-serif;background:#f6efe2;color:#2a1a10;padding:18px 22px;max-width:1200px;margin:0 auto;font-size:14px}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d9cdb8;padding:5px 8px;vertical-align:top}th{background:#6e3510;color:#fff;text-align:left}.legend{background:#fffaf0;border-left:4px solid #f2b544;padding:8px 12px;margin:8px 0}.dl a{display:inline-block;margin:0 8px 10px 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none}.dl a.pdf{background:#7b4bd6}.must{background:#fff0ee;border:3px solid #d32f2f;border-radius:12px;padding:8px 18px 6px;margin:10px 0 16px}.must h2{margin:4px 0 8px;color:#c62828;font-size:18px}.must p{margin:6px 0;line-height:1.45}.ru{color:#555;font-style:normal}table.plan td.st{font-weight:700;white-space:nowrap}table.plan td.tl{color:#7a3d10;font-style:italic;width:24%}table.plan td.sa{color:#1f5fa8;width:22%}table.plan tr.part td{background:#2b2240;color:#ffd889;font-weight:700}<\/style><\/head><body><h1 style=\"color:#6e3510;margin:4px 0 10px\">🗝 План урока: Escape Room 13+ (вводный урок)<\/h1><p class=\"dl\"><a href=\"https://classroom.wowteach.ru/lessons/mvu_13plus/plans/mvu_13plus_plan.docx\" download>⬇ Скачать план (Word)<\/a><a class=\"pdf\" href=\"https://classroom.wowteach.ru/lessons/mvu_13plus/plans/mvu_13plus_plan.pdf\" download>⬇ Скачать план (PDF)<\/a><\/p><div class=\"must\"><h2>❗ Как работать с уроком — прочитайте обязательно<\/h2><p><b>Окна.<\/b> Вверху урока две кнопки: ✅ открывает чек-лист, 📋 — этот план. Оба открываются отдельными окнами: держите их у себя, а ученику показывайте только экран урока. В чек-листе сразу впишите имя ученика, пол и возраст — они попадут в отчёт.<\/p><p><b>Как идёт урок.<\/b> Ученик выбирает светящийся предмет в комнате, вы нажимаете на него и идёте по экранам кнопкой Next: ученик называет предмет, выполняет задания и отвечает на вопросы о себе. За каждый предмет он получает кусочек записки с кодом — даже если ошибся. Урок всегда начинается с Part 1 и длится 40 минут.<\/p><p><b>Баллы.<\/b> Задания с вариантами ответов (выбрать, соединить, разложить, найти ошибку) ставят балл в чек-лист сами. Устные ответы — назвать предмет, вопросы о себе, вопросы по картинке — оцениваете вы: вверху чек-листа есть рамка «Сейчас на экране», в ней вопрос, ожидаемый ответ и кнопки 0 / 1 / 2. Любой балл можно поменять прямо в таблице — ваш заменит посчитанный.<\/p><p><b>Предметы в чек-листе.<\/b> Над каждой частью чек-листа — картинки предметов этой части. Нажмите на предмет — подсветятся темы, которые он проверяет. Это удобно, когда времени мало и нужно проверить конкретную тему: рядом с каждой темой стоит метка 🔎 с предметом, нажатие на неё сразу открывает этот предмет в уроке.<\/p><p><b>Дальше или к замку.<\/b> После каждой части посмотрите суммы блоков в чек-листе: если везде 9 из 12 или больше, ведите ученика в следующую комнату, если нет — к замку. Решение за вами. Если время кончается, кнопка 🚪 вверху ведёт сразу к замку.<\/p><p><b>Отчёт.<\/b> В конце нажмите «📝 Отчёт» — чек-лист откроется на готовом отчёте: какие темы ученик знает уверенно, с какими знаком, каких пока не знает, и какая программа ему рекомендуется. Отчёт можно править прямо в окне: удалить лишнее, дописать своё, добавить комментарий. Потом нажмите «Скопировать отчёт».<\/p><p><b>Если ученик не понимает английский.<\/b> Историю и инструкции можно говорить по-русски — русский вариант стоит в колонке «Teacher’s language» под английским.<\/p><\/div><table class=\"plan\"><tr><th>Шаг<\/th><th>Что делать<\/th><th>Teacher’s language<\/th><th>Ожидаемые ответы<\/th><\/tr><tr><td class=\"st\">1. Welcome<\/td><td>Поздоровайтесь и скажите, что это не тест, а игра: ошибаться можно, отвечать можно как получается.<\/td><td class=\"tl\">Hi! Welcome to WowSpeak School! This is not a test — it’s a game. Let’s have fun! Are you ready?<br><span class=\"ru\">Привет! Это не тест, а игра — ошибаться можно. Готов?<\/span><\/td><td class=\"sa\">Yes! / I’m ready.<\/td><\/tr><tr><td class=\"st\">2. Get to know you<\/td><td>Задайте три вопроса с карточек, следующая карточка открывается кнопкой Next. Баллов здесь нет: вы знакомитесь и смотрите, как ученик держится.<\/td><td class=\"tl\">What’s your name? How old are you? What do you like doing in your free time?<br><span class=\"ru\">Как тебя зовут? Сколько тебе лет? Что ты любишь делать в свободное время?<\/span><\/td><td class=\"sa\">My name is… I’m 14. I like playing football…<\/td><\/tr><tr><td class=\"st\">3. История<\/td><td>Расскажите историю квеста. На экране только название — рассказываете вы. Если ученик плохо понимает английский, расскажите по-русски. Сколько цифр в коде, не говорите.<\/td><td class=\"tl\">You are locked in the WowSpeak Escape Room! The door has a code lock. The code is on a secret note, and the note is in pieces. Find the pieces — choose a glowing object and say what it is in English.<br><span class=\"ru\">Ты заперт в квест-комнате WowSpeak! Дверь закрыта на кодовый замок. В комнате спрятаны кусочки старой записки с кодом. Найди их — нажимай на предметы!<\/span><\/td><td class=\"sa\">—<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">PART 1 · 🛋 The Living Room<\/td><\/tr><tr><td class=\"st\">Предметы<\/td><td>Ученик выбирает светящийся предмет, вы нажимаете на него. Дальше идите по экранам кнопкой Next: ученик называет предмет, выполняет задания и отвечает на вопросы о себе. Когда открыты все предметы, нажмите «Put the note together» — кусочки сложатся, и ученик прочитает цифры.<\/td><td class=\"tl\">What’s this? / And you?<br><span class=\"ru\">Что это? А ты?<\/span><\/td><td class=\"sa\">Ожидаемые ответы — в чек-листе, в рамке «Сейчас на экране».<\/td><\/tr><tr><td class=\"st\">Дальше или к замку<\/td><td>Посмотрите в чек-листе суммы блоков этой части. Если везде 9 из 12 или больше, ведите дальше — «Keep looking». Если нет, к замку — «Open the lock». Решение за вами.<\/td><td class=\"tl\">Great job! Let’s keep looking! / Great job! Shall we open the lock?<br><span class=\"ru\">Отлично! Ищем дальше? / Откроем замок?<\/span><\/td><td class=\"sa\">—<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">PART 2 · 📚 The Secret Study<\/td><\/tr><tr><td class=\"st\">История<\/td><td>Нажмите «Keep looking» и расскажите продолжение. Не говорите «нам нужно ещё цифр» — просто нашлась новая комната.<\/td><td class=\"tl\">Look — the wall is moving! There is a secret study behind it.<br><span class=\"ru\">Смотри — стена сдвинулась! За ней тайный кабинет. Здесь спрятана ещё одна записка.<\/span><\/td><td class=\"sa\">—<\/td><\/tr><tr><td class=\"st\">Предметы<\/td><td>Ученик выбирает светящийся предмет, вы нажимаете на него. Дальше идите по экранам кнопкой Next: ученик называет предмет, выполняет задания и отвечает на вопросы о себе. Когда открыты все предметы, нажмите «Put the note together» — кусочки сложатся, и ученик прочитает цифры.<\/td><td class=\"tl\">What’s this? / And you?<br><span class=\"ru\">Что это? А ты?<\/span><\/td><td class=\"sa\">Ожидаемые ответы — в чек-листе, в рамке «Сейчас на экране».<\/td><\/tr><tr><td class=\"st\">Дальше или к замку<\/td><td>Посмотрите в чек-листе суммы блоков этой части. Если везде 9 из 12 или больше, ведите дальше — «Keep looking». Если нет, к замку — «Open the lock». Решение за вами.<\/td><td class=\"tl\">Great job! Let’s keep looking! / Great job! Shall we open the lock?<br><span class=\"ru\">Отлично! Ищем дальше? / Откроем замок?<\/span><\/td><td class=\"sa\">—<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">PART 3 · 🧪 The Secret Lab<\/td><\/tr><tr><td class=\"st\">История<\/td><td>Нажмите «Keep looking» и расскажите продолжение. Не говорите «нам нужно ещё цифр» — просто нашлась новая комната.<\/td><td class=\"tl\">There is a secret door to the attic. Welcome to the secret lab!<br><span class=\"ru\">В кабинете нашёлся люк на чердак. Там — тайная лаборатория и последняя записка.<\/span><\/td><td class=\"sa\">—<\/td><\/tr><tr><td class=\"st\">Предметы<\/td><td>Ученик выбирает светящийся предмет, вы нажимаете на него. Дальше идите по экранам кнопкой Next: ученик называет предмет, выполняет задания и отвечает на вопросы о себе. Когда открыты все предметы, нажмите «Put the note together» — кусочки сложатся, и ученик прочитает цифры.<\/td><td class=\"tl\">What’s this? / And you?<br><span class=\"ru\">Что это? А ты?<\/span><\/td><td class=\"sa\">Ожидаемые ответы — в чек-листе, в рамке «Сейчас на экране».<\/td><\/tr><tr><td class=\"st\">🔐 Замок<\/td><td>Ученик читает код по-английски, вы нажимаете «Enter the code».<\/td><td class=\"tl\">Read the code in English, please!<br><span class=\"ru\">Прочитай код по-английски.<\/span><\/td><td class=\"sa\">four, seven, two, nine…<\/td><\/tr><tr><td class=\"st\">🎉 Финал<\/td><td>Дверь открыта. Нажмите «📝 Отчёт» внизу слева и поработайте с отчётом (см. рамку вверху).<\/td><td class=\"tl\">Well done! You escaped! How did you like the game?<br><span class=\"ru\">Ура, ты выбрался! Понравилась игра?<\/span><\/td><td class=\"sa\">—<\/td><\/tr><\/table><\/body><\/html>", "mw_html": "<!DOCTYPE html>\n<html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>Чек-лист — Escape Room 13+<\/title>\n<style>\nbody{font-family:'Segoe UI',Arial,sans-serif;background:#f6efe2;color:#2a1a10;margin:0;font-size:14px}\nheader{position:sticky;top:0;background:#2b2240;color:#fff;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;z-index:5}\nheader input,header select{padding:5px 8px;border-radius:6px;border:0;font-size:14px}\nheader .tabs button{background:#4a3d68;color:#fff;border:0;border-radius:8px;padding:6px 14px;font-weight:700;cursor:pointer}\nheader .tabs button.on{background:#f2b544;color:#2a1a10}\nheader .code{margin-left:auto;font-weight:700;color:#ffd889}\nmain{padding:14px 18px;max-width:1200px;margin:0 auto}\n.now{background:#fff;border:2px solid #f2b544;border-radius:12px;padding:10px 14px;margin-bottom:14px}\n.now h3{margin:0 0 6px;font-size:15px}\n.oral{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}\n.oral .lab{flex:1;min-width:260px}\n.oral .exp{color:#1f7a3a;font-style:italic}\n.mk button{border:1px solid #bbb;background:#fafafa;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer;margin-left:3px}\n.mk button.on2{background:#3fbf6a;color:#fff;border-color:#3fbf6a}.mk button.on1{background:#f2b544;border-color:#f2b544}.mk button.on0{background:#e25555;color:#fff;border-color:#e25555}\ntable{border-collapse:collapse;width:100%;background:#fff;margin:6px 0 14px}\nth,td{border:1px solid #d9cdb8;padding:4px 8px;vertical-align:middle}\nth{background:#6e3510;color:#fff;text-align:left}\ntd.sc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\ntr.cur td{background:#fff3cf}\ntr.hl td{background:#dff0ff}tr.hl td:first-child{box-shadow:inset 4px 0 #3a8ee6}\ntable{table-layout:fixed}th:last-child{width:300px}\n.objbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 8px}.objbar .lab{color:#6a5a46;font-size:13px;margin-right:4px}\n.objbar button.ob{display:flex;align-items:center;gap:6px;border:1px solid #d9cdb8;background:#fff;border-radius:18px;padding:3px 10px 3px 4px;cursor:pointer;font-size:13px;color:#2a1a10}\n.objbar button.ob img{width:28px;height:28px;object-fit:contain}.objbar button.ob.on{background:#3a8ee6;color:#fff;border-color:#3a8ee6}\ntr.unset.past td:first-child{box-shadow:inset 4px 0 #f2b544}\n.sum{font-weight:700}.pass{color:#1f7a3a}.fail{color:#b03030}\n.auto{font-size:11px;color:#8a7a66;margin-left:4px}\n.mk button.f2{background:#c9efd5;border-color:#3fbf6a}.mk button.f1{background:#fde7b8;border-color:#f2b544}.mk button.f0{background:#f7c9c9;border-color:#e25555}\nspan.objs{float:right}button.obj{margin-left:6px;border:1px solid #e0d3bd;background:#fbf6ec;color:#8a6a46;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}button.obj:hover{background:#f2b544;color:#2a1a10;border-color:#f2b544}\n#cm{height:70px;font-family:inherit;font-size:14px}\nh2{margin:14px 0 4px;color:#6e3510;font-size:17px}\n.legend{background:#fffaf0;border-left:4px solid #f2b544;padding:8px 12px;margin:8px 0;font-size:13px}\ntextarea{width:100%;height:220px;font-family:Consolas,monospace;font-size:13px}\n.act button{background:#e8631a;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;margin-right:8px}\n.act button.gray{background:#888}\n#plan table td{font-size:13px}\n.dl a{display:inline-block;margin:0 8px 10px 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none}\n.dl a.pdf{background:#7b4bd6}\n<\/style><\/head><body>\n<header>\n  <b>✅ Чек-лист · Escape Room 13+<\/b>\n  <label>Имя ученика <input id=\"nm\" placeholder=\"Имя по-русски\"><\/label>\n  <label>Пол <select id=\"gd\"><option value=\"m\">мальчик<\/option><option value=\"f\">девочка<\/option><\/select><\/label>\n  <label>Возраст <input id=\"ag\" size=\"3\"><\/label>\n  <span class=\"code\" id=\"code\"><\/span>\n<\/header>\n<main>\n<div id=\"check\">\n  <div class=\"now\" id=\"now\"><\/div>\n  <div class=\"legend\"><b>0 · 1 · 2.<\/b> 2 — сам, верно, полной фразой (в задании с нажатием — всё верно); 1 — после подсказки, исправил себя, ответил словом вместо фразы (в задании — не меньше половины); 0 — не смог и с подсказкой, по-русски, не понял (в задании — меньше половины).\n  Балл по нажатиям ученика и ваши устные отметки («Сейчас на экране») сразу видны в таблице: <b>бледная<\/b> кнопка — посчитанный балл, рядом — откуда он («из задания», «устно», «из другой части»). Нажатие на 0/1/2 в таблице ставит ваш балл (<b>яркая<\/b> кнопка) вместо посчитанного; повторное нажатие — снять.\n  Над каждой частью — предметы: нажмите, и подсветятся темы, которые предмет проверяет (нажмите ещё раз — снять). Метка 🔎 у темы открывает этот предмет в уроке.\n  Часть пройдена, если в каждом блоке ≥ 9 из 12 — это подсказка, решение за вами.<\/div>\n  <div id=\"tables\"><\/div>\n  <h2 id=\"repH\">Отчёт<\/h2><div class=\"legend\">Отчёт собирается сам. Его можно править прямо здесь — удалить лишнее, дописать своё. После правки он больше не обновляется сам; «↺ Собрать отчёт заново» вернёт автоматический.<\/div>\n  <label><b>Комментарий преподавателя<\/b> (попадёт в отчёт)<textarea id=\"cm\" placeholder=\"Например: стеснялся говорить, но всё понимал; хорошо читает.\"><\/textarea><\/label>\n  <textarea id=\"rep\"><\/textarea>\n  <div class=\"act\"><button id=\"cp\">📋 Скопировать отчёт<\/button><button class=\"gray\" id=\"rb\">↺ Собрать отчёт заново<\/button><button class=\"gray\" id=\"rs\">Новый ученик (сбросить всё)<\/button><\/div>\n<\/div>\n<\/main>\n<script>\nconst A = window.APP;\nfunction $(s){return document.querySelector(s)}\nconst st=A.S.student; $('#nm').value=st.name; $('#gd').value=st.gender; $('#ag').value=st.age;\n$('#cm').value=A.S.comment||'';$('#cm').oninput=e=>{A.S.comment=e.target.value;A.save();if(A.S.repEdit==null)$('#rep').value=A.report()};\n$('#rep').oninput=e=>{A.S.repEdit=e.target.value;A.save()};\n$('#rb').onclick=()=>{if(A.S.repEdit==null||confirm('Ваши правки в отчёте пропадут. Собрать заново?')){A.S.repEdit=null;A.save();$('#rep').value=A.report()}};\nwindow.goReport=()=>{$('#repH').scrollIntoView({behavior:'smooth'});$('#cm').focus()};\n$('#nm').oninput=e=>{st.name=e.target.value;A.save();render()}; $('#gd').onchange=e=>{st.gender=e.target.value;A.save();render()}; $('#ag').oninput=e=>{st.age=e.target.value;A.save();render()};\n$('#cp').onclick=()=>{const ok=()=>{$('#cp').textContent='✔ Скопировано';setTimeout(()=>$('#cp').textContent='📋 Скопировать отчёт',1500)};const old=()=>{const r=$('#rep');r.focus();r.select();try{document.execCommand('copy');ok()}catch(e){alert('Не получилось скопировать — выделите текст отчёта и нажмите Ctrl+C')}};if(navigator.clipboard)navigator.clipboard.writeText($('#rep').value).then(ok,old);else old()};\n$('#rs').onclick=()=>{if(confirm('Сбросить все баллы и начать с новым учеником?'))A.reset()};\nfunction mk(cur,fn,faint){const d=document.createElement('span');d.className='mk';[2,1,0].forEach(v=>{const b=document.createElement('button');b.textContent=v===2?'✓ 2':v===1?'~ 1':'✗ 0';if(cur===v)b.className='on'+v;else if(faint===v)b.className='f'+v;b.onclick=()=>fn(cur===v?null:v);d.append(b)});return d}\nfunction screenTopics(s){const t=new Set();if(s.task)(s.task.items||[]).forEach(i=>(i.t||[]).forEach(x=>t.add(x)));(s.oral||[]).forEach(o=>o.topics.forEach(x=>t.add(x)));return t}\nfunction render(){\n  const S=A.S,D=A.D,s=A.screen();\n  // код\n  const ds=[];for(const p of [1,2,3]) ds.push('Part '+p+': '+S.digits[p].join(''));$('#code').textContent='Код: '+ds.join(' · ');\n  // сейчас на экране\n  const now=$('#now');now.innerHTML='';const h=document.createElement('h3');h.textContent='Сейчас на экране: '+(s?s.title:'—');now.append(h);\n  if(s&&s.oral)s.oral.forEach(o=>{const r=document.createElement('div');r.className='oral';const l=document.createElement('div');l.className='lab';l.innerHTML=o.label+(o.expect?' <span class=\"exp\">→ '+o.expect+'<\/span>':'');r.append(l);if(o.topics.length){const cur=S.oral[o.key]?S.oral[o.key].v:null;r.append(mk(cur,v=>{if(v===null)delete S.oral[o.key];else A.oralMark(o.key,o.topics,v);A.save();render()}))}else{const i=document.createElement('i');i.textContent='без балла';r.append(i)}now.append(r)});\n  if(s&&s.task){const p=document.createElement('div');p.style.color='#6a5a46';p.textContent='Задание с нажатием — балл ставится сам по ответам ученика. Темы подсвечены в таблице.';now.append(p)}\n  const curT=s?screenTopics(s):new Set();\n  // таблицы\n  const box=$('#tables');box.innerHTML='';\n  D.checklist.forEach((P,pi)=>{const h2=document.createElement('h2');h2.textContent=P.title;box.append(h2);if(D.parts[pi]){const bar=document.createElement('div');bar.className='objbar';const lab=document.createElement('span');lab.className='lab';lab.textContent='Что проверяет предмет:';bar.append(lab);D.parts[pi].objects.forEach(o=>{const c=document.createElement('button');c.className='ob'+(window._hl===o.id?' on':'');const im=document.createElement('img');im.src=A.img(o.img);c.append(im,document.createTextNode(o.name.split(' (')[0].replace(/^(a|an) /,'')));c.onclick=()=>{window._hl=window._hl===o.id?null:o.id;window._hlJump=true;render()};bar.append(c)});box.append(bar)}\n    P.blocks.forEach((b,bi)=>{const t=document.createElement('table');const th=document.createElement('tr');th.innerHTML='<th>'+b[0]+'<\/th><th>балл<\/th>';t.append(th);let sum=0,filled=0;\n      b[1].forEach((name,ti)=>{const id='p'+(pi+1)+'b'+(bi+1)+'t'+(ti+1);const sc=A.topicScore(id);if(sc.v!==null){sum+=sc.v;filled++}\n        const tr=document.createElement('tr');if(curT.has(id))tr.className='cur';if(window._hl&&A.where(id).some(x=>x.id===window._hl))tr.classList.add('hl');const td=document.createElement('td');td.textContent=name;const ob=document.createElement('span');ob.className='objs';td.append(ob);A.where(id).slice().sort((x,y)=>(x.part!==pi+1)-(y.part!==pi+1)).forEach(o=>{const c=document.createElement('button');c.className='obj';c.title='Открыть этот предмет в уроке';c.textContent='🔎 '+(o.part!==pi+1?'Part '+o.part+' · ':'')+o.name;c.onclick=()=>A.goObj(o.id);ob.append(c)});const td2=document.createElement('td');td2.className='sc';\n        td2.append(mk(S.override[id]!==undefined?S.override[id]:null,v=>A.setOverride(id,v),sc.src==='auto'?sc.v:null));{const a=document.createElement('span');a.className='auto';a.textContent=sc.src==='auto'?sc.from.join(' + '):'';td2.append(a)}\n        tr.append(td,td2);t.append(tr)});\n      const n=b[1].length,part=filled&&filled<n;const tf=document.createElement('tr');tf.innerHTML='<td class=\"sum\">Сумма блока<\/td><td class=\"sum '+(filled&&!part?(sum>=9?'pass':'fail'):'')+'\">'+(filled?sum+' из 12 '+(sum>=9?'✔':'')+(part?' <span class=\"auto\">(оценено '+filled+' тем из '+n+')<\/span>':''):'—')+'<\/td>';t.append(tf);box.append(t)})});\n  if(A.S.repEdit==null)$('#rep').value=A.report();else if(document.activeElement!==$('#rep'))$('#rep').value=A.S.repEdit;\n  if(window._hlJump){window._hlJump=false;const r=box.querySelector('tr.hl');if(r)r.scrollIntoView({block:'center',behavior:'smooth'})}\n  // новый экран — таблица сама прокручивается к его темам (в частях 2–3 по 12 таблиц)\n  const sid=s?s.id:'';if(sid!==window._lastSid){window._lastSid=sid;const r=box.querySelector('tr.cur');const busy=document.activeElement&&document.activeElement.id===\"cm\";if(r&&!busy)r.scrollIntoView({block:'center',behavior:'smooth'})}\n}\nwindow.render=render;render();\n<\/script><\/body><\/html>\n"};
const M = D.media;
const img = n => M + n + '.webp';
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) { if (k === 'cls') e.className = a[k]; else if (k === 'html') e.innerHTML = a[k]; else if (k.startsWith('on')) e[k] = a[k]; else e.setAttribute(k, a[k]); } kids.flat().forEach(c => c != null && e.append(c)); return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = n => Math.floor(Math.random() * n);

/* ───────── состояние ───────── */
const S = {
  student: { name: '', gender: 'm', age: '' },
  auto: {},    // topic → {ok, n}
  oral: {},    // promptKey → {topics, v}
  override: {},// topic → 0/1/2
  done: {},    // objId → true
  scraps: { 1: 0, 2: 0, 3: 0 },
  part: 1, maxPart: 1,
  digits: { 1: [...Array(4)].map(() => rnd(10)), 2: [...Array(2)].map(() => rnd(10)), 3: [...Array(2)].map(() => rnd(10)) },
  assembled: { 1: false, 2: false, 3: false },
  hint: false,
  comment: '', repEdit: null,
};
function save() { try { localStorage.setItem('mvu13', JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem('mvu13')); if (s && s.digits) Object.assign(S, s); } catch (e) {} S.hint = false; }

/* ───────── оценка ───────── */
function autoMark(topics, ok) { (Array.isArray(topics) ? topics : [topics]).forEach(t => { const a = S.auto[t] || (S.auto[t] = { ok: 0, n: 0 }); a.n++; if (ok) a.ok++; }); save(); MW.refresh(); }
function oralMark(key, topics, v) { S.oral[key] = { topics, v }; save(); MW.refresh(); }
// одинаковые по названию темы в разных частях/блоках получают балл друг от друга (решение Анны 13.11)
const TNAME = {}, SAME = {};
const CANON = n => (D.alias && D.alias[n]) || n;   // разные названия одной темы в разных учебниках (сверка 20.11)
D.checklist.forEach((P, pi) => P.blocks.forEach((b, bi) => b[1].forEach((n, ti) => { const id = `p${pi + 1}b${bi + 1}t${ti + 1}`; TNAME[id] = CANON(n); (SAME[CANON(n)] = SAME[CANON(n)] || []).push(id); })));
// src: manual — учитель поставил в таблице; auto — посчитано; from — откуда (задание / устно / таблица в другой части)
function topicScore(t) {
  if (t in S.override) return { v: S.override[t], src: 'manual', from: [] };
  const vals = [], from = new Set();
  (SAME[TNAME[t]] || [t]).forEach(id => {
    if (id !== t && id in S.override) { vals.push(S.override[id]); from.add('из другой части'); return; }
    const a = S.auto[id]; if (a && a.n) { vals.push(a.ok === a.n ? 2 : a.ok * 2 >= a.n ? 1 : 0); from.add(id === t ? 'из задания' : 'из другой части'); }
    for (const k in S.oral) if (S.oral[k].topics.includes(id)) { vals.push(S.oral[k].v); from.add(id === t ? 'устно' : 'из другой части'); }
  });
  if (!vals.length) return { v: null, src: '', from: [] };
  return { v: Math.round(vals.reduce((x, y) => x + y, 0) / vals.length), src: 'auto', from: [...from] };
}

/* ───────── экраны ───────── */
const SCREENS = []; // {id, part, render(el), topics:[], oral:[{key,label,topics,expect}], title, kind}
let cur = 0, history = [];
function addScreen(s) { s.idx = SCREENS.length; SCREENS.push(s); return s; }
function show(i, push = true) {
  if (push && cur !== i) history.push(cur);
  cur = i; const s = SCREENS[i];
  const box = $('#screens'); box.innerHTML = '';
  const node = el('div', { cls: 'screen on ' + (s.cls || '') });
  window.onresize = null;
  box.append(node); s.render(node);
  $('#parts').style.display = (s.part || s.final) ? 'flex' : 'none';
  [...$('#parts').children].forEach((b, k) => b.classList.toggle('cur', k + 1 === s.part));
  const showTray = s.part && !s.final && (s.cls === 'room' || /^(note|check|intro)/.test(s.id));
  $('#env').style.display = showTray ? 'flex' : 'none';
  $('#nextBtn').style.display = s.noNext ? 'none' : '';
  $('#nextBtn').disabled = false;
  renderEnv(); MW.refresh();
}
function cardStep(s, label) {
  s.ci = s.ci || 0; const many = s.cards.length > 1;
  const c = el('div', { cls: 'card', style: 'position:relative;z-index:2;cursor:pointer;min-width:40vw' }, el('div', { cls: 'lbl' }, label + (many ? ` · ${s.ci + 1} / ${s.cards.length}` : '')), el('div', { cls: 'qq' }, s.cards[s.ci]), null);
  c.onclick = () => next();

// отчёт по шаблону Анны (19.11): знает / знаком / пока не знает + рекомендованная программа
function report() {
  const RU = D.topic_ru || {};

  const by = { 2: [], 1: [], 0: [] }, seen = new Set();
  const blocks = [];
  D.checklist.forEach((P, pi) => P.blocks.forEach((b, bi) => {

  }));
  // программа: блоки «PR N Unit a-b» по порядку программ; рекомендуем первый, где меньше 9 из 12
  const key = b => { const m = b.name.match(/PR\s*(\d+)\s*Unit\s*(\d+)/i); return m ? [+m[1], +m[2]] : [99, 0]; };
  const ordered = blocks.slice().sort((x, y) => { const a = key(x), c = key(y); return a[0] - c[0] || a[1] - c[1]; });
  const first = ordered.find(b => b.sum < 9);
  const pretty = b => { const m = b.name.match(/PR\s*(\d+)\s*Unit\s*(\d+)\s*[-–]\s*(\d+)/i); return m ? `Prepare ${m[1]}, Units ${m[2]}–${m[3]}` : b.name; };

  const who = [(st.name || '').trim(), age ? (/^\d+$/.test(age) ? `${age} ${yrs(age)}` : age) : ''].filter(Boolean).join(', ');
  const lines = [
    ...(who ? [`${f ? 'Ученица' : 'Ученик'}: ${who}.`] : []),
    `Уверенно знает темы: ${list(by[2])}. ${f ? 'Знакома' : 'Знаком'} с темами: ${list(by[1])}. Пока не знает: ${list(by[0])}.`,

    WHERE = {};
    SCREENS.forEach(s => {
      if (!s.obj) return;
      const ts = [];
      if (s.task) (s.task.items || []).forEach(i => { (i.t || []).forEach(x => ts.push(x)); (i.gaps || []).forEach(g => g.forEach(x => ts.push(x))); });
      (s.oral || []).forEach(o => (o.topics || []).forEach(x => ts.push(x)));
      ts.forEach(x => { const c = CANON(TNAME[x]); const L = WHERE[c] = WHERE[c] || []; if (!L.some(e => e.id === s.obj.id)) L.push({ id: s.obj.id, part: s.part, name: s.obj.name.split(' (')[0].replace(/^(a|an) /, '') }); });
    });
  }
  return WHERE[CANON(TNAME[id])] || [];
}

/* ───────── загрузка ───────── */
const IMGCACHE = [];
function preload(urls, done) { let k = 0; if (!urls.length) return done(); urls.forEach(u => { const i = new Image(); IMGCACHE.push(i); const fin = () => { k++; $('#lbar').style.width = (k / urls.length * 100) + '%'; if (k === urls.length) done(); }; i.onload = () => (i.decode ? i.decode().catch(() => {}) : Promise.resolve()).then(fin); i.onerror = fin; i.src = u; }); }
load();
document.fonts && document.fonts.load('700 40px Caveat');
preload(D.preload.map(img), async () => {
  try { await Promise.race([document.fonts.load('700 200px Caveat'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  [1, 2, 3].forEach(makeNote);
  buildScreens(); show(0, false);
  $('#loader').style.display = 'none';
});
</script>
