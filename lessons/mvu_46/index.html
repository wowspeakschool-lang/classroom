<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wow Dragon — Treasure Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2a1a3a;--pur:#7b4bd6;--pur2:#a77cf0;--gold:#ffc93c;--ok:#3fbf6a;--bad:#e25555;--panel:rgba(255,255,255,.92)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#1c1230;color:var(--ink);font-family:'Baloo 2',Arial,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,calc(100vh*16/9));height:min(100vh,calc(100vw*9/16));overflow:hidden;border-radius:8px;background:#000;font-size:min(2.2vh,1.24vw)}
.screen{position:absolute;inset:0}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dim{position:absolute;inset:0;background:rgba(30,15,60,.35)}
.it{position:absolute;transform:translate(-50%,-100%);cursor:pointer;transition:transform .25s}
.it img{height:100%;width:auto;display:block;pointer-events:none}
.it.glow img{animation:glow 2s ease-in-out infinite}
.it:hover{transform:translate(-50%,-100%) scale(1.08)}
.it.off{pointer-events:none}
.it.flip img{transform:scaleX(-1)}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 .2em rgba(255,230,120,.4))}50%{filter:drop-shadow(0 0 1.1em rgba(255,230,120,1)) brightness(1.08)}}
.pulse{animation:pulse .7s ease-in-out 3}
@keyframes pulse{50%{transform:translate(-50%,-106%)}}
.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:translate(-50%,-100%) rotate(0)}25%{transform:translate(-50%,-100%) rotate(-6deg)}75%{transform:translate(-50%,-100%) rotate(6deg)}}
.bounce{animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translate(-50%,-102.5%)}}
.sway{transform-origin:50% 100%;animation:sway 3s ease-in-out infinite}
@keyframes sway{0%,100%{transform:translate(-50%,-100%) rotate(-2.5deg)}50%{transform:translate(-50%,-101.5%) rotate(2.5deg)}}
.breathe{transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translate(-50%,-100%) scale(1.02,.985)}}
.walkbob{transform-origin:50% 100%;animation:walkbob .5s ease-in-out infinite}
@keyframes walkbob{0%,100%{transform:translate(-50%,-100%) rotate(-3deg)}50%{transform:translate(-50%,-104%) rotate(3deg)}}
.it img{transition:opacity .2s ease}
.flyer{position:absolute;z-index:3;pointer-events:none;animation:across 11s linear infinite}
@keyframes across{0%{left:-12%}100%{left:108%}}
.flyer img{height:100%;display:block;transform:scaleX(-1);animation:flap 1.6s ease-in-out infinite}
.flyer.right img{animation-name:flapr}
@keyframes flapr{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-35%) rotate(4deg)}}
@keyframes flap{0%,100%{transform:scaleX(-1) translateY(0) rotate(-4deg)}50%{transform:scaleX(-1) translateY(-35%) rotate(4deg)}}
.float{animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translate(-50%,-106%) rotate(4deg)}}
.title{position:absolute;left:50%;top:2.5%;transform:translateX(-50%);font-weight:800;font-size:2.3em;color:#fff;white-space:normal;max-width:62%;text-align:center;line-height:1.1;z-index:30;pointer-events:none;-webkit-text-stroke:.16em #4f2a9a;paint-order:stroke fill;text-shadow:0 .12em .25em rgba(0,0,0,.35);letter-spacing:.01em}
.big{font-size:4.2em;font-weight:800;color:#fff;text-shadow:0 .08em .2em rgba(0,0,0,.5)}
.btn{background:linear-gradient(180deg,#ffe07a,var(--gold));color:var(--ink);border:0;border-radius:1em;padding:.35em 1.1em;font-size:1.6em;font-weight:800;box-shadow:0 .2em 0 #c98d00}
.btn:active{transform:translateY(.1em);box-shadow:0 .1em 0 #c98d00}
.btn.pur{background:linear-gradient(180deg,var(--pur2),var(--pur));color:#fff;box-shadow:0 .2em 0 #4f2a9a}
.btn.ghost{background:rgba(255,255,255,.85);box-shadow:none;border:2px solid var(--pur2)}
.ctr{position:absolute;left:50%;transform:translateX(-50%);z-index:30;display:flex;gap:.8em;align-items:center}
/* верх и низ */
#topbar{position:absolute;right:1%;top:1.5%;z-index:60;display:flex;gap:.5em}
.tb{background:linear-gradient(180deg,#ffe07a,var(--gold));border:0;border-radius:.8em;padding:.15em .6em;font-size:1.7em}
#nav{position:absolute;right:1%;bottom:2%;z-index:60;display:flex;gap:.5em}
#nav .btn{font-size:1.5em}
#mapBtn{position:absolute;left:1%;bottom:2%;z-index:60;display:none}
#skipBtn{position:absolute;left:11%;bottom:2.4%;z-index:60;display:none;font-size:1.05em;padding:.25em .8em;opacity:.8}
#keys{position:absolute;left:1%;top:1.5%;z-index:60;display:flex;gap:.35em;background:rgba(255,255,255,.85);border-radius:1em;padding:.25em .5em}
#keys span{width:4.4em;height:3em;display:flex;align-items:center;justify-content:center;border-radius:.6em;border:2px dashed #c9b6ea}
#keys span img{width:100%;height:100%;object-fit:contain}
#keys span.got{border:2px solid transparent;animation:pop .5s}
@keyframes pop{50%{transform:scale(1.4)}}
/* карта */
.place{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:0;background:transparent}
.place.lit{box-shadow:0 0 0 .25em rgba(255,255,255,.0);animation:ring 2s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 .3em rgba(255,215,90,.9),0 0 2em rgba(255,215,90,.8)}}
.place .ok{position:absolute;right:12%;top:16%;z-index:2;width:2.2em;height:2.2em;border-radius:50%;background:var(--ok);color:#fff;font-weight:800;font-size:1.4em;display:flex;align-items:center;justify-content:center;box-shadow:0 .1em .3em rgba(0,0,0,.4)}
.place .pi{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.place .vk{position:absolute;right:18%;top:2%;width:45%;filter:drop-shadow(0 .2em .3em rgba(0,0,0,.4))}
.walker{position:absolute;transform:translate(-50%,-100%);z-index:20;pointer-events:none}
.walker img{height:100%;display:block}
/* окна-поверх */
.ov{position:absolute;inset:0;background:rgba(20,10,40,.55);z-index:40;display:flex;align-items:center;justify-content:center}
.card{background:var(--panel);border-radius:1.4em;padding:1em 1.6em;text-align:center;box-shadow:0 .5em 2em rgba(0,0,0,.4)}
.bag{position:absolute;left:1.5%;bottom:2%;z-index:25;width:15%;}
.bag img{width:100%;display:block}
.bagn{position:absolute;right:-.4em;top:-.4em;background:var(--pur);color:#fff;border-radius:1em;font-weight:800;padding:0 .5em;font-size:1.6em}
.fly{position:absolute;z-index:50;transition:all .8s ease-in-out;pointer-events:none}
.fly img{height:100%;display:block}
.row{display:flex;gap:1.6em;align-items:flex-end;justify-content:center}
.row img{height:12em;max-width:12em;object-fit:contain}
.slot{width:12em;height:12em;display:flex;align-items:flex-end;justify-content:center;transition:opacity .3s}
.curtain{position:absolute;inset:0;background:var(--pur);border-radius:1.4em;display:flex;align-items:center;justify-content:center;color:#fff;font-size:3em;font-weight:800}
.rope{position:absolute;width:.25em;background:#8a5a2b;transform-origin:top;z-index:21;transition:height 1s}
.porthole{position:relative;height:72%;aspect-ratio:1}
.porthole>img.pf{width:100%;height:100%}
.porthole .in{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);max-height:32%;max-width:50%}
.count{font-size:12em;font-weight:800;color:#fff;text-shadow:0 .05em .2em rgba(0,0,0,.6);cursor:pointer;user-select:none}
#fx{position:absolute;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}
#loader{position:fixed;inset:0;background:#1c1230;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;z-index:99;font-size:22px}
#loader .b{width:40vw;height:12px;background:#3b2a5c;border-radius:6px;overflow:hidden}#loader i{display:block;height:100%;width:0;background:var(--gold)}
.hl{outline:.25em solid var(--gold);border-radius:1em}
</style>
</head>
<body>
<div id="loader"><div>Loading…</div><div class="b"><i id="lbar"></i></div></div>
<div id="app"><div id="stage">
  <div id="screens"></div>
  <div id="keys"></div>
  <div id="topbar"><button class="tb" id="checkBtn" title="Чек-лист (для преподавателя)">✅</button><button class="tb" id="planBtn" title="План урока (для преподавателя)">📋</button></div>
  <button class="btn ghost" id="mapBtn">🗺 Map</button><button class="btn ghost" id="skipBtn" title="Пропустить задание и получить ключ">⏭ Skip</button>
  <div id="nav"><button class="btn ghost" id="restartBtn" title="Начать урок заново">↻</button><button class="btn ghost" id="backBtn">←</button><button class="btn" id="nextBtn">Next ➜</button></div>
  <canvas id="fx"></canvas>
</div></div>

 ["travel"]}], "key_yellow": [{"q": "Hooray! We have all the keys! Where did we find them?", "a": "In the house, in the park, in the forest, in space.", "topics": []}], "jungle": [{"q": "Which key? What colour is it? (ребёнок называет цвет — нажмите на этот ключ)", "a": "The red key!", "topics": []}, {"q": "What is it?", "a": "It’s a book!", "topics": []}], "bye": [{"q": "Did you like it? What did you like? (по-русски: что понравилось, что нет, чего не хватило)", "a": "—", "topics": []}]}, "screen_ru": {"hello": "Привет", "dragon": "Дракоша", "map": "Карта", "room": "Дом: собираем рюкзак", "teddy": "Дом: где мишка?", "missing": "Дом: что пропало?", "key_red": "Красный ключ", "forest": "Лес", "bushes": "Лес: кто в кустах?", "riddle": "Лес: загадка и дерево", "key_blue": "Голубой ключ", "park": "Парк", "says": "Парк: Дракоша говорит", "feed": "Парк: покорми бабушку", "key_green": "Зелёный ключ", "launch": "Космос: отсчёт", "space": "Космос: планеты", "key_yellow": "Жёлтый ключ", "jungle": "Джунгли: сундук", "bye": "Финал"}, "note": {"feed": "Еду урок считает сам: верно с первого раза — балл, иначе — нет. Кнопка 🔊 повторяет фразу.", "map": "Порядок: дом → парк → лес → космос → джунгли. Светится следующее место, пройденные — с галочкой. Next ведёт туда сам.", "space": "Слабым: посчитать звёзды или планеты и нажать «⏭ Skip» — ключ выдастся сразу.", "jungle": "Если ключей меньше четырёх, сундук не откроется — вернитесь на карту."}, "preload": ["bg/forest", "bg/jungle", "bg/launch", "bg/map", "bg/park", "bg/room", "bg/space", "hero/dragon_astro_float", "hero/dragon_astro_wave", "hero/dragon_book", "hero/dragon_clap", "hero/dragon_dance", "hero/dragon_fly", "hero/dragon_jump", "hero/dragon_jumpkey", "hero/dragon_point", "hero/dragon_run", "hero/dragon_sad", "hero/dragon_swim", "hero/dragon_think", "hero/dragon_walk1", "hero/dragon_wave1", "hero/dragon_wave2", "hero/granny_cry", "hero/granny_eat", "hero/granny_eat_apple", "hero/granny_eat_banana", "hero/granny_eat_broccoli", ;font-style:italic}\n.oral .tp{color:#7b4bd6;font-size:12px}\n.mk button{border:1px solid #bbb;background:#fafafa;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer;margin-left:3px}\n.mk button.on2{background:#3fbf6a;color:#fff;border-color:#3fbf6a}.mk button.on1{background:#ffc93c;border-color:#ffc93c}.mk button.on0{background:#e25555;color:#fff;border-color:#e25555}\n.mk button.f2{background:#c9efd5;border-color:#3fbf6a}.mk button.f1{background:#fde7b8;border-color:#ffc93c}.mk button.f0{background:#f7c9c9;border-color:#e25555}\n.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}\ntable{border-collapse:collapse;width:100%;background:#fff;table-layout:fixed}\nth,td{border:1px solid #d8cbee;padding:4px 8px;vertical-align:middle}\nth{background:#7b4bd6;color:#fff;text-align:left}th:last-child{width:190px}\ntr.cur td{background:#fff3cf}\n.auto{font-size:11px;color:#8a7a99;margin-left:4px}\nbutton.go{margin-left:6px;border:1px solid #e0d3f3;background:#f8f4ff;color:#6a4aa6;border-radius:10px;padding:1px 8px;font-size:12px;cursor:pointer}\n.sum{font-weight:700}.pass{color:#1f7a3a}.fail{color:#b03030}\nh2{margin:14px 0 4px;color:#4f2a9a;font-size:17px}\n.legend{background:#fffaf0;border-left:4px solid #ffc93c;padding:8px 12px;margin:8px 0;font-size:13px}\ntextarea{width:100%;height:170px;font-family:Consolas,monospace;font-size:13px}\n#cm{height:60px;font-family:inherit;font-size:14px}\n.act button{background:#7b4bd6;color:#fff;border:0;border-radius:8px;padding:7px 14px;font-weight:700;cursor:pointer;margin-right:8px}\n.act button.gray{background:#888}\n<\/style><\/head><body>\n<header>\n  <b>✅ Чек-лист · Wow Dragon 4–6<\/b>\n  <label>Имя ученика <input id=\"nm\" placeholder=\"Имя по-русски\"><\/label>\n  <label>Пол <select id=\"gd\"><option value=\"m\">мальчик<\/option><option value=\"f\">девочка<\/option><\/select><\/label>\n  <label>Возраст <input id=\"ag\" size=\"3\"><\/label>\n<\/header>\n<main>\n  <div class=\"now\" id=\"now\"><\/div>\n  <div class=\"legend\"><b>0 · 1 · 2.<\/b> 2 — сам и верно (словом или фразой); 1 — после подсказки, с ошибкой, исправил себя; 0 — не смог и с подсказкой, ответил по-русски, не понял.\n  Устные ответы оцениваете вы — в рамке «Сейчас на экране». Еду в игре «Покорми бабушку» урок считает сам. <b>Бледная<\/b> кнопка в таблице — посчитанный балл, <b>яркая<\/b> — ваш; нажатие в таблице заменяет посчитанный, повторное — снимает.\n  Метка 🔎 у темы открывает в уроке место, где эту тему проверяют. Модуль пройден, если в нём <b>4 из 6<\/b> или больше; отчёт рекомендует первый непройденный модуль.<\/div>\n  <div class=\"grid\" id=\"tables\"><\/div>\n  <h2 id=\"repH\">Отчёт<\/h2><div class=\"legend\">Отчёт собирается сам. Его можно править прямо здесь — удалить лишнее, дописать своё. После правки он больше не обновляется сам; «↺ Собрать отчёт заново» вернёт автоматический.<\/div>\n  <label><b>Комментарий преподавателя<\/b> (попадёт в отчёт)<textarea id=\"cm\" placeholder=\"Например: стеснялся, но всё понимал; любит животных.\"><\/textarea><\/label>\n  <textarea id=\"rep\"><\/textarea>\n  <div class=\"act\"><button id=\"cp\">📋 Скопировать отчёт<\/button><button class=\"gray\" id=\"rb\">↺ Собрать отчёт заново<\/button><button class=\"gray\" id=\"rs\">Новый ученик (сбросить всё)<\/button><\/div>\n<\/main>\n<script>\nconst A = window.APP;\nfunction $(s){return document.querySelector(s)}\nconst st=A.S.student; $('#nm').value=st.name; $('#gd').value=st.gender; $('#ag').value=st.age;\n$('#nm').oninput=e=>{st.name=e.target.value;A.save();render()}; $('#gd').onchange=e=>{st.gender=e.target.value;A.save();render()}; $('#ag').oninput=e=>{st.age=e.target.value;A.save();render()};\n$('#cm').value=A.S.comment||'';$('#cm').oninput=e=>{A.S.comment=e.target.value;A.save();if(A.S.repEdit==null)$('#rep').value=A.report()};\n$('#rep').oninput=e=>{A.S.repEdit=e.target.value;A.save()};\n$('#rb').onclick=()=>{if(A.S.repEdit==null||confirm('Ваши правки в отчёте пропадут. Собрать заново?')){A.S.repEdit=null;A.save();$('#rep').value=A.report()}};\nwindow.goReport=()=>{$('#repH').scrollIntoView({behavior:'smooth'});$('#cm').focus()};\n$('#cp').onclick=()=>{const ok=()=>{$('#cp').textContent='✔ Скопировано';setTimeout(()=>$('#cp').textContent='📋 Скопировать отчёт',1500)};const old=()=>{const r=$('#rep');r.focus();r.select();try{document.execCommand('copy');ok()}catch(e){alert('Не получилось скопировать — выделите текст отчёта и нажмите Ctrl+C')}};if(navigator.clipboard)navigator.clipboard.writeText($('#rep').value).then(ok,old);else old()};\n$('#rs').onclick=()=>{if(confirm('Сбросить все баллы и начать с новым учеником? Урок начнётся сначала, это окно закроется — откройте чек-лист снова кнопкой ✅.'))A.reset()};\nfunction mk(cur,fn,faint){const d=document.createElement('span');d.className='mk';[2,1,0].forEach(v=>{const b=document.createElement('button');b.textContent=v===2?'✓ 2':v===1?'~ 1':'✗ 0';if(cur===v)b.className='on'+v;else if(faint===v)b.className='f'+v;b.onclick=()=>fn(cur===v?null:v);d.append(b)});return d}\nfunction dyn(t){const S=A.S;return t.replace('{teddy}',S.teddyAt||'…').replace('{missing}',(S.missing||'…').replace('obj/','').replace('schoolbook','book').replace('tshirt','T-shirt')).replace('{says}',S.says||'…').replace('{stars}',S.stars)}\nfunction render(){\n  const S=A.S,D=A.D,s=A.screen();\n  const ps=(s&&D.prompts[s.id])||[];\n  const now=$('#now');now.innerHTML='';const h=document.createElement('h3');h.textContent='Сейчас на экране: '+(s?(D.screen_ru[s.id]||s.id):'—');now.append(h);\n  const curT=new Set();\n  ps.forEach((o,k)=>{const key=s.id+':'+k;(o.topics||[]).forEach(t=>curT.add(t));const r=document.createElement('div');r.className='oral';const l=document.createElement('div');l.className='lab';l.innerHTML=dyn(o.q)+(o.a?' <span class=\"exp\">→ '+dyn(o.a)+'<\/span>':'')+((o.topics||[]).length?' <span class=\"tp\">('+o.topics.map(t=>D.topic_ru[t]).join(', ')+')<\/span>':'');r.append(l);\n    if((o.topics||[]).length){const cur=S.oral[key]?S.oral[key].v:null;r.append(mk(cur,v=>{A.oralMark(key,o.topics,v);render()}))}else{const i=document.createElement('i');i.textContent='без балла';r.append(i)}now.append(r)});\n  if(s&&D.note[s.id]){const p=document.createElement('div');p.style.color='#6a5a80';p.textContent=D.note[s.id];now.append(p)}\n  const box=$('#tables');box.innerHTML='';\n  D.checklist.forEach(m=>{const t=document.createElement('table');const th=document.createElement('tr');th.innerHTML='<th>'+m.title+'<\/th><th>балл<\/th>';t.append(th);let sum=0,filled=0;\n    m.topics.forEach(([id,name])=>{const sc=A.topicScore(id);if(sc.v!==null){sum+=sc.v;filled++}\n      const tr=document.createElement('tr');if(curT.has(id))tr.className='cur';const td=document.createElement('td');td.textContent=name;\n      A.where(id).forEach(w=>{const b=document.createElement('button');b.className='go';b.title='Открыть это место в уроке';b.textContent='🔎 '+w.name;b.onclick=()=>A.go(w.id);td.append(b)});\n      const td2=document.createElement('td');td2.append(mk(S.override[id]!==undefined?S.override[id]:null,v=>A.setOverride(id,v),sc.src==='auto'?sc.v:null));const a=document.createElement('span');a.className='auto';a.textContent=sc.src==='auto'?sc.from.join(' + '):'';td2.append(a);\n      tr.append(td,td2);t.append(tr)});\n    const tf=document.createElement('tr');tf.innerHTML='<td class=\"sum\">Сумма модуля<\/td><td class=\"sum '+(filled===3?(sum>=D.pass?'pass':'fail'):'')+'\">'+(filled?sum+' из 6 '+(sum>=D.pass?'✔':'')+(filled<3?' <span class=\"auto\">(оценено '+filled+' из 3)<\/span>':''):'—')+'<\/td>';t.append(tf);box.append(t)});\n  if(A.S.repEdit==null)$('#rep').value=A.report();else if(document.activeElement!==$('#rep'))$('#rep').value=A.S.repEdit;\n  const sid=s?s.id:'';if(sid!==window._last){window._last=sid;const r=box.querySelector('tr.cur');if(r&&document.activeElement!==$('#cm'))r.scrollIntoView({block:'center',behavior:'smooth'})}\n}\nwindow.render=render;render();\n<\/script><\/body><\/html>\n", "plan_html": "<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>План урока — Wow Dragon 4–6<\/title><style>body{font-family:'Segoe UI',Arial,sans-serif;background:#f4effb;color:#2a1a3a;padding:18px 22px;max-width:1200px;margin:0 auto;font-size:14px}table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #d8cbee;padding:5px 8px;vertical-align:top}th{background:#7b4bd6;color:#fff;text-align:left}.dl a{display:inline-block;margin:0 8px 10px 0;padding:8px 16px;border-radius:10px;background:#7b4bd6;color:#fff;font-weight:700;text-decoration:none}.dl a.pdf{background:#e8631a}.must{background:#fff0ee;border:3px solid #d32f2f;border-radius:12px;padding:8px 18px 6px;margin:10px 0 16px}.must h2{margin:4px 0 8px;color:#c62828;font-size:18px}.must p{margin:6px 0;line-height:1.45}.ru{color:#555;font-style:normal}table.plan td.st{font-weight:700;white-space:nowrap}table.plan td.tl{color:#5a2d9a;font-style:italic;width:28%}table.plan td.sa{color:#1f5fa8;width:18%}table.plan tr.part td{background:#4f2a9a;color:#ffe07a;font-weight:700}<\/style><\/head><body><h1 style=\"color:#4f2a9a;margin:4px 0 10px\">🐉 План урока: Wow Dragon — Treasure Quest (вводный урок 4–6)<\/h1><p class=\"dl\"><a href=\"https://classroom.wowteach.ru/lessons/mvu_46/plans/mvu_46_plan.docx\" download>⬇ Скачать план (Word)<\/a><a class=\"pdf\" href=\"https://classroom.wowteach.ru/lessons/mvu_46/plans/mvu_46_plan.pdf\" download>⬇ Скачать план (PDF)<\/a><\/p><div class=\"must\"><h2>❗ Как работать с уроком — прочитайте обязательно<\/h2><p><b>Окна.<\/b> Вверху урока две кнопки: ✅ открывает чек-лист, 📋 — этот план. Оба открываются отдельными окнами: держите их у себя, ученику показывайте только экран урока (демонстрация экрана со звуком). В чек-листе сразу впишите имя, пол и возраст — они попадут в отчёт.<\/p><p><b>Как идёт урок.<\/b> Дракоша нашёл карту сокровищ. Идём по местам строго по порядку: дом → парк → лес → космос → джунгли. На карте светится то место, куда идти сейчас. В каждом месте ребёнок отвечает на вопросы и играет, а в конце получает ключ. Ключи собираются в связку вверху слева, четыре ключа открывают сундук в джунглях.<\/p><p><b>Кнопка Next.<\/b> Ведите урок кнопкой Next — она делает следующий шаг в сцене: Дракоша грустит и радуется, предмет летит в рюкзак, мишка перепрыгивает, ключ улетает в связку, открывается планета. Так ничего не пропустится. Нажимать на сами предметы тоже можно. В плане ниже у каждого шага написано, что делает Next.<\/p><p><b>Кнопка Skip.<\/b> Маленькая кнопка «⏭ Skip» внизу слева есть там, где ключ выдаётся только после задания: бабушка в парке, загадка в лесу, отсчёт и планеты в космосе. Если ребёнку трудно, нажмите её — ключ выдастся сразу, урок пойдёт дальше.<\/p><p><b>Слабый ученик.<\/b> Если ребёнок совсем ничего не знает, не мучаем: проходим ту же историю в обучающем формате — вместо вопросов цвета, числа, названия мест. Переключиться можно в любой момент. Сокровище находим всегда; в космосе слабые считают звёзды или планеты, дальше — «⏭ Skip».<\/p><p><b>Баллы.<\/b> Устные ответы оцениваете вы: вверху чек-листа есть рамка «Сейчас на экране» — в ней вопрос, ожидаемый ответ и кнопки 0 / 1 / 2. Еду в игре «Покорми бабушку» урок считает сам. Любой балл можно поменять прямо в таблице — ваш заменит посчитанный.<\/p><p><b>Метки 🔎.<\/b> У каждой темы в чек-листе стоит метка 🔎 с местом, где её проверяют. Нажатие сразу открывает это место в уроке — удобно, если какую-то тему пропустили.<\/p><p><b>Отчёт.<\/b> Отчёт — внизу окна ✅: что ребёнок знает уверенно, с чем знаком, чего пока не знает и какой модуль ему рекомендуется (модуль пройден при 4 из 6 баллов и больше). Отчёт можно править прямо в окне, потом нажмите «Скопировать отчёт». Обязательно позовите родителя.<\/p><p><b>Если ребёнок не понимает английский.<\/b> Историю и инструкции можно говорить по-русски — русский вариант стоит в колонке «Teacher’s language» под английским.<\/p><\/div><table class=\"plan\"><tr><th>Шаг<\/th><th>Что делать<\/th><th>Teacher’s language<\/th><th>Ожидаемые ответы<\/th><\/tr><tr><td class=\"st\">1. Привет<\/td><td>Представьтесь, спросите имя. Скажите, что это игра и оценок нет; если ребёнок чего-то не знает, можно сказать «I don’t know». Узнайте, с чего он занимается: телефон, планшет, компьютер.<\/td><td class=\"tl\">Hi! My name is … Today we have an adventure! What’s your name?<br><span class=\"ru\">Привет! Меня зовут … Сегодня у нас урок-приключение! Как тебя зовут?<\/span><\/td><td class=\"sa\">I’m Masha.<\/td><\/tr><tr><td class=\"st\">2. Дракоша<\/td><td>Познакомьте с Дракошей, не забывайте TPR: показывайте «happy» и «sad» лицом. <b>Next:<\/b> Дракоша грустит → снова радуется → карта в руке подпрыгивает → дальше.<\/td><td class=\"tl\">Look! This is Wow Dragon. Is he happy or sad? Are you happy?<br><span class=\"ru\">Это Волшебный Дракоша. Он весёлый или грустный? А ты?<\/span><\/td><td class=\"sa\">He’s happy. I’m happy.<\/td><\/tr><tr><td class=\"st\">3. История<\/td><td>Расскажите историю. Для сильных — спросите, что у Дракоши в руках.<\/td><td class=\"tl\">Dragons guard treasure. Repeat: treasure! Dragon found an old treasure map. Let’s find four keys and open the treasure chest!<br><span class=\"ru\">Драконы охраняют сокровища. Повтори: treasure! Дракоша нашёл старую карту сокровищ. Найдём четыре ключа и откроем сундук!<\/span><\/td><td class=\"sa\">It’s a map. Treasure!<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🗺 КАРТА — порядок мест: дом → парк → лес → космос → джунгли<\/td><\/tr><tr><td class=\"st\">Карта<\/td><td>Дракоша стоит в углу карты. Следующее место светится — туда и идём. Пройденные места отмечены галочкой и ключом. <b>Next:<\/b> Дракоша идёт в светящееся место. Кнопка «🗺 Map» внизу слева в любой момент возвращает на карту.<\/td><td class=\"tl\">Look! What is it? Is it a house or a park? Where do you live? Let’s go!<br><span class=\"ru\">Что это? Дом или парк? А ты где живёшь? Пойдём!<\/span><\/td><td class=\"sa\">It’s a house. / It’s a park.<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🏠 1. ДОМ — красный ключ<\/td><\/tr><tr><td class=\"st\">Собираем рюкзак<\/td><td>Предметы светятся. Ребёнок называет предмет — он улетает в рюкзак Дракоши. Спрашивайте и про комнату, и про то, что в рюкзаке. <b>Next:<\/b> следующий предмет летит в рюкзак.<\/td><td class=\"tl\">What room is it? What is it? Is it a car or a plane? What do you have in your bag? Let’s say: I have a car!<br><span class=\"ru\">Что это за комната? Что это? Машинка или самолёт? Что у тебя в рюкзаке? Скажи: I have a car!<\/span><\/td><td class=\"sa\">It’s a bedroom. It’s a car. I have a ball.<\/td><\/tr><tr><td class=\"st\">Где мишка?<\/td><td>Мишка сидит в разных местах: на кровати, под столом, в коробке, у шкафа, на стуле. <b>Next:<\/b> мишка перепрыгивает на новое место.<\/td><td class=\"tl\">Where’s the teddy? Is it on the bed or under the bed?<br><span class=\"ru\">Где мишка? На кровати или под кроватью?<\/span><\/td><td class=\"sa\">It’s on the bed. It’s under the table.<\/td><\/tr><tr><td class=\"st\">Что пропало?<\/td><td>Пять вещей из рюкзака. <b>Next:<\/b> закрыть глаза — одна вещь пропадает; ещё Next — показать ответ. Два раунда.<\/td><td class=\"tl\">Close your eyes! … Open! What’s missing?<br><span class=\"ru\">Закрой глазки! … Открой! Чего не хватает?<\/span><\/td><td class=\"sa\">The ball!<\/td><\/tr><tr><td class=\"st\">Ключ<\/td><td><b>Next:<\/b> ключ улетает в связку вверху; ещё Next — на карту.<\/td><td class=\"tl\">You did it! It’s a key! What colour is the key?<br><span class=\"ru\">Молодец! Это ключ! Какого он цвета?<\/span><\/td><td class=\"sa\">It’s red.<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🌸 2. ПАРК — зелёный ключ<\/td><\/tr><tr><td class=\"st\">Парк<\/td><td>Бабушка Дракоши на лавочке, вокруг дети, по небу летит птица. <b>Next:<\/b> герои по очереди подпрыгивают — спрашивайте про каждого.<\/td><td class=\"tl\">Who’s this? Is it Granny? What is it? Is it a bird? Can it fly? Can it swim? What can you do? What is he doing?<br><span class=\"ru\">Кто это? Бабушка? Что это? Птица? Она умеет летать? А плавать? Что умеешь ты? Что он делает?<\/span><\/td><td class=\"sa\">It’s Granny. It can fly. I can run. He’s running.<\/td><\/tr><tr><td class=\"st\">Дракоша говорит<\/td><td>Игра на движение: вы говорите команду, ребёнок выполняет и говорит «I can jump!». <b>Next:<\/b> следующее движение (прыгать, плавать, летать, бегать, танцевать, хлопать).<\/td><td class=\"tl\">Dragon says: jump! Can you jump?<br><span class=\"ru\">Дракоша говорит: прыгай! Ты умеешь прыгать?<\/span><\/td><td class=\"sa\">I can jump!<\/td><\/tr><tr><td class=\"st\">Покорми бабушку<\/td><td>Бабушка голодная и плачет. Четыре раунда: бабушка говорит, что любит, ребёнок показывает еду. Верно — еда летит на тарелку и бабушка её ест; неверно — бабушка морщится. Баллы за еду игра ставит сама. <b>Next:<\/b> послушать фразу; ребёнок показывает; ещё Next — бабушка получает верную еду. Кнопка «⏭ Skip» внизу слева — сразу к ключу.<\/td><td class=\"tl\">Granny is hungry! Listen! What does Granny like? What do you like? What does your mum like?<br><span class=\"ru\">Бабушка голодная! Послушай! Что любит бабушка? А ты что любишь? А что любит мама?<\/span><\/td><td class=\"sa\">She likes fish. I like pizza. My mum likes cake.<\/td><\/tr><tr><td class=\"st\">Ключ<\/td><td><b>Next:<\/b> ключ в связку; ещё Next — на карту.<\/td><td class=\"tl\">Thank you! Here is a key! What colour is the key?<br><span class=\"ru\">Спасибо! Вот ключ! Какого он цвета?<\/span><\/td><td class=\"sa\">It’s green.<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🌳 3. ЛЕС — голубой ключ<\/td><\/tr><tr><td class=\"st\">Лес<\/td><td>Звери поодиночке и парами. Спрашивайте, кто это, где живёт и где сидит. Медведь вдали — для «that», котята впереди — для «these». <b>Next:<\/b> звери по очереди подпрыгивают.<\/td><td class=\"tl\">What is it: jungle or forest? What is it? Is it a cat? What are they? Are they cats? Where is the owl? What’s this? What’s that?<br><span class=\"ru\">Это джунгли или лес? Что это? Это кошка? Кто это (их двое)? Это кошки? Где сова? Что это (близко)? А что там (далеко)?<\/span><\/td><td class=\"sa\">It’s a fox. They are ducks. It’s in the tree. That’s a bear.<\/td><\/tr><tr><td class=\"st\">Кто в кустах?<\/td><td>Пусть ребёнок угадает, кто прячется. <b>Next:<\/b> из-за следующего куста выглядывает зверь.<\/td><td class=\"tl\">Who’s behind the bush? Is it a fox?<br><span class=\"ru\">Кто прячется в кустах? Лиса?<\/span><\/td><td class=\"sa\">It’s a fox! It’s a rabbit!<\/td><\/tr><tr><td class=\"st\">Загадка и дерево<\/td><td>Ключ висит на ветке, Дракоше не достать. Загадка с TPR: small — показать маленькое, blue — синее, fly — помахать руками. Ребёнок выбирает ответ — ключ опускается, но всё ещё высоко. «Станем деревьями»: руки вверх и трясём. <b>Next:<\/b> верный ответ (бабочка), потом три встряски — ключ падает. «⏭ Skip» — сразу к ключу.<\/td><td class=\"tl\">I’m small. I’m blue. I can fly. Who am I? It’s too high! Let’s be trees! Hands up! Shake, shake, shake!<br><span class=\"ru\">Я маленькая, синяя, умею летать. Кто я? Высоко! Давай станем деревьями: руки вверх и трясём!<\/span><\/td><td class=\"sa\">A butterfly!<\/td><\/tr><tr><td class=\"st\">Ключ<\/td><td><b>Next:<\/b> ключ в связку; ещё Next — на карту.<\/td><td class=\"tl\">Hooray! Another key! What colour is the key?<br><span class=\"ru\">Ура, ещё один ключ! Какого цвета?<\/span><\/td><td class=\"sa\">It’s blue.<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🚀 4. КОСМОС — жёлтый ключ<\/td><\/tr><tr><td class=\"st\">Отсчёт<\/td><td>Космос проходят все. Считайте вместе от 10 до 1. <b>Next:<\/b> минус один; на нуле ракета улетает.<\/td><td class=\"tl\">Let’s count! Ten, nine, eight… one! Blast off!<br><span class=\"ru\">Считаем вместе! Десять, девять… один! Полетели!<\/span><\/td><td class=\"sa\">ten, nine… one!<\/td><\/tr><tr><td class=\"st\">Планеты<\/td><td>Слабым — посчитать звёзды или планеты и нажать маленькую кнопку «⏭ Skip» внизу слева: жёлтый ключ выдаётся сразу. Сильным — ещё и иллюминаторы: на красной планете открытка, на ледяной — ничего, на Луне — ракета, на Земле — жёлтый ключ. <b>Next:<\/b> открыть следующую планету / закрыть иллюминатор; после Земли — ключ.<\/td><td class=\"tl\">Look! What is it? How many stars? Let’s count! Is it hot or cold? What is it? Where do you go on holiday? How do you travel?<br><span class=\"ru\">Что это? Сколько звёзд? Считаем! Тут жарко или холодно? Что это? Куда ты ездишь отдыхать? На чём?<\/span><\/td><td class=\"sa\">It’s a planet. Seven stars! It’s cold. It’s a postcard. By plane.<\/td><\/tr><tr><td class=\"st\">Все ключи<\/td><td>Вспомните, где нашли каждый ключ. <b>Next:<\/b> ключ в связку; ещё Next — на карту.<\/td><td class=\"tl\">Hooray! We have all the keys! Where did we find them?<br><span class=\"ru\">Ура! Все ключи у нас! Где мы их нашли?<\/span><\/td><td class=\"sa\">In the house, in the park…<\/td><\/tr><tr class=\"part\"><td colspan=\"4\">🌴 5. ДЖУНГЛИ — сундук<\/td><\/tr><tr><td class=\"st\">Сундук<\/td><td>Ребёнок называет цвет — ключ этого цвета летит в свою скважину. Когда вставлены все четыре, сундук открывается, в нём волшебная книга. <b>Next:<\/b> следующий ключ в скважину; потом — финал.<\/td><td class=\"tl\">Look! A treasure chest! What’s in it? Gold? Which key? What colour? What is it?<br><span class=\"ru\">Смотри, сундук с сокровищами! Что там? Золото? Какой ключ? Какого цвета? Что это?<\/span><\/td><td class=\"sa\">The red key! It’s a book!<\/td><\/tr><tr><td class=\"st\">🎉 Финал<\/td><td>Это книга английского — наше сокровище, с Дракошей будем учиться дальше. Спросите по-русски, что понравилось и что нет, чего не хватило. Обязательно позовите родителя. Отчёт — в окне ✅ внизу.<\/td><td class=\"tl\">Well done! It’s a magic English book! Did you like it? Bye-bye!<br><span class=\"ru\">Молодец! Это волшебная книга английского! Тебе понравилось? Пока!<\/span><\/td><td class=\"sa\">—<\/td><\/tr><\/table><\/body><\/html>"};
const img = n => D.media + n + '.webp';
const $ = s => document.querySelector(s);
const el = (t, a = {}, ...kids) => { const e = document.createElement(t); for (const k in a) { if (k === 'cls') e.className = a[k]; else if (k === 'html') e.innerHTML = a[k]; else if (k === 'style') e.style.cssText = a[k]; else if (k.startsWith('on')) e[k] = a[k]; else e.setAttribute(k, a[k]); } kids.flat().forEach(c => c != null && e.append(c)); return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const KEYS = ['red', 'blue', 'green', 'yellow'];

/* ───────── состояние ───────── */
const S0 = () => ({ student: { name: '', gender: 'm', age: '' }, auto: {}, oral: {}, override: {}, keys: {}, visited: {}, stars: 5 + Math.floor(Math.random() * 4), comment: '', repEdit: null, at: 'start' });
let S = S0();
let RESETTING = false;
function save() { if (RESETTING) return; try { localStorage.setItem('mvu46', JSON.stringify(S)); } catch (e) {} }
function load() { try { const s = JSON.parse(localStorage.getItem('mvu46')); if (s && s.student) Object.assign(S, s); } catch (e) {} }
function hardReset() { RESETTING = true; try { localStorage.removeItem('mvu46'); } catch (e) {} try { if (MW.w && !MW.w.closed) MW.w.close(); } catch (e) {} location.reload(); }

/* ───────── оценка ───────── */
function autoMark(t, ok) { const a = S.auto[t] || (S.auto[t] = { ok: 0, n: 0 }); a.n++; if (ok) a.ok++; save(); MW.refresh(); }
function oralMark(key, topics, v) { if (v === null) delete S.oral[key]; else S.oral[key] = { topics, v }; save(); MW.refresh(); }
function topicScore(t) {
  if (t in S.override) return { v: S.override[t], src: 'manual', from: [] };
  const vals = [], from = new Set();
  const a = S.auto[t]; if (a && a.n) { vals.push(a.ok === a.n ? 2 : a.ok * 2 >= a.n ? 1 : 0); from.add('из игры'); }
  for (const k in S.oral) if (S.oral[k].topics.includes(t)) { vals.push(S.oral[k].v); from.add('устно'); }
  if (!vals.length) return { v: null, src: '', from: [] };
  return { v: Math.round(vals.reduce((x, y) => x + y, 0) / vals.length), src: 'auto', from: [...from] };
}

/* ───────── звук ───────── */
let AC = null;
function tone(seq) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); let t = AC.currentTime; seq.forEach(([f, d, type]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8; }); } catch (e) {} }
const SND = { key: () => tone([[784, .15], [988, .15], [1319, .35]]), ok: () => tone([[660, .12], [880, .25]]), bad: () => tone([[220, .3, 'triangle']]), pop: () => tone([[520, .08], [780, .1]]), whoosh: () => tone([[300, .1, 'sawtooth'], [500, .1, 'sawtooth'], [800, .2, 'sawtooth']]) };
function say(name) { const a = new Audio(D.audio[name]); a.play().catch(() => {}); }

/* ───────── экраны ───────── */
const SCREENS = [], SID = {};
let cur = 0, hist = [];
function add(s) { s.idx = SCREENS.length; SCREENS.push(s); SID[s.id] = s.idx; return s; }
function show(i, push = true) {
  if (typeof i === 'string') i = SID[i];
  if (push && cur !== i) hist.push(cur);
  cur = i; const s = SCREENS[i];
  const box = $('#screens'); box.innerHTML = '';
  const node = el('div', { cls: 'screen' }); box.append(node);
  if (s.bg) node.append(el('img', { cls: 'bg', src: img(s.bg) }));
  s.render(node);
  $('#nextBtn').style.display = (s.next || s.step) ? '' : 'none';
  $('#mapBtn').style.display = s.mapBtn ? '' : 'none';
  $('#skipBtn').style.display = s.skip ? '' : 'none';
  renderKeys(); MW.refresh();
}
// Next сначала делает следующий шаг сцены (прыжок, ключ, следующий предмет), и только когда шагов нет — ведёт дальше
function next() { const s = SCREENS[cur]; if (s.step && s.step()) return; if (s.next) show(typeof s.next === 'function' ? s.next() : s.next); }
$('#nextBtn').onclick = () => next();
$('#backBtn').onclick = () => { if (hist.length) show(hist.pop(), false); };
$('#mapBtn').onclick = () => show('map');
$('#skipBtn').onclick = () => { const s = SCREENS[cur]; if (s.skip) show(s.skip); };
$('#restartBtn').onclick = () => { if (confirm('Начать урок заново? Ключи и баллы чек-листа будут сброшены. Окно чек-листа закроется — откройте его снова кнопкой ✅.')) hardReset(); };
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') next(); if (e.key === 'ArrowLeft') $('#backBtn').click(); });

function renderKeys() {
  const k = $('#keys'); k.innerHTML = '';
  const s = SCREENS[cur]; k.style.display = s && s.keysBar ? 'flex' : 'none';
  KEYS.forEach(c => k.append(el('span', { cls: S.keys[c] ? 'got' : '' }, S.keys[c] ? el('img', { src: img('obj/key_' + c) }) : null)));
}
// предмет на сцене: x — центр, y — низ (в % сцены), h — высота в % сцены
function put(node, name, x, y, h, cls = '', onclick) {
  const d = el('div', { cls: 'it ' + cls, style: `left:${x}%;top:${y}%;height:${h}%` }, el('img', { src: img(name) }));
  if (onclick) d.onclick = () => onclick(d); else d.style.pointerEvents = 'none';
  node.append(d); return d;
}
// анимация из кадров: ['hero/dragon_wave1','hero/dragon_wave2']
// смена картинки героя — плавно, через затухание (без резкого скачка кадра)
function swap(d, name) {
  const base = d.querySelector('img'); d.querySelectorAll('img.xf').forEach(x => x.remove());
  const fl = d.classList.contains('flip') ? ' scaleX(-1)' : '';
  const top = el('img', { cls: 'xf', src: img(name), style: `position:absolute;left:50%;bottom:0;height:100%;width:auto;opacity:0;transform:translateX(-50%)${fl};transition:opacity .3s ease` });
  d.append(top); requestAnimationFrame(() => requestAnimationFrame(() => { top.style.opacity = 1; }));
  setTimeout(() => { base.src = img(name); setTimeout(() => top.remove(), 60); }, 330);
}
function anim(d, frames, ms = 450) { let i = 0; const im = d.querySelector('img'); const t = setInterval(() => { if (!document.body.contains(im)) return clearInterval(t); i = (i + 1) % frames.length; im.src = img(frames[i]); }, ms); return t; }
function flyTo(from, toRect, then) {
  const st = $('#stage').getBoundingClientRect(), r = from.getBoundingClientRect();
  const f = el('div', { cls: 'fly', style: `left:${r.left - st.left}px;top:${r.top - st.top}px;height:${r.height}px` }, el('img', { src: from.querySelector('img').src }));
  $('#stage').append(f); from.style.visibility = 'hidden'; from.classList.remove('glow'); from.style.pointerEvents = 'none';
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.left = (toRect.left - st.left + toRect.width * .3) + 'px'; f.style.top = (toRect.top - st.top + toRect.height * .2) + 'px'; f.style.height = (toRect.height * .4) + 'px'; f.style.opacity = '.2'; }));
  setTimeout(() => { f.remove(); then && then(); }, 850);
}
function confetti() { const c = $('#fx'); const g = c.getContext('2d'); c.width = c.clientWidth; c.height = c.clientHeight; const ps = [...Array(160)].map(() => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height, v: 2 + Math.random() * 3, s: 5 + Math.random() * 7, c: ['#ffc93c', '#a77cf0', '#3fbf6a', '#e25555', '#6aa8ff'][Math.floor(Math.random() * 5)], r: Math.random() * 6 })); let f = 0; (function step() { g.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.v; p.r += .1; g.fillStyle = p.c; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6); g.restore(); }); if (++f < 260) requestAnimationFrame(step); else g.clearRect(0, 0, c.width, c.height); })(); }
// шаги сцены для кнопки Next: список функций, каждая — один шаг; кончились — Next ведёт дальше
function steps(list) { let i = 0; SCREENS[cur].step = () => { while (i < list.length) { const r = list[i++](); if (r !== false) return true; } return false; }; }
const title = (node, t, st = '') => node.append(el('div', { cls: 'title', style: st }, t));

/* ───────── сцены ───────── */
function build() {
  // 0. Привет
  add({ id: 'hello', bg: 'bg/map', next: 'dragon', render(n) {
    n.append(el('div', { cls: 'dim' }));
    title(n, 'Wow Dragon · Treasure Quest', 'font-size:1.8em');
    put(n, 'hero/dragon_wave2', 82, 95, 46, 'sway');
  } });
  // 1. Дракоша: happy / sad, свиток-карта
  add({ id: 'dragon', bg: 'bg/forest', next: 'map', render(n) {
    title(n, 'Hello, Dragon!');
    let sad = false;
    const d = put(n, 'hero/dragon_wave1', 38, 92, 62, 'glow', () => { sad = !sad; swap(d, sad ? 'hero/dragon_sad' : 'hero/dragon_wave1'); SND.pop(); });
    const m = el('div', { cls: 'it glow', style: 'left:72%;top:80%;height:36%' }, el('img', { src: img('bg/map'), style: 'border-radius:1em;box-shadow:0 .4em 1.4em rgba(0,0,0,.4)' }));
    m.onclick = () => { m.classList.add('pulse'); SND.ok(); setTimeout(() => m.classList.remove('pulse'), 2200); };
    n.append(m);
    steps([() => d.onclick(), () => d.onclick(), () => m.onclick()]);
  } });
  // 2. Карта: дом → парк → лес → космос → джунгли, светится следующее место
  const PL = { house: [46.7, 76, 26], forest: [16.5, 57, 24], park: [73, 44, 26], jungle: [32, 20, 24], space: [85, 78, 15] };
  const START = [6, 93];
  // порядок мест (решение Анны 27.11): светится только следующее, Next ведёт туда же
  const ORDER = ['house', 'park', 'forest', 'space', 'jungle'];
  const NEXTP = () => ORDER.find(p => p === 'jungle' || !S.visited[p]);   // Дракоша в начале стоит в левом нижнем углу карты, ни в одном месте
  const KEYOF = { house: 'red', forest: 'blue', park: 'green', space: 'yellow' };
  add({ id: 'map', bg: 'bg/map', keysBar: true, render(n) {
    const [sx, sy] = PL[S.at] ? [PL[S.at][0], PL[S.at][1] + 6] : START;
    const w = put(n, 'hero/dragon_walk1', sx, sy, 22, '');
    w.classList.add('walker'); w.style.transition = 'left 1.4s linear, top 1.4s linear';
    Object.entries(PL).forEach(([k, [x, y, r]]) => {
      const b = el('button', { cls: 'place' + (k === NEXTP() ? ' lit' : ''), style: `left:${x}%;top:${y}%;width:${r}%;height:${r * 1.6}%`, title: k });
      if (k === 'space') b.append(el('img', { cls: 'pi', src: img('obj/planet_ring') }));   // планета на карте теперь яркая — космос обычное место
      if (S.visited[k]) b.append(el('span', { cls: 'ok' }, '✓'));
      if (KEYOF[k] && S.keys[KEYOF[k]]) b.append(el('img', { cls: 'vk', src: img('obj/key_' + KEYOF[k]) }));
      b.onclick = () => go(k, x, y);
      n.append(b);
    });
    let busy = false;
    function go(k, x, y) {
      if (busy) return; busy = true; SND.whoosh();
      w.classList.toggle('flip', x < parseFloat(w.style.left)); w.classList.add('walkbob');
      w.style.left = x + '%'; w.style.top = (y + 6) + '%';
      setTimeout(() => { w.classList.remove('walkbob'); S.at = k; S.visited[k] = true; save(); show({ house: 'room', forest: 'forest', park: 'park', jungle: 'jungle', space: 'launch' }[k]); }, 1500);
    }
    // Next на карте — в следующее непройденное место, сундук последним
    SCREENS[cur].step = () => { const k = NEXTP(); go(k, PL[k][0], PL[k][1]); return true; };
  } });

  // 3. Дом: собрать рюкзак
  const ROOM = [ // [картинка, x, низ y, высота, тема]
    // всё лежит на поверхности: кровать, подушка, полка, стол, шкаф, ковёр, пол
    ['obj/teddy', 33, 57, 20, 'toys'], ['obj/plane', 11, 50, 10, 'toys'], ['obj/doll', 80, 20, 16, 'toys'], ['obj/robot', 92, 20, 17, 'toys'],
    ['obj/ball', 44, 90, 13, 'toys'], ['obj/car', 62, 92, 12, 'toys'],
    ['obj/pencil', 77, 45, 10, 'school'], ['obj/schoolbook', 86, 45, 9, 'school'], ['obj/ruler', 95, 45, 8, 'school'],
    ['obj/tshirt', 19, 62, 12, 'clothes'], ['obj/hat', 63, 8, 11, 'clothes'], ['obj/sneakers', 48.5, 77, 9, 'clothes'], ['obj/socks', 76, 96, 11, 'clothes'],
  ];
  add({ id: 'room', bg: 'bg/room', keysBar: true, mapBtn: true, next: 'teddy', render(n) {
    title(n, "Pack Dragon's bag!", 'left:42%');
    const bag = el('div', { cls: 'bag' }, el('img', { src: img('obj/backpack') }), el('span', { cls: 'bagn' }, '0'));
    n.append(bag); let k = 0;
    put(n, 'hero/dragon_point', 25, 100, 50, 'flip');
    const its = ROOM.map(([nm, x, y, h]) => put(n, nm, x, y, h, 'glow', d => { if (d.dataset.done) return; d.dataset.done = 1; SND.pop(); flyTo(d, bag.getBoundingClientRect(), () => { bag.querySelector('.bagn').textContent = ++k; S.bag = (S.bag || []); if (!S.bag.includes(nm)) S.bag.push(nm); save(); }); }));
    steps(its.map(d => () => { if (d.dataset.done) return false; d.onclick(); }));
  } });
  // Б. Где мишка?
  const TED = [['on the bed', 31, 55, 22], ['under the table', 92, 76, 16], ['in the box', 44, 80, 16, true], ['next to the wardrobe', 49, 72, 20], ['on the chair', 82, 63, 16]];
  add({ id: 'teddy', bg: 'bg/room', keysBar: true, mapBtn: true, next: 'missing', render(n) {
    title(n, "Where's the teddy?", 'left:42%');
    let i = 0, d = null, box = null;
    // «в коробке» — одной картинкой мишка внутри открытой коробки (если она уже есть), иначе мишка над коробкой
    const place = () => { if (d) d.remove(); if (box) box.remove(); const [, x, y, h, inBox] = TED[i]; const tb = inBox && D.teddybox; d = put(n, tb ? 'obj/teddy_box' : 'obj/teddy', x, tb ? y + 10 : y, tb ? 26 : h, 'glow', () => { i = (i + 1) % TED.length; SND.pop(); place(); }); if (inBox && !tb) box = put(n, 'obj/toybox', x, y + 12, 18, ''); S.teddyAt = TED[i][0]; MW.refresh(); };
    place();

  } });
  // А. Что пропало?
  add({ id: 'missing', bg: 'bg/room', keysBar: true, mapBtn: true, next: 'key_red', render(n) {
    n.append(el('div', { cls: 'dim' })); title(n, "What's missing?");

    const set = shuffle(pool).slice(0, 5);

    row.append(...slots);

    const curt = el('div', { cls: 'curtain', style: 'display:none' }, '🙈 Close your eyes!');
    card.append(curt);

    const bHide = el('button', { cls: 'btn pur' }, '🙈 Close your eyes'), bShow = el('button', { cls: 'btn ghost' }, '👀 Show');
    bHide.onclick = async () => { slots.forEach(s => { s.style.opacity = 1; s.classList.remove('hl'); }); curt.style.display = 'flex'; SND.whoosh(); await wait(1500); hidden = Math.floor(Math.random() * slots.length); slots[hidden].style.opacity = 0; curt.style.display = 'none'; S.missing = set[hidden]; MW.refresh(); };
    bShow.onclick = () => { if (hidden < 0) return; slots[hidden].style.opacity = 1; slots[hidden].classList.add('hl'); SND.ok(); };
    n.append(el('div', { style: 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2em' }, card, el('div', { style: 'display:flex;gap:1em' }, bHide, bShow)));
    steps([() => bHide.onclick(), () => bShow.onclick(), () => bHide.onclick(), () => bShow.onclick()]);
  } });

  // экран ключа
  // Next на экране ключа забирает ключ сам, даже если на него не нажали — иначе сундук потом не откроется
const keyScreen = (c, bg, jump) => add({ id: 'key_' + c, bg, keysBar: true, next: () => { if (!S.keys[c]) { S.keys[c] = true; save(); SND.key(); } return 'map'; }, render(n) {
    n.append(el('div', { cls: 'dim' })); title(n, "It's a key! What colour is it?");
    const d = put(n, jump, 32, 92, 56, 'bounce');

  keyScreen('red', 'bg/room', 'hero/dragon_jump');

  // 4. Лес
  add({ id: 'forest', bg: 'bg/forest', keysBar: true, mapBtn: true, next: 'bushes', render(n) {
    title(n, 'In the forest');
    forestBase(n, true);
    steps([...n.querySelectorAll('.it.glow')].map(d => () => tap(d)));
  } });
  function forestBase(n, glow) {
    const g = glow ? 'glow' : '';
    put(n, 'obj/tree', 80, 88, 82, '');
    put(n, 'obj/owl', 86, 33, 17, g, d => tap(d));
    put(n, 'obj/squirrel', 70, 51, 15, g, d => tap(d));
    put(n, 'obj/bird', 62, 37, 11, g, d => tap(d));
    put(n, 'obj/bear', 46, 53, 15, g, d => tap(d));        // далеко — that
    put(n, 'obj/pair_ducks', 12, 74, 16, g, d => tap(d));
    put(n, 'obj/pair_frogs', 24, 88, 14, g, d => tap(d));
    put(n, 'obj/pair_kittens', 47, 96, 28, g, d => tap(d));  // близко — these
    put(n, 'obj/pair_rabbits', 33, 66, 15, g, d => tap(d));

  function tap(d) { d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse'); SND.pop(); }
  // В. Кто прячется в кустах
  add({ id: 'bushes', bg: 'bg/forest', keysBar: true, mapBtn: true, next: 'riddle', render(n) {

      const an = put(n, a, x, 86, 26, '');

      const b = put(n, 'obj/bush' + (1 + [20, 48, 75].indexOf(x)), x, 100, 34, 'glow', () => { an.style.top = '66%'; b.classList.remove('glow'); SND.ok(); });

  } });
  // загадка + ключ на верёвке + потряси дерево (Д)
  add({ id: 'riddle', bg: 'bg/forest', keysBar: true, mapBtn: true, skip: 'key_blue', next: null, render(n) {
    title(n, "I'm small. I'm blue. I can fly. Who am I?");
    const tree = put(n, 'obj/tree', 80, 88, 82, '');
    // верёвка висит с конца ветки, ключ высоко — Дракоша внизу прыгает, но не достаёт

    put(n, 'hero/dragon_jump', 62, 99, 28, 'bounce');
    let solved = false, shakes = 0;
    const cands = [['obj/butterfly', 16, 48, 17, true], ['obj/bird', 34, 42, 15], ['obj/owl', 22, 84, 22], ['obj/pair_frogs', 42, 90, 17]];

    tree.onclick = () => {
      if (!solved) return; tree.classList.remove('shake'); void tree.offsetWidth; tree.classList.add('shake'); SND.whoosh();
      if (++shakes >= 3) { rope.style.display = 'none'; key.style.top = '95%'; setTimeout(() => show('key_blue'), 1300); }

  } });
  keyScreen('blue', 'bg/forest', 'hero/dragon_jump');

  // 5. Парк
  add({ id: 'park', bg: 'bg/park', keysBar: true, mapBtn: true, next: 'says', render(n) {
    title(n, 'In the park');
    const g = put(n, 'hero/granny_sad', 17, 82, 36, 'glow', d => tap(d));
    put(n, 'obj/kid_run', 48, 90, 28, 'glow', d => tap(d));
    put(n, 'obj/kid_bike', 70, 84, 26, 'glow', d => tap(d));
    // качели: девочку ставим только вместе со своими качелями поверх нарисованных в фоне — отдельно она висела мимо рамы
    if (D.swingset) put(n, 'obj/kid_swingset', 40.4, 45.5, 18, 'glow', d => tap(d));
    put(n, 'obj/kid_skip', 58, 62, 22, 'glow', d => tap(d));

    put(n, 'obj/kid_icecream', 92, 60, 22, 'glow', d => tap(d));

    n.append(el('div', { cls: 'flyer' + (D.bird === 'obj/bird' ? '' : ' right'), style: 'top:14%;height:' + (D.bird === 'obj/bird' ? 9 : 12) + '%' }, el('img', { src: img(D.bird) })));   // птица летит клювом вперёд, плавно вверх-вниз
  } });
  // Ж. Дракоша говорит
  const SAYS = [['jump', 'hero/dragon_jump'], ['swim', 'hero/dragon_swim'], ['fly', 'hero/dragon_fly'], ['run', 'hero/dragon_run'], ['dance', 'hero/dragon_dance'], ['clap', 'hero/dragon_clap']];
  add({ id: 'says', bg: 'bg/park', keysBar: true, mapBtn: true, next: 'feed', render(n) {
    n.append(el('div', { cls: 'dim' })); title(n, 'Dragon says…');
    let i = 0;
    const d = put(n, SAYS[0][1], 50, 92, 62, 'glow bounce', () => { i = (i + 1) % SAYS.length; swap(d, SAYS[i][1]); S.says = SAYS[i][0]; SND.pop(); MW.refresh(); });
    S.says = SAYS[0][0];
    steps(SAYS.slice(1).map(() => () => d.onclick()));
  } });
  // Е. Покорми бабушку
  const FOOD = ['pizza', 'broccoli', 'icecream', 'fish', 'cake', 'apple', 'banana', 'carrot'];
  add({ id: 'feed', bg: 'bg/park', keysBar: true, mapBtn: true, skip: 'key_green', next: null, render(n) {
    n.append(el('div', { cls: 'dim' })); title(n, 'Listen and feed Granny!');
    const g = put(n, 'hero/granny_cry', 22, 88, 52, 'breathe');
    let stopCry = () => {};
    const plate = put(n, 'obj/plate', 22, 98, 14, '');
    const rounds = shuffle(FOOD).slice(0, 4); let r = 0, tries = 0, busy = false;
    const play = el('button', { cls: 'btn pur', style: 'position:absolute;left:22%;top:18%;transform:translateX(-50%);z-index:31;font-size:2.2em' }, '🔊 Listen');
    play.onclick = () => { stopCry(); say(rounds[r]); };
    n.append(play);
    const FD = {};
    let heard = -1;
    SCREENS[cur].step = () => {
      if (r >= rounds.length) { show('key_green'); return true; }
      if (heard !== r) { heard = r; play.onclick(); return true; }
      FD[rounds[r]].onclick(); return true;
    };
    FOOD.forEach((f, k) => {
      const x = 48 + (k % 4) * 13, y = k < 4 ? 50 : 82;
      FD[f] = put(n, 'obj/' + f, x, y, 19, 'glow', d => {
        if (r >= rounds.length || busy) return; stopCry();
        if (f === rounds[r]) {
          autoMark('food', tries === 0); tries = 0; SND.ok(); busy = true;
          flyTo(d, plate.getBoundingClientRect(), async () => {
            swap(g, D.eat.includes(f) ? 'hero/granny_eat_' + f : 'hero/granny_eat'); await wait(1800);
            r++; busy = false; if (r < rounds.length) { swap(g, 'hero/granny_sad'); }
            else { swap(g, 'hero/granny_key'); g.classList.add('glow'); play.remove(); $('.title').textContent = 'Thank you! Here is a key!'; g.style.pointerEvents = 'auto'; g.onclick = () => show('key_green'); confetti(); SND.key(); }
          });
        } else { tries++; swap(g, 'hero/granny_yuck'); SND.bad(); setTimeout(() => { if (r < rounds.length) swap(g, 'hero/granny_sad'); }, 1500); }
      });
    });
  } });
  keyScreen('green', 'bg/park', 'hero/dragon_jump');

  // 6. Космос: И отсчёт
  add({ id: 'launch', bg: 'bg/launch', keysBar: true, mapBtn: true, skip: 'space', next: null, render(n) {
    title(n, "Let's count: 10 … 1!");
    const rocket = put(n, 'obj/rocket', 50, 72, 42, ''); rocket.style.transition = 'top 2.2s ease-in';
    const d = put(n, 'hero/dragon_astro_wave', 27, 88, 44, 'bounce');
    let k = 10;
    const c = el('div', { cls: 'count', style: 'position:absolute;right:3%;top:30%;z-index:30' }, String(k)); n.append(c);
    c.onclick = () => {
      if (k <= 0) return; k--; SND.pop(); c.textContent = k ? String(k) : '🚀';
      if (!k) { d.style.transition = 'opacity .5s'; d.style.opacity = 0; SND.whoosh(); rocket.style.top = '-40%'; setTimeout(() => show('space'), 2300); }
    };
    SCREENS[cur].step = () => { c.onclick(); return true; };
  } });
  const PLAN = [['red', 'obj/planet_red', 18, 42, 26, 'obj/postcard'], ['ice', 'obj/planet_blue', 42, 88, 24, null], ['moon', 'obj/planet_moon', 63, 34, 18, 'obj/rocket'], ['earth', 'obj/planet_earth', 80, 82, 28, 'obj/key_yellow']];
  add({ id: 'space', bg: 'bg/space', keysBar: true, mapBtn: true, skip: 'key_yellow', next: null, render(n) {
    title(n, 'In space! How many stars?');
    // звёзды: число держим в S, чтобы пересчёт совпадал
    const SP = [[8, 18], [30, 12], [52, 20], [92, 40], [6, 70], [58, 60], [95, 75], [36, 62], [74, 14]];
    SP.slice(0, S.stars).forEach(([x, y], i) => { const s = put(n, 'obj/star', x, y, 8, 'glow', d => tap(d)); s.style.animationDelay = (i * .3) + 's'; });
    put(n, 'obj/planet_ring', 90, 22, 13, '');
    const d = put(n, 'hero/dragon_astro_float', 28, 86, 40, 'float');
    const PD = PLAN.map(([k, p, x, y, h, inside]) => put(n, p, x, y, h, 'glow', () => {
      SND.whoosh();
      const ov = el('div', { cls: 'ov' }); const ph = el('div', { cls: 'porthole' }, el('img', { cls: 'pf', src: img('obj/porthole_' + k) }));
      if (inside) { const i = el('img', { cls: 'in', src: img(inside) }); ph.append(i); if (k === 'earth') { i.style.cursor = 'pointer'; i.style.animation = 'glow 1.5s infinite'; i.onclick = e => { e.stopPropagation(); show('key_yellow'); }; } }
      ov.append(ph); ov.onclick = () => ov.remove(); n.append(ov);
    }));
    let pi = 0;
    SCREENS[cur].step = () => {
      const ov = n.querySelector('.ov');
      if (ov) { if (pi >= PLAN.length) { show('key_yellow'); return true; } ov.remove(); return true; }
      if (pi < PLAN.length) { PD[pi++].onclick(); return true; }
      show('key_yellow'); return true;
    };
  } });
  keyScreen('yellow', 'bg/space', 'hero/dragon_jumpkey');

  // 7. Джунгли: К ключи по цвету
  add({ id: 'jungle', bg: 'bg/jungle', keysBar: true, mapBtn: true, next: null, render(n) {
    const all = KEYS.every(c => S.keys[c]);
    title(n, all ? 'Open the chest! Which key?' : 'We need four keys!');
    const chest = put(n, 'obj/chest_closed', 50, 90, 50, '');
    const dr = put(n, 'hero/dragon_think', 20, 96, 48, '');
    if (!all) { const b = el('button', { cls: 'btn pur', style: 'position:absolute;left:50%;top:90%;transform:translateX(-50%);z-index:31' }, '🗺 Back to the map'); b.onclick = () => show('map'); n.append(b); return; }
    // скважины на сундуке: доли ширины картинки (по листу 9)
    const HOLE = { red: .245, blue: .405, green: .565, yellow: .735 };
    let left = 4;
    const KD = [];
    SCREENS[cur].step = () => { const k = KD.find(x => !x.dataset.done); if (k) { k.onclick(); return true; } return false; };
    KEYS.forEach((c, i) => {
      const k = KD[i] = put(n, 'obj/key_' + c, 78 + (i % 2) * 13, 42 + Math.floor(i / 2) * 26, 15, 'glow', () => {
        if (k.dataset.done) return; k.dataset.done = 1;
        const r = chest.getBoundingClientRect(), st = $('#stage').getBoundingClientRect();
        const tgt = { left: r.left + r.width * HOLE[c] - r.width * .12, top: r.top + r.height * .55, width: r.width * .24, height: r.height * .25 };
        SND.pop(); flyTo(k, tgt, () => { n.append(el('img', { src: img('obj/key_' + c), style: `position:absolute;z-index:7;left:${tgt.left - st.left + tgt.width * .3}px;top:${tgt.top - st.top + tgt.height * .2}px;height:${tgt.height * .4}px;transform:rotate(90deg)` })); if (--left === 0) open(); });
      });
    });
    async function open() {
      SND.key(); await wait(300);
      swap(chest, 'obj/chest_open'); confetti();
      const book = put(n, 'obj/book', 50, 66, 4, ''); book.style.transition = 'height 1.2s, top 1.2s'; book.style.zIndex = 6;
      requestAnimationFrame(() => { book.style.height = '30%'; book.style.top = '52%'; });
      swap(dr, 'hero/dragon_book'); dr.classList.add('bounce');
      $('.title').textContent = "What is it? It's a magic book!";
      $('#nextBtn').style.display = ''; SCREENS[cur].next = 'bye';
    }
  } });
  // 8. Финал
  add({ id: 'bye', bg: 'bg/jungle', render(n) {
    n.append(el('div', { cls: 'dim' })); title(n, 'Well done! Bye-bye!');
    put(n, 'hero/dragon_wave2', 40, 94, 60, 'sway');
    put(n, 'obj/book', 66, 80, 34, 'glow');
    confetti();
  } });
}

/* ───────── окно преподавателя ───────── */
const MW = {
  w: null,
  open(go) {
    const W = Math.min(1100, screen.availWidth - 80), H = Math.min(900, screen.availHeight - 80);
    const w = window.open('', 'wowspeak_mvu46', `popup=yes,width=${W},height=${H},left=${screen.availWidth - W - 20},top=30,resizable=yes,scrollbars=yes`);
    if (!w) { alert('Разрешите всплывающие окна, чтобы открыть чек-лист и план.'); return; }
    this.w = w;
    w.APP = { S, D, topicScore, img, oralMark, save, report, where, go: id => { show(id); w.focus(); }, screen: () => SCREENS[cur], setOverride: (t, v) => { if (v === null) delete S.override[t]; else S.override[t] = v; save(); MW.refresh(); }, reset: hardReset };
    w.document.open(); w.document.write(D.mw_html); w.document.close();
    setTimeout(() => { this.refresh(); if (go && w.goReport) w.goReport(); }, 150);
  },
  refresh() { if (this.w && !this.w.closed && this.w.render) this.w.render(); },
};
$('#checkBtn').onclick = () => MW.open();
$('#planBtn').onclick = () => {
  const W = Math.min(1100, screen.availWidth - 80), H = Math.min(900, screen.availHeight - 80);
  const w = window.open('', 'wowspeak_mvu46_plan', `popup=yes,width=${W},height=${H},left=30,top=30,resizable=yes,scrollbars=yes`);
  if (!w) { alert('Разрешите всплывающие окна, чтобы открыть план урока.'); return; }
  w.document.open(); w.document.write(D.plan_html); w.document.close();
};
// где проверяется тема: экраны, в чьих устных вопросах она есть
function where(t) { const r = []; Object.entries(D.prompts).forEach(([sid, ps]) => { if (ps.some(p => (p.topics || []).includes(t)) && !r.some(x => x.id === sid)) r.push({ id: sid, name: D.screen_ru[sid] || sid }); }); return r; }
function report() {
  const RU = D.topic_ru, by = { 2: [], 1: [], 0: [] }, mods = [];
  D.checklist.forEach(m => { let sum = 0, filled = 0; m.topics.forEach(([id]) => { const v = topicScore(id).v; if (v !== null) { by[v].push(RU[id]); sum += v; filled++; } }); mods.push({ name: m.title, sum, filled }); });
  const first = mods.find(m => m.sum < D.pass);
  const list = a => a.length ? a.join(', ') : '—';
  const st = S.student || {}, f = st.gender === 'f';
  const age = String(st.age || '').trim(), yrs = n => { n = +n; const d = n % 10, h = n % 100; return d === 1 && h !== 11 ? 'год' : d >= 2 && d <= 4 && (h < 12 || h > 14) ? 'года' : 'лет'; };
  const who = [(st.name || '').trim(), age ? (/^\d+$/.test(age) ? `${age} ${yrs(age)}` : age) : ''].filter(Boolean).join(', ');
  const lines = [
    ...(who ? [`${f ? 'Ученица' : 'Ученик'}: ${who}.`] : []),
    `Уверенно знает темы: ${list(by[2])}. ${f ? 'Знакома' : 'Знаком'} с темами: ${list(by[1])}. Пока не знает: ${list(by[0])}.`,
    `Рекомендованная программа: ${first ? first.name : 'Wow Dragon 2 пройден целиком — следующая ступень'}.`,
  ];
  if ((S.comment || '').trim()) lines.push(`Комментарий преподавателя: ${S.comment.trim()}`);
  return lines.join('\n');
}

/* ───────── загрузка ───────── */
const CACHE = [];
function preload(urls, done) { let k = 0; if (!urls.length) return done(); urls.forEach(u => { const i = new Image(); CACHE.push(i); const fin = () => { k++; $('#lbar').style.width = (k / urls.length * 100) + '%'; if (k === urls.length) done(); }; i.onload = fin; i.onerror = fin; i.src = u; }); }
load();
preload(D.preload.map(img), () => { build(); show(0, false); $('#loader').style.display = 'none'; });
</script>
