<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halloween Lesson 🎃 7–9 advanced</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#7b4bd6;--purple2:#5a2ea8;--orange:#ff8a1e;--orange2:#e8631a;--gold:#ffc63a;--green:#4fc04f;--pink:#ff6fae;--ink:#2a1550;
  --disp:'Fredoka','Baloo 2',sans-serif;--round:'Baloo 2','Segoe UI',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--round);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;user-select:none;background:#1a0b2e;touch-action:manipulation}
#game{position:relative;width:100vw;height:100vh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
.bg-cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}

/* top bar */
.topbar{position:absolute;top:0;left:0;right:0;z-index:40;display:none;justify-content:space-between;align-items:center;padding:12px 16px;pointer-events:none}
.progress-pips{display:flex;gap:5px;background:rgba(20,8,40,.55);padding:7px 12px;border-radius:16px;backdrop-filter:blur(4px);pointer-events:auto;flex-wrap:wrap;max-width:50vw}
.pip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3);transition:.3s}
.pip.done{background:var(--gold)}.pip.cur{background:var(--orange);transform:scale(1.3);box-shadow:0 0 8px var(--orange)}
.topbtns{display:flex;gap:8px;pointer-events:auto}
.tb{font-family:var(--disp);font-weight:700;font-size:14px;color:#fff;border:none;border-radius:12px;padding:9px 14px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.tb.plan{background:linear-gradient(180deg,#ffd36a,var(--gold));color:var(--ink)}.tb.music{background:linear-gradient(180deg,#9d84ff,var(--purple))}
.tb:active{transform:translateY(2px)}

/* nav bar (back / page / next) */
.navbar{position:absolute;bottom:0;left:0;right:0;z-index:40;display:none;justify-content:space-between;align-items:center;padding:12px 18px;pointer-events:none}
.navbar{justify-content:center;gap:16px}
.nav-arrow{font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;border:none;border-radius:50%;width:48px;height:48px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);pointer-events:auto;background:rgba(123,75,214,.6);display:flex;align-items:center;justify-content:center;opacity:.7}
.nav-arrow:hover{opacity:1}.nav-arrow:active{transform:translateY(2px)}
.nav-main{font-family:var(--disp);font-weight:700;font-size:20px;color:#fff;border:none;border-radius:16px;padding:12px 40px;cursor:pointer;box-shadow:0 5px 0 #c44f12;pointer-events:auto;background:linear-gradient(180deg,#ff9f3e,var(--orange2));transition:transform .1s,box-shadow .15s}
.nav-main:active{transform:translateY(3px);box-shadow:0 2px 0 #c44f12}
.nav-main.ready{animation:nextpulse 1.1s ease-in-out infinite}
@keyframes nextpulse{0%,100%{transform:scale(1);box-shadow:0 5px 0 #c44f12,0 0 0 rgba(255,159,62,.6)}50%{transform:scale(1.05);box-shadow:0 5px 0 #c44f12,0 0 24px rgba(255,159,62,.9)}}
.page-num{position:absolute;right:16px;font-family:var(--round);font-weight:700;font-size:12px;color:rgba(255,255,255,.55);background:rgba(20,8,40,.5);padding:5px 10px;border-radius:10px;pointer-events:auto}

.big-title{font-family:var(--disp);font-weight:700;font-size:clamp(26px,5vw,50px);color:#fff;text-shadow:0 4px 0 var(--purple2),0 0 22px rgba(123,75,214,.6);text-align:center;z-index:10}
.sub{font-family:var(--round);font-weight:700;font-size:clamp(15px,2.5vw,21px);color:var(--ink);margin-top:10px;line-height:1.45}
.sub.light{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.panel{background:rgba(255,253,246,.96);border:5px solid #fff;border-radius:28px;padding:22px 32px;box-shadow:0 14px 40px rgba(0,0,0,.3);text-align:center;z-index:10;max-width:92vw}

.btn{font-family:var(--disp);font-weight:700;font-size:clamp(20px,3.2vw,28px);color:#fff;border:none;border-radius:18px;padding:15px 44px;cursor:pointer;
  background:linear-gradient(180deg,#ff9f3e,var(--orange2));box-shadow:0 6px 0 #c44f12;transition:transform .1s,box-shadow .1s;margin-top:8px}
.btn:hover{transform:translateY(2px);box-shadow:0 4px 0 #c44f12}.btn:active{transform:translateY(6px);box-shadow:0 0 0 #c44f12}
.btn.purple{background:linear-gradient(180deg,#9d6cff,var(--purple2));box-shadow:0 6px 0 #3f1f78}.btn.purple:active{box-shadow:0 0 0 #3f1f78}
.btn.green{background:linear-gradient(180deg,#6fe06f,#3a9c3a);box-shadow:0 6px 0 #2a7a2a}.btn.green:active{box-shadow:0 0 0 #2a7a2a}
/* pulsing start */
.btn.pulse{animation:btnpulse 1.3s ease-in-out infinite}
@keyframes btnpulse{0%,100%{transform:scale(1);box-shadow:0 6px 0 #c44f12,0 0 0 rgba(255,159,62,.6)}50%{transform:scale(1.06);box-shadow:0 6px 0 #c44f12,0 0 30px rgba(255,159,62,.9)}}

#start .dragon-hero{width:min(220px,30vw);filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));animation:bob 2.4s ease-in-out infinite;margin-bottom:8px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

.choices{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;margin-top:20px;z-index:10}
.choice{background:rgba(255,255,255,.92);border:4px solid #fff;border-radius:22px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.choice:hover{transform:translateY(-6px) scale(1.03)}
.choice img{width:clamp(120px,16vw,180px);height:clamp(120px,16vw,180px);object-fit:contain}
.choice .lbl{font-family:var(--disp);font-weight:700;font-size:16px;color:var(--ink)}
.choice.sel{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(255,198,58,.5)}

/* fog present */
.fog-card{position:relative;width:min(400px,50vw);z-index:10}
.fog-card .word-img{width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.fog-card{cursor:pointer}
.fog-card .word-img{transition:filter .8s ease}
.fog-card .fog{position:absolute;inset:-22%;border-radius:45%;filter:blur(22px);opacity:1;
  background:radial-gradient(circle at 30% 35%,#f4efff 0,rgba(244,239,255,0) 42%),radial-gradient(circle at 70% 65%,#e7defa 0,rgba(231,222,250,0) 45%),
  radial-gradient(circle at 50% 50%,#d8cdee 0 62%,rgba(216,205,238,.85) 74%,rgba(216,205,238,0) 92%);
  animation:fogdrift 6s ease-in-out infinite alternate}
@keyframes fogdrift{0%{transform:translate(-2%,0) scale(1)}100%{transform:translate(2%,-2%) scale(1.04)}}
.fog.clear{opacity:0}
.word-label{font-family:var(--disp);font-weight:700;font-size:clamp(34px,6vw,64px);color:#fff;text-shadow:0 4px 0 var(--orange2),0 0 20px rgba(255,138,30,.6);margin-top:14px;text-transform:lowercase;opacity:0;transition:opacity .5s}
.word-label.show{opacity:1}

.pic-grid{display:flex;gap:clamp(14px,3vw,36px);flex-wrap:wrap;justify-content:center;z-index:10}
.pic-item{background:rgba(255,255,255,.9);border:5px solid #fff;border-radius:22px;padding:14px;cursor:pointer;transition:transform .12s;box-shadow:0 8px 20px rgba(0,0,0,.25);position:relative}
.pic-item:hover{transform:translateY(-5px)}
.pic-item img{width:clamp(110px,14vw,170px);height:clamp(110px,14vw,170px);object-fit:contain}
.pic-item.right{border-color:var(--green);box-shadow:0 0 0 5px var(--green),0 0 26px rgba(79,192,79,.6);animation:rpop .5s ease}
@keyframes rpop{0%,100%{transform:scale(1)}40%{transform:scale(1.12)}}
.pic-item.wrong{animation:wshake .4s ease}@keyframes wshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.pic-item .circle-mark{position:absolute;inset:-6px;border:7px solid var(--pink);border-radius:50%;opacity:0;pointer-events:none}
.pic-item.right .circle-mark{opacity:1;animation:drawcircle .5s ease}
@keyframes drawcircle{0%{transform:scale(.5) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
#spotlight-screen{background:radial-gradient(ellipse at 50% 30%,#3a1a66,#1a0b2e)}
.spot-field{position:absolute;inset:0;z-index:6}
.spot-item{position:absolute;width:clamp(110px,11vw,170px);transform:translate(-50%,-50%);cursor:pointer;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.spot-item.right{filter:drop-shadow(0 0 18px #6fe06f) drop-shadow(0 0 8px #6fe06f);animation:rpop .5s ease}
.spot-item.wrong{animation:wshake2 .4s ease}
@keyframes wshake2{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 10px),-50%)}75%{transform:translate(calc(-50% + 10px),-50%)}}
/* flashlight: dark layer with a hole of light + glowing ring */
.spot-dark{position:absolute;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(circle var(--r,120px) at var(--x,50%) var(--y,50%),rgba(255,236,170,.10) 0%,rgba(255,236,170,.05) 70%,#05010d 100%)}
.spot-ring{position:absolute;z-index:9;pointer-events:none;border-radius:50%;border:4px solid rgba(255,222,130,.75);
  box-shadow:0 0 28px 6px rgba(255,200,80,.45),inset 0 0 30px rgba(255,220,130,.25);transform:translate(-50%,-50%);transition:border-color .2s,box-shadow .2s}
.spot-ring.ok{border-color:#6fe06f;box-shadow:0 0 34px 10px rgba(79,192,79,.6),inset 0 0 30px rgba(79,192,79,.3)}
.spot-ring.bad{border-color:#ff6fae;box-shadow:0 0 34px 10px rgba(255,111,174,.5)}
#spotlight-screen .big-title,#spotlight-screen .sub{z-index:10}
.spot-stop{position:absolute;bottom:92px;z-index:10;font-size:clamp(24px,3.6vw,34px);padding:14px 54px;
  background:linear-gradient(180deg,#ff6b6b,#d63031);box-shadow:0 6px 0 #9b1c1c}
.spot-stop:hover{box-shadow:0 4px 0 #9b1c1c}.spot-stop:active{box-shadow:0 0 0 #9b1c1c}


/* room */
#room-screen,#finish-screen{overflow:hidden}
.room-wrap{position:absolute;inset:0;z-index:1}
.room-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.room-bg.top{opacity:0;transition:opacity 1.4s ease}
.room-bg.top.show{opacity:1}
.room-dragon{position:absolute;pointer-events:none;z-index:3;filter:drop-shadow(2px 8px 10px rgba(0,0,0,.35))}
.room-cap{position:absolute;top:18px;left:50%;transform:translateX(-50%);z-index:5;background:rgba(20,8,40,.72);backdrop-filter:blur(4px);
  border:3px solid var(--gold);border-radius:20px;padding:10px 30px;font-family:var(--disp);font-weight:700;font-size:clamp(24px,4vw,44px);color:#fff;
  text-shadow:0 3px 0 var(--purple2);white-space:nowrap}
.room-cap.pop{animation:cappop .6s ease}
@keyframes cappop{0%{transform:translateX(-50%) scale(.6);opacity:0}60%{transform:translateX(-50%) scale(1.08);opacity:1}100%{transform:translateX(-50%) scale(1)}}

/* candy jar */
.candy-pill{display:flex;align-items:center;gap:6px;background:rgba(20,8,40,.7);border:2px solid var(--gold);color:#fff;font:700 18px var(--disp);padding:4px 12px;border-radius:14px;pointer-events:auto}
.candy-pill.bump{animation:rpop .4s ease}
.candy-fly{position:fixed;left:0;top:0;z-index:80;font-size:34px;pointer-events:none}
.pip{cursor:pointer;width:13px;height:13px}.pip:hover{background:#fff}
/* shop */
.shop-item img{width:clamp(130px,16vw,220px)!important;height:clamp(110px,13vw,180px)!important;object-fit:contain}
/* story bubble (7-9) */
#story{position:absolute;right:3%;bottom:13%;z-index:30;display:none;flex-direction:column;align-items:flex-end;gap:4px;pointer-events:none}
#story img{width:clamp(110px,12vw,170px);animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
#story .say{background:#fff;color:var(--ink);font:700 clamp(17px,1.9vw,24px) var(--disp);padding:14px 20px;border-radius:22px 22px 4px 22px;box-shadow:0 8px 24px rgba(0,0,0,.35);width:min(480px,46vw);order:-1;margin-right:40px}
#story.in{animation:storyin .6s cubic-bezier(.3,1.4,.5,1)}
@keyframes storyin{0%{transform:translateX(60px);opacity:0}100%{transform:none;opacity:1}}
#party .party-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* round dots (several rounds inside one page) */
.round-dots{position:absolute;bottom:20px;left:20px;z-index:41;display:none;gap:12px;background:rgba(20,8,40,.55);padding:7px 14px;border-radius:16px;pointer-events:none}
.round-dots span{width:18px;height:18px;border-radius:50%;border:3px solid rgba(255,255,255,.75);transition:.3s}
.round-dots span.done{background:var(--gold);border-color:var(--gold)}
.round-dots span.cur{border-color:var(--orange);box-shadow:0 0 10px var(--orange);transform:scale(1.2)}

/* presentation */
.present-card{background:rgba(255,253,246,.96);border:6px solid #fff;border-radius:30px;padding:20px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:10;cursor:pointer}
.present-card img{width:min(380px,44vh);height:min(320px,38vh);object-fit:contain;display:block}
.present-card.pop{animation:cardpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes cardpop{0%{transform:scale(.3) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* new item highlight in the room */
.hl-dim{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .6s}
.hl-dim.on{opacity:1}
.hl-ring{position:absolute;z-index:5;pointer-events:none;border-radius:50%;border:6px solid var(--gold);box-shadow:0 0 30px 8px rgba(255,198,58,.7),inset 0 0 26px rgba(255,198,58,.5);opacity:0;transition:opacity .5s}
.hl-ring.on{opacity:1;animation:hlpulse 1s ease-in-out infinite}
@keyframes hlpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* cloud for What's missing */
.cloud{position:absolute;left:-22%;right:-22%;top:-18%;bottom:-18%;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 28% 58%,#fff 0 27%,transparent 28%),radial-gradient(circle at 52% 38%,#fff 0 33%,transparent 34%),
  radial-gradient(circle at 76% 56%,#fff 0 27%,transparent 28%),radial-gradient(ellipse 46% 32% at 50% 64%,#fff 0 99%,transparent 100%);
  filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}

/* freeze/act practice cards */
.fz-prac{display:flex;gap:clamp(12px,2.4vw,28px);flex-wrap:wrap;justify-content:center}
.fz-prac .pic-item .lbl{font-family:var(--disp);font-weight:700;color:var(--ink);text-align:center;font-size:18px}
.wiggle{animation:wiggle .5s ease-in-out 3}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.06)}75%{transform:rotate(8deg) scale(1.06)}}

/* 16:9 stage that covers the screen like object-fit:cover — overlays use % of the picture */
.stage{position:absolute;left:50%;top:50%;width:max(100vw,177.78vh);height:max(56.25vw,100vh);transform:translate(-50%,-50%)}
.stage>.room-bg{position:absolute;inset:0;width:100%;height:100%}

/* KNOCK KNOCK doors */
#knock{background:radial-gradient(ellipse at 50% 0%,#4a2a86 0%,#1d0e3a 55%,#0c0518 100%)}
.doors{display:grid;grid-template-columns:repeat(var(--cols,4),auto);gap:clamp(14px,2.4vh,28px) clamp(30px,4vw,70px);z-index:10;margin-top:70px;justify-content:center}
.door{--df:none;position:relative;width:min(9.5vw,17vh);aspect-ratio:276/420;cursor:pointer;perspective:900px}
.door .frame{position:absolute;inset:0;border-radius:50% 50% 6px 6px/33% 33% 6px 6px;background:var(--c2);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.door .inside{position:absolute;inset:7% 9% 0 9%;border-radius:50% 50% 3px 3px/33% 33% 3px 3px;background:radial-gradient(circle at 50% 62%,#ffd27a 0,#c4651c 35%,#3a1608 72%,#140606 100%);overflow:hidden}
.door .who{position:absolute;left:50%;bottom:10%;width:88%;transform:translateX(-50%) translateY(30%) scale(0);transition:transform .5s cubic-bezier(.3,1.7,.5,1);filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.door.open .who{transform:translateX(-50%) translateY(0) scale(1)}
.door .leaf{position:absolute;inset:0;transform-origin:left center;transition:transform 1s cubic-bezier(.5,0,.3,1);
  background:var(--img) center/100% 100% no-repeat;filter:var(--df) drop-shadow(0 8px 14px rgba(0,0,0,.45));z-index:2}
.door .leaf .num{position:absolute;top:66%;left:50%;transform:translateX(-50%);background:#ffe6a6;color:#5a2ea8;font-family:var(--disp);font-weight:700;
  font-size:clamp(20px,2.4vw,32px);width:1.6em;height:1.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.door:not(.open):hover .leaf{filter:var(--df) brightness(1.12) drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.door.knocking .leaf{animation:knockshake .22s 3}
@keyframes knockshake{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg)}70%{transform:rotate(1.6deg)}}
.door.open .leaf{transform:rotateY(-100deg);filter:var(--df) brightness(.7) drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.door .lbl{position:absolute;z-index:3;left:50%;bottom:-46px;transform:translateX(-50%);font-family:var(--disp);font-weight:700;font-size:clamp(18px,2.2vw,28px);color:#fff;
  text-shadow:0 3px 0 var(--purple2);opacity:0;transition:opacity .4s;white-space:nowrap}
.door .lbl.show{opacity:1}

/* PEEKABOO */
#peek{background:#1a0b2e;overflow:hidden}
.peek-clip{position:absolute;inset:0}
.peek-sprite,.peek-out{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));cursor:pointer}
.peek-out{display:none;z-index:4;pointer-events:none}
#peekCap{z-index:6}
#peekShow{position:absolute;bottom:92px;z-index:6}

/* CAULDRON */
#cauldron{background:radial-gradient(ellipse at 50% 35%,#3a1a66,#14072a)}
#cauldTitle img{height:1.15em;vertical-align:-0.25em;margin:0 .1em;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.cauld-row{display:flex;align-items:center;gap:clamp(14px,3vw,40px);z-index:10;margin-top:40px}
.cauld-wrap{position:relative;width:min(440px,46vh);aspect-ratio:480/393}
.cauld-fire{position:absolute;left:36%;width:28%;bottom:-6%;z-index:0;overflow:visible}
.cauld-pot{position:absolute;inset:0;width:100%;height:100%;z-index:1;filter:drop-shadow(0 10px 16px rgba(0,0,0,.45))}
.cauld-pot.potion{filter:none;transition:filter .6s}
#cauldBubbles{position:absolute;inset:0;z-index:2;pointer-events:none}
.cauld-wrap.hit{animation:wobble .4s ease}
@keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-3deg)}70%{transform:rotate(3deg)}}
.bubble{position:absolute;border-radius:50%;background:var(--potion-l,#b6ffb0);opacity:.85;pointer-events:none;animation:bub 1.6s ease-in infinite}
@keyframes bub{0%{transform:translateY(0) scale(.4);opacity:0}20%{opacity:.9}100%{transform:translateY(-70px) scale(1);opacity:0}}
.flame{transform-origin:50% 100%;animation:flick .35s ease-in-out infinite alternate}
@keyframes flick{0%{transform:scaleY(1) scaleX(1)}100%{transform:scaleY(1.18) scaleX(.92)}}
.cauld-count{font-family:var(--disp);font-weight:700;font-size:clamp(70px,10vw,130px);color:var(--gold);text-shadow:0 6px 0 #a8661a,0 0 30px rgba(255,198,58,.6);min-width:1.2em;text-align:center}
.cauld-count.pop{animation:rpop .4s ease}
.cauld-dots{display:flex;gap:8px;justify-content:center;margin-top:4px}
.cauld-dots span{width:20px;height:20px;border-radius:50%;border:3px solid var(--gold)}
.cauld-dots span.on{background:var(--gold)}
.cauld-shelf{display:flex;gap:clamp(12px,2.4vw,28px);z-index:10;margin-top:34px;margin-bottom:70px}
.cauld-item{background:rgba(255,255,255,.92);border:4px solid #fff;border-radius:20px;padding:10px;cursor:grab;touch-action:none;box-shadow:0 8px 18px rgba(0,0,0,.3);transition:transform .12s}
.cauld-item:hover{transform:translateY(-5px)}
.cauld-item img{width:clamp(80px,9vw,120px);height:clamp(70px,8vw,100px);object-fit:contain;pointer-events:none}
.flyer{position:fixed;z-index:70;pointer-events:none;width:clamp(80px,9vw,120px);filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.smoke{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(220,190,255,.7) 60%,rgba(220,190,255,0) 72%);pointer-events:none;z-index:5}
.cauld-popclip{position:absolute;inset:0;z-index:3;pointer-events:none;clip-path:polygon(-50% -150%,150% -150%,150% 21%,-50% 21%)}
.cauld-pop{position:absolute;left:50%;top:4%;width:38%;transform:translateX(-50%);z-index:3;pointer-events:none}

/* FREEZE DANCE */
.fz-dragon{width:min(240px,30vh);filter:drop-shadow(0 10px 14px rgba(0,0,0,.4))}
.fz-dragon.dance{animation:dance .5s ease-in-out infinite alternate}
@keyframes dance{0%{transform:rotate(-10deg) translateY(0)}50%{transform:rotate(0) translateY(-22px)}100%{transform:rotate(10deg) translateY(0)}}
.fz-notes{font-size:34px;height:44px;letter-spacing:18px;opacity:0;transition:opacity .3s}
.fz-notes.on{opacity:1;animation:bob .6s ease-in-out infinite}
.fz-card{display:none;flex-direction:column;align-items:center;background:rgba(255,253,246,.97);border:6px solid var(--gold);border-radius:28px;padding:20px 34px;box-shadow:0 0 40px rgba(255,198,58,.6)}
.fz-card.show{display:flex;animation:rpop .45s ease}
.fz-card .fz-big{font-family:var(--disp);font-weight:700;font-size:clamp(34px,5vw,58px);color:#1b8fd6}
.fz-card img{width:min(280px,34vh);height:min(240px,30vh);object-fit:contain}
.fz-card .fz-do{font-family:var(--disp);font-weight:700;font-size:clamp(20px,2.8vw,30px);color:var(--ink)}

/* SPOT THE DIFFERENCE */
#spotdiff .sd-row{display:flex;gap:clamp(10px,1.6vw,24px);z-index:10;margin-top:40px}
.sd-wrap{position:relative;width:min(47vw,78vh);aspect-ratio:16/9;border:5px solid #fff;border-radius:16px;overflow:hidden;cursor:crosshair;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sd-wrap img{width:100%;height:100%;display:block;pointer-events:none}
.sd-mark{position:absolute;border:4px solid #6fe06f;border-radius:50%;box-shadow:0 0 14px #6fe06f;pointer-events:none;animation:drawcircle .4s ease}
.sd-miss{position:absolute;color:#ff6b6b;font:700 34px var(--disp);transform:translate(-50%,-50%);pointer-events:none;text-shadow:0 2px 4px #000}
.sd-lbl{position:absolute;top:8px;left:10px;background:rgba(20,8,40,.75);color:#fff;font:700 18px var(--disp);padding:2px 12px;border-radius:10px;pointer-events:none}

/* BUILD A MONSTER */
#monster .mon-row{display:flex;gap:clamp(16px,3vw,50px);align-items:center;z-index:10;margin-top:70px}
.mon-stage{position:relative;width:min(52vh,40vw);aspect-ratio:1;background:rgba(255,255,255,.08);border-radius:30px}
.mon-panel{background:rgba(255,253,246,.96);border-radius:24px;padding:18px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mon-panel .r{display:flex;align-items:center;gap:10px;font:700 22px var(--disp);color:var(--ink)}
.mon-panel .r .ic{width:34px;height:34px;object-fit:contain}
.mon-panel .r button{width:42px;height:42px;border-radius:50%;border:none;font:700 24px var(--disp);background:var(--purple);color:#fff;cursor:pointer}
.mon-panel .r b{min-width:28px;text-align:center;font-size:26px}
#monColors{display:flex;gap:10px}
#monColors .mc{width:44px;height:44px;border-radius:50%;border:4px solid #fff;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#monColors .mc.on{border-color:var(--ink);transform:scale(1.15)}
#monTask{position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:12;background:rgba(20,8,40,.78);color:#fff;font:700 clamp(18px,2.4vw,28px) var(--disp);padding:10px 24px;border-radius:18px;border:3px solid var(--gold);max-width:90vw;text-align:center}

/* ANAGRAM */
#anagram .ana-img{width:min(220px,26vh);filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));z-index:10}
.ana-slots{display:flex;gap:10px;margin:18px 0;z-index:10}
.ana-slot{width:clamp(44px,5vw,64px);height:clamp(54px,6vw,76px);border-bottom:5px solid #fff;color:#fff;font:700 clamp(32px,4vw,52px) var(--disp);display:flex;align-items:center;justify-content:center}
.ana-slot.on{color:var(--gold)}
.ana-slot.gap{border-bottom-color:transparent;width:clamp(16px,2vw,28px)}
.ana-slots.win .ana-slot{color:#6fe06f;animation:rpop .5s ease}
.ana-tiles{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;z-index:10}
.ana-tile{width:clamp(50px,5.5vw,70px);height:clamp(50px,5.5vw,70px);border-radius:14px;border:none;background:linear-gradient(180deg,#ffd36a,var(--gold));color:var(--ink);font:700 clamp(28px,3.4vw,42px) var(--disp);box-shadow:0 5px 0 #b8861a;cursor:pointer}
.ana-tile.used{opacity:.25}
.ana-tile.shake{animation:wshake .4s ease}

/* BOARD GAME */
#board{background:#0b0718}
.bsq{position:absolute;width:3.8%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,248,230,.92);border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.bsq img{width:80%;height:80%;object-fit:contain}
.bsq span{font:700 clamp(10px,1.1vw,18px) var(--disp);color:var(--purple2)}
.bsq.sp{background:#ffe6a6;border-color:#ff8a1e}.bsq.end{width:4.6%;background:#6fe06f;border-color:#fff}
.bsq::after{content:attr(data-n);position:absolute;bottom:-38%;font:700 clamp(9px,.8vw,13px) var(--disp);color:#fff;text-shadow:0 1px 3px #000}
.bpawn{position:absolute;width:4.6%;transform:translate(-50%,-92%);z-index:5;transition:left .25s,top .25s;display:flex;flex-direction:column;align-items:center}
.bpawn img{width:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.bpawn span{margin-top:-4px;background:rgba(20,8,40,.85);color:#fff;font:700 clamp(10px,.9vw,14px) var(--disp);padding:1px 7px;border-radius:8px;white-space:nowrap}
.bpawn.cur img{filter:drop-shadow(0 0 10px var(--gold)) drop-shadow(0 6px 6px rgba(0,0,0,.6))}
.bp-col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bp-name{width:clamp(90px,9vw,140px);font:700 18px var(--disp);text-align:center;border-radius:10px;border:3px solid #fff;padding:5px;color:var(--ink);visibility:hidden}
.bp-col.on .bp-name{visibility:visible}.bp-col.on .bp-opt{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold)}
#boardWhoName{color:#fff;font:700 20px var(--disp)}
.board-ui{position:absolute;right:20px;bottom:90px;z-index:12;display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(20,8,40,.8);padding:14px 18px;border-radius:20px;border:3px solid var(--gold)}
.board-ui img.who{width:70px}
#diceBtn{font-size:74px;line-height:1;background:#fff;border:none;border-radius:16px;width:96px;height:96px;cursor:pointer;color:var(--ink);box-shadow:0 5px 0 #aaa}
#boardPick{position:absolute;inset:0;z-index:13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,4,25,.6)}
#boardPawns{display:flex;gap:18px}
.bp-opt{background:rgba(255,255,255,.92);border:5px solid #fff;border-radius:20px;padding:10px;cursor:pointer}
.bp-opt img{width:clamp(70px,8vw,120px);height:clamp(90px,10vw,150px);object-fit:contain}
.bp-opt.on{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold)}
#boardCard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:14;background:rgba(255,253,246,.98);border:6px solid var(--gold);border-radius:28px;padding:18px 34px;display:flex;flex-direction:column;align-items:center;gap:8px;transition:.3s}
#boardCard.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
#boardCard img{width:min(220px,28vh);height:min(200px,25vh);object-fit:contain}
#boardCardT{font:700 clamp(24px,3vw,38px) var(--disp);color:var(--purple2);text-align:center}

/* emotions big row */
.emo-big-row{display:flex;gap:clamp(16px,4vw,50px);justify-content:center;z-index:10;flex-wrap:wrap;margin-top:10px}

/* I like */
.like-stage{display:flex;flex-direction:column;align-items:center;gap:18px;z-index:10}
.like-card{background:rgba(255,255,255,.95);border:5px solid #fff;border-radius:26px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.3)}
.like-card img{width:min(210px,28vw);height:min(210px,28vw);object-fit:contain}
.like-thumbs{display:flex;gap:40px}
.thumb{font-size:58px;cursor:pointer;transition:transform .12s;background:none;border:none}
.thumb:hover{transform:scale(1.2)}
.thumb.chosen{animation:thumbpop .8s ease}
@keyframes thumbpop{0%{transform:scale(1)}35%{transform:scale(1.6)}100%{transform:scale(1)}}

/* bonus screen */
#bonus-screen{background:radial-gradient(ellipse at 50% 30%,#3a1a66,#1a0b2e)}
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;z-index:10}
.mem-txt{font:700 clamp(18px,1.8vw,26px) var(--disp);color:var(--ink);text-align:center;padding:6px;line-height:1.15}
.mem-card{position:relative;width:clamp(90px,10vw,140px);height:clamp(80px,9vw,120px);perspective:600px;cursor:pointer}
.mem-face{position:absolute;inset:0;border-radius:16px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden;transition:transform .4s;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.mem-back{background:linear-gradient(180deg,#9d6cff,var(--purple2));font-size:44px}
.mem-front{background:#fff;transform:rotateY(180deg)}
.mem-front img{width:80%;height:80%;object-fit:contain}
.mem-card.flip .mem-back{transform:rotateY(180deg)}
.mem-card.flip .mem-front{transform:rotateY(360deg)}
.mem-card.done{opacity:.45}

/* confetti/toast */
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}.conf{position:absolute;width:12px;height:12px;opacity:0}
.done-check{position:absolute;bottom:62px;right:18px;transform:translateY(20px);z-index:45;background:linear-gradient(180deg,#6fe06f,#3a9c3a);color:#fff;font-family:var(--disp);font-weight:700;font-size:20px;padding:8px 24px;border-radius:16px;box-shadow:0 6px 18px rgba(58,156,58,.5);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none}
.done-check.show{opacity:1;transform:translateY(0)}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:50;font-family:var(--disp);font-weight:700;font-size:clamp(28px,5vw,54px);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);opacity:0;pointer-events:none;text-align:center}
.toast.show{animation:tpop 1.2s ease-out}@keyframes tpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(1)}}

/* finish */
#finish-screen{background:radial-gradient(ellipse at 50% 30%,#3a1266,#10061f)}
.photo-frame{position:relative;z-index:10;background:#fff;border-radius:18px;padding:14px 14px 50px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:rotate(-2deg);max-width:88vw}
.photo-frame img{width:min(720px,80vw);height:auto;border-radius:8px;display:block}
.photo-frame .cap{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-family:'Fredoka',cursive;font-weight:700;font-size:22px;color:#5a2ea8}
.finish-actions{display:flex;gap:14px;margin-top:22px;z-index:10;flex-wrap:wrap;justify-content:center}
@media(max-width:820px){.mem-grid{grid-template-columns:repeat(4,1fr)}.choice img{width:120px;height:120px}}
</style>

const PLAN_HTML="<!DOCTYPE html><html lang=\"ru\"><head><meta charset=\"UTF-8\"><title>План урока — Halloween 7–9 — advanced<\/title><style>body{font-family:'Segoe UI',Arial,sans-serif;background:#f5f0fa;color:#2a1550;padding:24px;max-width:1050px;margin:0 auto;line-height:1.5}\nh1{color:#5a2ea8;font-size:26px}.meta,.voc{background:#fff;border-radius:12px;padding:14px 18px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08)}.meta b{color:#5a2ea8}\ntable{width:100%;border-collapse:collapse;margin:14px 0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.1)}\nth{background:#7b4bd6;color:#fff;padding:10px 12px;text-align:left;font-size:14px}td{padding:10px 12px;border-bottom:1px solid #eee;vertical-align:top;font-size:14px}\ntr:nth-child(even){background:#faf7fe}.pg{font-weight:700;color:#e8631a;font-size:18px;text-align:center;width:50px}.tl{color:#1a7a3a;font-style:italic;width:24%}.sa{color:#1f5fa8;font-style:italic;width:24%}<\/style><\/head><body><h1>🎃 План урока: Halloween 7–9 — advanced<\/h1><p class=\"dl\" style=\"margin:0 0 14px\"><a href=\"https://classroom.wowteach.ru/lessons/halloween/plans/halloween_7-9_advanced.docx\" download style=\"display:inline-block;margin:0 8px 0 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none\">⬇ Скачать план (Word)<\/a><a href=\"https://classroom.wowteach.ru/lessons/halloween/plans/halloween_7-9_advanced.pdf\" download style=\"display:inline-block;margin:0 8px 0 0;padding:8px 16px;border-radius:10px;background:#e8631a;color:#fff;font-weight:700;text-decoration:none;background:#7b4bd6\">⬇ Скачать план (PDF)<\/a><\/p><div class=\"meta\"><b>Длительность:<\/b> 35–40 мин. &nbsp; <b>Мотивация:<\/b> украшаем комнату к Хэллоуину — за каждую игру новое украшение, в конце фото.<\/div><table><tr><th>Стр.<\/th><th>Задание и инструкция<\/th><th>Teacher's language<\/th><th>Suggested answers / Students' answers<\/th><\/tr><tr><td class=\"pg\">1<\/td><td><b>Warm-up.<\/b> Картинка хэллоуинской улицы. На экране ничего не написано — вопросы задаёт учитель.<\/td><td class=\"tl\">\"What can you see?\" \"What is the witch doing?\" \"What holiday is it?\"<\/td><td class=\"sa\">\"There is a witch on a broom. There are bats in the sky.\" \"She is flying.\" \"It's Halloween!\"<\/td><\/tr><tr><td class=\"pg\">2<\/td><td><b>Новые слова<\/b> (8). Появляется картинка — учитель называет слово, ученик повторяет. Следующее слово — Next или нажатие на картинку.<\/td><td class=\"tl\">\"Look! It's a vampire. He's scary! Say: vampire!\"<\/td><td class=\"sa\">\"Vampire!\" \"It's a vampire. He's scary.\"<\/td><\/tr><tr><td class=\"pg\">3<\/td><td><b>Комната.<\/b> Пустая комната. Прилетает привидение Boo и просит помочь украсить комнату к вечеринке. За каждую игру в комнате появляется украшение.<\/td><td class=\"tl\">\"This is the room. Is it nice? Let's decorate it for Halloween!\"<\/td><td class=\"sa\">\"It's empty!\" \"Let's decorate it!\"<\/td><\/tr><tr><td class=\"pg\">4<\/td><td><b>Волшебный туман (8 раундов — все слова).<\/b> Туман медленно рассеивается, ученик угадывает как можно раньше. Угадал — нажмите на картинку или 👀. Просите ответ с прилагательным. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"What is it? Describe it.\"<\/td><td class=\"sa\">\"It's a big black spider!\" \"It's a scary haunted house.\"<\/td><\/tr><tr><td class=\"pg\">5<\/td><td><b>Knock, knock! (8 дверей — все слова).<\/b> Двери разных цветов, без номеров: ученик выбирает дверь по цвету, учитель нажимает — персонаж выпрыгивает. Подписей нет: ученик сам называет его. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Which door do you want?\" \"Knock, knock! Who's there? Is it scary?\"<\/td><td class=\"sa\">\"The yellow door, please!\" \"It's a vampire. He's scary!\"<\/td><\/tr><tr><td class=\"pg\">6<\/td><td><b>Фонарик (3 раунда).<\/b> Экран тёмный, картинки спрятаны. Учитель водит фонарик мышкой, ученик говорит, куда светить. Нашли — нажмите на картинку. Вверху — загадка-описание, ученик читает её и ищет. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Read the riddle. What is it? Where is it?\"<\/td><td class=\"sa\">\"It's black. It's got eight legs. It's a spider!\" \"Go left!\"<\/td><\/tr><tr><td class=\"pg\">7<\/td><td><b>Peekaboo (6 раундов — все персонажи).<\/b> Персонаж прячется в комнате: за шкафом, под кроватью, за дверью, в окне. Видно только кусочек — ученик угадывает. Нажмите на персонажа или 👀. Ученик говорит, кто прячется и <b>где<\/b>. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Who's hiding? Where is it?\"<\/td><td class=\"sa\">\"The bat is behind the door.\" \"The cat is under the bed.\"<\/td><\/tr><tr><td class=\"pg\">8<\/td><td><b>Найди отличия (6).<\/b> Две картинки. Ученик ищет отличия, учитель нажимает на найденное (на любой картинке) — отличие обводится на обеих. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"What's different? Compare the pictures.\"<\/td><td class=\"sa\">\"In picture 1 the cat is under the bench. In picture 2 it's on the bench.\" \"In picture 1 there are two bats. In picture 2 there is one bat.\" \"In picture 2 there isn't a spider.\" \"In picture 1 the broom is next to the door. In picture 2 it's on the roof.\"<\/td><\/tr><tr><td class=\"pg\">9<\/td><td><b>Собери монстра (3 раунда + свой монстр).<\/b> Вверху задание. Ученик собирает монстра кнопками: цвет, глаза, руки, ноги, рога. ✓ — проверить. В конце ученик собирает своего монстра.<\/td><td class=\"tl\">\"Read and make the monster.\" \"Describe your monster.\"<\/td><td class=\"sa\">\"My monster is purple. It has got four eyes, four arms and two horns.\"<\/td><\/tr><tr><td class=\"pg\">10<\/td><td><b>Анаграмма (8 слов).<\/b> Картинка-подсказка и перепутанные буквы. Ученик называет буквы по порядку, учитель нажимает. <b>Если ученик ещё не читает<\/b> — пусть просто назовёт слово по картинке, а учитель соберёт его кнопкой Next (одна буква за нажатие). После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Spell the word!\"<\/td><td class=\"sa\">\"Vampire! V-A-M-P-I-R-E.\"<\/td><\/tr><tr><td class=\"pg\">11<\/td><td><b>I like / I don't like (8 карточек — все слова).<\/b> Ученик отвечает, учитель нажимает 👍 или 👎. Конфета даётся за любой ответ. Обязательно с причиной. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Do you like spiders? Why?\"<\/td><td class=\"sa\">\"I don't like spiders because they are scary.\" \"I like bats because they can fly.\"<\/td><\/tr><tr><td class=\"pg\">12<\/td><td><b>Настольная игра «Дом с привидениями».<\/b> Выберите от 1 до 5 фишек (ученики и учитель) и подпишите имена под фишками, потом ▶. Кидаем кубик (🎲 или Next), фишка идёт сама. На клетке с картинкой — ответить на вопрос о ней. ⭐ — показать действие, ⏩ — вперёд на 2, ⏪ — назад на 2. Кто первым дойдёт до дома — победил. После игры загорается Next — откроется комната, новое украшение подсветится. Спросите «What's new?». Кружочки вверху — раунды.<\/td><td class=\"tl\">\"Roll the dice!\" \"Can it fly?\" \"How many legs has it got?\" \"Your turn!\"<\/td><td class=\"sa\">\"Yes, it can.\" \"It has got eight legs.\"<\/td><\/tr><tr><td class=\"pg\">13<\/td><td><b>Бонусные игры (если есть время).<\/b> Можно сыграть во все или сразу нажать Finish 🏁. После игры — 🎁: в комнате новое украшение, «🎮 ←» — назад к списку игр.<br>• <b>Dance<\/b>: сначала 4 карточки — учитель показывает движение, ученик повторяет. ▶ — музыка, скелет танцует, ученик тоже; музыка остановилась — появляется картинка, ученик показывает движение.<br>• <b>Memory<\/b>: пары «картинка — слово».<br>• <b>Shadows<\/b>: найти тень (4 раунда).<\/td><td class=\"tl\">\"Let's dance!\" \"Stop! What is it? Show me!\" \"Find the pairs!\"<\/td><td class=\"sa\">\"It's a bat. It can fly!\"<\/td><\/tr><tr><td class=\"pg\">14<\/td><td><b>Подарок за конфеты.<\/b> Вверху — сколько конфет собрал ученик (🍬 падает за каждый правильный ответ). Сколько бы ни собрал — выбирает один подарок в комнату: котёл, шарики или подарки. Новое украшение подсветится.<\/td><td class=\"tl\">\"How many candies have you got? What would you like for your room? Why?\"<\/td><td class=\"sa\">\"I've got 25 candies. I'd like the cauldron because it's magic.\"<\/td><\/tr><tr><td class=\"pg\">15<\/td><td><b>Вечеринка Boo.<\/b> Привидение Boo благодарит за помощь, гости танцуют. Спросите, кого ученик видит на вечеринке.<\/td><td class=\"tl\">\"Who is at the party? What are they doing?\"<\/td><td class=\"sa\">\"The skeleton is dancing. The ghost is flying.\"<\/td><\/tr><tr><td class=\"pg\">16<\/td><td><b>Финал.<\/b> Фото комнаты с выбранным подарком. «Save photo» — скачать и отправить родителям. ← — назад.<\/td><td class=\"tl\">\"Look at your room! Happy Halloween!\"<\/td><td class=\"sa\">\"Happy Halloween!\" \"Thank you!\"<\/td><\/tr><\/table><div class=\"voc\"><b>🗂️ Лексика и грамматика:<\/b> ghost, spider, witch, skeleton, vampire, mummy, broom, haunted house • scary, big, small, tall • There is / There are • in, on, under, behind, next to • has got • I like … because …<\/div><div class=\"voc\" style=\"font-size:13px;color:#777\"><b>Навигация:<\/b> ← → — назад / пропустить; Next загорается, когда задание выполнено, а в играх с раундами ведёт к следующему раунду. 📋 — этот план, 🎵 — музыка. Кружочки страниц вверху слева кликабельны — можно сразу перейти на любую страницу. 🍬 вверху справа — копилка: за каждый правильный ответ ученику падает конфета.<\/div><div class=\"voc\"><b>🏠 Домашнее задание<\/b> — материал <b>«Halloween Homework · 7–9 · advanced»<\/b> на платформе: «Материалы» → «Задать ДЗ» → ученик → отметить. Только слова урока, 10–15 минут. Задания:<ol style=\"margin:6px 0 0 22px\"><li>Карточки со звуком<\/li><li>Соедини слово и картинку<\/li><li>Собери слово из букв<\/li><li>There is / There are<\/li><li>in / on / under<\/li><li>Верно / неверно по картинке<\/li><li>🎤 Расскажи про комнату<\/li><\/ol><div style=\"color:#777;font-size:13px;margin-top:4px\">Устные задания ученик записывает голосом — их вы слушаете и оцениваете в «Проверке ДЗ».<\/div><\/div><\/body><\/html>";
document.getElementById('bgMusic').src=MUSIC;

<script>"use strict";
/* ===== Halloween Lesson Engine v2 (ages 4-6) ===== */
const LEVEL="cont";
const room={};           // room.dragon = chosen costume
/* Room chain: room_00 (empty) ... room_10 (fully decorated). Each task opens the next picture. */
const ROOM_COUNT=12;
let ROOM_NEW=[];  // set from the level config
/* where the new thing of each room is (x0,y0,x1,y1 in % of the picture) — for the highlight */
const ROOM_HL=[null,[3,0,97,16],[24.5,8.5,35.5,31],[7.4,42.3,20.7,51.9],[51.8,21.5,66.9,35.3],[77,21.9,82.4,53],[85,19.6,92.6,77],[36.5,20,46.8,43.8],[67,42.8,71.7,51.3],[46.3,20.2,52.8,34],[22.1,24.7,25.5,32.3],[67.5,62,74.5,69.5]];
let roomLevel=0;          // highest room already opened
let revealCtx=null;       // {onContinue} while a new room is on screen

/* ---- sound fx ---- */
let ac=null,sfxOn=true;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return ac;}
function tone(f,d,t,v,sl){if(!sfxOn)return;const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain();
  o.type=t||"sine";o.frequency.setValueAtTime(f,c.currentTime);if(sl)o.frequency.exponentialRampToValueAtTime(sl,c.currentTime+d);
  g.gain.setValueAtTime(v||.1,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);
  o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d+.02);}
let sRight=()=>{tone(660,.08,"square",.1);setTimeout(()=>tone(990,.14,"square",.1),80);};
const sWrong=()=>tone(200,.22,"sawtooth",.1,150);
const sPick=()=>tone(700,.08,"triangle",.1);
const sPop=()=>{tone(500,.08,"sine",.1,760);setTimeout(()=>tone(300,.08,"sine",.1),80);};
const sReveal=()=>{tone(523,.1,"sine",.1);setTimeout(()=>tone(784,.14,"sine",.1),100);};
function sCheer(){[523,659,784,1046,1319].forEach((f,i)=>setTimeout(()=>tone(f,.18,"triangle",.11),i*100));}

/* ---- background music (real mp3) ---- */
let musicOn=true;
let musicVol=0.18;
function playMusic(){const a=$("bgMusic");if(!musicOn)return;try{a.volume=musicVol;a.play().catch(()=>{});}catch(e){}}
function setMusicVol(v){musicVol=v;const a=$("bgMusic");if(a)a.volume=v;}
function stopMusic(){try{$("bgMusic").pause();}catch(e){}}

/* ---- confetti / toast ---- */
function confetti(){const wrap=$("confetti");const colors=["#ffc63a","#ff8a1e","#7b4bd6","#4fc04f","#ff6fae"];
  for(let i=0;i<40;i++){const c=document.createElement("div");c.className="conf";c.style.left=Math.random()*100+"vw";c.style.background=colors[i%colors.length];c.style.borderRadius=Math.random()<.5?"50%":"2px";
    c.animate([{transform:"translateY(-10vh) rotate(0)",opacity:1},{transform:"translateY(110vh) rotate("+(360+Math.random()*360)+"deg)",opacity:.9}],{duration:2000+Math.random()*1300,delay:Math.random()*300,easing:"linear"});
    wrap.appendChild(c);setTimeout(()=>c.remove(),3500);}}
function toast(t,c){const el=$("toast");el.textContent=t;el.style.color=c||"#fff";el.classList.remove("show");void el.offsetWidth;el.classList.add("show");}

/* ================= STEP SYSTEM =================
   Each step has an id + config. Navigation: Back / Next (skip) always available to teacher.
   Rewards are chosen with a "Continue" button (look first, then continue). */
let steps=[], stepIdx=0;
function buildSteps(){
  steps=[
    {page:1, id:"wu-topic"},
    {page:2, id:"present"},
    {page:3, id:"roomintro"},
    {page:4, id:"fog", rounds:8, room:1},
    {page:5, id:"knock", room:2},
    {page:6, id:"spotlight", rounds:3, room:3},
    {page:7, id:"peek", rounds:8, room:4},
    {page:8, id:"spotdiff", room:5},
    {page:9, id:"monster", room:6},
    {page:10, id:"anagram", room:7},
    {page:11, id:"ilike", room:8},
    {page:12, id:"board", room:9},
    {page:13, id:"iftime"},
    {page:14, id:"finish"}
  ];
  const fin=steps.pop();
  if(ASSETS.shop_a)steps.push({id:"shop"});
  if(ASSETS.party)steps.push({id:"party"});
  steps.push(fin);steps.forEach((x,k)=>x.page=k+1);
}
/*MARKER*/
/* ---- step completion + center Next ---- */
let stepComplete=false;
let roundNext=null;   // set by a multi-round game: what the big Next does before the game is finished
function markStepDone(){
  stepComplete=true;
  const nb=$("navNextMain");
  if(nb){nb.classList.add("ready");nb.textContent="Next 👉";}
  sReveal();
  // show a gentle "done" check
  const chk=$("doneCheck");if(chk){chk.classList.add("show");}
}
function resetStepDone(){
  stepComplete=false;
  const nb=$("navNextMain");if(nb){nb.classList.remove("ready");nb.textContent="Next 👉";}
  const chk=$("doneCheck");if(chk){chk.classList.remove("show");}
}

function updatePips(){const pips=$("pips");pips.innerHTML="";
  for(let i=0;i<steps.length;i++){const d=document.createElement("div");d.className="pip"+(i<stepIdx?" done":(i===stepIdx?" cur":""));pips.appendChild(d);}
  if(typeof pipsClickable==="function")pipsClickable();}
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id+"-screen")?$(id+"-screen").classList.add("active"):$(id).classList.add("active");}
function setPageNum(p){const el=$("pageNum");if(el)el.textContent=p+" / "+steps.length;}

function goStep(i){
  if(i<0)i=0; if(i>=steps.length)i=steps.length-1;
  stepIdx=i;updatePips();resetStepDone();
  const st=steps[i];st._roomShown=false;revealCtx=null;roundNext=null;stopSpot();clearGameTimers();freezeCleanup();setDots(0);hideHighlight();$("confetti").innerHTML="";storySay(null);
  $("topbar").style.display="flex";$("navbar").style.display="flex";$("roomGames").style.display="none";
  // on the bonus menu there is no big Next (it was mixed up with "finish") — only the arrows and the Finish button
  $("navNextMain").style.display=(st.id==="iftime")?"none":"";
  setPageNum(st.page);
  const map={"wu-topic":setupTopic,"wu-emo":setupEmo,"wu-costume":setupCostume,"present":setupPresent,
    "roomintro":setupRoomIntro,"shop":setupShop,"party":setupParty,"fog":setupFog,"miming":setupMiming,"circle":setupCircle,"spotlight":setupSpotlight,
    "odd":setupOdd,"howmany":setupHowMany,"knock":setupKnock,"spotdiff":setupSpotDiff,"monster":setupMonster,"anagram":setupAnagram,"board":setupBoard,"peek":setupPeek,"cauldron":setupCauldron,"ilike":setupILike,"missing":setupMissing,"iftime":setupIfTime,"finish":setupFinish};
  (map[st.id]||(()=>{}))(st);
}
function nextStep(){goStep(stepIdx+1);}
/* round dots: several rounds inside one page */
function setDots(total,done){const el=$("roundDots");if(!total){el.style.display="none";el.innerHTML="";return;}
  el.style.display="flex";el.innerHTML="";
  for(let i=0;i<total;i++){const d=document.createElement("span");d.className=i<done?"done":(i===done?"cur":"");el.appendChild(d);}}
function prevStep(){goStep(stepIdx-1);}

/* ---- screens ---- */
function setupTopic(st){$("wuTopicBg").src=img("warmup7");showScreen("wu-topic");}

function setupEmo(st){
  // 3 big pumpkins, choose one (no overlay)
  const box=$("emoBigRow");box.innerHTML="";
  [["emo_happy","happy"],["emo_sad","sad"],["emo_angry","angry"]].forEach(([k,en])=>{
    const d=document.createElement("div");d.className="choice";
    d.innerHTML='<img src="'+img(k)+'"><span class="lbl">'+en+'</span>';
    d.onclick=()=>{sPick();box.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));d.classList.add('sel');};
    box.appendChild(d);
  });
  showScreen("wu-emo");
}

function setupCostume(st){
  const box=$("costumeChoices");box.innerHTML="";
  [["dragon_vampire","Vampire 🧛"],["dragon_ghost","Ghost 👻"],["dragon_pumpkin","Pumpkin 🎃"]].forEach(([k,lbl])=>{
    const d=document.createElement("div");d.className="choice";
    d.innerHTML='<img src="'+img(k)+'"><span class="lbl">'+lbl+'</span>';
    d.onclick=()=>{sPick();box.querySelectorAll('.choice').forEach(c=>c.classList.remove('sel'));d.classList.add('sel');room["dragon"]=k;sPop();};
    box.appendChild(d);
  });
  showScreen("wu-costume");
}

let presentIdx=0;
function setupPresent(st){presentIdx=0;showScreen("present");showPresentWord();}
function showPresentWord(){
  const wd=WORDS[presentIdx];
  $("presentImg").src=img(wd.key);$("presentWord").textContent=wd.word;
  const c=$("presentCard");c.classList.remove("pop");void c.offsetWidth;c.classList.add("pop");later(()=>charSound(wd.word),250);
  setDots(WORDS.length,presentIdx);
  if(presentIdx===WORDS.length-1)later(markStepDone,600);
}
function presentNext(){if(presentIdx<WORDS.length-1){presentIdx++;showPresentWord();return true;}return false;}
$("presentCard").onclick=presentNext;

/* MAGIC FOG — thick fog clears very slowly; child guesses as early as possible */
let fogState=null;
function setupFog(st){fogState={done:0,total:WORDS.length,order:shuffle(WORDS),busy:false,raf:0};showScreen("fog");roundNext=fogRoundNext;nextFog();}
function nextFog(){
  const fs=fogState,wd=fs.order[fs.done];fs.busy=false;
  const fog=$("fogFog"),im=$("fogImg");
  fog.style.transition="none";im.style.transition="none";fog.style.opacity="1";im.style.filter="blur(28px)";
  $("fogWord").classList.remove("show");$("fogWord").textContent=wd.word;$("fogShow").style.display="";
  setDots(fs.total,fs.done);
  const nim=Object.assign(new Image(),{crossOrigin:'anonymous'});nim.onload=()=>{im.src=nim.src;};nim.src=img(wd.key);
  void fog.offsetWidth;
  // the fog thins out little by little over FOG_SECONDS (driven frame by frame, so it works in every browser)
  cancelAnimationFrame(fs.raf);const t0=performance.now()+300;
  const step=now=>{
    if(fs.busy||!$("fog").classList.contains("active"))return;
    const t=Math.max(0,Math.min(1,(now-t0)/(FOG_SECONDS*1000))),e=Math.pow(t,1.15);
    fog.style.opacity=String(1-e);im.style.filter="blur("+(28*(1-e)).toFixed(1)+"px)";
    if(t<1)fs.raf=requestAnimationFrame(step);};
  fs.raf=requestAnimationFrame(step);
}
const FOG_SECONDS=6;
function revealFog(){
  const fs=fogState;if(!fs||fs.busy)return;fs.busy=true;cancelAnimationFrame(fs.raf);
  const fog=$("fogFog"),im=$("fogImg");
  fog.style.transition="opacity .9s ease";im.style.transition="filter .9s ease";fog.style.opacity="0";im.style.filter="blur(0px)";
  $("fogShow").style.display="none";
  const wdF=fs.order[fs.done];later(()=>{$("fogWord").classList.add("show");sRight();charSound(wdF.word);},700);
  fs.done++;
  if(fs.done>=fs.total)later(()=>{setDots(fs.total,fs.done);markStepDone();},1500);
  else later(nextFog,3000);
}
$("fogShow").onclick=revealFog;
function fogRoundNext(){if(!fogState.busy)revealFog();}$("fogCard").onclick=revealFog;

/* CIRCLE IT — multiple rounds */
let roundState={};
function setupCircle(st){
  roundState={done:0,total:st.rounds||3,reward:st.reward};
  nextCircleRound();
  showScreen("circle");
}
function nextCircleRound(){
  const target=WORDS[Math.floor(Math.random()*WORDS.length)];
  $("circleTitle").textContent="Circle the "+target.word+"! ⭕ ("+(roundState.done+1)+"/"+roundState.total+")";
  const grid=$("circleGrid");grid.innerHTML="";
  const order=WORDS.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  order.forEach(wd=>{const d=document.createElement("div");d.className="pic-item";
    d.innerHTML='<img src="'+img(wd.key)+'"><div class="circle-mark"></div>';
    d.onclick=()=>{
      if(wd.key===target.key){sRight();d.classList.add("right");
        roundState.done++;
        if(roundState.done>=roundState.total){setTimeout(markStepDone,700);}
        else setTimeout(nextCircleRound,900);
      }else{sWrong();d.classList.add("wrong");setTimeout(()=>d.classList.remove("wrong"),400);}
    };grid.appendChild(d);});
  
}


/* SPOTLIGHT — the screen is dark; pictures are hidden in different places.
   The teacher moves the light with the mouse (when the mouse rests, the light wanders by itself).
   Tap the right picture when it is in the light. */
const spot={raf:0,x:0,y:0,tx:0,ty:0,r:120,manualUntil:0,wanderAt:0,paused:false,target:null,last:0,done:0,total:4,order:[]};
const SPOT_DECOYS=["pumpkin_big","candy"];
function setupSpotlight(st){
  spot.done=0;spot.total=st.rounds||3;spot.order=shuffle(WORDS);
  showScreen("spotlight");
  const o=$("spotlight-screen").getBoundingClientRect();
  spot.x=spot.tx=o.width*0.5;spot.y=spot.ty=o.height*0.5;spot.paused=false;spot.manualUntil=0;spot.wanderAt=0;spot.last=0;
  nextSpotRound();
  roundNext=()=>{if(spot.paused)return;const it=[...$("spotField").children].find(c=>c.dataset.key===spot.target.key);
    if(it){spot.tx=parseFloat(it.style.left);spot.ty=parseFloat(it.style.top);spotCheck(it);}};
  cancelAnimationFrame(spot.raf);spot.raf=requestAnimationFrame(spotLoop);
}
function stopSpot(){cancelAnimationFrame(spot.raf);spot.raf=0;}
function nextSpotRound(){
  const target=spot.order[spot.done];spot.target=target;
  $("spotTitle").textContent=LEVEL==="beg"?"Find the "+target.word+"! 🔦":target.riddle+" 🔦";
  setDots(spot.total,spot.done);
  const field=$("spotField"),o=field.getBoundingClientRect();field.innerHTML="";
  const keys=shuffle([target.key].concat(shuffle(WORDS.filter(w=>w!==target)).slice(0,5).map(w=>w.key)));
  const iw=Math.min(170,Math.max(110,o.width*0.11)),pts=[];
  keys.forEach(k=>{
    let best=null;
    for(let t=0;t<200;t++){ // random places, not too close to each other, away from the title and the buttons
      const x=o.width*(0.08+Math.random()*0.84),y=o.height*(0.26+Math.random()*0.52);
      const dmin=Math.min(...pts.map(p=>Math.hypot(p[0]-x,p[1]-y)),1e9);
      if(!best||dmin>best[2])best=[x,y,dmin];
      if(dmin>iw*1.55)break;}
    pts.push(best);
    const im=document.createElement("img");im.className="spot-item";im.src=img(k);im.dataset.key=k;
    im.style.left=best[0]+"px";im.style.top=best[1]+"px";im.style.width=iw+"px";
    im.onclick=()=>{spot.tx=best[0];spot.ty=best[1];spotCheck(im);};
    field.appendChild(im);});
  spot.paused=false;$("spotRing").className="spot-ring";
}
function spotLoop(ts){
  if(!$("spotlight-screen").classList.contains("active")){spot.raf=0;return;}
  const dt=spot.last?Math.min(50,ts-spot.last):16;spot.last=ts;
  const o=$("spotlight-screen").getBoundingClientRect();
  spot.r=Math.max(95,Math.min(150,o.width*0.085));
  const now=performance.now();
  // фонарь сам не бродит: стоит, где его оставили (решение Анны от 22.10.2026)
  const k=1-Math.pow(now<spot.manualUntil?0.8:0.965,dt/16);spot.x+=(spot.tx-spot.x)*k;spot.y+=(spot.ty-spot.y)*k;
  const dark=$("spotDark");dark.style.setProperty("--x",spot.x+"px");dark.style.setProperty("--y",spot.y+"px");dark.style.setProperty("--r",spot.r+"px");
  const ring=$("spotRing");ring.style.left=spot.x+"px";ring.style.top=spot.y+"px";ring.style.width=ring.style.height=(spot.r*2)+"px";
  spot.raf=requestAnimationFrame(spotLoop);
}
function spotCheck(item){
  if(spot.paused||spot.done>=spot.total)return;
  const ring=$("spotRing");
  if(item.dataset.key===spot.target.key){
    spot.paused=true;spot.manualUntil=performance.now()+1e6;
    sRight();later(()=>charSound((WORDS.find(w=>w.key===item.dataset.key)||{}).word),250);item.classList.add("right");ring.className="spot-ring ok";spot.done++;setDots(spot.total,spot.done);
    if(spot.done>=spot.total)later(markStepDone,700);
    else later(()=>{spot.manualUntil=0;nextSpotRound();},1600);
  }else{
    sWrong();ring.className="spot-ring bad";item.classList.add("wrong");
    later(()=>{item.classList.remove("wrong");ring.className="spot-ring";},500);
  }
}
$("spotlight-screen").addEventListener("pointermove",e=>{
  if(e.pointerType==="touch"||spot.paused)return;
  const o=$("spotlight-screen").getBoundingClientRect();spot.tx=e.clientX-o.left;spot.ty=e.clientY-o.top;spot.manualUntil=performance.now()+2500;});


/* timers of the new games — cleared on every page change */

function clearGameTimers(){gameTimers.forEach(clearTimeout);gameTimers=[];}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sKnock=()=>[0,230,460].forEach(t=>setTimeout(()=>tone(150,.1,"triangle",.3,70),t));
const sCreak=()=>tone(170,.8,"sawtooth",.035,330);

/* [door picture, colour filter] — purple, orange, green, blue, red, pink, yellow, grey */

/* PEEKABOO — a creature hides in the room, only a part of it peeks out */
const PEEK_SPOTS=[
  {id:"wardrobe",where:"behind the wardrobe",clip:"polygon(0 0,76.3% 0,76.3% 100%,0 100%)",left:76.4,top:30,w:11,peek:[-55,0],rot:-10,edge:"left"},
  {id:"bed",where:"under the bed",clip:"polygon(66.5% 63.6%,76.2% 63.6%,76.2% 71%,66.5% 71%)",left:71.3,top:71,w:8,peekY:6.5,rot:0},
  {id:"door",where:"behind the door",clip:"polygon(0 0,91.3% 0,91.3% 100%,0 100%)",left:91.4,top:33,w:11,peek:[-50,0],rot:-10,edge:"left"},
  {id:"window",where:"at the window",clip:"polygon(5% 4.5%,17.3% 4.5%,17.3% 41.5%,5% 41.5%)",left:11.2,top:41.8,w:9,peekY:9,rot:0}
];
let peekState=null;
function setupPeek(st){
  $("peekBg").src=img(roomKey(roomLevel));
  const spots=shuffle(PEEK_SPOTS);
  const pw=shuffle(CREATURES());
  peekState={done:0,total:pw.length,words:pw,spots,anim:null,busy:false};
  showScreen("peek");roundNext=revealPeek;nextPeek();
}
function nextPeek(){
  const ps=peekState,wd=ps.words[ps.done%ps.words.length],sp=ps.spots[ps.done%ps.spots.length];ps.cur=wd;ps.busy=false;
  $("peekCap").textContent=LEVEL==="beg"?"Who's hiding? 👀":"Who's hiding? Where? 👀";$("peekCap").style.display="";setDots(ps.total,ps.done);
  const clip=$("peekClip"),spr=$("peekSprite"),out=$("peekOut");
  out.style.display="none";out.getAnimations().forEach(a=>a.cancel());
  clip.style.clipPath=sp.clip;spr.style.display="";spr.src=img(wd.key);
  spr.style.width=sp.w+"%";spr.style.top=sp.top+"%";
  spr.style.left=(sp.edge==="left"?sp.left:sp.left-sp.w/2)+"%";
  if(ps.anim)ps.anim.cancel();
  // horizontal peeks move by a share of the sprite width; vertical ones by a share of the picture height
  const H=$("peekStage").getBoundingClientRect().height;
  const mv=k=>sp.peekY?"translate(0,"+(-sp.peekY*H/100*k)+"px)":"translate("+sp.peek[0]*k+"%,0)";
  const hid="translate(0,0) rotate(0deg)",pk=mv(1)+" rotate("+sp.rot+"deg)",pk2=mv(0.8)+" rotate("+(sp.rot*0.5)+"deg)";
  ps.anim=spr.animate([{transform:hid},{transform:pk,offset:.18},{transform:pk2,offset:.45},{transform:pk,offset:.7},{transform:hid,offset:.9},{transform:hid}],
    {duration:3400,iterations:Infinity,easing:"ease-in-out"});
}
function revealPeek(){
  const ps=peekState;if(!ps||ps.busy)return;ps.busy=true;
  const spr=$("peekSprite"),out=$("peekOut"),stage=$("peekStage").getBoundingClientRect();
  if(ps.anim)ps.anim.pause();
  const r=spr.getBoundingClientRect();
  out.src=spr.src;out.style.left=(r.left-stage.left)+"px";out.style.top=(r.top-stage.top)+"px";out.style.width=r.width+"px";out.style.display="block";spr.style.display="none";
  const scr=$("peek").getBoundingClientRect();
  const dx=(scr.left+scr.width/2)-(r.left+r.width/2),dy=(scr.top+scr.height*0.52)-(r.top+r.height/2);
  out.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate("+dx+"px,"+dy+"px) scale(1.35)"}],{duration:650,easing:"cubic-bezier(.3,1.5,.5,1)",fill:"forwards"});
  const sp=ps.spots[(ps.done)%ps.spots.length];
  charSound(ps.cur.word);$("peekCap").textContent=LEVEL==="beg"?"It's a "+ps.cur.word+"!":"The "+ps.cur.word+" is "+sp.where+"!";
  ps.done++;setDots(ps.total,ps.done);
  if(ps.done>=ps.total)later(markStepDone,1800);
  else later(nextPeek,2800);
}
$("peekSprite").onclick=revealPeek;$("peekShow").onclick=revealPeek;

/* MAGIC CAULDRON — "Put 2 spiders in!" drag (or tap) the right creatures into the pot */
const POTIONS=[[0,"#c8ff9a"],[230,"#ffc2dc"],[115,"#b8e4ff"],[300,"#ffe9a6"],[175,"#dcc6ff"]];  // [hue-rotate of the pot picture, bubble colour]
let cauld=null;
/* candies: pictures candy_1..candy_6 when they exist, emoji until then */
const CANDY_EMOJI=["🍬","🍭","🍫","🧁","🍩","🍪"];
function candyNode(i,cls){const k="candy_"+(i+1);
  if(ASSETS[k]){const e=document.createElement("img");e.src=img(k);if(cls)e.className=cls;return e;}
  const e=document.createElement("div");e.textContent=CANDY_EMOJI[i];e.style.cssText="font-size:1em;line-height:1;text-align:center";if(cls)e.className=cls;return e;}
function setupCauldron(st){
  const nums=shuffle([2,3,4,5]).slice(0,st.rounds||3);
  cauld={round:0,total:nums.length,plan:nums.map(n=>({n})),count:0,potion:0,lock:false};
  $("cauldPot").src=img("cauldron");$("cauldPotion").src=img("cauldron_potion");setPotion(0);
  const bub=$("cauldBubbles");bub.innerHTML="";
  for(let i=0;i<7;i++){const b=document.createElement("div");b.className="bubble";const sz=8+Math.random()*14;
    b.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(24+Math.random()*52)+"%;top:"+(12+Math.random()*7)+"%;animation-delay:"+(Math.random()*1.6)+"s";bub.appendChild(b);}
  const shelf=$("cauldShelf");shelf.innerHTML="";
  CANDY_EMOJI.forEach((_,i)=>{const d=document.createElement("div");d.className="cauld-item";const n=candyNode(i);
    if(n.tagName==="DIV")n.style.fontSize="clamp(54px,6vw,80px)";d.appendChild(n);
    d.addEventListener("pointerdown",e=>cauldDrag(e,d,i));shelf.appendChild(d);});
  showScreen("cauldron");cauldRound();
  roundNext=()=>{if(cauld.lock)return;cauld.count=cauld.plan[cauld.round].n-1;cauldGot();};
}
function setPotion(i){const p=POTIONS[i%POTIONS.length];$("cauldPotion").style.filter="hue-rotate("+p[0]+"deg)";$("cauldWrap").style.setProperty("--potion-l",p[1]);}
function cauldRound(){
  const r=cauld.plan[cauld.round];cauld.count=0;cauld.lock=false;
  $("cauldTitle").innerHTML="Put "+r.n+" "+(ASSETS.candy_1?'<img src="'+img("candy_1")+'">':"🍬")+" in! 🧪";setDots(cauld.total,cauld.round);
  $("cauldCount").textContent="0";
  $("cauldDots").innerHTML="";for(let i=0;i<r.n;i++)$("cauldDots").appendChild(document.createElement("span"));
}
function cauldDrag(e,el,ci){
  if(cauld.lock)return;e.preventDefault();
  const r=el.getBoundingClientRect(),fl=candyNode(ci,"flyer");document.body.appendChild(fl);
  const fw=r.width*0.8;fl.style.width=fw+"px";if(fl.tagName==="DIV")fl.style.fontSize=(fw*0.8)+"px";
  const sx=e.clientX,sy=e.clientY;let moved=false;
  const place=(x,y)=>{fl.style.left=(x-fw/2)+"px";fl.style.top=(y-fw*0.45)+"px";};place(sx,sy);
  const mv=ev=>{if(Math.hypot(ev.clientX-sx,ev.clientY-sy)>8)moved=true;place(ev.clientX,ev.clientY);};
  const up=ev=>{document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
    const c=$("cauldWrap").getBoundingClientRect();
    const over=ev.clientX>c.left&&ev.clientX<c.right&&ev.clientY>c.top-40&&ev.clientY<c.bottom;
    if(!moved||over)flyIntoPot(fl);
    else{fl.animate([{opacity:1},{opacity:0,transform:"scale(.5)"}],{duration:250}).onfinish=()=>fl.remove();}};
  document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
}
function flyIntoPot(fl){
  const c=$("cauldWrap").getBoundingClientRect(),f=fl.getBoundingClientRect();
  const tx=c.left+c.width/2-(f.left+f.width/2),ty=c.top+c.height*0.18-(f.top+f.height/2);
  if(!cauld.lock){
    fl.animate([{transform:"translate(0,0) scale(1)"},{transform:"translate("+tx+"px,"+(ty-60)+"px) scale(.8)",offset:.6},{transform:"translate("+tx+"px,"+ty+"px) scale(.1)"}],{duration:600,easing:"ease-in"}).onfinish=()=>{fl.remove();cauldGot();};
  }else{
    fl.animate([{transform:"translate(0,0)"},{transform:"translate("+tx+"px,"+(ty-50)+"px) scale(.8)",offset:.45},{transform:"translate("+(tx+180)+"px,"+(ty-260)+"px) rotate(200deg) scale(.6)",opacity:0}],{duration:1000,easing:"ease-out"}).onfinish=()=>fl.remove();

  }
}
function cauldGot(){
  const r=cauld.plan[cauld.round];if(cauld.lock)return;cauld.count++;sPlop();
  const w=$("cauldWrap");w.classList.remove("hit");void w.offsetWidth;w.classList.add("hit");
  const cnt=$("cauldCount");cnt.textContent=cauld.count;cnt.classList.remove("pop");void cnt.offsetWidth;cnt.classList.add("pop");
  [...$("cauldDots").children].forEach((d,i)=>d.classList.toggle("on",i<cauld.count));
  if(cauld.count>=r.n){cauld.lock=true;later(cauldPoof,700);}
}
function cauldPoof(){
  const w=$("cauldWrap");sPoof();
  for(let i=0;i<6;i++){const s=document.createElement("div");s.className="smoke";const sz=80+Math.random()*90;
    s.style.cssText="width:"+sz+"px;height:"+sz+"px;left:"+(30+Math.random()*40)+"%;top:"+(-5+Math.random()*25)+"%;margin:-"+sz/2+"px 0 0 -"+sz/2+"px";w.appendChild(s);
    s.animate([{transform:"scale(.2)",opacity:.9},{transform:"scale(1.6) translateY(-30px)",opacity:0}],{duration:1300,delay:i*60,easing:"ease-out"}).onfinish=()=>s.remove();}
  cauld.potion++;later(()=>setPotion(cauld.potion),300);
  for(let i=0;i<9;i++){const st=document.createElement("div");st.textContent=["✨","⭐","🌟"][i%3];
    st.style.cssText="position:absolute;z-index:4;pointer-events:none;font-size:"+(26+Math.random()*22)+"px;left:"+(25+Math.random()*50)+"%;top:14%";w.appendChild(st);
    st.animate([{transform:"translate(0,0) scale(.3)",opacity:0},{transform:"translate("+(Math.random()*120-60)+"px,-"+(80+Math.random()*90)+"px) scale(1)",opacity:1,offset:.5},{transform:"translate("+(Math.random()*160-80)+"px,-"+(150+Math.random()*80)+"px) scale(.8)",opacity:0}],{duration:1600,delay:i*70,easing:"ease-out"}).onfinish=()=>st.remove();}
  cauld.round++;setDots(cauld.total,cauld.round);
  if(cauld.round>=cauld.total)later(markStepDone,1800);else later(cauldRound,2500);
}

/* bonus: MEMORY match (4 pairs of the words) */
function startMemory(){
  $("bonusTitle").textContent="🧩";
  const mw=shuffle(WORDS).slice(0,6),deck=[];mw.forEach(w=>{deck.push(w.key+"|p");deck.push(w.key+"|t");});
  for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}
  let open=[],matched=0,lock=false;
  const body=$("bonusBody");body.innerHTML='<div class="mem-grid" id="memGrid"></div>';
  const grid=$("memGrid");
  deck.forEach((k,idx)=>{const card=document.createElement("div");card.className="mem-card";card.dataset.key=k;card.dataset.i=idx;
    const [kk,kind]=k.split("|"),ww=WORDS.find(w=>w.key===kk);card.dataset.key=kk;
    const asPic=kind==="p"||LEVEL==="beg";
    card.innerHTML='<div class="mem-face mem-back">🎃</div><div class="mem-face mem-front">'+(asPic?'<img src="'+img(kk)+'">':'<div class="mem-txt">'+ww.word+'</div>')+'</div>';
    card.onclick=()=>{
      if(lock||card.classList.contains("flip")||card.classList.contains("done"))return;
      card.classList.add("flip");sPick();open.push(card);
      if(open.length===2){lock=true;
        if(open[0].dataset.key===open[1].dataset.key){
          sRight();setTimeout(()=>{open.forEach(c=>c.classList.add("done"));open=[];lock=false;matched++;
            if(matched===mw.length){setTimeout(()=>{sCheer();$("bonusDone").style.display="";},400);}},500);
        }else{sWrong();setTimeout(()=>{open.forEach(c=>c.classList.remove("flip"));open=[];lock=false;},LEVEL==="beg"?1500:2200);}
      }
    };grid.appendChild(card);});
  $("bonusDone").style.display="none";
  showScreen("bonus");
}

/* ---- character sounds (synthesised, no files) ---- */
let noiseBuf=null;
function noise(){const c=audio();if(!c)return null;if(!noiseBuf){noiseBuf=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}return noiseBuf;}
function nz(t0,dur,freq,q,vol,type){const c=audio();if(!c||!sfxOn)return;const s=c.createBufferSource();s.buffer=noise();
  const f=c.createBiquadFilter();f.type=type||"bandpass";f.frequency.value=freq;f.Q.value=q||1;const g=c.createGain();
  const t=c.currentTime+t0;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f);f.connect(g);g.connect(c.destination);s.start(t);s.stop(t+dur+0.02);}
function osc(t0,dur,f0,f1,type,vol,vib){const c=audio();if(!c||!sfxOn)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;
  o.type=type||"sine";o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=vib[0];lg.gain.value=vib[1];l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.12,t+0.04);g.gain.setValueAtTime(vol||.12,t+dur*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02);}

  ghost:()=>{osc(0,1.1,330,240,"sine",.13,[5,18]);osc(0,1.1,495,360,"sine",.05,[5,25]);},                       // "wooo-oo"
  bat:()=>{[0,.13,.26].forEach(t=>osc(t,.08,3200,4200,"sine",.06));nz(.05,.25,1800,.7,.04);},                   // squeaks + flap
  spider:()=>{[0,.07,.14,.21,.28,.35].forEach(t=>nz(t,.03,5000,4,.08));},                                       // tiny tapping legs
  monster:()=>{osc(0,.9,85,60,"sawtooth",.10,[22,12]);nz(0,.9,300,1.2,.10,"lowpass");},                         // growl
  witch:()=>{[0,.17,.34,.51].forEach((t,i)=>{osc(t,.12,900-i*60,700-i*60,"square",.05);nz(t,.12,2500,2,.05);});}, // he-he-he-he

  mummy:()=>{osc(0,1.2,140,110,"sawtooth",.06,[3,6]);nz(0,1.2,500,1,.04,"lowpass");},                           // moan
