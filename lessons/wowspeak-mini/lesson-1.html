<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Урок 1 — WowSpeak</title>
<style>
:root {
  --primary: #3D2E68;
  --primary-light: #7B68A6;
  --accent: #B89540;
  --bg: #FDFCFF;
  --bg-soft: #F4F1FA;
  --bg-card: #FFFFFF;
  --border: #D6D0E5;
  --border-soft: #E8E2F0;
  --text: #1F1F1F;
  --muted: #6B6B6B;
  --green: #4FA66B;
  --green-bg: #E8F4ED;
  --amber: #B89540;
  --amber-bg: #FFF6E0;
  --amber-border: #F0DBA0;
  --coral: #E2918A;
  --gold-bg: #FAE9B8;
  --shadow-sm: 0 2px 8px rgba(61, 46, 104, 0.08);
  --shadow: 0 4px 16px rgba(61, 46, 104, 0.10);
  --shadow-lg: 0 8px 32px rgba(61, 46, 104, 0.15);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Roboto, sans-serif;
  background: linear-gradient(180deg, #F8F5FC 0%, #EFEAF7 100%);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.5;
}

#app {
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px 24px 200px;
  min-height: 100vh;
  position: relative;
}

/* ─── header ─── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 8px 0 20px;
  flex-wrap: wrap;
}
.lesson-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  letter-spacing: 1px;
  text-transform: uppercase;
  flex: 1;
}
.progress-text {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
}
.header-reset-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}
.header-reset-btn:hover {
  background: var(--bg-soft);
  color: var(--primary);
  border-color: var(--primary-light);
}
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border-soft);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-light), var(--primary));
  border-radius: 3px;
  transition: width 0.4s ease;
}

/* ─── main content ─── */
main { min-height: 400px; }
.screen { animation: fadeIn 0.4s ease; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.screen-title {
  text-align: center;
  font-size: 36px;
  font-weight: 700;
  color: var(--primary);
  margin: 24px 0 16px;
}
.screen-section {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 32px;
  margin: 16px 0 24px;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-soft);
}

/* ─── buttons ─── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 32px;
  font-size: 16px;
  font-weight: 600;
  font-family: inherit;
  border: 2px solid var(--primary);
  border-radius: 12px;
  background: var(--bg-card);
  color: var(--primary);
  cursor: pointer;
  transition: opacity 0.5s ease, transform 0.3s ease, background 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  min-width: 140px;
}
.btn:hover {
  background: var(--bg-soft);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.btn:active { transform: translateY(0); }
.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover { background: #2E2350; }
.btn-big {
  padding: 18px 48px;
  font-size: 18px;
  min-width: 200px;
}
.btn.invisible {
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
}
.btn.disabled-look {
  background: #e7e2f3 !important;
  color: #a99fce !important;
  border-color: #e7e2f3 !important;
  box-shadow: none !important;
  opacity: 1;
  cursor: not-allowed;
  pointer-events: none;
}
.btn.disabled-look:hover {
  background: var(--bg-card);
  transform: none;
  box-shadow: none;
}

.continue-area, .intro-button-area {
  display: flex;
  justify-content: center;
  margin-top: 32px;
  min-height: 70px;
  gap: 12px;
  flex-wrap: wrap;
}

/* ─── content instruction ─── */
.content-instruction {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  margin: 8px 0 24px;
  line-height: 1.4;
}

/* ─── placeholder boxes ─── */
.placeholder {
  background: var(--bg-soft);
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 200px;
}
.placeholder-emoji { font-size: 96px; line-height: 1; }
.placeholder-label {
  font-size: 14px;
  color: var(--muted);
  font-style: italic;
  text-align: center;
}

/* ─── backpack ─── */
.backpack-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  padding: 16px;
}
.backpack-emoji { font-size: 130px; line-height: 1; }
.shadows-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 12px;
  width: 100%;
  max-width: 500px;
  justify-items: center;
}
.shadow-slot {
  width: 100%;
  max-width: 56px;
  aspect-ratio: 1 / 1;
  height: auto;
  background: #C8C0DC;
  border-radius: 50%;
  opacity: 0.5;
}
.shadow-slot.filled {
  background: var(--gold-bg);
  opacity: 1;
  box-shadow: 0 0 0 3px rgba(184, 149, 64, 0.3);
}

/* ─── achievement ─── */
.achievement-card {
  background: linear-gradient(135deg, #FFF6E0 0%, #FAE9B8 100%);
  border: 2px solid var(--amber-border);
  border-radius: 20px;
  padding: 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop {
  from { opacity: 0; transform: scale(0.6); }
  to { opacity: 1; transform: scale(1); }
}
.achievement-emoji {
  font-size: 120px;
  line-height: 1;
  filter: drop-shadow(0 4px 12px rgba(184, 149, 64, 0.4));
}
.achievement-label-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.achievement-label-en {
  font-size: 36px;
  font-weight: 700;
  color: var(--accent);
}
.achievement-label-ru {
  font-size: 16px;
  color: var(--muted);
  font-style: italic;
}

/* ─── word card ─── */
.word-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  padding: 16px;
}
.word-picture {
  background: var(--bg-soft);
  border: 1px solid var(--border-soft);
  border-radius: 20px;
  padding: 36px;
  width: 100%;
  max-width: 480px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.word-emoji { font-size: 130px; line-height: 1; }
.word-picture .placeholder-label { margin-top: 8px; }
.word-en-row {
  display: flex;
  align-items: center;
  gap: 16px;
}
.word-en {
  font-size: 38px;
  font-weight: 700;
  color: var(--primary);
  font-style: italic;
}
.sound-btn {
  background: var(--bg-card);
  border: 2px solid var(--primary-light);
  border-radius: 50%;
  width: 56px;
  height: 56px;
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  padding: 0;
  font-family: inherit;
}
.sound-btn:hover {
  background: var(--bg-soft);
  transform: scale(1.05);
}
.sound-btn.playing {
  background: var(--primary);
  color: white;
  animation: pulse 0.8s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}

.drilling-prompt {
  background: var(--amber-bg);
  border: 3px solid var(--amber-border);
  border-radius: 20px;
  padding: 22px 44px;
  font-size: 28px;
  font-weight: 800;
  color: var(--amber);
  margin: 12px 0 0;
  text-align: center;
  animation: gentleBounce 1.8s ease-in-out infinite;
}
@keyframes gentleBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}

/* ─── choice / reflection buttons ─── */
.choice-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.choice-btn {
  padding: 24px;
  font-size: 18px;
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  font-weight: 600;
  color: var(--primary);
  transition: all 0.2s ease;
  font-family: inherit;
}
.choice-btn:hover {
  border-color: var(--primary-light);
  background: var(--bg-soft);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.choice-btn.selected {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.choice-btn.multi-selected {
  background: var(--primary-light);
  color: white;
  border-color: var(--primary);
}
.choice-btn.multi-selected::before {
  content: "✓ ";
  font-weight: 800;
}

/* ─── matching ─── */
.match-game {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  align-items: center;
  max-width: 700px;
  margin: 0 auto;
}
.match-col {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.match-item {
  padding: 16px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 20px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  min-height: 80px;
  transition: all 0.2s ease;
  user-select: none;
  font-style: italic;
  color: var(--primary);
}
.match-item .emoji-large { font-size: 48px; font-style: normal; }
.match-item:hover { background: var(--bg-soft); }
.match-item.selected {
  border-color: var(--primary);
  background: var(--bg-soft);
  transform: scale(1.02);
}
.match-item.matched {
  background: var(--green-bg);
  border-color: var(--green);
  cursor: default;
  opacity: 0.7;
}
.match-item.wrong {
  animation: shake 0.4s;
  border-color: var(--coral);
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

/* ─── multichoice ─── */
.mc-counter {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 16px;
  text-align: center;
}
.mc-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 20px;
}
.mc-option {
  padding: 18px;
  border-radius: 12px;
  border: 2px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 20px;
  font-weight: 600;
  color: var(--primary);
  font-style: italic;
  font-family: inherit;
  transition: all 0.2s ease;
}
.mc-option:hover {
  background: var(--bg-soft);
  border-color: var(--primary-light);
}
.mc-option.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}
.mc-option.wrong {
  background: #FCEEEE;
  border-color: var(--coral);
  color: var(--coral);
  animation: shake 0.4s;
}

/* ─── free practice ─── */
.fp-area {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.fp-input-wrap { flex: 1; }
.fp-textarea {
  width: 100%;
  min-height: 220px;
  padding: 20px;
  font-size: 20px;
  font-family: inherit;
  border: 2px solid var(--border);
  border-radius: 12px;
  resize: vertical;
  background: var(--bg-card);
}
.fp-textarea:focus {
  outline: none;
  border-color: var(--primary-light);
}
.fp-hint {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
  font-style: italic;
}
.fp-counter {
  font-size: 15px;
  margin-top: 10px;
  font-weight: 600;
  color: var(--muted);
}
.fp-counter.done {
  color: var(--green);
}
.fp-dict-btn {
  background: var(--bg-card);
  border: 2px solid var(--primary-light);
  border-radius: 16px;
  padding: 20px 16px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  font-family: inherit;
  min-width: 120px;
  transition: all 0.2s ease;
}
.fp-dict-btn:hover { background: var(--bg-soft); }
.fp-dict-emoji { font-size: 32px; }

/* ─── dictionary panel ─── */
.dict-overlay {
  position: fixed;
  inset: 0;
  background: rgba(61, 46, 104, 0.4);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.dict-overlay.open { display: flex; }
.dict-panel {
  background: var(--bg-card);
  border-radius: 24px;
  padding: 32px;
  max-width: 600px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  position: relative;
}
.dict-close {
  position: absolute;
  top: 16px;
  right: 16px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: none;
  background: var(--bg-soft);
  color: var(--primary);
  cursor: pointer;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.dict-title {
  font-size: 24px;
  font-weight: 700;
  color: var(--primary);
  margin: 0 0 20px;
}
.dict-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.dict-word {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  background: var(--bg-soft);
  border-radius: 12px;
}
.dict-word-emoji { font-size: 36px; }
.dict-word-en {
  font-weight: 700;
  color: var(--primary);
  font-style: italic;
  font-size: 16px;
}
.dict-word-ru {
  font-size: 13px;
  color: var(--muted);
}

/* ─── audio choice game (big sound button) ─── */
.audio-game-sound-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin: 16px 0 24px;
}
.audio-game-sound-btn {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--bg-soft);
  border: 4px solid var(--primary-light);
  font-size: 48px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s ease;
  font-family: inherit;
  padding: 0;
}
.audio-game-sound-btn:hover {
  background: var(--primary);
  color: white;
  transform: scale(1.05);
}
.audio-game-sound-btn.playing {
  background: var(--primary);
  color: white;
  animation: pulse 0.8s ease-in-out infinite;
}
.audio-game-hint {
  font-size: 13px;
  color: var(--muted);
  font-style: italic;
}

/* ─── audio choice picture options ─── */
.audio-pic-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  max-width: 600px;
  margin: 16px auto 0;
}
.audio-pic-option {
  padding: 24px;
  border-radius: 16px;
  border: 2px solid var(--border);
  background: var(--bg-card);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  transition: all 0.2s ease;
  min-height: 130px;
}
.audio-pic-option:hover {
  background: var(--bg-soft);
  border-color: var(--primary-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}
.audio-pic-emoji {
  font-size: 64px;
  line-height: 1;
}
.audio-pic-option.correct {
  background: var(--green-bg);
  border-color: var(--green);
}
.audio-pic-option.wrong {
  background: #FCEEEE;
  border-color: var(--coral);
  animation: shake 0.4s;
}

/* ─── free practice example block ─── */
.fp-example {
  background: var(--bg-soft);
  border-left: 4px solid var(--primary-light);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 0 auto 24px;
  max-width: 800px;
}
.fp-example-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.fp-example-text {
  font-size: 18px;
  color: var(--text);
  font-style: italic;
  line-height: 1.5;
}

/* ─── memory cards ─── */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  max-width: 560px;
  margin: 0 auto;
}
.memory-card {
  aspect-ratio: 1;
  position: relative;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.5s;
  perspective: 600px;
}
.memory-card.flipped {
  transform: rotateY(180deg);
}
.memory-card.matched {
  cursor: default;
}
.memory-card.matched .memory-card-front {
  background: var(--green-bg);
  border-color: var(--green);
}
.memory-card-back, .memory-card-front {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border: 2px solid var(--border);
}
.memory-card-back {
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  color: white;
  font-size: 36px;
  font-weight: 700;
  border-color: var(--primary);
}
.memory-card-front {
  background: var(--bg-card);
  transform: rotateY(180deg);
}
.memory-card-emoji {
  font-size: 56px;
  line-height: 1;
}
.memory-card-word {
  font-size: 16px;
  font-weight: 700;
  color: var(--primary);
  font-style: italic;
  text-align: center;
  padding: 8px;
}

/* ─── anagram ─── */
.anagram-slots {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  margin: 24px 0 16px;
  flex-wrap: wrap;
}
.anagram-slot {
  width: 60px;
  height: 60px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  background: var(--bg-card);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: 700;
  color: var(--primary);
  transition: all 0.2s ease;
}
.anagram-slot.filled {
  border-style: solid;
  background: var(--bg-soft);
  border-color: var(--primary);
}
.anagram-slot.separator {
  border: none;
  background: transparent;
  width: 28px;
  font-size: 36px;
  color: var(--primary);
  font-weight: 800;
}
.anagram-slot.done {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}
.anagram-tiles {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 16px;
}
.anagram-tile {
  width: 60px;
  height: 60px;
  border: 2px solid var(--primary-light);
  border-radius: 12px;
  background: var(--bg-card);
  font-size: 28px;
  font-weight: 700;
  color: var(--primary);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
  padding: 0;
}
.anagram-tile:hover:not(.used) {
  background: var(--bg-soft);
  transform: scale(1.05);
}
.anagram-tile.used {
  opacity: 0.3;
  cursor: default;
  transform: scale(0.9);
}
.anagram-tile.wrong {
  background: #FCEEEE;
  border-color: var(--coral);
  color: var(--coral);
  animation: shake 0.4s;
}

@media (max-width: 720px) {
  .audio-game-sound-btn { width: 80px; height: 80px; font-size: 36px; }
  .memory-grid { gap: 8px; }
  .memory-card-emoji { font-size: 40px; }
  .memory-card-word { font-size: 13px; }
  .anagram-slot, .anagram-tile { width: 48px; height: 48px; font-size: 24px; }
}


#teacher-widget {
  position: fixed;
  bottom: 20px;
  right: 24px;
  z-index: 100;
  width: 140px;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
#teacher-img {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  border: 4px solid white;
  box-shadow: var(--shadow);
  object-fit: cover;
  display: block;
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
#speech-bubble {
  position: absolute;
  bottom: 160px;
  right: 0;
  width: 380px;
  max-width: calc(100vw - 60px);
  background: white;
  border-radius: 20px;
  padding: 18px 22px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-soft);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  transition: opacity 0.3s ease;
}
#speech-bubble::after {
  content: "";
  position: absolute;
  bottom: -10px;
  right: 50px;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 12px solid white;
  filter: drop-shadow(0 2px 2px rgba(61, 46, 104, 0.08));
}
#speech-bubble.empty { opacity: 0; visibility: hidden; }

#teacher-widget.intro-mode {
  position: static;
  width: auto;
  margin: 16px auto 8px;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#teacher-widget.intro-mode #teacher-img {
  width: 200px;
  height: 200px;
  border-width: 6px;
  box-shadow: var(--shadow-lg);
}
#teacher-widget.intro-mode #speech-bubble {
  position: static;
  width: 100%;
  max-width: 720px;
  padding: 24px 28px;
  font-size: 19px;
  line-height: 1.55;
  text-align: center;
  bottom: auto;
  right: auto;
}
#teacher-widget.intro-mode #speech-bubble::after { display: none; }

@media (max-width: 720px) {
  #app { padding: 12px 16px 200px; }
  .screen-section { padding: 20px; }
  .screen-title { font-size: 26px; }
  .word-emoji { font-size: 90px; }
  .word-en { font-size: 30px; }
  .achievement-emoji { font-size: 100px; }
  .drilling-prompt { font-size: 22px; padding: 16px 32px; }
  #teacher-widget { width: 100px; right: 12px; bottom: 12px; }
  #teacher-img { width: 100px; height: 100px; }
  #speech-bubble {
    bottom: 120px;
    width: calc(100vw - 32px);
    right: -16px;
    font-size: 14px;
    padding: 14px 18px;
  }
  #speech-bubble::after { right: 36px; }
  #teacher-widget.intro-mode #teacher-img { width: 150px; height: 150px; }
  #teacher-widget.intro-mode #speech-bubble {
    font-size: 16px;
    padding: 18px 22px;
  }
  .match-game { grid-template-columns: 1fr 1fr; gap: 16px; }
  .mc-options { grid-template-columns: 1fr; }
  .fp-area { flex-direction: column; }
}

/* ── Asset images (replace emoji visuals) ── */
.asset-img { height: 1em; width: auto; vertical-align: middle; display: inline-block; }
.word-emoji .asset-img { filter: drop-shadow(0 6px 14px rgba(0,0,0,0.08)); }
.achievement-emoji .asset-img { filter: drop-shadow(0 4px 12px rgba(184,149,64,0.4)); }
.placeholder-emoji { text-align: center; width: 100%; }
.placeholder-emoji .asset-img { height: auto; width: clamp(220px, 62vw, 440px); margin: 0 auto; }

/* ═══ Адаптивность: телефон / планшет / десктоп ═══ */
html, body { overflow-x: clip; }
.asset-img { max-width: 100%; }
img { max-width: 100%; }

/* Планшеты (721–1024px): уже десктопного, но просторнее телефона */
@media (min-width: 721px) and (max-width: 1024px) {
  #app { max-width: 840px; padding: 16px 20px 200px; }
  .mc-options { grid-template-columns: repeat(2, 1fr); }
}

/* Маленькие телефоны (до 430px) */
@media (max-width: 430px) {
  #app { padding: 10px 12px 190px; }
  .screen-section { padding: 16px; }
  .screen-title { font-size: 23px; }
  .dict-grid { grid-template-columns: 1fr; }
  .memory-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .memory-card-emoji { font-size: 34px; }
  .anagram-slot, .anagram-tile { width: 40px; height: 40px; font-size: 20px; }
  .match-game { gap: 12px; }
  .word-emoji { font-size: 76px; }
}

/* ═══ Интро-фаза: учитель СЛЕВА, речевой пузырь СПРАВА ═══ */
#teacher-widget.intro-mode {
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 22px;
  max-width: 800px;
}
#teacher-widget.intro-mode #teacher-img {
  width: 170px; height: 170px;
  flex: 0 0 auto;
  order: 0;
}
#teacher-widget.intro-mode #speech-bubble {
  position: relative;
  width: auto;
  flex: 1 1 auto;
  max-width: 520px;
  text-align: left;
  bottom: auto; right: auto;
  padding: 22px 26px;
  order: 1;
}
#teacher-widget.intro-mode #speech-bubble::after {
  display: block;
  content: "";
  position: absolute;
  left: -11px; top: 50%;
  transform: translateY(-50%);
  bottom: auto; right: auto;
  width: 0; height: 0;
  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-right: 11px solid white;
  filter: drop-shadow(-2px 0 1px rgba(0,0,0,0.05));
}
/* На узких экранах фото поменьше, но раскладка остаётся в ряд */
@media (max-width: 560px) {
  #teacher-widget.intro-mode { gap: 12px; }
  #teacher-widget.intro-mode #teacher-img { width: 104px; height: 104px; }
  #teacher-widget.intro-mode #speech-bubble { padding: 14px 16px; font-size: 15px; }
}

/* ═══ подсказка: убранный неверный вариант ═══ */
.mc-option.eliminated, .audio-pic-option.eliminated {
  opacity: 0.25; pointer-events: none; filter: grayscale(0.75);
  transition: opacity .3s ease, filter .3s ease;
}

50%{ transform: scale(1.06); } }

/* ═══ мемо: баннер запоминания ═══ */
.memo-banner { text-align:center; font-size:20px; font-weight:800; color:#5B4B9E; margin:6px auto 14px; transition:opacity .5s ease; }
.memo-banner-fade { opacity:0; }

/* ═══ пример нельзя копировать ═══ */
.fp-example, .fp-example * {
  -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
  -webkit-touch-callout: none;
}

/* ═══ кнопка действия всегда на виду (липкая к низу) ═══ */
.continue-area, .l2-check, .l2-sticky {
  position: sticky; bottom: 0; z-index: 45;
}
.continue-area::before, .l2-check::before, .l2-sticky::before {
  content:""; position:absolute; z-index:-1;
  left:50%; transform:translateX(-50%);
  width:100vw; top:-14px; bottom:-18px;
  background: rgba(255,255,255,0.95);
  -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  box-shadow: 0 -6px 16px rgba(91,75,158,0.10);
}
.continue-area { padding-top: 10px;
  position: sticky; bottom: 12px; z-index: 45;
}
.continue-area .btn { box-shadow: 0 6px 22px rgba(91,75,158,0.40); }
@media (max-width: 380px){ .shadows-grid { gap: 7px; } }

/* --- адаптация под большие экраны --- */
@media (min-width: 900px) and (min-height: 640px) {
  #app {
    display: flex;
    flex-direction: column;
  }
  #app > header { flex: 0 0 auto; }

  /* Резерв высоты под контент на больших экранах не нужен: он оставлял пустоту
     снизу и съедал место, из-за которого центрирование не срабатывало вовсе. */
  #app main { min-height: 0; }

  /* Большой нижний отступ нужен только когда учитель закреплён в углу.
     В фазе рассказа он стоит в потоке и ничего не перекрывает. */
  #app:has(#teacher-widget.intro-mode) { padding-bottom: 56px; }

  /* В фазе рассказа учитель стоит в потоке: поднимаем пару «учитель + контент»
     к центру. В фазе задания учитель закреплён в углу и из потока выпадает,
     поэтому центрируем один контент. */
  #teacher-widget.intro-mode { margin-top: auto; }
  #teacher-widget:not(.intro-mode) ~ #content { margin-top: auto; }
  #content { margin-bottom: auto; }
}
/* --- яркая тема «Волшебная страна» --- */

  --accent:#e08a2b;
  --border:#cfe3ef; --border-soft:#e4f1f7;
  --shadow-sm:0 5px 16px rgba(61,46,104,.13);
  --shadow:0 9px 26px rgba(61,46,104,.17);
  --shadow-lg:0 16px 44px rgba(61,46,104,.24);
}

body{ background:#9fe3e0; }

/* шапка и карточки — белые, объёмные, с крупными скруглениями */
#app > header{
  background:rgba(255,255,255,.9); border-radius:0 0 22px 22px;
  padding:10px 18px 14px; margin:0 -8px 10px; box-shadow:0 4px 16px rgba(61,46,104,.14);
  backdrop-filter:blur(6px);
}
.screen-section{
  border-radius:26px; border:3px solid #fff; padding:28px;
  background:rgba(255,255,255,.95); box-shadow:var(--shadow);
}
#speech-bubble{ border-radius:26px; border:3px solid #fff; box-shadow:var(--shadow); }
#teacher-img{ border-color:#fff !important; box-shadow:var(--shadow-lg); }

/* заголовки лежат прямо на небе — добавляем светлую обводку для читаемости */
.screen-title, .content-instruction{
  text-shadow:0 2px 0 rgba(255,255,255,.95), 0 0 14px rgba(255,255,255,.9);
}

/* кнопки с гранью: нажимается «по-настоящему» */
.btn{ border-radius:18px; font-weight:800; }
.btn-primary{
  background:linear-gradient(180deg,#8a6ad0,#5c3fa2);
  box-shadow:0 5px 0 #46307e, 0 10px 20px rgba(61,46,104,.28);
  border:0;
}
.btn-primary:active{ transform:translateY(4px); box-shadow:0 1px 0 #46307e; }

.progress-bar{ background:rgba(255,255,255,.65); height:9px; border-radius:6px; }
.progress-fill{ background:linear-gradient(90deg,#ffd469,#e08a2b); border-radius:6px; }

</style>
</head>
<body>

<div id="app">
  <header>
    <div class="lesson-title">Урок 1</div>
    <button class="header-reset-btn" id="reset-btn" title="Начать урок заново">↻ заново</button>
    <div class="progress-text" id="progress-text">1 / 22</div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </header>

  <div id="teacher-widget">
    <div id="speech-bubble" class="empty"><p id="speech-text"></p></div>
    <img id="teacher-img" alt="Учитель">
  </div>

  <main id="content"></main>
</div>

<div class="dict-overlay" id="dict-overlay">
  <div class="dict-panel">
    <button class="dict-close" id="dict-close-btn">×</button>
    <h3 class="dict-title">📖 Словарик</h3>
    <div class="dict-grid" id="dict-grid"></div>
  </div>
</div>

};

function loadState() {

    if (raw) return Object.assign({}, defaultState, JSON.parse(raw));
  } catch (e) {}
  return Object.assign({}, defaultState);
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}

function resetProgress() {

// ═══════════════════════════════════════════════════════
// WEB SPEECH API
// ═══════════════════════════════════════════════════════
let englishVoice = null, femaleVoice = null, maleVoice = null;
function pickEnglishVoice() {
  if (!window.speechSynthesis) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) return;
  const en = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const femaleRe = /female|samantha|karen|moira|tessa|kate|fiona|allison|ava|nicky|victoria|susan|zira|serena|catherine|hazel/i;
  const maleRe = /daniel|alex|fred|david|mark|george|arthur|oliver|thomas|guy|aaron|\btom\b|rishi|james|reed/i;
  femaleVoice = en.find(v => femaleRe.test(v.name)) || null;
  maleVoice = en.find(v => maleRe.test(v.name)) || null;
  englishVoice = femaleVoice || en.find(v => v.lang === "en-US" || v.lang === "en-GB") || en[0] || null;
}
if (window.speechSynthesis) {
  pickEnglishVoice();
  window.speechSynthesis.onvoiceschanged = pickEnglishVoice;
}
function speakEN(text, btn, onDone, voiceKind) {
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    if (btn) btn.classList.remove("playing");
    if (onDone) onDone();
  };
  if (!window.speechSynthesis) { setTimeout(finish, 300); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "en-US";
  utter.rate = 0.85;
  let voice = englishVoice, pitch = 1.0;
  if (voiceKind === "f") { voice = femaleVoice || englishVoice; pitch = 1.2; }
  else if (voiceKind === "m") { voice = maleVoice || englishVoice; pitch = 0.8; }
  utter.pitch = pitch;
  if (voice) utter.voice = voice;
  if (btn) btn.classList.add("playing");
  utter.onend = finish;
  utter.onerror = finish;
  window.speechSynthesis.speak(utter);
  // подстраховка, если onend не сработает
  if (onDone) setTimeout(finish, 2500);
}

// ═══════════════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════════════
function el(tag, props, ...children) {
  const e = document.createElement(tag);
  if (props) {
    for (const k in props) {
      if (k === "class") e.className = props[k];
      else if (k === "html") e.innerHTML = props[k];
      else if (k.startsWith("on")) e.addEventListener(k.substr(2).toLowerCase(), props[k]);
      else if (k === "style") Object.assign(e.style, props[k]);
      else e.setAttribute(k, props[k]);
    }
  }
  for (const c of children) {
    if (c == null) continue;
    if (typeof c === "string") e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

// ═══════════════════════════════════════════════════════
// SOUND EFFECTS (Web Audio, синтез — без внешних файлов)
// ═══════════════════════════════════════════════════════
const SFX = (function () {
  let ctx = null;
  function ac() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, start, dur, type, gain) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime + start;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.18, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  return {
    correct() { tone(659, 0, 0.12, "sine", 0.2); tone(988, 0.10, 0.16, "sine", 0.2); },
    wrong() { tone(311, 0, 0.16, "triangle", 0.15); tone(233, 0.12, 0.20, "triangle", 0.14); },
    complete() { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.09, 0.20, "sine", 0.18); }); },
    lessonComplete() {
      [523, 659, 784, 1047, 1319].forEach(function (f, i) { tone(f, i * 0.11, 0.30, "triangle", 0.2); });
      tone(1047, 0.62, 0.55, "sine", 0.16); tone(1568, 0.62, 0.55, "sine", 0.13);
    }
  };
})();

function picNode(key, emoji) {
  var k = (key && IMG[key]) ? key : EMOJI_KEY[emoji];
  if (k && IMG[k]) {
    return el("img", { class: "asset-img", src: IMG[k], alt: k, draggable: "false" });
  }
  return emoji;
}

function getWord(id) { return WORDS.find(w => w.id === id); }

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function currentScreen() { return screens[screenById[state.currentId]]; }

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function goTo(id) {
  state.currentId = id;
  phase = "intro";
  if (!state.visited.includes(id)) state.visited.push(id);
  saveState();
  window.scrollTo(0, 0);
  render();
}

function next() {
  const s = currentScreen();
  if (s.next) { goTo(s.next); return; }
  const idx = linearOrder.indexOf(state.currentId);
  if (idx < 0 || idx >= linearOrder.length - 1) return;
  let nextId = linearOrder[idx + 1];
  if (state.currentId === "2-2A" || state.currentId === "2-2B") nextId = "3-1";
  goTo(nextId);
}

function advancePhase() {
  const s = currentScreen();
  // singlePhase: intro IS the whole screen, button → next
  // Otherwise: intro → content → next
  if (phase === "intro" && !s.singlePhase) {
    phase = "content";
    render();
  } else {
    next();
  }
}

function getProgress() {
  const idx = linearOrder.indexOf(state.currentId);
  if (idx < 0) return { current: 1, total: 24 };
  let current;
  if (idx <= 4) current = idx + 1;
  else if (idx === 5 || idx === 6) current = 6;
  else current = idx;
  return { current, total: 24 };
}

// ═══════════════════════════════════════════════════════
// MAIN RENDER
// ═══════════════════════════════════════════════════════
function render() {
  if (buttonRevealTimer) { clearTimeout(buttonRevealTimer); buttonRevealTimer = null; }

  const s = currentScreen();

  // If skipIntro and phase is intro, switch to content
  if (s.skipIntro && phase === "intro") phase = "content";

  const tw = document.getElementById("teacher-widget");
  const bubble = document.getElementById("speech-bubble");
  const speechText = document.getElementById("speech-text");
  const teacherImg = document.getElementById("teacher-img");
  const content = document.getElementById("content");

  teacherImg.src = TEACHER_IMG[s.emotion] || TEACHER_IMG.neutral;

  const p = getProgress();
  document.getElementById("progress-text").textContent = `${p.current} / ${p.total}`;
  document.getElementById("progress-fill").style.width = `${(p.current / p.total) * 100}%`;

  content.innerHTML = "";

  if (phase === "intro") {
    tw.classList.add("intro-mode");
    speechText.textContent = s.speech || "";
    if (s.speech) bubble.classList.remove("empty");
    else bubble.classList.add("empty");
    renderIntroPhase(s, content);
  } else {
    tw.classList.remove("intro-mode");
    bubble.classList.add("empty");
    renderContentPhase(s, content);
  }
}

function renderIntroPhase(s, content) {
  const screenEl = el("div", { class: "screen" });
  content.appendChild(screenEl);

  // Title for greeting
  if (s.type === "greeting" && s.title) {
    screenEl.appendChild(el("h1", { class: "screen-title" }, s.title));
  }

  // Visual (varies by type)
  if (s.type === "backpack") {
    const section = el("div", { class: "screen-section" });
    const area = el("div", { class: "backpack-area" });
    area.appendChild(el("div", { class: "backpack-emoji" }, picNode("backpack", "🎒")));
    const grid = el("div", { class: "shadows-grid" });
    for (let i = 0; i < 6; i++) {
      grid.appendChild(el("div", { class: "shadow-slot" + (i < (s.filledSlots || 0) ? " filled" : "") }));
    }
    area.appendChild(grid);
    section.appendChild(area);
    screenEl.appendChild(section);
  } else if (s.type === "achievement") {
    if (s.emoji === "🪄") SFX.lessonComplete(); else SFX.complete();
    const section = el("div", { class: "screen-section" });
    const card = el("div", { class: "achievement-card" });
    card.appendChild(el("div", { class: "achievement-emoji" }, picNode(null, s.emoji)));
    const labelRow = el("div", { class: "achievement-label-row" });
    labelRow.appendChild(el("div", { class: "achievement-label-en" }, s.en));
    const soundBtn = el("button", {
      class: "sound-btn",
      onclick: function() { speakEN(s.en, this); },
    }, "🔊");
    labelRow.appendChild(soundBtn);
    card.appendChild(labelRow);
    card.appendChild(el("div", { class: "achievement-label-ru" }, "(" + s.ru + ")"));
    section.appendChild(card);
    screenEl.appendChild(section);
    // Auto-play TTS after a delay
    if (s.autoPlayEN) {
      setTimeout(() => speakEN(s.autoPlayEN, soundBtn), s.autoPlayDelay || 1500);
    }
  } else if (s.type === "choice") {
    const section = el("div", { class: "screen-section" });
    const v = el("div", { class: "placeholder" });
    v.appendChild(el("div", { class: "placeholder-emoji" }, picNode(null, s.visualEmoji)));
    if (s.visualLabel) v.appendChild(el("div", { class: "placeholder-label" }, s.visualLabel));
    section.appendChild(v);
    screenEl.appendChild(section);
  } else if (s.type === "story") {
    if (s.icon) {
      const section = el("div", { class: "screen-section" });
      const v = el("div", { class: "placeholder" });
      v.appendChild(el("div", { class: "placeholder-emoji" }, s.icon));
      if (s.iconLabel) v.appendChild(el("div", { class: "placeholder-label" }, s.iconLabel));
      section.appendChild(v);
      screenEl.appendChild(section);
    }
    if (s.island) markIslandDone(s.island);
  }

  // Button area
  const btnArea = el("div", { class: "intro-button-area" });

  if (s.type === "farewell" && s.showRestartButton) {
    // Two buttons: restart + finish
    const restartBtn = el("button", {
      class: "btn btn-big invisible",
      onclick: () => {
        if (confirm("Начать урок заново? Прогресс будет удалён.")) {
          resetProgress();
        }
      },
    }, "Пройти урок ещё раз");
    const finishBtn = el("button", {
      class: "btn btn-primary btn-big invisible",
      onclick: showFinishOverlay,
    }, s.buttonLabel || "Завершить урок");
    const mapBtn = el("button", {
      class: "btn btn-primary btn-big invisible",
      onclick: function() { location.href = MAP_URL; },
    }, "Вернуться на карту 🗺️");
    btnArea.appendChild(mapBtn);
    btnArea.appendChild(restartBtn);
    btnArea.appendChild(finishBtn);
    buttonRevealTimer = setTimeout(() => {
      mapBtn.classList.remove("invisible");
      restartBtn.classList.remove("invisible");
      finishBtn.classList.remove("invisible");
    }, s.introDelay || 2500);
  } else {
    const btn = el("button", {
      class: "btn btn-primary btn-big invisible",
      onclick: advancePhase,
    }, s.buttonLabel || "Дальше");
    btnArea.appendChild(btn);
    buttonRevealTimer = setTimeout(() => {
      btn.classList.remove("invisible");
    }, s.introDelay || 2500);
  }

  screenEl.appendChild(btnArea);
}

function renderContentPhase(s, content) {
  const screenEl = el("div", { class: "screen" });
  content.appendChild(screenEl);

  const renderer = contentRenderers[s.type];
  if (renderer) renderer(s, screenEl);
  else screenEl.appendChild(el("div", {}, "Неизвестный тип: " + s.type));
}

function continueBtn(label, handler) {
  return el("div", { class: "continue-area" },
    el("button", { class: "btn btn-primary btn-big", onclick: handler || advancePhase }, label || "Дальше"));
}

const contentRenderers = {
  choice: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    const section = el("div", { class: "screen-section" });
    const grid = el("div", { class: "choice-grid" });

      grid.appendChild(el("button", {
        class: "choice-btn",

          state.answers[s.id] = opt.label;
          saveState();
          goTo(opt.next);
        },
      }, opt.label));
    });
    section.appendChild(grid);
    root.appendChild(section);
  },

  presentation: function(s, root) {
    const w = getWord(s.word);
    const section = el("div", { class: "screen-section" });
    const card = el("div", { class: "word-card" });
    const pic = el("div", { class: "word-picture" });
    pic.appendChild(el("div", { class: "word-emoji" }, picNode(w.id, w.emoji)));
    pic.appendChild(el("div", { class: "placeholder-label" }, "картинка: " + w.ru));
    card.appendChild(pic);

    const enRow = el("div", { class: "word-en-row" });
    enRow.appendChild(el("div", { class: "word-en" }, w.phrase));
    const soundBtn = el("button", { class: "sound-btn", onclick: function() { speakEN(w.phrase, this); } }, "🔊");
    enRow.appendChild(soundBtn);
    card.appendChild(enRow);

    section.appendChild(card);
    root.appendChild(section);
    root.appendChild(continueBtn(s.contentButtonLabel));

    setTimeout(() => speakEN(w.phrase, soundBtn), 400);
  },

  drilling: function(s, root) {
    const w = getWord(s.word);
    const section = el("div", { class: "screen-section" });
    const card = el("div", { class: "word-card" });
    const pic = el("div", { class: "word-picture" });
    pic.appendChild(el("div", { class: "word-emoji" }, picNode(w.id, w.emoji)));
    card.appendChild(pic);

    const enRow = el("div", { class: "word-en-row" });
    enRow.appendChild(el("div", { class: "word-en" }, w.phrase));
    const soundBtn = el("button", { class: "sound-btn", onclick: function() { speakEN(w.phrase, this); } }, "🔊");
    enRow.appendChild(soundBtn);
    card.appendChild(enRow);

    card.appendChild(el("div", { class: "drilling-prompt" }, "🔁 Повтори вслух!"));

    section.appendChild(card);
    root.appendChild(section);
    root.appendChild(continueBtn(s.contentButtonLabel));

    // Auto-play sound when entering screen
    setTimeout(() => speakEN(w.phrase, soundBtn), 400);
  },

  matching: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    const section = el("div", { class: "screen-section" });
    const words = s.pairs.map(getWord);
    const sw = shuffle(words);
    const sp = shuffle(words);

    let selectedWord = null;
    let matched = new Set();

    const game = el("div", { class: "match-game" });
    const wordsCol = el("div", { class: "match-col" });
    const picsCol = el("div", { class: "match-col" });

    sw.forEach(w => {
      const item = el("div", {
        class: "match-item",
        "data-word": w.id,
        onclick: function() {
          if (this.classList.contains("matched")) return;
          wordsCol.querySelectorAll(".match-item").forEach(x => x.classList.remove("selected"));
          this.classList.add("selected");
          selectedWord = w.id;
          speakEN(w.en);
        },
      }, w.en);
      wordsCol.appendChild(item);
    });

    sp.forEach(w => {
      const item = el("div", {
        class: "match-item",
        "data-word": w.id,
        onclick: function() {
          if (this.classList.contains("matched") || !selectedWord) return;
          if (selectedWord === w.id) {
            const wordEl = wordsCol.querySelector('[data-word="' + w.id + '"]');
            SFX.correct();
            this.classList.add("matched");
            wordEl.classList.add("matched");
            wordEl.classList.remove("selected");
            matched.add(w.id);
            selectedWord = null;
            setTimeout(() => speakEN(w.en), 260);
            if (matched.size === picsCol.children.length) SFX.complete();
          } else {
            const wordEl = wordsCol.querySelector('[data-word="' + selectedWord + '"]');
            SFX.wrong();
            this.classList.add("wrong");
            wordEl.classList.add("wrong");
            const that = this;
            setTimeout(() => {
              that.classList.remove("wrong");
              wordEl.classList.remove("wrong", "selected");
            }, 500);
            selectedWord = null;
          }
        },
      });
      item.appendChild(el("span", { class: "emoji-large" }, picNode(w.id, w.emoji)));
      picsCol.appendChild(item);
    });

    game.appendChild(wordsCol);
    game.appendChild(picsCol);
    section.appendChild(game);
    root.appendChild(section);
    root.appendChild(continueBtn(s.contentButtonLabel));
  },

  multichoice: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    const section = el("div", { class: "screen-section" });
    root.appendChild(section);
    const continueWrap = el("div", { class: "continue-area" });
    const continueButton = el("button", { class: "btn btn-primary btn-big disabled-look", onclick: () => {} }, s.contentButtonLabel || "Дальше");
    continueWrap.appendChild(continueButton);
    root.appendChild(continueWrap);

    const total = s.questions.length;
    const queue = s.questions.slice();
    let qIdx = 0;

    function requeue(q) {
      if (q._isRepeat) return;
      const copy = Object.assign({}, q); copy._isRepeat = true;
      queue.push(copy);
    }

    function showQ() {
      section.innerHTML = "";
      if (qIdx >= queue.length) {
        SFX.complete();
        section.appendChild(el("div", { style: { textAlign: "center", padding: "40px", fontSize: "22px", color: "var(--green)", fontWeight: "700" } }, "✓ Молодец! Все ответы верные."));
        continueButton.classList.remove("disabled-look");
        continueButton.onclick = next;
        return;
      }
      const q = queue[qIdx];
      const w = getWord(q.word);
      let answered = false, wrongCount = 0, erred = false;

      section.appendChild(el("div", { class: "mc-counter" }, q._isRepeat ? "Повторим ещё раз 🔁" : ("Вопрос " + Math.min(qIdx + 1, total) + " из " + total)));

      const pic = el("div", { class: "word-picture" });
      pic.appendChild(el("div", { class: "word-emoji" }, picNode(w.id, w.emoji)));
      section.appendChild(pic);

      const opts = el("div", { class: "mc-options" });
      const shuffledOpts = shuffle(q.options);
      const optButtons = [];
      shuffledOpts.forEach(label => {
        const isCorrect = (label === w.en);
        const optBtn = el("button", { class: "mc-option" }, label);
        optButtons.push({ btn: optBtn, isCorrect: isCorrect });
        optBtn.addEventListener("click", function() {
          if (answered || this.classList.contains("eliminated")) return;
          if (isCorrect) {
            answered = true;
            SFX.correct();
            this.classList.add("correct");
            if (erred) requeue(q);
            setTimeout(() => speakEN(w.en, null, () => {
              setTimeout(() => { qIdx++; showQ(); }, 150);
            }), 140);
          } else {
            SFX.wrong();
            erred = true; wrongCount++;
            this.classList.add("wrong");
            const btn = this;
            setTimeout(() => btn.classList.remove("wrong"), 500);
            if (wrongCount >= 2) {
              const wrongs = optButtons.filter(o => !o.isCorrect && !o.btn.classList.contains("eliminated"));
              if (wrongs.length) wrongs[0].btn.classList.add("eliminated");
            }
          }
        });
        opts.appendChild(optBtn);
      });
      section.appendChild(opts);
    }
    showQ();
  },

  freepractice: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    // Example block — visible above the task
    const exampleBox = el("div", { class: "fp-example" });
    exampleBox.appendChild(el("div", { class: "fp-example-label" }, "Например"));
    exampleBox.appendChild(el("div", { class: "fp-example-text" }, "a cap, a T-shirt, jeans"));
    root.appendChild(exampleBox);

    const section = el("div", { class: "screen-section" });
    const wrap = el("div", { class: "fp-area" });

    const inputWrap = el("div", { class: "fp-input-wrap" });
    const textarea = el("textarea", {
      class: "fp-textarea",
      placeholder: "Пиши здесь по-английски...",
    });
    textarea.value = state.freeText || "";

    const counter = el("div", { class: "fp-counter" });
    const minWords = s.requireMinWords || 0;

    function countWords(text) {
      return (text || "")
        .split(/[\s,.;:!?()]+/)
        .map(w => w.replace(/^[^a-zA-Zа-яА-Я-]+|[^a-zA-Zа-яА-Я-]+$/g, ""))
        .filter(w => w.length >= 3).length;
    }
    function updateCounter() {
      const n = countWords(textarea.value);
      if (minWords > 0) {
        counter.textContent = "Слов: " + n + " / " + minWords;
        counter.classList.toggle("done", n >= minWords);
        if (n >= minWords) {
          submitBtn.classList.remove("disabled-look");
          submitBtn.onclick = next;
        } else {
          submitBtn.classList.add("disabled-look");
          submitBtn.onclick = function() {
            alert("Напиши ещё хотя бы " + (minWords - n) + " " + (minWords - n === 1 ? "слово" : "слов"));
          };
        }
      } else {
        counter.textContent = "Слов: " + n;
      }
    }
    textarea.addEventListener("input", function() {
      state.freeText = this.value;
      saveState();
      updateCounter();
    });
    inputWrap.appendChild(textarea);
    inputWrap.appendChild(counter);
    inputWrap.appendChild(el("div", { class: "fp-hint" }, "Если забыл слово — открой словарик справа. Без проверки правильности — пиши как умеешь."));
    wrap.appendChild(inputWrap);

    const dictBtn = el("button", { class: "fp-dict-btn", onclick: openDictionary });
    dictBtn.appendChild(el("div", { class: "fp-dict-emoji" }, "📖"));
    dictBtn.appendChild(el("div", {}, "Словарик"));
    wrap.appendChild(dictBtn);

    section.appendChild(wrap);
    root.appendChild(section);

    const submitWrap = el("div", { class: "continue-area" });
    const submitBtn = el("button", { class: "btn btn-primary btn-big" }, s.contentButtonLabel || "Готово");
    submitWrap.appendChild(submitBtn);
    root.appendChild(submitWrap);

    updateCounter();
  },

  reflection: function(s, root) {
    root.appendChild(el("div", { class: "content-instruction" }, s.question));
    const section = el("div", { class: "screen-section" });

    // Load previous selections if any
    let selected = new Set();
    if (Array.isArray(state.answers[s.saveKey])) {
      state.answers[s.saveKey].forEach(o => selected.add(o));
    }

    const grid = el("div", { class: "choice-grid" });
    s.options.forEach(opt => {
      const btn = el("button", {
        class: "choice-btn" + (selected.has(opt) ? " multi-selected" : ""),
      }, opt);
      btn.addEventListener("click", function() {
        if (selected.has(opt)) {
          selected.delete(opt);
          this.classList.remove("multi-selected");
        } else {
          selected.add(opt);
          this.classList.add("multi-selected");
        }
        state.answers[s.saveKey] = Array.from(selected);
        saveState();
        updateCont();
      });
      grid.appendChild(btn);
    });
    section.appendChild(grid);
    root.appendChild(section);

    const contArea = el("div", { class: "continue-area" });
    const contBtn = el("button", { class: "btn btn-primary btn-big disabled-look" }, s.contentButtonLabel || "Дальше");
    contBtn.addEventListener("click", function() { if (!contBtn.classList.contains("disabled-look")) next(); });
    contArea.appendChild(contBtn);
    root.appendChild(contArea);
    function updateCont() { contBtn.classList.toggle("disabled-look", selected.size < 1); }
    updateCont();
  },

  memory: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    const section = el("div", { class: "screen-section" });
    root.appendChild(section);
    const continueWrap = el("div", { class: "continue-area" });
    const continueButton = el("button", {
      class: "btn btn-primary btn-big disabled-look",
      onclick: function() {},
    }, s.contentButtonLabel || "Дальше");
    continueWrap.appendChild(continueButton);
    root.appendChild(continueWrap);

    const cards = [];
    s.pairs.forEach(wid => {
      const w = getWord(wid);
      cards.push({ pair: wid, type: "emoji", display: w.emoji });
      cards.push({ pair: wid, type: "word", display: w.en });
    });
    const shuffled = shuffle(cards);

    let flipped = [];
    let matched = new Set();
    let lock = true; // заблокировано на время показа

    const grid = el("div", { class: "memory-grid" });

    const banner = el("div", { class: "memo-banner" }, "👀 Запомни, где что!");
    section.appendChild(banner);

    shuffled.forEach((card, i) => {
      const cardEl = el("div", { class: "memory-card flipped" }); // старт: открыты
      const back = el("div", { class: "memory-card-back" }, "?");
      const front = el("div", { class: "memory-card-front" });
      if (card.type === "emoji") {
        front.appendChild(el("div", { class: "memory-card-emoji" }, picNode(card.pair, card.display)));
      } else {
        front.appendChild(el("div", { class: "memory-card-word" }, card.display));
      }
      cardEl.appendChild(back);
      cardEl.appendChild(front);
      cardEl.addEventListener("click", function() {
        if (lock) return;
        if (matched.has(i) || flipped.indexOf(i) !== -1) return;

        cardEl.classList.add("flipped");
        flipped.push(i);
        if (card.type === "word") speakEN(getWord(card.pair).en);

        if (flipped.length === 2) {
          const a = flipped[0], b = flipped[1];
          if (shuffled[a].pair === shuffled[b].pair) {
            SFX.correct();
            matched.add(a); matched.add(b);
            flipped = [];
            grid.children[a].classList.add("matched");
            grid.children[b].classList.add("matched");
            if (matched.size === shuffled.length) {
              SFX.complete();
              continueButton.classList.remove("disabled-look");
              continueButton.onclick = next;
            }
          } else {
            SFX.wrong();
            lock = true;
            setTimeout(function() {
              grid.children[a].classList.remove("flipped");
              grid.children[b].classList.remove("flipped");
              flipped = [];
              lock = false;
            }, 1200);
          }
        }
      });
      grid.appendChild(cardEl);
    });

    section.appendChild(grid);

    // Обратный отсчёт: карты открыты 5 сек, потом закрываются
    let count = 5;
    banner.textContent = "👀 Запомни, где что! " + count;
    const timer = setInterval(function() {
      count--;
      if (count > 0) {
        banner.textContent = "👀 Запомни, где что! " + count;
      } else {
        clearInterval(timer);
        banner.textContent = "Начинаем! Найди пары 🔎";
        for (let k = 0; k < grid.children.length; k++) {
          if (!matched.has(k)) grid.children[k].classList.remove("flipped");
        }
        lock = false;
        setTimeout(function(){ if (section.contains(banner)) banner.classList.add("memo-banner-fade"); }, 1500);
      }
    }, 1000);
  },

  anagram: function(s, root) {
    if (s.instruction) {
      root.appendChild(el("div", { class: "content-instruction" }, s.instruction));
    }
    const section = el("div", { class: "screen-section" });
    root.appendChild(section);
    const continueWrap = el("div", { class: "continue-area" });
    const continueButton = el("button", {
      class: "btn btn-primary btn-big disabled-look",
      onclick: function() {},
    }, s.contentButtonLabel || "Дальше");
    continueWrap.appendChild(continueButton);
    root.appendChild(continueWrap);

    let wordIdx = 0;

    function showWord() {
      section.innerHTML = "";
      if (wordIdx >= s.words.length) {
        SFX.complete();
        section.appendChild(el("div", {
          style: { textAlign: "center", padding: "40px", fontSize: "22px", color: "var(--green)", fontWeight: "700" },
        }, "✓ Молодец! Все слова собраны."));
        continueButton.classList.remove("disabled-look");
        continueButton.onclick = next;
        return;
      }

      const wid = s.words[wordIdx];
      const w = getWord(wid);
      const display = w.spelling || w.id;

      // Compute letters (only letter chars) and which slot positions are fillable
      const lettersOnly = [];
      const fillableIndices = [];
      for (let i = 0; i < display.length; i++) {
        const ch = display[i];
        if (/[a-zA-Z]/.test(ch)) {
          lettersOnly.push(ch);
          fillableIndices.push(i);
        }
      }

      section.appendChild(el("div", { class: "mc-counter" }, "Слово " + (wordIdx + 1) + " из " + s.words.length));

      const card = el("div", { class: "word-card" });

      // Picture
      const pic = el("div", { class: "word-picture" });
      pic.appendChild(el("div", { class: "word-emoji" }, picNode(w.id, w.emoji)));
      card.appendChild(pic);

      // Slots — one per char in display; separators (non-letters) are pre-filled
      const slotsRow = el("div", { class: "anagram-slots" });
      const slots = [];
      for (let i = 0; i < display.length; i++) {
        const ch = display[i];
        const slot = el("div", { class: "anagram-slot" });
        if (!/[a-zA-Z]/.test(ch)) {
          slot.textContent = ch;
          slot.classList.add("filled", "separator");
        }
        slotsRow.appendChild(slot);
        slots.push(slot);
      }
      card.appendChild(slotsRow);

      // Letter tiles (shuffled, only the letters)
      const tilesRow = el("div", { class: "anagram-tiles" });
      const shuffledLetters = shuffle(lettersOnly);
      let currentIdx = 0;

      shuffledLetters.forEach(function(letter) {
        const tile = el("button", { class: "anagram-tile" }, letter);
        tile.addEventListener("click", function() {
          if (this.classList.contains("used")) return;
          const expected = lettersOnly[currentIdx];
          if (letter === expected) {
            SFX.correct();
            const slotIdx = fillableIndices[currentIdx];
            slots[slotIdx].textContent = letter;
            slots[slotIdx].classList.add("filled");
            this.classList.add("used");
            currentIdx++;
            if (currentIdx === lettersOnly.length) {
              slots.forEach(function(s) {
                if (!s.classList.contains("separator")) s.classList.add("done");
              });
              speakEN(w.en);
              setTimeout(function() {
                wordIdx++;
                showWord();
              }, 1200);
            }
          } else {
            SFX.wrong();
            this.classList.add("wrong");
            const tt = this;
            setTimeout(function() { tt.classList.remove("wrong"); }, 500);
          }
        });
        tilesRow.appendChild(tile);
      });
      card.appendChild(tilesRow);

      section.appendChild(card);
    }
    showWord();
  },
};

// DICTIONARY
// ═══════════════════════════════════════════════════════
function openDictionary() {
  const grid = document.getElementById("dict-grid");
  grid.innerHTML = "";
  WORDS.forEach(w => {
    const item = el("div", { class: "dict-word" });
    item.appendChild(el("div", { class: "dict-word-emoji" }, picNode(w.id, w.emoji)));
    const txt = el("div");
    txt.appendChild(el("div", { class: "dict-word-en" }, w.en));
    txt.appendChild(el("div", { class: "dict-word-ru" }, w.ru));
    item.appendChild(txt);
    const sb = el("button", {
      class: "sound-btn",
      style: { width: "36px", height: "36px", fontSize: "16px", marginLeft: "auto" },
      onclick: function(e) { e.stopPropagation(); speakEN(w.phrase, this); },
    }, "🔊");
    item.appendChild(sb);
    grid.appendChild(item);
  });
  document.getElementById("dict-overlay").classList.add("open");
}

document.getElementById("dict-close-btn").addEventListener("click", () => {
  document.getElementById("dict-overlay").classList.remove("open");
});
document.getElementById("dict-overlay").addEventListener("click", (e) => {
  if (e.target.id === "dict-overlay") document.getElementById("dict-overlay").classList.remove("open");
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if (confirm("Начать урок заново? Прогресс будет удалён.")) {
    resetProgress();

});
