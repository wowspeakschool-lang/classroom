# Добавить ВНУТРЬ существующего server { } для api.wowteach.ru,
# рядом с блоками, которые уже проксируют Supabase.

location /tts {
    proxy_pass         http://127.0.0.1:8088;
    proxy_set_header   Host $host;
    proxy_set_header   Authorization $http_authorization;
    proxy_read_timeout 60s;

    # Запросы идут из браузера с другого домена
    add_header Access-Control-Allow-Origin  "https://classroom.wowteach.ru" always;
    add_header Access-Control-Allow-Headers "authorization, content-type"    always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS"             always;

    if ($request_method = OPTIONS) { return 204; }
}
