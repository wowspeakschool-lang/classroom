# Добавить ВНУТРЬ существующего server { } для api.wowteach.ru,
# рядом с блоками, которые уже проксируют Supabase.

location /tts {
    proxy_pass         http://127.0.0.1:8088;
    proxy_set_header   Host $host;
    proxy_set_header   Authorization $http_authorization;
    proxy_read_timeout 60s;

    # Запросы идут из браузера с другого домена
    # 19.10.2026: озвучку зовут и classroom, и платформа app.wowteach.ru —
    # заголовок отдаём тому из двух, кто спросил.
    set $cors "";
    if ($http_origin ~ ^https://(classroom|app)\.wowteach\.ru$) { set $cors $http_origin; }
    add_header Access-Control-Allow-Origin  $cors always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Headers "authorization, content-type"    always;
    add_header Access-Control-Allow-Methods "POST, GET, OPTIONS"             always;

    if ($request_method = OPTIONS) { return 204; }
}
