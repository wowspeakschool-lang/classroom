<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Волшебная страна — дорога на праздник</title>
<style>
:root{
  --sky:#bfe9ff; --card:#fffdf7; --ink:#3a2f4a;
  --accent:#ff9d3c; --good:#5ec26a; --bad:#ff8a8a;
  --shadow:0 10px 24px rgba(60,40,90,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"Nunito","Comic Sans MS",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);background:var(--sky);user-select:none;-webkit-user-select:none}
img{-webkit-user-drag:none}
#app{position:fixed;inset:0}

/* ───────── карта ───────── */
#map{position:absolute;inset:0;display:none;background:#bfe9ff center/cover no-repeat}
#map.on{display:block}
.island{position:absolute;transform:translate(-50%,-50%);width:30%;max-width:420px;
  border:0;background:none;padding:0;cursor:pointer;transition:transform .2s}
.island img{width:100%;display:block;filter:drop-shadow(0 12px 18px rgba(40,60,90,.25))}
.island:active{transform:translate(-50%,-50%) scale(.96)}
.island .name{display:block;margin-top:-6px;font-size:clamp(13px,2.4vw,22px);font-weight:800;
  color:#fff;text-shadow:0 2px 6px rgba(40,60,90,.6)}
.island.locked img{filter:grayscale(.9) brightness(.82) contrast(.9)
  drop-shadow(0 12px 18px rgba(40,60,90,.25));opacity:.75}
.island.locked .name{opacity:.7}
.island .tick{position:absolute;top:2%;right:8%;font-size:clamp(22px,4vw,40px)}
.island .lock{position:absolute;top:8%;left:50%;transform:translateX(-50%);
  font-size:clamp(20px,3.6vw,36px);filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.island.shake{animation:islandshake .4s}
@keyframes islandshake{25%{transform:translate(calc(-50% - 10px),-50%)}
                       75%{transform:translate(calc(-50% + 10px),-50%)}}
.dot{position:absolute;transform:translate(-50%,-50%);width:5.4%;max-width:64px;
  opacity:0;transition:opacity .4s}
.dot.on{opacity:1}
/* Белая обводка: без неё камушек сливался с травой и водой. */
.dot img{width:100%;display:block;
  filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 4px #fff) drop-shadow(0 4px 6px rgba(40,60,90,.3))}
/* Новый камушек/облачко падает и потом мигает, пока экран открыт. */
.dot.pop{animation:drop .6s both, blink 1.1s .6s ease-in-out infinite}
.dot.pop img{filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 10px #ffe46b) drop-shadow(0 0 18px #ffd23f)}
@keyframes blink{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  50%{transform:translate(-50%,-50%) scale(1.35);opacity:.55}}
@keyframes drop{0%{transform:translate(-50%,-160%) scale(1.5);opacity:0}
                60%{transform:translate(-50%,-50%) scale(1.1);opacity:1}
                100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
/* Светлячок и его подсказка — одной строкой внизу: пузырь, поставленный
   отдельно по центру, ложился прямо на светлячка. Без подсказки ребёнок
   попадал на карту и просто смотрел на острова. */
#map .mapguide{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);
  display:flex;align-items:flex-end;gap:12px;width:min(78%,760px);justify-content:center}
/* Мия заполняет квадрат плотнее светлячка и при 130 px заходила головой
   на название Солнечной Полянки. */
#map .mapguide img{width:min(12vw,104px);flex:0 0 auto;display:block}
#map .mapsay{flex:0 1 auto;margin-bottom:6px;
  background:var(--card);border-radius:20px;padding:10px 16px;box-shadow:var(--shadow);
  font-size:clamp(13px,1.8vw,20px);line-height:1.35;text-align:left}
/* На низком экране подсказка ложилась на названия островов. */
@media (max-height:470px){
  #map .mapguide{bottom:1%;gap:8px;width:min(92%,760px)}
  #map .mapguide img{width:min(11vw,84px)}
  #map .mapsay{font-size:13px;padding:6px 12px;border-radius:16px;margin-bottom:2px}
  .island .name{font-size:clamp(11px,2vw,16px)}
}
.island.beckon{animation:beat 1.6s ease-in-out infinite}
.island.beckon .name{text-shadow:0 2px 10px rgba(255,180,60,.95),0 2px 6px rgba(40,60,90,.6)}
#map .maptitle{position:absolute;left:50%;top:3%;transform:translateX(-50%);
  font-size:clamp(16px,3vw,30px);font-weight:900;color:#fff;
  text-shadow:0 3px 10px rgba(40,60,90,.55);white-space:nowrap}

/* ───────── урок ───────── */
#lesson{position:absolute;inset:0;display:none;flex-direction:column;
  background:linear-gradient(180deg,#d9f3ff 0%,#fff4de 100%)}
#lesson.on{display:flex}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:8px 14px}
.topbar .home,.topbar .listen{border:0;background:rgba(255,255,255,.85);border-radius:999px;
  width:52px;height:52px;padding:0;font-size:26px;cursor:pointer;box-shadow:var(--shadow);flex:0 0 auto}
.topbar .home:active,.topbar .listen:active{transform:scale(.94)}
/* Сколько шагов внутри одного задания уже сделано. Без этого ребёнок не
   понимал, что начался следующий раунд: картинка сменилась, а игра та же. */
.topbar .roundbar{display:flex;gap:7px;margin:0 auto;align-items:center}
.topbar .roundbar i{width:16px;height:16px;border-radius:50%;
  background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 2px rgba(120,110,140,.3);
  transition:background .3s, transform .3s}
.topbar .roundbar i.on{background:var(--good);box-shadow:none;transform:scale(1.15)}
.topbar .tokens{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.topbar .tokens img{width:30px;height:30px;object-fit:contain}
.topbar .tokens .ghost{width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.45);border:2px dashed rgba(120,110,140,.35)}

.stage{flex:1 1 auto;display:flex;align-items:center;gap:2vw;padding:0 3vw 6px;
  min-height:0;overflow:hidden}
.guide{flex:0 0 22%;max-width:230px;display:flex;flex-direction:column;align-items:center}
.guide img{width:100%;max-width:180px;display:block}
.bubble{background:var(--card);border-radius:20px;padding:10px 14px;box-shadow:var(--shadow);
  font-size:clamp(13px,1.6vw,18px);line-height:1.35;text-align:center;margin-top:-6px}

/* Высота считается от свободного места, а не в vh: иначе на низком экране
   содержимое наползает на кнопку и перехватывает нажатие. */
.content{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1vh;min-width:0;min-height:0;height:100%;overflow:hidden}
.picarea{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;
  justify-content:center;gap:2vw}
.picarea img{height:100%;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(40,60,90,.2))}
.picarea.who{flex:0 1 30%;min-height:18%}
/* Когда на экране есть и герой, и цель, троим тесно: карточки ужимались
   до 56 px на узком телефоне. Тогда герой и цель отдают место ряду. */
.content.withwho .picarea.who{flex:0 1 22%}
.content.withwho .target{flex:0 0 32%}
.picarea.small img{height:auto;max-height:100%;width:auto;max-width:34%}
/* Предмет для корзин должен быть заметно меньше самих корзин, иначе
   непонятно, что во что кладут. */
.picarea.sortitem{flex:1 1 0}
.picarea.sortitem img{height:auto;max-height:58%;width:auto;max-width:20%;
  object-fit:contain}
.picarea.sortitem img.gone{opacity:0;transform:scale(.3)}
.picarea.items{gap:4vw}
.picarea.items img{height:auto;max-height:100%;width:auto;max-width:24%}
/* Две картинки в сюжете — не три зверька: им можно занять полэкрана. */
.picarea.duo{gap:4vw}
.picarea.duo img{height:auto;max-height:100%;width:auto;max-width:42%}
/* Тёмная пещера. Время — под запись RU-59 (Мия, 10.4 с): «Как темно…»
   до 2.0 с, «Сейчас позову своих светлячков» 2.4–4.3, «Светлячки, летите
   сюда!» 4.8–6.8, «Смотри — гнёздышко» с 7.2. Светлячки слетаются по
   одному с 5 с, свет загорается к «Смотри». Цикл — 7.6 с. */
.picarea.dark{position:relative}
.picarea.dark.go img.scene{animation:cavelit 7.6s ease forwards}
@keyframes cavelit{0%,86%{filter:brightness(.14) saturate(.5)}
  97%,100%{filter:brightness(1) saturate(1) drop-shadow(0 8px 16px rgba(40,60,90,.2))}}
.picarea.dark img.fly{position:absolute;height:auto;max-width:none;opacity:0;
  filter:drop-shadow(0 0 10px #fff3a0) drop-shadow(0 0 22px #ffe066)}
.picarea.dark.go img.fly{animation:swarmin 1.7s ease-out var(--d) both,
  hover 1.8s ease-in-out calc(var(--d) + 1.7s) infinite alternate}
@keyframes swarmin{from{opacity:0;transform:translate(var(--sx),var(--sy)) scale(.5)}
  30%{opacity:1}to{opacity:1;transform:translate(0,0) scale(1)}}
@keyframes hover{from{translate:0 0}to{translate:0 -14%}}
.picarea.dark::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,236,150,.6),rgba(255,236,150,0) 42%)}
.picarea.dark.go::after{animation:caveglow 7.6s ease forwards}
@keyframes caveglow{0%,84%{opacity:0}93%{opacity:1}100%{opacity:.35}}
.picarea.dark::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 45%,rgba(255,236,150,.6),rgba(255,236,150,0) 42%)}
.picarea.dark.go::after{animation:caveglow 5s ease forwards}
@keyframes caveglow{0%,72%{opacity:0}84%{opacity:1}100%{opacity:.35}}
.below{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.wordline{font-size:clamp(22px,4vw,44px);font-weight:900;letter-spacing:.5px;text-align:center}

.stage.solo{justify-content:center}
/* Высота обязательна: иначе крупный светлячок выдавливает пузырь за низ
   сцены, и у первой реплики обрезалось последнее слово. */
.stage.solo .guide{flex:0 0 auto;width:min(46%,400px);max-width:none;
  height:100%;justify-content:center;min-height:0}
.stage.solo .guide img{flex:0 1 auto;min-height:0;width:auto;height:auto;
  max-width:100%;max-height:72%;object-fit:contain}
.stage.solo .bubble{flex:0 0 auto;max-width:100%;font-size:clamp(15px,2.1vw,23px)}
.stage.solo .content{display:none}
/* Картинка без гида: Мия и пузырь прячутся, реплика звучит как обычно.
   На «Раз, два, взяли!» сцена со зверятами — сама по себе рассказ, и
   фигурка с текстом сбоку её только сжимала (Анна). */
.stage.piconly .guide{display:none}

.mapview{flex:1 1 0;min-height:0;width:100%;position:relative;border-radius:24px;
  background-position:center;background-size:cover;box-shadow:var(--shadow);overflow:hidden}
.mapview>img{position:absolute;transform:translate(-50%,-50%);width:26%;
  filter:drop-shadow(0 8px 14px rgba(40,60,90,.25))}
/* Вступление: сначала все острова тусклые — дороги ещё нет; потом первый
   оживает и зовёт нажать на себя. */
.mapview>img.dim{filter:grayscale(.9) brightness(.82) contrast(.9)
  drop-shadow(0 8px 14px rgba(40,60,90,.25));opacity:.7}
.mapview>img.wake{animation:wake 1.2s ease-out both}
@keyframes wake{0%{filter:grayscale(.9) brightness(.82);opacity:.7}
  100%{filter:none;opacity:1}}
.mapview>img.pick{cursor:pointer;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.08)}}
.mapview>img.nudge{animation:nudge .4s}
@keyframes nudge{25%{transform:translate(-58%,-50%)}75%{transform:translate(-42%,-50%)}}

/* ───────── чего не стало и раскрась ───────── */
.shelfrow{gap:3vw;position:relative}
.shelfrow img{transition:opacity .35s, transform .35s}
.shelfrow img.hidden{opacity:0;transform:scale(.4)}
.shelfrow img.back{animation:pop .5s}
.veil{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:auto;height:118%;max-width:none;opacity:0;animation:veilin .4s forwards}
.veil.away{animation:veilout .45s forwards}
@keyframes veilin{from{opacity:0;transform:translate(-50%,-70%)}
  to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes veilout{from{opacity:1;transform:translate(-50%,-50%)}
  to{opacity:0;transform:translate(-50%,-30%)}}
.cards.locked{pointer-events:none;opacity:.55}
.paintarea{position:relative}
.paintarea img{height:100%;max-width:100%;object-fit:contain}
.paintarea img.splash{animation:pop .5s}

/* ───────── карточки ───────── */
.cards{--n:2;--gap:3vw;gap:var(--gap)}
.card{background:var(--card);border:4px solid transparent;border-radius:26px;
  box-shadow:var(--shadow);padding:1.4%;cursor:pointer;flex:0 0 auto;
  --side:min(calc((var(--bw,100%) - (var(--n) - 1) * var(--gap)) / var(--n)),
             var(--bh,100%), 400px);
  width:var(--side);height:var(--side);
  display:flex;align-items:center;justify-content:center;
  transition:transform .15s,border-color .2s,opacity .3s}
.card img{height:100%;width:100%;object-fit:contain;display:block;pointer-events:none}
.card:active{transform:scale(.96)}
.card.right{border-color:var(--good);animation:pop .4s}
.card.wrong{border-color:var(--bad);animation:shake .4s}
.card.gone{opacity:0;transform:scale(.3);pointer-events:none}

/* ───────── «получилось!» между раундами ───────── */
.cheer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:40}
.cheer span{font-size:min(22vh,150px);line-height:1;
  filter:drop-shadow(0 8px 20px rgba(40,60,90,.35));animation:cheerin .9s ease-out forwards}
@keyframes cheerin{
  0%{transform:scale(.3) rotate(-12deg);opacity:0}
  35%{transform:scale(1.15) rotate(4deg);opacity:1}
  55%{transform:scale(1) rotate(0)}
  80%{opacity:1}
  100%{transform:scale(1.05);opacity:0}}
/* Новый раунд проявляется, а не подменяется мгновенно. Только прозрачность:
   от масштаба поехали бы замеры карточек в fit(). */
.content.fresh, .sortitem img.fresh{animation:freshin .32s ease-out}
@keyframes freshin{from{opacity:0}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* ───────── поле предметов (нажми на все / шарики) ───────── */
.field{flex:1 1 0;min-height:0;width:100%;display:grid;gap:1.5vw;
  grid-template-columns:repeat(3,1fr);align-content:center;justify-items:center}
.field .cell{width:100%;height:100%;min-height:0;background:none;border:0;padding:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:opacity .35s,transform .35s}
.field .cell img{max-height:100%;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(40,60,90,.22))}
.field .cell.gone{opacity:0;transform:scale(.2) rotate(15deg);pointer-events:none}
.field .cell.wrong{animation:shake .4s}
.field.float .cell img{animation:floaty 2.6s ease-in-out infinite alternate}
@keyframes floaty{from{transform:translateY(-6%)}to{transform:translateY(6%)}}

/* ───────── корзины ───────── */
.baskets{flex:0 0 46%;display:flex;gap:3vw;align-items:flex-end;justify-content:center;
  width:100%;min-height:0}
.baskets button{border:0;background:none;padding:0;cursor:pointer;height:100%;
  flex:1 1 0;min-width:0;transition:transform .15s}
.baskets button:active{transform:scale(.94)}
.baskets img{height:100%;width:100%;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(40,60,90,.25))}
.baskets button.wrong{animation:shake .4s}
.baskets button.hit img{animation:pop .5s}

/* ───────── кляксы ───────── */
.blobs{flex:1 1 0;min-height:0;display:flex;gap:4vw;align-items:center;justify-content:center;
  width:100%}
.blobs button{border:0;background:none;padding:0;cursor:pointer;height:70%;
  flex:1 1 0;min-width:0;transition:transform .15s}
.blobs img{height:100%;width:100%;object-fit:contain}
.blobs button.lit{animation:pop .5s}
.blobs button.wrong{animation:shake .4s}

/* ───────── цель: чемодан, машинка, полка ───────── */
/* width:100% обязателен: без него .target сжимается по ширине картинки,
   и max-width считается уже от неё — чемодан ужимался до 62% самого себя
   и выглядел вчетверо меньше карточек. */
.target{flex:0 0 46%;min-height:0;width:100%;
  display:flex;align-items:center;justify-content:center}
.target{gap:2vw}
.target img.who{height:76%;max-width:20%;align-self:flex-end}
.target img{height:100%;max-width:55%;object-fit:contain;
  filter:drop-shadow(0 8px 16px rgba(40,60,90,.25))}
.target.hit img:not(.who){animation:pop .5s}

/* ───────── лента (поймай вещь) ───────── */
.belt{flex:1 1 0;min-height:0;width:100%;position:relative;overflow:hidden}
.belt .train{position:absolute;top:50%;left:100%;display:flex;align-items:center;
  gap:calc(var(--side,120px) * .7);transform:translate(0,-50%)}
.belt .cell{flex:0 0 auto;width:var(--side,120px);height:var(--side,120px);border:0;
  background:none;padding:0;cursor:pointer}
.belt .cell img{width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 6px 12px rgba(40,60,90,.22))}
.belt .cell.gone{opacity:0;transition:opacity .3s;pointer-events:none}
.belt .cell.wrong{animation:shake .4s}

/* ───────── рука с пальцами ───────── */
.handrow{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;
  justify-content:center;gap:3vw}
.handbox{position:relative;height:100%;display:flex;align-items:center}
.handbox{max-width:60%}
.handbox img.hand{height:100%;max-width:100%;object-fit:contain;display:block}
.handbox .arrow{position:absolute;width:0;height:0;
  border-left:14px solid transparent;border-right:14px solid transparent;
  border-top:20px solid var(--accent);transform:translate(-50%,-100%);
  transition:left .28s ease,top .28s ease;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));
  opacity:0}
.handbox .arrow.on{opacity:1}
.handrow .thing{height:56%;max-width:34%;object-fit:contain;transition:opacity .3s;
  filter:drop-shadow(0 8px 16px rgba(40,60,90,.2))}
.handrow .thing.swap{animation:pop .5s}

/* верно или нет */
.yesno{flex:0 0 26%;display:flex;gap:6vw;align-items:center;justify-content:center;width:100%}
.yesno button{border:0;border-radius:50%;width:auto;height:100%;aspect-ratio:1;
  font-size:clamp(28px,6vw,54px);cursor:pointer;box-shadow:var(--shadow);
  background:#fff;transition:transform .15s}
.yesno button:active{transform:scale(.94)}
.yesno .yes{background:#d8f5da}
.yesno .no{background:#ffe0e0}
.yesno button.wrong{animation:shake .4s}
/* летящая в цель вещь */
.flyer{position:fixed;object-fit:contain;z-index:50;pointer-events:none;
  transition:left .55s cubic-bezier(.4,0,.2,1), top .55s cubic-bezier(.4,0,.2,1),
             width .55s cubic-bezier(.4,0,.2,1), height .55s cubic-bezier(.4,0,.2,1),
             opacity .55s}
/* подсказка «теперь твоя очередь» */
/* Просто текст, без плашки: оранжевая плашка выглядела как кнопка. */
.turn{flex:0 0 auto;color:var(--accent);font-weight:900;text-align:center;
  font-size:clamp(15px,2.4vw,22px);text-shadow:0 1px 0 #fff;animation:pop .5s}

/* Кнопки — «одна большая» (Анна выбрала вариант 3): на экране одна
   крупная кнопка почти во всю ширину, «Ещё раз» — круглый значок в шапке. */
.bottombar{flex:0 0 auto;display:flex;gap:12px;align-items:center;justify-content:center;
  padding:8px 16px calc(16px + env(safe-area-inset-bottom))}
.btn{border:0;border-radius:22px;width:min(88vw,440px);min-height:66px;padding:0 24px;
  font:inherit;font-weight:900;font-size:clamp(19px,2.4vw,26px);color:#fff;
  background:linear-gradient(180deg,#ffb35c,#ff8f2a);
  box-shadow:0 8px 18px rgba(255,140,40,.35);cursor:pointer}
.btn:active{transform:translateY(2px)}
.btn:disabled{opacity:.6}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid #ffd8b0;
  box-shadow:0 6px 16px rgba(60,40,90,.15)}
.btn.next{background:linear-gradient(180deg,#71d27c,#4bb158);
  box-shadow:0 8px 18px rgba(70,170,80,.35)}
.btn[hidden]{display:none}
/* Экран, где «Дальше» появится позже, держит под неё место —
   иначе картинка прыгает вверх-вниз, когда кнопка выезжает. */
.bottombar.waits .next[hidden]{display:block;visibility:hidden}

#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(40,30,60,.5);backdrop-filter:blur(3px);z-index:20}
#overlay.on{display:flex}
.panel{background:var(--card);border-radius:28px;padding:26px 30px;text-align:center;
  box-shadow:var(--shadow);max-width:min(90%,560px)}
.panel h2{margin:0 0 6px;font-size:clamp(20px,3.4vw,30px)}
.panel p{margin:0 0 18px;font-size:clamp(14px,2vw,19px);line-height:1.4}
.panel .row{display:flex;flex-direction:column;align-items:stretch;gap:14px}
.panel .btn{width:100%;white-space:nowrap;font-size:clamp(16px,2vw,22px)}

#wsdev{position:absolute;right:10px;top:10px;z-index:30;display:none;gap:6px}
#wsdev.on{display:flex}
#wsdev button{border:0;border-radius:10px;background:rgba(0,0,0,.55);color:#fff;
  font:inherit;font-size:13px;padding:6px 10px;cursor:pointer}
/* Временная нумерация экранов: чтобы Анне хватало прислать номер. */
#wsdev .num{border-radius:10px;background:rgba(255,157,60,.92);color:#fff;
  font:inherit;font-weight:900;font-size:14px;padding:6px 12px;align-self:center}

@media (max-aspect-ratio:1/1){
  .stage{flex-direction:column;gap:1vh;padding-top:4px}
  .guide{flex:0 0 auto;max-width:none;width:100%;flex-direction:row;align-items:center;gap:10px}
  .guide img{width:22%;max-width:104px}
  .bubble{margin-top:0;text-align:left;flex:1 1 auto;font-size:clamp(13px,3.4vw,18px)}
  /* Растянуть по ширине: без этого карта с камушками, лента и ряд
     карточек (у них нет своей ширины) схлопывались в ноль. */
  .content{flex:1 1 auto;height:auto;align-self:stretch}
  .cards{gap:4vw}
  .handrow{flex-direction:column;gap:1vh}
  .handrow .thing{height:auto;max-height:30%;max-width:40%}
}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="lesson">
    <div class="topbar">
      <button class="home" title="На карту">🗺️</button>
      <button class="listen" title="Ещё раз">🔊</button>
      <div class="roundbar"></div>
      <div class="tokens"></div>
    </div>
    <div class="stage">
      <div class="guide"><img alt=""><div class="bubble"></div></div>
      <div class="content"></div>
    </div>
    <div class="bottombar">
      <button class="btn next" hidden>Дальше ▶</button>
    </div>
  </div>
  <div id="overlay"><div class="panel"></div></div>
  <div id="wsdev">
    <span class="num"></span>
    <button data-act="prev">◀</button>
    <button data-act="next">▶</button>
    <button data-act="reset">↻ сначала</button>
  </div>
</div>
<script>
const DEV_PANEL = __DEV__;
const IMG = __IMG__;
const AUDIO = __AUDIO__;
const LESSONS = __LESSONS__;
const PRAISE = __PRAISE__;
const RETRY = __RETRY__;
const ASK = __ASK__;
const FINALE = __FINALE__;
const ECHO = __ECHO__;
const MAPSAY = __MAPSAY__;
// Ссылка на запись: подставить, когда Анна её пришлёт. Пока пусто —
// кнопка показывает подпись-заглушку вместо того, чтобы молча не работать.
const GIFT_URL = "";          // ссылка кнопки «Получить подарок» в финале
const COLORS = __COLORS__;
const FRIENDS = __FRIENDS__;
const TIPS = __TIPS__;
const HOP = /[?&]fast=1/.test(location.search) ? 60 : 700;
// пауза на повтор ребёнком в эхо-раунде
const ECHO_PAUSE = /[?&]fast=1/.test(location.search) ? 60 : 2200;
const STORE = "ws46_progress";
const ISLAND_POS = [[20, 60], [50, 38], [80, 62]];

/* ─────────────────────────── звук ─────────────────────────── */
let current = null;
function stopSound(){
  if (current){ try{ current.pause(); }catch(e){} current = null; }
  try{ speechSynthesis.cancel(); }catch(e){}
}
/* Страховка по времени обязательна: событие «речь закончилась» в вебвью и
   на телефоне может не прийти вовсе, и экран встанет намертво.

   Но считать её по длине текста нельзя: у русских реплик текст сюда не
   передаётся (он только в пузыре), и запись на восемь секунд «заканчивалась»
   через полторы. Пока озвучки не было, это ничего не ломало; с ней английское
   слово полезло бы поверх Искорки. Для записи берём её настоящую длину. */
/* Похвала звучит поверх смены раунда, а всё, что должно прозвучать после
   неё, ждёт её конца. Экран сменился, пока ждали, — звук уже не нужен. */
function play(key, text, lang){
  const mine = token;
  return praiseEnd.then(() => mine === token ? playNow(key, text, lang) : undefined);
}
function playNow(key, text, lang){
  stopSound();
  return new Promise(resolve => {
    let done = false, timer = null;
    const finish = () => { if (!done){ done = true; clearTimeout(timer); resolve(); } };
    const guard = ms => { clearTimeout(timer); timer = setTimeout(finish, ms); };
    guard(Math.min(12000, 1500 + (text ? text.length * 90 : 0)));
    const src = AUDIO[key];
    if (src){
      const a = new Audio(src);
      current = a;
      a.onended = a.onerror = finish;
      guard(20000);                       // пока длина неизвестна
      a.onloadedmetadata = () => {
        if (isFinite(a.duration) && a.duration) guard(a.duration * 1000 + 900);
      };
      a.play().catch(finish);
      return;
    }
    /* Русский синтез не используем: звучит плохо. Без записи реплика молчит,
       текст для взрослого остаётся в пузыре. Английское ребёнку надо слышать. */
    if (!text || lang !== "en" || !("speechSynthesis" in window)){ finish(); return; }
    try{
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = 0.8;
      u.onend = u.onerror = finish;
      speechSynthesis.speak(u);
    } catch(e){ finish(); }
  });
}
const en = v => play(v[0], v[1], "en");
const ru = k => play(k);
const choice = a => a[Math.floor(Math.random() * a.length)];
/* Похвала идёт из перемешанной колоды, а не наугад: наугад из пяти то и
   дело выпадало одно и то же, и четыре «Ух ты, как здорово!» подряд
   раздражают. Колода кончилась — перемешиваем заново так, чтобы первая
   не совпала с последней сказанной.

   Своим звуком, мимо current: смена раунда вызывает stopSound(), и через
   play() похвала обрывалась бы на полуслове. */
let praiseBag = [], lastPraise = null, praiseEnd = Promise.resolve();
function nextPraise(){
  if (!praiseBag.length){
    praiseBag = shuffle(PRAISE);
    if (praiseBag.length > 1 && praiseBag[0] === lastPraise) praiseBag.push(praiseBag.shift());
  }
  return lastPraise = praiseBag.shift();
}
function praise(){
  const src = AUDIO[nextPraise()];
  if (!src) return;
  praiseEnd = new Promise(done => {
    const a = new Audio(src);
    let guard = setTimeout(done, 4000);
    // та же пауза, что после реплики Искорки перед английским словом
    a.onended = a.onerror = () => { clearTimeout(guard); setTimeout(done, 250); };
    a.onloadedmetadata = () => {
      if (isFinite(a.duration) && a.duration){
        clearTimeout(guard); guard = setTimeout(done, a.duration * 1000 + 300);
      }
    };
    a.play().catch(done);
  });
}
const retry = () => ru(choice(RETRY));
function blip(key){
  try { const a = new Audio(AUDIO[key]); a.volume = .7; a.play().catch(()=>{}); } catch(e){}
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const pic = t => IMG[t[0] + "_" + t[1]];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ───────────────────────── прогресс ───────────────────────── */
function progress(){
  try { return JSON.parse(localStorage.getItem(STORE)) || {done:[]}; }
  catch(e){ return {done:[]}; }
}
function saveProgress(p){ try{ localStorage.setItem(STORE, JSON.stringify(p)); }catch(e){} }
const isDone = id => progress().done.indexOf(id) >= 0;
const unlocked = id => id === 1 || isDone(id - 1);

/* ─────────────────────────── карта ────────────────────────── */
const mapEl = document.getElementById("map");
const lessonEl = document.getElementById("lesson");
const overlay = document.getElementById("overlay");

function dotPos(i, k, total){
  const t = (k + 1) / (total + 1);
  return [ISLAND_POS[i][0] + (ISLAND_POS[i+1][0] - ISLAND_POS[i][0]) * t,
          ISLAND_POS[i][1] + (ISLAND_POS[i+1][1] - ISLAND_POS[i][1]) * t + 13];
}
function addDots(host, i, shown, popLast){
  const les = LESSONS[i], total = les.tokens;
  for (let k = 0; k < total; k++){
    const d = document.createElement("div");
    const p = dotPos(i, k, total);
    d.className = "dot" + (k < shown ? " on" : "") + (popLast && k === shown-1 ? " pop" : "");
    d.style.left = p[0] + "%"; d.style.top = p[1] + "%";
    d.innerHTML = '<img src="' + IMG[les.token] + '" alt="">';
    host.appendChild(d);
  }
}
/* Какой остров зовёт: первый открытый, но не пройденный. */
function nextIsland(){
  for (let i = 0; i < LESSONS.length; i++){
    const id = LESSONS[i].id;
    if (unlocked(id) && !isDone(id)) return i;
  }
  return -1;
}
function mapLine(){
  const done = progress().done.length;
  if (done >= LESSONS.length) return MAPSAY[2];
  if (done === 1 || done === 2) return MAPSAY[done - 1];
  return MAPSAY[3];
}
function buildMap(){
  mapEl.style.backgroundImage = "url(" + IMG.map_bg + ")";
  mapEl.innerHTML = '<div class="maptitle">Дорога на праздник</div>';
  const call = nextIsland();
  LESSONS.forEach((les, i) => {
    const b = document.createElement("button");
    b.className = "island" + (unlocked(les.id) ? "" : " locked") +
      (i === call ? " beckon" : "");
    b.style.left = ISLAND_POS[i][0] + "%"; b.style.top = ISLAND_POS[i][1] + "%";
    b.innerHTML = '<img src="' + IMG[les.island] + '" alt="">' +
      '<span class="name">' + les.title + "</span>" +
      (isDone(les.id) ? '<span class="tick">⭐</span>' : "") +
      (unlocked(les.id) ? "" : '<span class="lock">🔒</span>');
    b.onclick = () => {
      if (unlocked(les.id)){ startLesson(i); return; }
      b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake");
      blip("SFX-NO");
    };
    mapEl.appendChild(b);
    if (i < LESSONS.length - 1) addDots(mapEl, i, isDone(les.id) ? les.tokens : 0, false);
  });
  const g = document.createElement("div");
  g.className = "mapguide";
  g.innerHTML = '<img src="' + IMG.guide_smile + '" alt="">' +
    '<div class="mapsay">' + mapLine().text + "</div>";
  mapEl.appendChild(g);
}
function showMap(){
  stopSound(); token++; buildMap();
  mapEl.classList.add("on");
  lessonEl.classList.remove("on");
  overlay.classList.remove("on");
  ru(mapLine().ru);
}

/* ─────────────────────────── урок ─────────────────────────── */
const guideImg = lessonEl.querySelector(".guide img");
const bubble = lessonEl.querySelector(".bubble");
const content = lessonEl.querySelector(".content");
const tokensEl = lessonEl.querySelector(".tokens");
const btnNext = lessonEl.querySelector(".next");
const btnListen = lessonEl.querySelector(".listen");
let L = 0, S = 0, round = 0, earned = 0, token = 0;

function startLesson(i){
  L = i; S = 0; round = 0; earned = 0;
  // Пока ни один урок не пройден, карты ещё нет — и уводить на неё некуда.
  lessonEl.querySelector(".home").hidden = progress().done.length === 0;
  mapEl.classList.remove("on"); lessonEl.classList.add("on");
  render();
}

/* Первый запуск начинается не с карты, а сразу со светлячка: острова
   ребёнок увидит, когда пройдёт первый урок и ему будет что выбирать. */
function boot(){
  if (progress().done.length === 0) startLesson(0); else showMap();
}
const lesson = () => LESSONS[L];
const screen = () => lesson().screens[S];

function drawTokens(){
  let html = "";
  for (let i = 0; i < lesson().tokens; i++){
    const key = lesson().token === "friend" ? FRIENDS[i] : lesson().token;
    html += i < earned ? '<img src="' + IMG[key] + '" alt="">' : '<div class="ghost"></div>';
  }
  tokensEl.innerHTML = html;
}

function updateNum(){
  const num = document.querySelector("#wsdev .num");
  if (!num) return;
  const s = screen();
  num.textContent = "У" + lesson().id + " · " + (S + 1) +
    (s.rounds && s.rounds.length > 1 ? " (" + (round + 1) + "/" + s.rounds.length + ")" : "");
}
function render(){
  stopSound(); token++;
  const s = screen();
  // guide — свой портрет экрана (на первом Мия с приглашением в руках)
  guideImg.src = IMG[s.guide || (s.solo || s.t === "token" ? "guide_wow" : "guide")];
  bubble.textContent = s.text || "";
  content.innerHTML = "";
  btnNext.hidden = true;
  btnNext.parentNode.classList.remove("waits");
  btnNext.textContent = s.btn || "Дальше ▶";
  lessonEl.querySelector(".stage").classList.toggle("solo", !!s.solo);
  lessonEl.querySelector(".stage").classList.toggle("piconly", !!s.picOnly);
  content.classList.toggle("withwho", !!(s.who && s.t !== "collect"));
  if (s.t === "token") earned = s.n;
  drawTokens();
  updateNum();
  drawRounds();
  content.classList.remove("fresh"); void content.offsetWidth;
  content.classList.add("fresh");
  RENDER[s.t](s);
  fit();
  if (s._run) s._run();
}

/* Реплики идут очередью, а не по таймеру: без русской записи пауза перед
   английским словом — пустая тишина. Маркер обрывает очередь, если экран
   уже сменился. */
async function queue(steps){
  const mine = token;
  for (const step of steps){
    if (mine !== token) return;
    await step();
  }
}
/* Английское слово и само задание идут ТОЛЬКО после того, как Искорка
   договорит: иначе ребёнок начинает тыкать, не дослушав. Пока записи нет,
   на чтение реплики взрослому даётся пауза по длине текста. */
function readPause(text){
  if (HOP < 200) return 120;              // ?fast=1 — режим проверки
  return Math.min(4200, 900 + (text || "").length * 45);
}
function taskSteps(s){
  const steps = [];
  const r = s.rounds ? s.rounds[round] : null;
  if (s.t === "word"){
    steps.push(() => en(s.voice));     // один раз (Анна): медленный повтор убран
  }
  if (s.t === "findall") steps.push(() => en(s.voice));
  if (s.t === "sort" && r) steps.push(() => en(r.voice));
  if ((s.t === "collect" || s.t === "catch" || s.t === "pick" ||
       s.t === "paint") && r){
    steps.push(() => en(r.voice));
  }
  if (s.t === "truefalse" && r) steps.push(() => en(r.voice));
  if (s.t === "order" && r){
    r.voices.forEach(v => { steps.push(() => en(v)); steps.push(() => wait(350)); });
  }
  return steps;
}
/* Ставит содержимое задания и включает его звук, когда реплика отзвучала. */
function afterIntro(s, build){
  if (build) build();          // игра на экране сразу — ждать нечего
  fit();
  const mine = token;
  (async () => {
    // реплика Искорки — только в первом раунде и не при перезапуске ленты
    if (round === 0 && !s._again){
      await ru(s.ru);
      if (mine !== token) return;
      await wait(AUDIO[s.ru] ? 250 : readPause(s.text));
    } else {
      await wait(300);
    }
    if (mine !== token) return;
    await queue(taskSteps(s));
    if (mine !== token) return;
    if (s._quiz) await s._quiz();
  })();
}
function replay(){
  const s = screen();
  if (s._run){ s._run(); return; }
  queue([() => ru(s.ru)].concat(taskSteps(s)));
}

/* Ряду карточек нужен его размер в пикселях: от него считается сторона
   квадрата. Зацикливания нет — высота задана флексом с basis 0. */
function fit(){
  content.querySelectorAll(".cards").forEach(el => {
    const r = el.getBoundingClientRect();
    el.style.setProperty("--bw", r.width + "px");
    el.style.setProperty("--bh", r.height + "px");
  });
}
window.addEventListener("resize", () => { fit(); setTimeout(fit, 120); });

const RENDER = {};

function picArea(keys, cls){
  const area = document.createElement("div");
  area.className = "picarea" + (cls ? " " + cls : "");
  keys.forEach(k => { const im = document.createElement("img"); im.src = k; area.appendChild(im); });
  return area;
}
function cardsRow(keys, onPick){
  const row = document.createElement("div");
  row.className = "picarea cards";
  row.style.setProperty("--n", keys.length);
  keys.forEach(k => {
    const c = document.createElement("button");
    c.className = "card";
    c.dataset.key = k.t ? k.t.join("_") : "";
    c.innerHTML = '<img src="' + k.src + '" alt="">';
    c.onclick = () => onPick(c, k);
    row.appendChild(c);
  });
  return row;
}
function sayButton(label, onClick){
  const below = document.createElement("div");
  below.className = "below";
  const b = document.createElement("button");
  b.className = "btn big";
  b.textContent = label;
  b.onclick = onClick;
  below.appendChild(b);
  content.appendChild(below);
  return b;
}
async function wrong(el){
  el.classList.add("wrong"); blip("SFX-NO");
  setTimeout(() => el.classList.remove("wrong"), 500);
  await retry();
}
/* Знак «получилось». Раньше правильный ответ отмечался только звуком, и
   между раундами одной игры ребёнок не понимал, засчитали ему или нет. */
const CHEER = ["\u2705", "\u2b50", "\ud83d\udc4d", "\ud83c\udf89", "\ud83c\udf1f"];
function cheer(){
  const box = document.createElement("div");
  box.className = "cheer";
  box.innerHTML = "<span>" + choice(CHEER) + "</span>";
  lessonEl.appendChild(box);
  setTimeout(() => box.remove(), 950);
}
function drawRounds(){
  const bar = lessonEl.querySelector(".roundbar");
  const s = screen();
  const n = s && s.rounds && s.rounds.length > 1 ? s.rounds.length
          : (s && s.steps && s.steps.length > 1 ? s.steps.length : 0);
  bar.innerHTML = "";
  for (let i = 0; i < n; i++){
    const d = document.createElement("i");
    if (i < round) d.className = "on";
    bar.appendChild(d);
  }
}
/* Знак держится 700 мс, и следующий раунд приходит через них независимо
   от длины похвалы. Раньше раунд ждал, пока она договорит: с записью это
   1–2.6 с, и переход стал рваным. Теперь похвала договаривает поверх
   нового раунда, а его английское слово ждёт её конца (praiseEnd). */
async function cheerStep(){
  cheer();
  praise();
  await wait(700);
}
async function rightStep(next){
  blip("SFX-OK");
  await cheerStep();
  next();
}
function nextRound(s){
  round++;
  if (round >= s.rounds.length){ round = 0; next(); } else { render(); }
}

/* ───────── сюжет и награда ───────── */
function showNextLater(ms){
  const mine = token;
  setTimeout(() => { if (mine === token) btnNext.hidden = false; }, ms);
}
/* Говорит реплику и открывает «Дальше». Пока записи нет, ждём на глаз —
   взрослому надо успеть прочесть текст. Когда запись есть, ждать по таймеру
   нельзя: реплика длится восемь секунд, а кнопка открывалась через две, и
   ребёнок пролистывал Искорку на полуслове. */
function sayThenNext(s, ms){
  btnNext.parentNode.classList.add("waits");
  if (!AUDIO[s.ru]){ showNextLater(ms); ru(s.ru); return; }
  const mine = token;
  ru(s.ru).then(() => { if (mine === token) showNextLater(300); });
}
/* Стайка светлячков в пещере: куда садится (в % области) и откуда летит
   (сдвиг в % от своего размера) — все прилетают слева сверху, со стороны
   Мии, но с разных точек. */
const SWARM = [[40, 40, -900, -500], [52, 33, -1100, -700], [62, 44, -1300, -400],
               [46, 56, -800, -300], [58, 60, -1000, -200]];
RENDER.story = function(s){
  /* pics — когда реплика про две вещи сразу: «следы ведут к пещере, а вход
     завален камнем». Отдельным экраном это было бы лишней дорожкой. */
  if (s.pics) content.appendChild(picArea(s.pics.map(k => IMG[k]), "duo"));
  else if (!s.solo && s.dark){
    /* «Как темно… Сейчас позову своих светлячков. Светлячки, летите сюда!»:
       картинка начинается тёмной, на зов Мия поднимает палочку, слетается
       стайка, и становится светло. «Ещё раз» повторяет всё сначала. */
    const area = picArea([IMG[s.pic]], "dark");
    area.firstChild.classList.add("scene");
    const flies = SWARM.map(([x, y, sx, sy], i) => {
      const fly = document.createElement("img");
      fly.className = "fly"; fly.src = IMG.firefly; fly.alt = "";
      fly.style.setProperty("--sx", sx + "%"); fly.style.setProperty("--sy", sy + "%");
      fly.style.setProperty("--d", (5.0 + i * 0.3).toFixed(1) + "s");
      area.appendChild(fly);
      return fly;
    });
    content.appendChild(area);
    /* Места считаются от самой картинки, а не от области: на узком экране
       пещера занимает только середину высокой области, и в процентах от неё
       светлячки садились над пещерой и мимо яйца. */
    const place = () => {
      const img = area.firstChild, A = area.getBoundingClientRect();
      const ar = (img.naturalWidth || 1) / (img.naturalHeight || 1);
      const w = Math.min(A.width, A.height * ar), h = w / ar;
      const ox = (A.width - w) / 2, oy = (A.height - h) / 2, fw = w * 0.07;
      flies.forEach((fly, i) => {
        const [x, y] = SWARM[i];
        fly.style.width = fw + "px";
        fly.style.left = (ox + x / 100 * w - fw / 2) + "px";
        fly.style.top = (oy + y / 100 * h - fw / 2) + "px";
      });
    };
    area.firstChild.decode().then(place, place);
    addEventListener("resize", place);
    s._run = () => {
      place();
      const mine = token;
      guideImg.src = IMG.guide;
      area.classList.remove("go"); void area.offsetWidth; area.classList.add("go");
      setTimeout(() => { if (mine === token) guideImg.src = IMG.guide_wow; }, 4800);
      sayThenNext(s, 8000);
    };
    return;                    // звук и свет запустит render() через s._run
  }
  else if (!s.solo) content.appendChild(picArea([IMG[s.pic]]));
  sayThenNext(s, 2000);
};
RENDER.token = function(s){
  if (s.kind === "friends"){
    content.appendChild(picArea(FRIENDS.slice(0, s.n).map(k => IMG[k]), "items"));
  } else {
    const view = document.createElement("div");
    view.className = "mapview";
    view.style.backgroundImage = "url(" + IMG.map_bg + ")";
    /* Остров, к которому строим, тусклый, пока дорожка не готова;
       дальние — тем более. Прежние дорожки лежат целиком. */
    const built = s.n >= LESSONS[L].tokens;
    LESSONS.forEach((les, i) => {
      const im = document.createElement("img");
      im.src = IMG[les.island];
      im.style.left = ISLAND_POS[i][0] + "%"; im.style.top = ISLAND_POS[i][1] + "%";
      if (i > L + (built ? 1 : 0)) im.classList.add("dim");
      if (built && i === L + 1) im.classList.add("wake");
      view.appendChild(im);
    });
    for (let j = 0; j < L; j++) addDots(view, j, LESSONS[j].tokens, false);
    addDots(view, L, s.n, true);
    content.appendChild(view);
  }
  sayThenNext(s, 2200);
};

/* ───────── чего не стало ───────── */
RENDER.gone = function(s){
  afterIntro(s, () => {
    const r = s.rounds[round];
    const top = document.createElement("div");
    top.className = "picarea items shelfrow";
    const slots = r.things.map(t => {
      const im = document.createElement("img");
      im.src = pic(t);
      top.appendChild(im);
      return im;
    });
    content.appendChild(top);

    const row = cardsRow(shuffle(r.things.slice()).map(t => ({src: pic(t), t})),
      async (c, k) => {
        if (k.t !== r.things[r.missing]){ await wrong(c); return; }
        c.classList.add("right");
        slots[r.missing].classList.remove("hidden");
        slots[r.missing].classList.add("back");
        await en(r.voice);
        await rightStep(() => nextRound(s));
      });
    row.classList.add("locked");
    content.appendChild(row);

    /* Сначала облачко наплывает на все вещи, потом уходит — и одной нет.
       Карточки до этого не нажимаются: иначе ребёнок тыкает вслепую. */
    s._quiz = async () => {
      const mine = token;
      const cloud = document.createElement("img");
      cloud.className = "veil";
      cloud.src = IMG.cloudlet;
      // облачко садится на ту вещь, которая пропадёт
      const sl = slots[r.missing], tr = top.getBoundingClientRect(), rr = sl.getBoundingClientRect();
      cloud.style.left = (rr.left - tr.left + rr.width / 2) + "px";
      cloud.style.height = (rr.height * 1.15) + "px";
      top.appendChild(cloud);
      await wait(900);
      if (mine !== token) return;
      slots[r.missing].classList.add("hidden");
      await wait(700);
      if (mine !== token) return;
      cloud.classList.add("away");
      await wait(500);
      if (mine !== token) return;
      cloud.remove();
      row.classList.remove("locked");
    };
  });
};

/* ───────── чемодан, магазин, стирка ───────── */
/* Летит именно картинка: у карточки вокруг неё есть поля, и полёт,
   посчитанный по кнопке, стартовал мимо предмета. Прятать можно и саму
   картинку (корзины), и карточку целиком (чемодан). */
function flyTo(card, target){
  const src = card.tagName === "IMG" ? card : card.querySelector("img");
  const a = src.getBoundingClientRect(), b = target.getBoundingClientRect();
  const im = src.cloneNode();
  im.className = "flyer";
  im.style.left = a.left + "px"; im.style.top = a.top + "px";
  im.style.width = a.width + "px"; im.style.height = a.height + "px";
  document.body.appendChild(im);
  card.classList.add("gone");
  requestAnimationFrame(() => {
    im.style.left = (b.left + b.width * 0.3) + "px";
    im.style.top = (b.top + b.height * 0.3) + "px";
    im.style.width = (b.width * 0.4) + "px";
    im.style.height = (b.height * 0.4) + "px";
    im.style.opacity = "0.15";
  });
  setTimeout(() => im.remove(), 650);
}

/* ───────── поймай вещь ───────── */
/* Лента трогается, когда цвет уже назван, а не сразу. С записью реплика
   идёт четыре с половиной секунды, слово — ещё секунду, и вещи успевали
   проехать полпути, пока ребёнок узнавал, что ловить. Уехала вещь за
   край — раунд начинается заново, но уже без реплики: раньше Искорка
   повторяла «Предметы поехали!» каждые одиннадцать секунд. */
RENDER.catch = function(s){
  afterIntro(s, () => {
    const r = s.rounds[round];
    /* Вещи едут одним поездом с промежутками: раньше каждая стартовала
       отдельно через 0.9 с и они наезжали друг на друга — не нажать. */
    const belt = document.createElement("div");
    belt.className = "belt";
    const train = document.createElement("div");
    train.className = "train";
    belt.appendChild(train);
    const opts = shuffle([r.target].concat(r.others));
    opts.forEach(t => {
      const c = document.createElement("button");
      c.className = "cell";
      c.dataset.key = t.join("_");
      c.innerHTML = '<img src="' + pic(t) + '" alt="">';
      c.onclick = async () => {
        if (t !== r.target){ await wrong(c); return; }
        train.style.transform = getComputedStyle(train).transform;
        train.style.transition = "none";
        c.classList.add("gone");
        await rightStep(() => nextRound(s));
      };
      train.appendChild(c);
    });
    content.appendChild(belt);
    const size = () => {
      const b = belt.getBoundingClientRect();
      const side = Math.min(b.height * .5, b.width * .3);
      train.style.setProperty("--side", side + "px");
      return b.width;
    };
    size();
    s._quiz = async () => {
      const W = size();
      const dist = W + train.offsetWidth + 20;
      const ms = dist / (W * .14) * 1000;   // скорость как раньше: 14% ширины в секунду
      train.style.transition = "transform " + ms + "ms linear";
      void train.offsetWidth;
      train.style.transform = "translate(" + (-dist) + "px,-50%)";
      // вещь может уехать за край — тогда пускаем раунд заново
      const mine = token;
      setTimeout(() => {
        if (mine !== token) return;
        s._again = true; render();
      }, ms + 400);
    };
  });
  s._again = false;
};

/* ───────── рука с пальцами: знакомство и три дрилла ───────── */
function handBox(words, picKey){
  const rowEl = document.createElement("div");
  rowEl.className = "handrow";
  const box = document.createElement("div");
  box.className = "handbox";
  const hand = document.createElement("img");
  hand.className = "hand";
  hand.src = IMG["hand" + Math.min(Math.max(words, 1), 5)];
  const arrow = document.createElement("div");
  arrow.className = "arrow";
  box.appendChild(hand); box.appendChild(arrow);
  rowEl.appendChild(box);
  if (picKey){
    const th = document.createElement("img");
    th.className = "thing"; th.src = IMG[picKey];
    rowEl.appendChild(th);
  }
  content.appendChild(rowEl);
  return {box, arrow, thing: rowEl.querySelector(".thing")};
}
function moveArrow(arrow, count, i){
  const tips = TIPS[Math.min(Math.max(count, 1), 5)];
  const t = tips[Math.min(i, tips.length - 1)];
  arrow.classList.add("on");
  /* Кончики — в долях самой картинки, а не рамки: на телефоне рамка выше
     нарисованной руки (object-fit: contain), и стрелка висела над ладошкой. */
  const img = arrow.parentNode.querySelector("img.hand");
  const bw = img.clientWidth, bh = img.clientHeight;
  const k = Math.min(bw / (img.naturalWidth || bw), bh / (img.naturalHeight || bh));
  const dw = (img.naturalWidth || bw) * k, dh = (img.naturalHeight || bh) * k;
  arrow.style.left = (img.offsetLeft + (bw - dw) / 2 + t[0] * dw) + "px";
  arrow.style.top = (img.offsetTop + (bh - dh) / 2 + t[1] * dh) + "px";
}

/* Раунд, где ребёнок говорит фразу сам: рука стоит молча и показывает,
   сколько в ней слов, стрелка никуда не идёт — она бы сбивала. Правильная
   фраза звучит только по кнопке «проверить себя». */
function fingersSolo(s){
  const r = s.rounds[round];
  const n = r.words.length;
  const ui = handBox(n, r.pic);
  ui.arrow.remove();

  const below = document.createElement("div");
  below.className = "below";
  const text = document.createElement("div");
  text.className = "wordline";
  text.textContent = r.combo[1];
  below.appendChild(text);
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.textContent = "Теперь скажи всё предложение целиком";
  turn.hidden = true;
  below.appendChild(turn);
  const check = document.createElement("button");
  check.className = "btn big";
  check.textContent = "🔊 Проверить себя";
  check.hidden = true;
  check.onclick = async () => {
    check.disabled = true;
    stopSound();
    text.textContent = r.line[1];
    await en(r.line);
    await cheerStep();
    nextRound(s);
  };
  below.appendChild(check);
  content.appendChild(below);

  s._run = async () => {
    const mine = token;
    turn.hidden = true; check.hidden = true; check.disabled = false;
    text.textContent = r.combo[1];
    await ru(s.ru);
    if (mine !== token) return;
    await wait(AUDIO[s.ru] ? 250 : readPause(s.text));
    if (mine !== token) return;
    await en(r.combo);
    if (mine !== token) return;
    await wait(300);
    if (mine !== token) return;
    turn.hidden = false;
    check.hidden = false;
  };
}

RENDER.fingers = function(s){
  const isSwap = s.mode === "swap";
  if (isSwap && round > 0){ fingersSolo(s); return; }
  const isEcho = !isSwap && !!(s.echo && s.echo[round]);
  const step = isSwap ? null : s.steps[round];
  const words = isSwap ? s.rounds[round].words : s.words;
  const from = isSwap ? 0 : step[0];
  const to = isSwap ? words.length - 1 : step[1];
  const count = to - from + 1;
  const picKey = isSwap ? s.rounds[round].pic : s.pic;
  const line = isSwap ? s.rounds[round].line : s.line;
  const ui = handBox(count, picKey);

  const below = document.createElement("div");
  below.className = "below";
  const text = document.createElement("div");
  text.className = "wordline";
  text.textContent = words.slice(from, to + 1).map(w => w[1]).join(" ");
  below.appendChild(text);
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.textContent = "Теперь ты! Покажи ладошку, говори и следи за пальчиками";
  turn.hidden = true;
  below.appendChild(turn);
  /* Стрелка на очереди ребёнка трогается не сама, а по кнопке: иначе она
     уезжала, пока он ещё разворачивал ладошку. */
  const ready = document.createElement("button");
  ready.className = "btn big";
  ready.textContent = "✋ Я готов";
  ready.hidden = true;
  below.appendChild(ready);
  const said = document.createElement("button");
  said.className = "btn big";
  said.textContent = "🗣 Я сказал!";
  said.hidden = true;
  said.onclick = async () => {
    stopSound();
    if (isSwap){ blip("SFX-OK"); await en(line); }
    await cheerStep();
    round++;
    const total = isSwap ? s.rounds.length : s.steps.length;
    if (round >= total){ round = 0; next(); } else { render(); }
  };
  below.appendChild(said);
  content.appendChild(below);

  /* Сначала слово за словом — палец в палец. Раньше звучала вся фраза
     сразу, и к третьему пальцу говорить было уже нечего. */
  s._run = async () => {
    const mine = token;
    turn.hidden = true; said.hidden = true; ready.hidden = true;
    bubble.textContent = isEcho ? ECHO.text : (s.text || "");
    await ru(isEcho ? ECHO.ru : s.ru);
    if (mine !== token) return;
    await wait(AUDIO[s.ru] ? 250 : readPause(s.text));
    if (mine !== token) return;
    if (isSwap){
      await en(s.rounds[round].combo);
      if (mine !== token) return;
      await wait(400);
    }
    /* Эхо: слово — пауза, ребёнок повторяет — следующий палец. */
    if (isEcho) turn.textContent = "Повтори!";
    for (let i = 0; i < count; i++){
      if (mine !== token) return;
      moveArrow(ui.arrow, count, i);
      await en(words[from + i]);
      if (!isEcho){ await wait(HOP); continue; }
      if (mine !== token) return;
      turn.hidden = false;
      await wait(ECHO_PAUSE);
      turn.hidden = true;
    }
    ui.arrow.classList.remove("on");
    if (mine !== token) return;
    if (isEcho){ said.hidden = false; return; }
    turn.textContent = "Теперь ты! Покажи ладошку, говори и следи за пальчиками";
    turn.hidden = false;
    ready.hidden = false;
    await ru(ASK);
    ready.onclick = async () => {
      ready.hidden = true;
      const mine2 = token;
      for (let i = 0; i < count; i++){
        if (mine2 !== token) return;
        moveArrow(ui.arrow, count, i);
        await wait(HOP + 350);
      }
      ui.arrow.classList.remove("on");
      said.hidden = false;
    };
  };
};

function next(){
  stopSound(); round = 0;
  if (S >= lesson().screens.length - 1){ finish(); return; }
  S++; render();
}
function prev(){
  stopSound(); round = 0;
  if (S > 0){ S--; render(); }
}

function finish(){
  const p = progress();
  if (p.done.indexOf(lesson().id) < 0) p.done.push(lesson().id);
  saveProgress(p);
  const last = L === LESSONS.length - 1;
  const panel = overlay.querySelector(".panel");
  if (last){
    // Дорога пройдена — возвращать на карту некуда, зовём на урок.
    /* Вместо «Пройти ещё раз» — «Получить подарок» (Анна). Ссылки пока
       нет: GIFT_URL в начале файла; пустая — кнопка стоит, но никуда не
       ведёт, чтобы было видно, где она будет. */
    panel.innerHTML = "<h2>🎉 Ты дошёл до праздника!</h2>" +
      "<p>Ты выучил три цвета, три вещи и умеешь рассказывать о себе " +
      "по-английски. А кто вылупится из яйца — узнаем в следующем приключении. " +
      "Приходи, я буду ждать!</p>" +
      '<div class="row"><button class="btn" data-act="gift">Получить подарок 🎁</button></div>';
    panel.querySelector('[data-act="gift"]').onclick =
      () => { if (GIFT_URL) location.href = GIFT_URL; };
  } else {
    panel.innerHTML = "<h2>Урок пройден!</h2><p>Дорожка на следующий остров готова.</p>" +
      '<div class="row"><button class="btn ghost" data-act="again">Пройти ещё раз</button>' +
      '<button class="btn" data-act="map">Вернуться на карту 🗺️</button></div>';
    panel.querySelector('[data-act="map"]').onclick = showMap;
  }
  const again = panel.querySelector('[data-act="again"]');
  if (again) again.onclick = () => {
    overlay.classList.remove("on"); startLesson(L);
  };
  overlay.classList.add("on");
  ru(last ? FINALE : null);
}

btnNext.onclick = next;
btnListen.onclick = replay;
lessonEl.querySelector(".home").onclick = showMap;

if (DEV_PANEL && !/[?&]dev=0/.test(location.search)){
  const dev = document.getElementById("wsdev");
  dev.classList.add("on");
  dev.onclick = e => {
    const act = e.target.dataset.act;
    if (act === "next") next();
    if (act === "prev") prev();
    if (act === "reset"){ try{ localStorage.removeItem(STORE); }catch(e){} boot(); }
  };
}

boot();
</script>
