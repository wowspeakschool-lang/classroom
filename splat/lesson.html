<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Пингвинёнок идёт домой — Splat Kids × WowSpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Урок «Пингвинёнок идёт домой». Сцена 16:9 вписывается в окно; координаты спрайтов — в % сцены,
   размеры шрифтов — от ширины сцены (--u = 1% ширины), чтобы при демонстрации экрана в Zoom всё масштабировалось. */
:root{--pink:#ff7eb6;--pink-d:#e2559a;--sky:#5bb8ff;--sky-d:#2f8ee0;--mint:#33c7b0;--mint-d:#1f9e8b;--sun:#ffd23f;--red:#e3262f;
  --ink:#3b2d5c;--paper:#fffdf8;--disp:'Fredoka','Nunito',sans-serif;--text:'Nunito','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1d2a4a;overflow:hidden}
body{font-family:var(--text);color:var(--ink);user-select:none;-webkit-tap-highlight-color:transparent;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);overflow:hidden;background:#cfe8f7;--u:calc(min(100vw,177.78vh)/100)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
.sp{position:absolute;transform:translate(-50%,-50%);height:auto;pointer-events:none}
.sp.click{pointer-events:auto;cursor:pointer}
.layer{position:absolute;inset:0}

/* верхняя панель */
#top{position:absolute;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:calc(var(--u)*1) calc(var(--u)*1.4);pointer-events:none}
#top>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:calc(var(--u)*.6);font-family:var(--disp);font-weight:700}
.logo .sk{background:var(--red);color:#fff;border-radius:calc(var(--u)*.5);padding:calc(var(--u)*.35) calc(var(--u)*.7);line-height:.9;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.logo .sk b{display:block;font-size:calc(var(--u)*1.6);letter-spacing:.04em}
.logo .sk i{display:block;font-style:normal;font-size:calc(var(--u)*.75);letter-spacing:.3em}
.logo .x{color:#fff;font-size:calc(var(--u)*1.3);text-shadow:0 1px 3px rgba(0,0,0,.3)}
.logo .ws{background:#fff;border-radius:calc(var(--u)*.6);padding:calc(var(--u)*.4) calc(var(--u)*.8);font-size:calc(var(--u)*1.1)}
#germbar{display:flex;gap:calc(var(--u)*.4);background:rgba(255,255,255,.75);border-radius:999px;padding:calc(var(--u)*.3) calc(var(--u)*1)}
#germbar img{width:calc(var(--u)*3);transition:.5s}
#germbar img.off{filter:grayscale(1);opacity:.25;transform:scale(.7)}
.tb{border:none;background:#fff;border-radius:999px;font-family:var(--disp);font-weight:600;font-size:calc(var(--u)*1.1);padding:calc(var(--u)*.5) calc(var(--u)*1);cursor:pointer;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.12)}

/* низ: навигация и номер слайда */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;align-items:center;gap:calc(var(--u)*1);padding:calc(var(--u)*.8)}
.arrow{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);border-radius:50%;border:none;background:rgba(255,255,255,.85);font-size:calc(var(--u)*1.5);cursor:pointer;color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.12)}
#pageno{position:absolute;right:calc(var(--u)*1.4);bottom:calc(var(--u)*1.2);z-index:30;background:rgba(255,255,255,.85);border-radius:999px;padding:calc(var(--u)*.3) calc(var(--u)*.9);font-family:var(--disp);font-weight:600;font-size:calc(var(--u)*1.1)}

/* общие элементы */
.title{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:5;font-family:var(--disp);font-weight:700;font-size:calc(var(--u)*3);color:var(--ink);background:rgba(255,255,255,.85);padding:calc(var(--u)*.5) calc(var(--u)*2);border-radius:999px;white-space:nowrap;box-shadow:0 4px 0 rgba(59,45,92,.08)}
.wordcard{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);z-index:6;background:#fff;border-radius:calc(var(--u)*2.4);padding:calc(var(--u)*1.4);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*.6);box-shadow:0 calc(var(--u)*1) calc(var(--u)*3) rgba(59,45,92,.25)}
.wordcard img{height:calc(var(--u)*22);width:auto;max-width:calc(var(--u)*30);object-fit:contain}
.wordcard .w{font-family:var(--disp);font-weight:700;font-size:calc(var(--u)*3.6)}
.say{border:none;background:var(--pink);color:#fff;border-radius:50%;width:calc(var(--u)*4.4);height:calc(var(--u)*4.4);font-size:calc(var(--u)*2);cursor:pointer;box-shadow:0 calc(var(--u)*.3) 0 var(--pink-d)}
.say:active{transform:translateY(2px);box-shadow:none}
.card{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:calc(var(--u)*1.8);padding:calc(var(--u)*1);cursor:pointer;box-shadow:0 calc(var(--u)*.6) calc(var(--u)*1.6) rgba(59,45,92,.2);display:flex;flex-direction:column;align-items:center;transition:transform .2s}
.card img{height:calc(var(--u)*14);width:calc(var(--u)*14);object-fit:contain}
.card.good{outline:calc(var(--u)*.5) solid var(--mint)}
.card.bad{outline:calc(var(--u)*.5) solid var(--pink)}
.btn{position:absolute;transform:translate(-50%,-50%);border:none;border-radius:999px;font-family:var(--disp);font-weight:700;font-size:calc(var(--u)*2);padding:calc(var(--u)*.8) calc(var(--u)*2.2);cursor:pointer;color:#fff;background:linear-gradient(180deg,#5fe0cb,var(--mint-d));box-shadow:0 calc(var(--u)*.4) 0 #167a6b;z-index:8}
.btn.pink{background:linear-gradient(180deg,#ff9fca,var(--pink-d));box-shadow:0 calc(var(--u)*.4) 0 #b83c79}
.btn.sun{background:linear-gradient(180deg,#ffe27a,#f2a81d);color:var(--ink);box-shadow:0 calc(var(--u)*.4) 0 #c98410}
.btn:active{transform:translate(-50%,calc(-50% + 3px));box-shadow:none}
.num{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-weight:700;font-size:calc(var(--u)*3.2);color:#fff;background:var(--sky-d);width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);border-radius:50%;display:flex;align-items:center;justify-content:center;border:calc(var(--u)*.35) solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.2);pointer-events:none}
.mark{position:absolute;transform:translate(-50%,-50%);font-size:calc(var(--u)*5);pointer-events:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.glint{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6c0 25%,rgba(255,230,120,0) 70%);animation:twinkle 1.2s ease-in-out infinite;pointer-events:none}

/* анимации */
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 calc(var(--u)*-1.2)}}
@keyframes shake{0%,100%{rotate:0deg}25%{rotate:-8deg}75%{rotate:8deg}}
@keyframes pop{0%{scale:.2;opacity:0}70%{scale:1.12}100%{scale:1;opacity:1}}
@keyframes poof{0%{scale:1;opacity:1}40%{scale:1.3;opacity:1;filter:brightness(1.6)}100%{scale:0;opacity:0;rotate:200deg}}
@keyframes twinkle{0%,100%{opacity:.4;scale:.8}50%{opacity:1;scale:1.15}}
@keyframes rays{from{rotate:0deg}to{rotate:360deg}}
@keyframes wiggle{0%,100%{rotate:-4deg}50%{rotate:4deg}}
@keyframes swim{0%{left:30%}50%{left:70%}100%{left:30%}}
.bob{animation:bob 2.4s ease-in-out infinite}
.shake{animation:shake .4s}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.poof{animation:poof .7s ease-in forwards}
.wiggle{animation:wiggle .35s ease-in-out infinite}
.rays{position:absolute;transform:translate(-50%,-50%);width:calc(var(--u)*40);height:calc(var(--u)*40);border-radius:50%;
  background:repeating-conic-gradient(rgba(255,240,170,.85) 0 8deg,rgba(255,255,255,0) 8deg 22deg);animation:rays 6s linear infinite;
  mask:radial-gradient(circle,#000 20%,transparent 70%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 70%);pointer-events:none}

/* лента */
.belt{position:absolute;left:0;right:0;top:56%;height:26%;background:linear-gradient(180deg,#e9f4ff,#cfe3f7);border-top:calc(var(--u)*.5) solid #fff;border-bottom:calc(var(--u)*.8) solid #9fc3e6;box-shadow:inset 0 0 calc(var(--u)*2) rgba(47,142,224,.25);overflow:hidden}
.belt .frame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;height:118%;border:calc(var(--u)*.6) dashed var(--pink);border-radius:calc(var(--u)*1.6);z-index:2}
.belt .item{position:absolute;top:50%;height:80%;width:auto;transform:translate(-50%,-50%);cursor:pointer}
/* плитки */
.tiles{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:calc(var(--u)*30);height:calc(var(--u)*30);background:#fff;border-radius:calc(var(--u)*2);overflow:hidden;box-shadow:0 calc(var(--u)*.8) calc(var(--u)*2) rgba(59,45,92,.2)}
.tiles img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain}
.tiles .grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr)}
.tiles .grid i{background:linear-gradient(135deg,#ffb3d2,#9fd3ff);border:2px solid #fff;transition:opacity .35s, transform .35s}
.tiles .grid i.gone{opacity:0;transform:scale(.4)}
/* сертификат */
.cert{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:70%;height:74%;background:var(--paper);border-radius:calc(var(--u)*2.4);border:calc(var(--u)*.7) solid var(--pink);box-shadow:0 0 0 calc(var(--u)*.6) #fff,0 calc(var(--u)*1) calc(var(--u)*3) rgba(59,45,92,.3);text-align:center;padding:calc(var(--u)*2.4) calc(var(--u)*3)}
.cert h2{font-family:var(--disp);font-size:calc(var(--u)*3.6);color:var(--pink-d);line-height:1.05}
.cert h3{font-family:var(--disp);font-size:calc(var(--u)*2.2);color:var(--sky-d);margin-top:calc(var(--u)*.4)}
.cert input{font-family:var(--disp);font-size:calc(var(--u)*3.2);text-align:center;border:none;border-bottom:calc(var(--u)*.3) solid var(--mint);background:transparent;outline:none;width:60%;margin-top:calc(var(--u)*2.2);color:var(--ink)}
.cert p{font-weight:800;font-size:calc(var(--u)*1.5);margin-top:calc(var(--u)*1.4)}
/* план учителя */
#plan{position:absolute;right:calc(var(--u)*1.4);top:calc(var(--u)*5.5);z-index:40;width:44%;max-height:80%;overflow:auto;background:var(--paper);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*1.4) calc(var(--u)*1.8);box-shadow:0 calc(var(--u)*1) calc(var(--u)*4) rgba(0,0,0,.35);font-size:calc(var(--u)*1.15);line-height:1.45;display:none}
#plan.on{display:block}
#plan h4{font-family:var(--disp);font-size:calc(var(--u)*1.6);color:var(--mint-d)}
#plan .sec{font-weight:900;font-size:calc(var(--u)*.9);color:var(--pink-d);text-transform:uppercase;letter-spacing:.06em}
#plan dt{font-weight:900;margin-top:calc(var(--u)*.8);font-size:calc(var(--u)*.95);color:var(--sky-d)}
#plan dd{margin:calc(var(--u)*.2) 0 0}
#plan .all{margin-top:calc(var(--u)*1)}
#plan table{border-collapse:collapse;width:100%;font-size:calc(var(--u)*.95)}
#plan td,#plan th{border:1px solid #e5dfe9;padding:calc(var(--u)*.4);vertical-align:top;text-align:left}
#plan tr.cur{background:#fff3c4}
</style>
</head>
<body>
<div id="stage">
  <img class="bg" id="bg" alt="">
  <div class="layer" id="slide"></div>
  <div id="top">
    <div class="logo"><span class="sk"><b>SPLAT</b><i>KIDS</i></span><span class="x">×</span><span class="ws">WowSpeak</span></div>
    <div id="germbar"></div>
    <div><button class="tb" id="bPlan">📋 План</button> <button class="tb" id="bFull">⛶</button></div>
  </div>
  <div id="plan"></div>
  <div id="nav"><button class="arrow" id="prev">◀</button><button class="arrow" id="next">▶</button></div>
  <div id="pageno"></div>
</div>

<script>
/* План урока — из docs/plan_uroka.md, вставляется скриптом tools/build_lesson.py (не править руками). */
const PLAN = /*PLAN_START*/[{"n": 1, "sec": "Приветствие — 1 мин", "todo": "—", "say": "Hello! I'm (имя). What's your name? <i>(если ученик не понимает: «Как тебя зовут?»)</i>", "ans": "I'm Masha. / Masha."}, {"n": 2, "sec": "Приветствие — 1 мин", "todo": "—", "say": "Look! (TPR: пальчик к глазу) Who is it? Кто это? Это пингвинёнок. Penguin. Say: penguin! (TPR: рука к уху) Давай с ним поздороваемся. Say: Hello, Penguin! (TPR: машем рукой)", "ans": "Penguin! Hello, Penguin!"}, {"n": 3, "sec": "Завязка — 1,5 мин", "todo": "—", "say": "Look! (TPR: пальчик к глазу) What is it? Что это? Да, замок! Посмотри, какой он. Это обычный замок или зубной? Здесь живёт пингвинёнок.", "ans": "Замок! Зубной!"}, {"n": 4, "sec": "Завязка — 1,5 мин", "todo": "—", "say": "А кто это у ворот? Это микробы. Как думаешь, они пустят пингвинёнка домой? Нет, не пускают. Поможем прогнать микробов?", "ans": "Микробы! Нет. Да!"}, {"n": 5, "sec": "Шаг 1 — tooth — 3 мин", "todo": "На каждый счёт нажать на следующую льдинку — пингвинёнок прыгает", "say": "Ой, что-то блестит! Давай допрыгаем! Say: one, two, three, four! (TPR: показываем пальцы)", "ans": "One, two, three, four!"}, {"n": 6, "sec": "Шаг 1 — tooth — 3 мин", "todo": "Нажать на зубик — он увеличивается и сияет", "say": "What is it? Что это? Look! (TPR: пальчик к глазу) Это волшебный зубик. Say: tooth! (TPR: рука к уху) Как мы покажем зубик? (TPR: пальчик на свои зубки) Say: tooth! Whisper! Tooth. (TPR: палец к губам) Loud! Tooth! (TPR: ладони рупором)", "ans": "tooth (шёпотом, громко)"}, {"n": 7, "sec": "Шаг 1 — tooth — 3 мин", "todo": "На каждый счёт нажать на льдинку — прыгаем обратно", "say": "Прыгаем обратно к замку! One, two, three, four!", "ans": "One, two, three, four!"}, {"n": 8, "sec": "Шаг 1 — tooth — 3 мин", "todo": "Когда ребёнок скажет tooth — нажать на зубик: лучики, микроб исчезает", "say": "Этот зубик волшебный — микробы его испугались! Давай скажем громче, чтобы он засиял. Say: tooth!", "ans": "TOOTH!"}, {"n": 9, "sec": "Шаг const M = 'media/lesson/';
// В автономной версии (tools/bundle_lesson.py) картинки и звук вшиты сюда; в обычной — null, берём файлы рядом.
const IMG = /*IMG*/null/*IMG_END*/, AUD = /*AUD*/null/*AUD_END*/;
const U = n => IMG ? IMG[n] : M + n + '.webp';
const $ = (s, r = document) => r.querySelector(s);
const stage = $('#stage'), layer = $('#slide');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);

/* ---------- звук слов (Piper, голос как в курсах) ---------- */
const WORDS = { tooth: 'magic_tooth', toothbrush: 'brush', toothpaste: 'tube', cup: 'cup' };
const audio = {};
function say(w) { const a = audio[w] || (audio[w] = new Audio(AUD ? AUD[w] : `audio/${w}.mp3`)); a.currentTime = 0; a.play().catch(() => {}); }

/* ---------- конструкторы ---------- */
function el(tag, cls, html, parent = layer) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent.appendChild(e); return e; }
function sp(name, x, y, w, cls = '', parent = layer) {
  const i = el('img', 'sp ' + cls, null, parent); i.src = U(name); i.alt = '';
  i.style.left = x + '%'; i.style.top = y + '%'; i.style.width = w + '%'; return i;
}
function btn(text, x, y, cls, fn) { const b = el('button', 'btn ' + (cls || ''), text); b.style.left = x + '%'; b.style.top = y + '%'; b.onclick = fn; return b; }
function title(t) { return el('div', 'title', t); }
function wordcard(w) {
  const c = el('div', 'wordcard pop', `<img src="${U(WORDS[w])}" alt=""><div class="w">${w}</div><button class="say">🔊</button>`);
  c.querySelector('.say').onclick = e => { e.stopPropagation(); say(w); };
  return c;
}
function card(w, x, y, label = false) {
  const c = el('div', 'card pop', `<img src="${U(WORDS[w] || w)}" alt="">${label ? `<b style="font-family:var(--disp);font-size:calc(var(--u)*2)">${w}</b>` : ''}`);
  c.style.left = x + '%'; c.style.top = y + '%'; return c;
}
function wobble(e) { e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake'); }
function poof(e) { e.classList.remove('bob'); e.classList.add('poof'); }
const timers = [];
function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
function every(fn, ms) { timers.push(setInterval(fn, ms)); }

/* Прыжок спрайта по дуге к точке (x, y) в % сцены */
function jumpTo(s, x, y, ms = 520) {
  const x0 = parseFloat(s.style.left), y0 = parseFloat(s.style.top), t0 = performance.now();
  return new Promise(res => {
    (function f(t) {
      const k = Math.min(1, (t - t0) / ms);
      s.style.left = x0 + (x - x0) * k + '%';
      s.style.top = y0 + (y - y0) * k - Math.sin(Math.PI * k) * 14 + '%';
      if (k < 1) requestAnimationFrame(f); else res();
    })(t0);
  });
}

/* ---------- пингвинёнок: что у него в руках, зависит от слайда ---------- */
// до щётки (слайд 10) — пустые руки, после — со щёткой, после пасты (слайд 15) — со щёткой и пастой
function peng(pose, n) {
  const map = {
    p: { stand: 'p_wave', jump: 'p_jump', happy: 'p_happy', sad: 'p_sad', think: 'p_point', wow: 'p_surprised' },
    pb: { stand: 'pb_stand', jump: 'pb_jump', happy: 'pb_stand', sad: 'pb_stand', think: 'pb_stand', wow: 'pb_stand', fish: 'pb_fish' },
    ph: { stand: 'ph_stand', jump: 'ph_jump', happy: 'ph_jump', sad: 'ph_stand', think: 'ph_stand', wow: 'ph_stand', brush: 'ph_brush' },
  };
  const set = n < 10 ? 'p' : n < 15 ? 'pb' : 'ph';
  return map[set][pose] || map[set].stand;
}

/* ---------- микробы у ворот ---------- */
const GERMS = ['germ_green', 'germ_purple', 'germ_orange', 'germ_blue'];
const GATES = [8, 13, 18, 23];               // на этих слайдах прогоняем по одному микробу
let killed = 0;
function drawGermbar(bossOn = true) {
  $('#germbar').innerHTML = GERMS.map((g, i) => `<img src="${U(g)}" class="${i < killed ? 'off' : ''}">`).join('') +
    `<img src="${U('boss')}" class="${bossOn ? '' : 'off'}" style="width:calc(var(--u)*3.8)">`;
}
// микробы у ворот: четыре маленьких по бокам и главный в центре
const GPOS = [[30, 58], [70, 58], [22, 74], [78, 74]];
function gateGerms(n) {
  const out = [];
  GERMS.forEach((g, i) => { if (i >= killed) out.push(sp(g, GPOS[i][0], GPOS[i][1], 9, 'bob')); else out.push(null); });
  const boss = sp('boss', 50, 70, 15, 'bob');
  return { small: out, boss };
}

function listenGame(words, n) {
  const rounds = shuffle([...words, ...words, words[0]]).slice(0, 5);
  let r = 0;
  const b = btn('🔊', 50, 22, 'pink', () => say(rounds[r]));
  function round() {
    layer.querySelectorAll('.card').forEach(c => c.remove());
    const opts = shuffle(words);
    const x0 = 50 - (opts.length - 1) * 12;
    opts.forEach((w, i) => {
      const c = card(w, x0 + i * 24, 58);
      c.onclick = () => {
        if (w === rounds[r]) { c.classList.add('good'); r++; if (r < rounds.length) later(round, 900); else later(() => { layer.querySelectorAll('.card').forEach(x => x.remove()); b.remove(); sp(peng('happy', n), 50, 58, 22, 'pop'); }, 900); }
        else { c.classList.add('bad'); wobble(c); later(() => c.classList.remove('bad'), 600); }
      };
    });
  }
  round();
}

  function lay() {
    layer.querySelectorAll('.card,.sp.snowball,.btn').forEach(x => x.remove());
    cards = shuffle(words).map((w, i) => { const c = card(w, X[i], 60); c.dataset.w = w; return c; });
    btn('❄️ Прячем!', 50, 22, 'pink', hide);
  }
  async function hide() {
    layer.querySelector('.btn').remove();
    const g = sp('germ_purple', 50, 30, 9, 'pop');
    await sleep(700);
    balls = X.map(x => sp('snowball', x, 60, 15, 'click pop snowball'));
    await sleep(600); g.remove();
    const hit = Math.floor(Math.random() * 3);
    balls[hit].classList.add('wiggle');
    balls.forEach((b, i) => b.onclick = () => {
      if (i !== hit) return wobble(b);
      b.remove(); cards[i].classList.add('good'); say(cards[i].dataset.w);
      round++; later(round < 3 ? lay : () => { layer.querySelectorAll('.card,.sp.snowball').forEach(x => x.remove()); }, 1600);
    });
  }
  lay();
} };

S[17] = { bg: 'snow_meadow', go(n) {

    const tiles = shuffle([...t.querySelectorAll('i')]);

    btn('👀 Открыть всё', 80, 86, 'sun', () => { t.querySelectorAll('i').forEach(x => x.classList.add('gone')); say(ws[i]); i++; later(show, 1800); });

  show();
} };
S[18] = gateSlide(['tooth', 'toothbrush', 'toothpaste']);
// 19. Горка: ребёнок дует — снег слетает, под ним стаканчик
S[19] = { bg: 'ice_hill', go(n) {
  sp(peng('stand', n), 14, 64, 13);
  const cup = sp('cup', 52, 42, 10);
  const pile = sp('mound2', 52, 44, 22, 'click');

    for (let k = 0; k < 24; k++) {

      f.style.cssText = `position:absolute;left:${50 + Math.random() * 8}%;top:${40 + Math.random() * 8}%;width:${s}px;height:${s}px;border-radius:50%;background:#fff;transition:all 1.2s ease-out;opacity:1`;
      requestAnimationFrame(() => { f.style.left = 100 + Math.random() * 20 + '%'; f.style.top = 10 + Math.random() * 50 + '%'; f.style.opacity = 0; });
    }
    pile.style.transition = 'all 1s'; pile.style.left = '110%'; pile.style.opacity = 0;
    cup.classList.add('pop');
  };
} };
S[20] = { bg: 'ice_hill', go(n) { wordcard('cup'); say('cup'); sp(peng('stand', n), 14, 64, 13, 'pop'); } };
// 21. Лента «Стоп!»
function beltGame(items, onPick) {
  const belt = el('div', 'belt', '<div class="frame"></div>');
  let x = 0, running = true, last = performance.now();
  const els = items.map((w, i) => { const im = el('img', 'item', null, belt); im.src = U(WORDS[w] || w); im.dataset.w = w; return im; });
  const gap = 100 / Math.min(items.length, 4) + 6;
  (function f(t) {
    if (!belt.isConnected) return;
    const dt = t - last; last = t;
    if (running) x += dt * 0.006;           // медленно: ≈ 6 % ширины в секунду
    els.forEach((im, i) => { im.style.left = ((i * gap + x) % (els.length * gap)) - 10 + '%'; });
    requestAnimationFrame(f);
  })(last);
  return { belt, els, toggle(v) { running = v ?? !running; return running; }, inFrame() {
    return els.find(im => { const l = parseFloat(im.style.left); return l > 39 && l < 61; }); } };
}
S[21] = { bg: 'snow_meadow', go(n) {
  const b = beltGame(['tooth', 'toothbrush', 'toothpaste', 'cup', 'tooth', 'cup'], null);
  btn('✋ Stop!', 50, 30, 'pink', function () {
    const run = b.toggle();
    this.textContent = run ? '✋ Stop!' : '▶ Go!';
    b.els.forEach(im => im.style.filter = '');
    if (!run) { const it = b.inFrame(); if (it) { it.style.filter = 'drop-shadow(0 0 12px #ffd23f)'; say(it.dataset.w); } }
  });
} };
// 22. Show me — живая игра
S[22] = { bg: 'snow_meadow', go(n) {
  title('Show me!');

} };
S[23] = gateSlide(['tooth', 'toothbrush', 'toothpaste', 'cup']);
// 24. Главный микроб: по ленте едет полезное и вредное; нажимаем на полезное, когда ребёнок назвал
S[24] = { bg: 'castle_dark', go(n) {
  const boss = sp('boss', 50, 36, 18, 'bob');
  let scale = 1, got = 0;
  const useful = ['toothbrush', 'toothpaste', 'cup'];
  const b = beltGame(['cake', 'toothbrush', 'candy', 'toothpaste', 'soda', 'cup'], null);

      if (got === useful.length) later(() => { poof(boss); b.toggle(false); }, 600);
    } else { wobble(im); scale = Math.min(1.2, scale + .05); boss.style.width = 18 * scale + '%'; }
  });
} };
S[25] = { bg: 'castle_dark', go(n) {

  later(() => { s.style.transition = 'all 1.4s ease-in'; s.style.left = '120%'; s.style.top = '40%'; drawGermbar(false); }, 900);
} };
// 26–27. Финал
S[26] = { bg: 'castle_lights', go(n) { sp(peng('jump', n), 50, 72, 16, 'pop bob'); drawGermbar(false); } };
S[27] = { bg: 'castle_lights', go(n) {
  drawGermbar(false);
  const steps = [['Take a toothbrush!', 'brush'], ['Take some toothpaste!', 'tube'], ['Brush, brush, brush!', 'ph_brush'], ['Smile!', 'ph_jump']];
  const p = sp('ph_stand', 50, 62, 20, 'pop');

// 28. Сертификат
S[28] = { bg: 'castle_lights', go(n) {
  drawGermbar(false);
  const c = el('div', 'cert pop', `<h2>Защитник Зубного замка</h2><h3>Tooth Castle Hero</h3><input placeholder="Имя героя" maxlength="22"><p>прогнал всех микробов и выучил слова<br>tooth · toothbrush · toothpaste · cup</p>`);

/* ---------- навигация ---------- */
const TOTAL = 28;
let cur = 0;
function go(n) {
  if (n < 1 || n > TOTAL) return;
  timers.splice(0).forEach(t => { clearTimeout(t); clearInterval(t); });
  layer.innerHTML = '';
  cur = n;
  killed = GATES.filter(g => g < n).length;     // сколько микробов уже прогнано к этому слайду
  drawGermbar(n < 25);
  $('#germbar').style.visibility = n < 4 ? 'hidden' : '';
  const s = S[n];
  $('#bg').src = U(s.bg);
  s.go(n);
  $('#pageno').textContent = `${n} / ${TOTAL}`;
  renderPlan();
}
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
});
$('#bFull').onclick = () => document.fullscreenElement ? document.exitFullscreen() : stage.requestFullscreen?.();

/* ---------- план учителя ---------- */
let planAll = false;
$('#bPlan').onclick = () => $('#plan').classList.toggle('on');
function renderPlan() {
  const p = PLAN.find(r => r.n === cur);
  const box = $('#plan');
  if (!p) { box.innerHTML = '<h4>План не загружен</h4>'; return; }
  let h = `<div class="sec">${p.sec}</div><h4>Слайд ${p.n}</h4><dl>
    <dt>Что нужно сделать</dt><dd>${p.todo}</dd><dt>Teacher's language</dt><dd>${p.say}</dd><dt>Suggested answers</dt><dd>${p.ans}</dd></dl>
    <button class="tb all" id="bAll">${planAll ? 'Скрыть весь план' : 'Весь план урока'}</button>`;
  if (planAll) h += `<table><tr><th>№</th><th>Что сделать</th><th>Teacher's language</th><th>Answers</th></tr>` +
    PLAN.map(r => `<tr class="${r.n === cur ? 'cur' : ''}"><td>${r.n}</td><td>${r.todo}</td><td>${r.say}</td><td>${r.ans}</td></tr>`).join('') + '</table>';
  box.innerHTML = h;
  $('#bAll').onclick = () => { planAll = !planAll; renderPlan(); };
}

go(1);
