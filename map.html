<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карта Волшебной страны · WowSpeak</title>
<style>
  :root{
    --violet:#3D2E68; --accent:#e08a2b; --success:#4caf50;
    --bg:#f6f4fc; --bg2:#e7e2f3; --sea:#16b6b9;
    --stage-w:900; --stage-h:1500;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--sea); color:var(--violet);
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    -webkit-tap-highlight-color:transparent;
  }

  /* ---------- планка «Части карты» ---------- */
  .bar{
    position:sticky; top:0; z-index:30; width:100%; max-width:560px;
    display:flex; align-items:center; gap:10px; justify-content:center;
    padding:10px 14px calc(10px + env(safe-area-inset-top,0px));
    background:rgba(246,244,252,.92); backdrop-filter:blur(8px);
    border-radius:0 0 20px 20px; box-shadow:0 3px 14px rgba(61,46,104,.16);
  }
  .bar b{font-size:clamp(13px,3.6vw,16px); font-weight:800; white-space:nowrap}
  .slots{display:flex; gap:5px}
  .slot{
    width:clamp(26px,7.5vw,34px); aspect-ratio:1; border-radius:7px;
    border:2px dashed rgba(61,46,104,.28); background:rgba(61,46,104,.05);
    position:relative; overflow:hidden; display:grid; place-items:center;
  }
  .slot svg{position:absolute; inset:12%; width:76%; height:76%; opacity:.22}
  .slot.filled{border-style:solid; border-color:var(--accent); background:#fff8ee}
  .slot.filled svg{opacity:1}
  .slot.pop svg{animation:pop .55s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes pop{from{opacity:0;transform:scale(.3) rotate(-18deg)}to{opacity:1;transform:scale(1) rotate(0)}}

  /* ---------- сцена карты ---------- */
  .stage{
    position:relative; width:100%; max-width:560px;
    aspect-ratio:var(--stage-w)/var(--stage-h);
    background:#7fd9d4 center/cover no-repeat;
    margin:0 auto; overflow:hidden;
  }
  .stage svg.trails{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
  .trail{fill:none; stroke-linecap:round; stroke-width:9; stroke-dasharray:2 20; opacity:.35;
         stroke:rgba(255,255,255,.9)}
  .trail.open{opacity:1; stroke:#fff5d0; animation:run 1.5s linear infinite;
              filter:drop-shadow(0 0 5px rgba(255,210,110,.9))}
  @keyframes run{to{stroke-dashoffset:-22}}

  /* остров */
  .island{
    position:absolute; transform:translate(-50%,-50%);
    border:0; padding:0; background:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px;
  }
  .island img{width:100%; display:block; transition:filter .8s ease, opacity .8s ease}
  .island .name{
    font-size:clamp(11px,3vw,14px); font-weight:800; color:#fff;
    background:rgba(61,46,104,.72); padding:3px 10px; border-radius:999px;
    white-space:nowrap; transition:opacity .5s ease;
  }
  .island.locked img{filter:grayscale(.8) brightness(.72) contrast(.9)}
  .island.locked .name{opacity:.55}
  .island.locked{cursor:default}
  .island.current img{
    filter:drop-shadow(0 0 16px rgba(255,214,102,.9));
    animation:beat 1.9s ease-in-out infinite;
  }
  /* пока остров закрыт, он не светится и не пульсирует, даже будучи «текущим»:
     иначе во время открытия он вспыхивает цветом раньше, чем растает замок */
  .island.locked.current img{
    filter:grayscale(.8) brightness(.72) contrast(.9);
    animation:none;
  }
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
  .island.shake{animation:shake .45s}
  @keyframes shake{0%,100%{transform:translate(-50%,-50%)}
    25%{transform:translate(calc(-50% - 7px),-50%)}75%{transform:translate(calc(-50% + 7px),-50%)}}

  /* замочек — рисуется кодом, не картинкой */
  .lock{position:absolute; left:50%; top:44%; width:66%; overflow:visible; transform:translate(-50%,-50%);
        filter:drop-shadow(0 3px 6px rgba(61,46,104,.5)); pointer-events:none}
  .lock .shackle{transform-origin:30% 42%; transition:transform .5s cubic-bezier(.3,1.5,.5,1) 1.45s}
  .island.unlocking .lock .shackle{transform:rotate(-42deg) translateY(-2px)}
  .island.unlocking .lock{animation:melt 1s 1.9s ease-in forwards}
  @keyframes melt{to{opacity:0; transform:translate(-50%,-30%) scale(1.5)}}

  /* ключик: прилетает сбоку, входит в замок, проворачивается и исчезает вместе с ним */
  /* ключик проворачивается вокруг кончика, который стоит в скважине (20,31) */
  .lock .keyblade{opacity:0; transform-origin:20px 31px}
  .island.unlocking .lock .keyblade{animation:keyIn 2.6s ease forwards}
  @keyframes keyIn{
    0%  {opacity:0; transform:translateX(28px)}
    14% {opacity:1; transform:translateX(20px)}
    38% {opacity:1; transform:translateX(0)}
    54% {opacity:1; transform:translateX(0) rotate(40deg)}
    70% {opacity:1; transform:translateX(0) rotate(40deg)}
    100%{opacity:0; transform:translateX(0) rotate(40deg)}
  }

  /* финал */
  /* коробка финала совпадает с островом-Замком, чтобы корона и дракон встали по нему */
  .finale{position:absolute; left:57%; top:29%; transform:translate(-50%,-50%);
          width:56%; aspect-ratio:3/2; pointer-events:none; opacity:0}
  .finale.on{opacity:1; transition:opacity .9s ease .4s}
  .finale .dragon{position:absolute; left:72%; top:50%; width:26%;
                  animation:float 3.2s ease-in-out infinite}
  .finale .crown{position:absolute; left:50%; top:-2%; width:20%; transform:translateX(-50%);
                 animation:floatX 3.2s ease-in-out infinite .6s}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @keyframes floatX{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-8px)}}

  /* подсказка «сначала пройди предыдущий» */
  .hint{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,14px);
    background:var(--violet); color:#fff; font-weight:700; font-size:15px;
    padding:11px 18px; border-radius:14px; box-shadow:0 8px 22px rgba(61,46,104,.34);
    opacity:0; pointer-events:none; transition:opacity .3s, transform .3s; z-index:40; max-width:88vw;
  }
  .hint.on{opacity:1; transform:translate(-50%,0)}

  /* карта собрана */
  .done-panel{
    width:100%; max-width:560px; padding:16px 18px 30px; text-align:center;
    background:var(--bg2); border-radius:20px 20px 0 0;
  }
  .done-panel h2{margin:.2em 0; font-size:clamp(18px,5vw,24px)}
  .done-panel p{margin:.3em 0 1em; font-size:clamp(14px,3.8vw,16px); opacity:.85}
  .done-panel[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important; animation-iteration-count:1!important;
                         transition-duration:.001ms!important}
  }
</style>
</head>
<body>

<div class="bar">
  <b>Ключики:</b>
  <span class="slots" id="slots"></span>
  <b><span id="count">0</span> из 4</b>
</div>

<div class="stage" id="stage">
  <svg class="trails" viewBox="0 0 900 1500" preserveAspectRatio="none" aria-hidden="true">
    <path class="trail" id="trail-1" d="M330 1230 C 420 1170, 560 1130, 630 1010"></path>
    <path class="trail" id="trail-2" d="M630 1010 C 560 900, 380 880, 300 760"></path>
    <path class="trail" id="trail-3" d="M300 760 C 360 640, 470 560, 510 430"></path>
  </svg>
</div>

<div class="done-panel" id="donePanel" hidden>
  <h2>Все четыре ключика твои! 🔑</h2>
  <p>Ворота Замка открылись, Дракон проснулся — Праздник начался!</p>
</div>

<div class="hint" id="hint"></div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "wowspeak_journey";
  var WEB = "assets/map/web/";

  /* Две точки, которые подменяет сборщик единого файла (tools/build_single_file.py):
     там картинки лежат data-URI прямо в странице, а урок открывается в iframe. */
  function asset(name){ return WEB + name + ".webp"; }
  function openLesson(item){ location.href = item.lesson; }

  /* Острова снизу вверх: остров 1 внизу, Замок наверху.
     left/top — центр острова в процентах сцены, width — доля ширины сцены. */
  var ISLANDS = [
    {n:1, name:"Ярмарка Слов",  img:"island-1-fair",          left:37, top:82, width:56,
     lesson:"lessons/wowspeak-mini/lesson-1.html"},
    {n:2, name:"Остров Зеркал", img:"island-2-mirrors",       left:70, top:67, width:50, labelDx:-8,
     lesson:"lessons/wowspeak-mini/lesson-2.html"},
    {n:3, name:"Остров Друзей", img:"island-3-friends",       left:33, top:51, width:52,
     lesson:"lessons/wowspeak-mini/lesson-3.html"},
    {n:4, name:"Замок Дракона", img:"island-4-castle-closed", left:57, top:29, width:56,
     lesson:"lessons/wowspeak-mini/lesson-4.html"}
  ];

  var stage = document.getElementById("stage");
  var slotsBox = document.getElementById("slots");
  var countEl = document.getElementById("count");
  var hintEl = document.getElementById("hint");
  var donePanel = document.getElementById("donePanel");

  stage.style.backgroundImage = "url('" + asset("map-background") + "')";

  /* ---------- прогресс ---------- */
  function readJourney(){
    var j = {island1:false, island2:false, island3:false, island4:false, seen:0};
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var saved = JSON.parse(raw);
        for(var k in j){ if(saved && typeof saved[k] !== "undefined") j[k] = saved[k]; }
      }
    }catch(e){ /* приватный режим или мусор в ключе — играем с чистого листа */ }
    return j;
  }

  function saveJourney(j){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(j)); }catch(e){}
  }

  /* ?progress=N — предпросмотр без прохождения уроков, ?reset=1 — сброс.
     Нужно, чтобы показывать карту и гонять автотесты, не проходя курс заново. */
  function applyQuery(j){
    var q = new URLSearchParams(location.search);
    if(q.get("reset") === "1"){
      try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
      return readJourney();
    }
    var p = parseInt(q.get("progress"), 10);
    if(!isNaN(p)){
      for(var i=1;i<=4;i++) j["island"+i] = i <= p;
      j.seen = q.get("animate") === "1" ? Math.max(0, p) : Math.min(p+1, 4);
    }
    return j;
  }

  var journey = applyQuery(readJourney());

  function doneCount(){
    var n = 0;
    for(var i=1;i<=4;i++) if(journey["island"+i]) n++;
    return n;
  }
  /* Открыт остров, следующий за последним пройденным: пройдено 0 — открыт первый. */
  function unlockedUpTo(){ return Math.min(doneCount() + 1, 4); }

  /* ---------- сборка сцены ---------- */
  var nodes = {};

  ISLANDS.forEach(function(item){
    var btn = document.createElement("button");
    btn.className = "island";
    btn.style.left = item.left + "%";
    btn.style.top = item.top + "%";
    btn.style.width = item.width + "%";
    btn.type = "button";

    var img = document.createElement("img");
    img.src = asset(item.img);
    img.alt = "";
    btn.appendChild(img);

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    /* у острова 2 видимая часть смещена влево внутри холста — двигаем подпись за ней */
    if(item.labelDx) name.style.transform = "translateX(" + item.labelDx + "%)";
    btn.appendChild(name);

    btn.appendChild(makeLock());

    btn.addEventListener("click", function(){ onIslandClick(item, btn); });
    stage.appendChild(btn);
    nodes[item.n] = {btn:btn, img:img, item:item};
  });

  function makeBarKey(){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 52 24");
    svg.innerHTML =
      '<circle cx="13" cy="12" r="8.5" fill="none" stroke="#e8a72a" stroke-width="5"/>' +
      '<circle cx="13" cy="12" r="3" fill="#fff6e2"/>' +
      '<rect x="20" y="9.5" width="29" height="5" rx="2.5" fill="#e8a72a"/>' +
      '<rect x="36" y="14" width="4.5" height="7" rx="2" fill="#e8a72a"/>' +
      '<rect x="44" y="14" width="4.5" height="5.5" rx="2" fill="#e8a72a"/>';
    return svg;
  }

  function makeLock(){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("class", "lock");
    /* viewBox шире самого замка: ключику нужно место справа, чтобы влететь из-за края.
       Центр viewBox по X = 20 = центр замка, поэтому замок остаётся на том же месте. */
    svg.setAttribute("viewBox", "-40 0 120 54");
    svg.innerHTML =
      '<path class="shackle" d="M12 22 V15 a8 8 0 0 1 16 0 V22" fill="none" ' +
        'stroke="#efe6ff" stroke-width="5.5" stroke-linecap="round"/>' +
      '<rect x="5" y="21" width="30" height="26" rx="6" fill="#c3b2e8" stroke="#6a55a8" stroke-width="2.5"/>' +
      /* ключик: кончик ровно в скважине (20,31), зубцы смотрят на замок, кольцо справа */
      '<g class="keyblade">' +
        '<rect x="20" y="28.8" width="21" height="4.4" rx="2.2" fill="#e8a72a"/>' +
        '<rect x="22.5" y="33.2" width="3.6" height="4.2" rx="1.4" fill="#e8a72a"/>' +
        '<rect x="28.5" y="33.2" width="3.6" height="3.2" rx="1.4" fill="#e8a72a"/>' +
        '<circle cx="45.5" cy="31" r="5.5" fill="none" stroke="#e8a72a" stroke-width="4.2"/>' +
        '<circle cx="45.5" cy="31" r="2" fill="#fff6e2"/>' +
      '</g>' +
      /* скважина рисуется последней — она перекрывает кончик, и он выглядит вошедшим внутрь */
      '<circle cx="20" cy="31" r="3.4" fill="#3D2E68"/>' +
      '<rect x="18.6" y="32" width="2.9" height="8" rx="1.45" fill="#3D2E68"/>';
    return svg;
  }

  for(var i=1;i<=4;i++){
    var slot = document.createElement("span");
    slot.className = "slot";
    slot.appendChild(makeBarKey());
    slotsBox.appendChild(slot);
  }

  var finale = document.createElement("div");
  finale.className = "finale";
  finale.innerHTML =
    '<img class="dragon" src="' + asset("dragon") + '" alt="Дракон">' +
    '<img class="crown" src="' + asset("crown") + '" alt="Корона">';
  stage.appendChild(finale);

  /* ---------- отрисовка состояния ---------- */
  function render(animateUnlockOf){
    var done = doneCount();
    var openTo = unlockedUpTo();

    ISLANDS.forEach(function(item){
      var node = nodes[item.n];
      var locked = item.n > openTo;
      node.btn.classList.toggle("locked", locked);
      /* пульсирует только тот остров, который сейчас проходить */
      node.btn.classList.toggle("current", item.n === openTo && done < 4);
      node.btn.setAttribute("aria-label",
        item.name + (locked ? " — закрыт" : (journey["island"+item.n] ? " — пройден, можно пройти заново" : " — играть")));
      node.btn.disabled = false;
      var lock = node.btn.querySelector(".lock");
      if(lock) lock.style.display = locked ? "" : "none";
    });

    /* Замок в праздничном виде, когда собраны все четыре части */
    nodes[4].img.src = asset(done === 4 ? "island-4-castle-festive" : "island-4-castle-closed");

    for(var t=1;t<=3;t++){
      var trail = document.getElementById("trail-" + t);
      /* тропинка к следующему острову горит, когда предыдущий пройден */
      trail.classList.toggle("open", journey["island"+t] === true);
    }

    var slots = slotsBox.children;
    for(var s=0;s<4;s++){
      slots[s].classList.toggle("filled", journey["island"+(s+1)] === true);
    }
    countEl.textContent = String(done);

    finale.classList.toggle("on", done === 4);
    donePanel.hidden = done !== 4;

    if(animateUnlockOf) playUnlock(animateUnlockOf);
  }

  function playUnlock(n){
    var node = nodes[n];
    if(!node) return;
    node.btn.classList.add("locked");           /* показываем закрытым... */
    node.btn.classList.remove("current");
    var lock = node.btn.querySelector(".lock");
    if(lock) lock.style.display = "";
    requestAnimationFrame(function(){
      setTimeout(function(){
        /* ...ключик влетает, проворачивается, дужка откидывается, замок тает */
        node.btn.classList.add("unlocking");
        setTimeout(function(){
          node.btn.classList.remove("locked", "unlocking");
          if(lock) lock.style.display = "none";
          node.btn.classList.add("current");
        }, 3000);
      }, 300);
    });
  }

  function popNewPieces(fromCount){
    var slots = slotsBox.children;
    for(var s=fromCount; s<doneCount(); s++){
      (function(el, delay){
        setTimeout(function(){ el.classList.add("pop"); }, delay);
      })(slots[s], 250 + (s - fromCount) * 260);
    }
  }

  var hintTimer = null;
  function showHint(text){
    hintEl.textContent = text;
    hintEl.classList.add("on");
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function(){ hintEl.classList.remove("on"); }, 2600);
  }

  function onIslandClick(item, btn){
    if(item.n > unlockedUpTo()){
      btn.classList.remove("shake");
      void btn.offsetWidth;
      btn.classList.add("shake");
      showHint("Ключик от этого острова ждёт на «" + ISLANDS[item.n-2].name + "» 🔑");
      return;
    }
    openLesson(item);
  }

  /* ---------- первый показ ---------- */
  var openTo = unlockedUpTo();
  var needUnlockAnim = journey.seen < openTo && doneCount() > 0;
  var seenBefore = journey.seen;

  render(needUnlockAnim ? openTo : 0);
  if(doneCount() > seenBefore - 1) popNewPieces(Math.max(0, seenBefore - 1));

  if(journey.seen !== openTo){
    journey.seen = openTo;
    if(!new URLSearchParams(location.search).has("progress")) saveJourney(journey);
  }
})();
</script>
</body>
</html>
