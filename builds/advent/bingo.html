<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Christmas Bingo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Nunito:wght@600;700;800&family=Pacifico&display=swap">
<style>
/* Christmas Bingo — подарок 22-го окошка (Анна, 24.11.2026): собирается из слов, которые ребёнок уже открыл.
   4 карточки игроков 3×3 (в центре FREE) + лист ведущего с карточками для вытягивания и правилами. */
:root{--red:#D7263D;--green:#1F8A4C;--gold:#E7B22E;--ink:#1E2340;--mute:#5A6286;--paper:#FFFDF7;--bg:#EEF1F8;--line:#E3D6B8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141A2E}}
:root[data-theme="dark"]{--bg:#141A2E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#1C2456;color:#fff}
.bar b{font-family:Montserrat,sans-serif;font-weight:900}.bar span{opacity:.85;font-size:14px}
.bar button{margin-left:auto;font:800 14px Montserrat,sans-serif;border:0;border-radius:12px;padding:10px 16px;background:#FFD45A;color:#3A2600;cursor:pointer}
.bar button+button{margin-left:0;background:#fff;color:#1C2456}
.sheet{width:min(794px,100% - 32px);margin:18px auto;background:var(--paper);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.15);padding:28px 30px;position:relative;overflow:hidden}
.garl{position:absolute;left:0;right:0;top:0;height:46px;background:url(img/garland.webp) center top/auto 46px repeat-x;opacity:.95}
.hd{text-align:center;margin-top:30px}
.hd h1{font-family:Pacifico,cursive;font-weight:400;color:var(--red);font-size:40px;margin:0;line-height:1.1}
.hd p{margin:2px 0 0;color:var(--mute);font-weight:700}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
.cards.one{grid-template-columns:minmax(0,560px);justify-content:center}
.cards.one .cell b{font-size:15px}.cards.one .who{font-size:18px}
.card{border:3px solid var(--green);border-radius:18px;padding:10px 10px 12px;background:#fff}
.card .who{font:900 15px Montserrat,sans-serif;color:var(--green);text-align:center;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center}
.cell img{width:68%;height:62%;object-fit:contain}
.cell b{font:800 12px Montserrat,sans-serif;line-height:1.1;margin-top:3px}
.cell.free{background:#FFF3C9;border-color:var(--gold)}.cell.free .fr{font-size:34px;line-height:1;color:var(--red)}/* не картинкой звезды: на карточке может быть «gold star» и «tree topper» */.cell.free b{color:#A8730B;font-size:15px}
.rules{margin-top:20px;padding:14px 18px;border-radius:14px;background:#F4FAF6;border:2px dashed var(--green)}
.rules h2{font:900 18px Montserrat,sans-serif;margin:0 0 6px;color:var(--green)}
.rules ol{margin:0;padding-left:20px}.rules li{margin:3px 0}
.calls{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin-top:16px;border-top:2px dashed #C9CED8;border-left:2px dashed #C9CED8}
.call{border-right:2px dashed #C9CED8;border-bottom:2px dashed #C9CED8;padding:8px 4px;text-align:center}
.call img{width:58px;height:58px;object-fit:contain}
.call b{display:block;font:800 13px Montserrat,sans-serif}.call small{color:var(--mute);font-size:12px}

/* логотип школы на распечатках (Анна, 27.11.2026): надпись wowSpeak с розовой «o», как на платформе */
.wlogo{font:900 22px Montserrat,system-ui,sans-serif;letter-spacing:.5px;color:#2d2d3f;line-height:1}
.wlogo i{font-style:normal;color:#e91e8c}
.hdl{position:absolute;left:30px;top:56px;z-index:2}
.cut{color:var(--mute);font-size:13px;margin-top:10px;text-align:center}
.note{width:min(794px,100% - 32px);margin:0 auto 10px;color:var(--mute);font-size:14px}
:root[data-theme="dark"] .note{color:#B9C3E6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .note{color:#B9C3E6}}
@media (max-width:620px){.hdl{position:static;text-align:center;margin-top:52px}.hd{margin-top:6px}.cards{grid-template-columns:1fr}.calls{grid-template-columns:repeat(3,1fr)}.sheet{padding:22px 14px}.hd h1{font-size:32px}}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}.bar,.note{display:none}
  .sheet{width:auto;margin:0;box-shadow:none;border-radius:0;padding:0;page-break-after:always;overflow:visible}
  .garl{position:static;height:40px;background-size:auto 40px}
  .hd{margin-top:6px}.cards{gap:12mm 8mm}
  .hdl{left:0;top:44px}.wlogo{font-size:26px}
  .rules{font-size:15px;line-height:1.6;margin-top:10mm}
  .calls{margin-top:4mm}.call{padding:2mm 1mm;height:31mm;display:flex;flex-direction:column;align-items:center;justify-content:center}.call img{width:15mm;height:15mm}.call b{font-size:11px;line-height:1.15}.call small{font-size:9.5px;line-height:1.1}
  .cards.one{grid-template-columns:172mm;margin-top:8mm}.cards.one .cell b{font-size:17px}.cards.one .grid{gap:3mm}
  .cell b{font-size:11px}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style></head><body>
<div class="bar"><b>🎲 Christmas Bingo</b><span id="sub"></span><button type="button" id="pr">🖨 Распечатать</button></div>
<p class="note" id="note"></p>
<div id="out"></div>
<script>
(function(){
/* слова приходят из кабинета в адресе: #d=<base64 JSON {name, words:[{w,ru,img}]}>; без них — пример */
var D=null;try{var m=location.hash.match(/d=([^&]+)/);if(m)D=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));}catch(e){}
if(!D)D={name:'Маша',words:[['red ball','красный шар','red_ball'],['gold star','золотая звезда','star'],['gold bell','золотой колокольчик','bell'],['garland','гирлянда','ic_garland'],
 ['red candy cane','красный леденец-тросточка','candy_cane'],['white snowflake','белая снежинка','snowflake'],['blue ball','синий шар','blue_ball'],['gingerbread man','пряничный человечек','gingerbread'],
 ['red bow','красный бантик','bow'],['pine cone','шишка','pine_cone'],['red stocking','красный новогодний носок','stocking'],['snowman','снеговик','snowman'],['reindeer','олень','reindeer'],['Christmas tree','ёлка','tree_pine']]
 .map(function(x){return {w:x[0],ru:x[1],img:'img/'+x[2]+'.webp'};})};
var W=D.words,name=D.name||'';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
/* перемешивание с зерном: у каждой карточки свой порядок и, если слов много, свой набор */
function rnd(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};}
function shuf(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var seed0=0;for(var i=0;i<name.length;i++)seed0+=name.charCodeAt(i)*(i+7);seed0=seed0%9973+W.length*31+11;
var cards=[];for(var k=0;k<4;k++){var r=rnd(seed0+k*977+1);var pick=shuf(W,r).slice(0,8);pick.splice(4,0,null);cards.push(pick);}
var PL=['Игрок 1','Игрок 2','Игрок 3','Игрок 4'];
function cardHtml(c,k){return '<div class="card"><div class="who">'+PL[k]+'</div><div class="grid">'+c.map(function(x){
  return x?'<div class="cell"><img src="'+esc(x.img)+'" alt=""><b>'+esc(x.w)+'</b></div>':'<div class="cell free"><span class="fr">★</span><b>FREE</b></div>';}).join('')+'</div></div>';}
function head(sub){return '<div class="garl"></div><div class="hdl"><span class="wlogo">w<i>o</i>wSpeak</span></div><div class="hd"><h1>Christmas Bingo</h1><p>'+sub+'</p></div>';}
var by=name?'Слова из адвент-календаря · '+esc(name):'Слова из адвент-календаря';
/* 27.11 Анна попросила документом — карточка на весь лист A4: крупно, удобно закрывать клетки */
var h=cards.map(function(c,k){return '<section class="sheet">'+head(by)+'<div class="cards one">'+cardHtml(c,k)+'</div></section>';}).join('')+
  '<section class="sheet">'+head('Лист ведущего · правила')+
  '<div class="rules"><h2>Как играть</h2><ol>'+
  '<li>Каждый берёт карточку. Клетка <b>FREE</b> в центре уже закрыта.</li>'+
  '<li>Ведущий разрезает карточки ниже, кладёт в шапку и вытягивает по одной. Называет слово <b>по-английски</b> и не показывает картинку.</li>'+
  '<li>У кого на карточке это слово — закрывает клетку пуговицей, монеткой или конфетой.</li>'+
  '<li>Закрыл ряд — по горизонтали, вертикали или диагонали — кричи <b>«Bingo!»</b> и прочитай свои слова вслух.</li>'+
  '<li>Сыграть ещё раз: играем до полной карточки.</li></ol></div>'+
  '</section>'+
  '<section class="sheet">'+head('Лист ведущего · карточки для вырезания')+
  '<div class="calls">'+W.map(function(x){return '<div class="call"><img src="'+esc(x.img)+'" alt=""><b>'+esc(x.w)+'</b><small>'+esc(x.ru)+'</small></div>';}).join('')+'</div>'+
  '<div class="cut">✂ Разрежь по пунктиру</div></section>';
document.getElementById('out').innerHTML=h;
document.getElementById('sub').textContent=W.length+' слов · 4 карточки · лист ведущего';
document.getElementById('note').textContent='Листы A4: по карточке игрока на листе и лист ведущего. Распечатай и играй всей семьёй.';
document.getElementById('pr').onclick=function(){try{window.print();}catch(e){}};
})();
</script>
</body></html>
