<meta charset="utf-8">
<title>Адвент в кабинете ученика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Кабинет ученика на весь экран: слева меню, справа содержимое; на телефоне меню снизу.
   Стиль кабинета: кремово-персиковый фон, белые карточки ~26px, фиолетовый и розовый, жёлтые монеты.
   Один светлый вид намеренно — так выглядит настоящий кабинет. */
:root{
  --bg:#FFF4EC; --card:#FFFFFF; --ink:#2B2140; --muted:#6B6280; --line:#F0E2D6;
  --violet:#6A4DF4; --violet-soft:#EEE9FF; --pink:#F7628C; --pink-soft:#FFE6EE;
  --coin:#FFC83D; --coin-ink:#6E4A00; --green:#1F8F62; --green-soft:#E3F6EC; --red:#C8364D; --night:#1C2456;
  --ff-head:"Montserrat","Segoe UI",Arial,sans-serif; --ff-body:"Nunito","Segoe UI",Arial,sans-serif;
  --r:26px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--ff-head);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--ff-head);font-weight:900;font-size:24px;color:var(--violet);padding:0 10px 14px}
.logo span{color:var(--pink)}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:16px;font-family:var(--ff-head);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;position:relative}
.nav .ic{font-size:20px;width:26px;text-align:center}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--violet-soft);color:var(--violet)}
.nav:focus-visible{outline:3px solid var(--violet);outline-offset:1px}
.nav.xmas{color:#fff;background:linear-gradient(135deg,#2F3C8F,#1C2456);margin-top:6px;animation:glow 1.8s ease-in-out infinite}
.nav.xmas.on{outline:3px solid var(--coin)}
.dot{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 6px rgba(255,200,61,.38)}}
@keyframes pulse{50%{transform:translateY(-50%) scale(1.18)}}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--bg)}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-family:var(--ff-head);font-weight:900;display:grid;place-items:center;flex:none}
.me b{font-family:var(--ff-head);display:block;font-size:14px}
.me small{color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;padding-right:max(26px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:5;background:var(--bg)}
.top h1{font-size:24px;font-weight:900;flex:1;min-width:0}
.coins{font-family:var(--ff-head);font-weight:900;background:var(--coin);color:var(--coin-ink);padding:8px 14px;border-radius:999px;font-variant-numeric:tabular-nums;transition:transform .2s;white-space:nowrap;border:0;cursor:pointer}
.coins:hover{filter:brightness(1.05)}
.coins:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.coins.bump{transform:scale(1.2)}
.streak{font-family:var(--ff-head);font-weight:800;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px;white-space:nowrap}
.page{padding:4px 26px 120px;padding-right:max(26px,env(safe-area-inset-right,0px));flex:1}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:17px}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-head);font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;align-self:flex-start}
.p-coin{background:var(--coin);color:var(--coin-ink)}.p-violet{background:var(--violet-soft);color:var(--violet)}.p-pink{background:var(--pink-soft);color:#B8325C}.p-green{background:var(--green-soft);color:var(--green)}
.btn{font-family:var(--ff-head);font-weight:800;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--violet);color:#fff;font-size:14px;align-self:flex-start}
.btn.pink{background:var(--pink)}.btn.ghost{background:var(--violet-soft);color:var(--violet)}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hero{border-radius:30px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;margin-bottom:16px;background:linear-gradient(90deg,rgba(20,26,70,.92) 0%,rgba(20,26,70,.7) 45%,rgba(20,26,70,0) 75%),url(img/bg_night.webp) center 70%/cover no-repeat,var(--night);animation:heroGlow 2.2s ease-in-out infinite}
@keyframes heroGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 7px rgba(255,200,61,.45)}}
.hero h2{font-size:clamp(22px,3vw,30px);font-weight:900;max-width:60%}
.hero p{max-width:55%;color:#E4E8FF;margin:0}
.hero .tr{position:absolute;right:4%;bottom:-4%;height:118%;max-width:40%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.hero .new{background:var(--pink);font-family:var(--ff-head);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;align-self:flex-start;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-3px) scale(1.05)}}
.hero:focus-visible{outline:4px solid var(--coin);outline-offset:3px}
.hw{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--bg)}
.hw .em{font-size:26px}
.hw b{font-family:var(--ff-head);font-size:14px;display:block}
.wheel{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--pink) 0 60deg,var(--coin) 0 120deg,var(--violet) 0 180deg,#3E9BEA 0 240deg,var(--green) 0 300deg,#FF8A3D 0);border:6px solid #fff;box-shadow:0 0 0 2px var(--line);align-self:center}
.bigcoin{font-family:var(--ff-head);font-weight:900;font-size:34px;color:var(--coin-ink);font-variant-numeric:tabular-nums}
/* ---------- адвент ---------- */
[hidden]{display:none!important}
.adv-tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:66px;z-index:4;background:var(--bg);padding:6px 0 10px;margin-bottom:2px}
.adv-tabs button{font-family:var(--ff-head);font-weight:800;font-size:15px;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;cursor:pointer}
.adv-tabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.adv-tabs button:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.plaque{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#FFF8D6;border:2px dashed #E3B400;border-radius:20px;padding:12px 16px;margin-bottom:12px}
.plaque .vn{font-family:var(--ff-head);font-weight:900;font-size:20px;color:#6E4A00;white-space:nowrap}
.plaque .vt{flex:1;min-width:220px;color:#4A3A10;font-weight:700}
.advbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:12px}
.advbar .date{font-family:var(--ff-head);font-weight:900;font-size:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:18px;height:18px;border-radius:6px;display:inline-block}
.scene{position:relative;border-radius:26px;overflow:hidden;background:var(--night) url(img/bg_night.webp) center bottom/cover no-repeat;aspect-ratio:16/9;width:100%;max-width:min(100%,calc((100vh - 330px)*16/9));margin-inline:auto}
.snowfall{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff9,transparent),radial-gradient(2px 2px at 70% 20%,#fff9,transparent),radial-gradient(3px 3px at 40% 70%,#fff7,transparent),radial-gradient(2px 2px at 85% 60%,#fff9,transparent);background-size:240px 240px;animation:snow 16s linear infinite}
@keyframes snow{to{background-position:0 240px,0 240px,0 240px,0 240px}}
.road{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.road .all{fill:none;stroke:#ffffff55;stroke-linecap:round;stroke-linejoin:round}
.road .done{fill:none;stroke:#FFD978;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 2px #ffcf5a)}
.door{position:absolute;width:var(--dw,8.4%);aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}
.door:hover{transform:translate(-50%,-50%) scale(1.1)}
.door:focus-visible{outline:3px solid var(--coin);outline-offset:3px;border-radius:50%}
.door .disc{position:absolute;inset:0;border-radius:50%}
/* картинка целиком внутри кружка: квадрат 56% по центру, object-fit:contain — ничего не обрезается (23.11.2026, Анна: «значки обрезаны») */
.door .disc .pic{position:absolute;left:22%;top:22%;width:56%;height:56%;filter:drop-shadow(0 4px 5px rgba(0,0,0,.35))}
.door.d-open .disc{background:radial-gradient(circle at 50% 40%,#ffffff40,#ffffff14 70%);box-shadow:inset 0 0 0 2px #ffffffaa,0 0 14px #ffd97855}
.door .disc .pic.pw{left:7%;width:86%}
.door.d-avail .disc .pic,.door.d-today .disc .pic,.door.d-missed .disc .pic,.door.d-future .disc .pic{left:16%;top:16%;width:68%;height:68%}
.door .num{position:absolute;left:-4%;top:-6%;min-width:34%;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--night);font-family:var(--ff-head);font-weight:900;font-size:clamp(10px,1.1vw,15px);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:2px;z-index:2}
.door.d-today .num,.door.d-yday .num{background:var(--pink);color:#fff}
.door .miss.yd{background:var(--pink);color:#fff}
.door.d-today{animation:todayGlow 1.4s ease-in-out infinite}
@keyframes todayGlow{50%{transform:translate(-50%,-50%) scale(1.12)}}
.door.d-today::before{content:"";position:absolute;inset:-16%;border-radius:50%;background:radial-gradient(circle,rgba(255,220,120,.6),transparent 65%)}
.door.d-missed .disc{background:#ffffff14;box-shadow:inset 0 0 0 2px #ffffffaa}


.door .miss{position:absolute;left:50%;bottom:-17%;transform:translateX(-50%);background:var(--coin);color:var(--coin-ink);font-family:var(--ff-head);font-weight:900;font-size:clamp(8px,.85vw,11px);border-radius:999px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap;z-index:2}
.door.d-future .disc .pic{filter:grayscale(1) brightness(1.5) opacity(.38)}
.door.d-future .num{background:#ffffffaa}
.door .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(13px,1.6vw,22px);z-index:1}
.door.shake{animation:shake .5s}
@keyframes shake{25%{transform:translate(-50%,-50%) rotate(-12deg)}75%{transform:translate(-50%,-50%) rotate(12deg)}}
img.pic{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
/* ёлка и сундук */
.treebox{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.treearea{position:relative;border-radius:26px;background:var(--night) url(img/bg_night.webp) center bottom/cover no-repeat;height:calc(100vh - 330px);min-height:470px;overflow:hidden;touch-action:none}
.treearea .tree{position:absolute;left:10%;right:10%;top:7%;bottom:3%}
.placed{position:absolute;aspect-ratio:1;touch-action:none;cursor:grab;user-select:none;transform:translate(-50%,-50%) rotate(var(--r,0deg))}
.placed .pic{filter:drop-shadow(0 4px 5px rgba(0,0,0,.4))}
.placed.pwide .pic{object-fit:fill}
.placed.dragging{cursor:grabbing;z-index:5}
.placed.sel{z-index:6}
.frame{position:absolute;inset:-6px;border:2px dashed #fff;border-radius:10px;pointer-events:none}
.hd{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--violet);box-shadow:0 2px 6px rgba(0,0,0,.4);touch-action:none;pointer-events:auto;display:grid;place-items:center;font-size:11px;line-height:1;color:var(--violet);font-weight:900}
.hd.sc{right:-15px;bottom:-15px;cursor:nwse-resize}
.hd.ro{left:50%;top:-34px;transform:translateX(-50%);cursor:grab}
.hd.ro::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:12px;background:#fff;transform:translateX(-50%)}
.hd.lx{left:-15px;top:50%;transform:translateY(-50%);cursor:ew-resize;border-color:var(--pink);color:var(--pink)}
.hd.rx{right:-15px;top:50%;transform:translateY(-50%);cursor:ew-resize;border-color:var(--pink);color:var(--pink)}
.hd.by{left:50%;bottom:-15px;transform:translateX(-50%);cursor:ns-resize;border-color:var(--pink);color:var(--pink)}
.tool{position:absolute;z-index:8;display:flex;gap:6px;transform:translate(-50%,0);background:#fff;border-radius:16px;padding:6px;box-shadow:0 10px 24px -8px rgba(0,0,0,.55);align-items:center;flex-wrap:wrap;max-width:94%;justify-content:center}
.tool button{border:0;border-radius:10px;background:var(--violet-soft);color:var(--violet);padding:6px 9px;font-family:var(--ff-head);font-weight:800;font-size:12px;cursor:pointer;white-space:nowrap}
.tool .dt{width:30px;height:30px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);position:relative}
.tool .dt.cur{box-shadow:0 0 0 3px var(--violet)}
.tool .dt.no{opacity:.55}
.tool .dt.no::after{content:"🪙";position:absolute;right:-8px;top:-8px;font-size:11px}
.tool .hint2{font-size:11px;color:var(--muted);width:100%;text-align:center}
.chest{background:var(--card);border-radius:26px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.chest-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chest-head h3{flex:1}
.chest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px;padding:2px}
.slot{position:relative;background:var(--bg);border-radius:18px;aspect-ratio:1;border:2px solid var(--line);cursor:grab;touch-action:none;user-select:none;padding:12px 12px 20px;display:block;min-width:0}
.slot .pic{width:100%;height:100%}
.slot .cnt{position:absolute;right:5px;top:5px;background:var(--violet);color:#fff;font-family:var(--ff-head);font-weight:800;font-size:10px;border-radius:999px;padding:1px 6px}
.slot .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slot.s-locked{cursor:pointer;background:#F3EEF8}
.slot.s-locked .pic{filter:grayscale(1) brightness(.2);opacity:.25}
.slot.s-locked::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:20px}
.slot.s-open{border-color:var(--violet);box-shadow:0 0 0 3px var(--violet-soft)}
.slot:focus-visible{outline:3px solid var(--violet)}
.panel{background:var(--violet-soft);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.panel-h{display:flex;align-items:center;gap:8px}
.panel-h b{font-family:var(--ff-head);flex:1;min-width:0}
.panel .x{border:0;background:#fff;border-radius:50%;width:30px;height:30px;cursor:pointer;font-weight:900;flex:none}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swi{position:relative;width:62px;height:62px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:6px;cursor:pointer;touch-action:none}
.swi.own{border-color:var(--green)}
.swi.not .pic{opacity:.55}
.swi.not{border-style:dashed}
.swi.cur{outline:3px solid var(--violet);outline-offset:1px}
.swi .c{position:absolute;right:-6px;top:-6px;background:var(--green);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px}
.swi.not .c{background:var(--coin);color:var(--coin-ink)}
.swi .cd{position:absolute;left:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #0002}
.gsz{display:flex;gap:6px;flex-wrap:wrap}
.gsz button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:5px 11px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit}
.gsz button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.act{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act .t{color:var(--ink);font-size:13px;flex:1;min-width:120px}
.mini-say{border:0;background:#fff;color:var(--violet);border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}
.dragghost{position:fixed;z-index:100;pointer-events:none;width:80px;height:80px;transform:translate(-50%,-50%)}
.dragghost img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.trees{display:flex;gap:8px;flex-wrap:wrap}
.trees button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:4px;cursor:pointer;width:60px;height:74px;position:relative}
.trees button.on{border-color:var(--violet)}
.trees button:disabled{cursor:not-allowed}
.trees button:disabled .pic{filter:grayscale(1);opacity:.3}
.trees .lk{position:absolute;inset:0;display:grid;place-items:center}
.hint{font-size:13px;color:var(--muted)}
.tbtns{display:flex;gap:8px;flex-wrap:wrap}
.bonus{background:#FFF3C4;color:var(--coin-ink);font-family:var(--ff-head);font-weight:900;border-radius:14px;padding:8px 12px}
.rep{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.rep .rt{font-family:var(--ff-head);font-weight:900;color:var(--red);min-width:0;font-variant-numeric:tabular-nums}
.rep .rt.on{animation:recblink 1s ease-in-out infinite}
@keyframes recblink{50%{opacity:.35}}
.mcard.snap img{width:100%;border-radius:18px;display:block}
.tgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:16px;align-items:start}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.klist{display:flex;flex-direction:column;gap:8px}
.krow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);grid-template-areas:"a n p" "a s p";gap:2px 12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:10px 12px;cursor:pointer;font:inherit;color:var(--ink)}
.krow.on{border-color:var(--violet);background:var(--violet-soft)}
.krow .ava{grid-area:a}.krow .kn{grid-area:n;min-width:0}.krow .kp{grid-area:p}.krow .ks{grid-area:s;font-size:13px;color:var(--muted)}
.krow small{display:block;color:var(--muted);font-size:12px}
.ava{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-family:var(--ff-head);font-weight:900;display:grid;place-items:center;flex:none}
.ava.big{width:52px;height:52px;font-size:22px}
.bar{display:block;height:10px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--coin),var(--pink))}
.khead{display:flex;gap:12px;align-items:center}
.kbody{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:14px;align-items:start}
.mini{position:relative;aspect-ratio:.85;border-radius:20px;overflow:hidden;background:var(--night) url(img/bg_night.webp) center bottom/cover}
.mini .mt{position:absolute;left:10%;right:10%;top:7%;bottom:3%;width:80%;height:90%;object-fit:contain}

  return {pts:pts,ar:mob?3/5:16/9,dw:mob?'15%':'8.4%'};
}

/* «Повтори за мной»: настоящая запись голоса там, где браузер даёт микрофон.

   и честно пишем, что запись включится на платформе (23.11.2026). */
function repeatAfterMe(m,word){
  var recB=m.querySelector('#recB'),recT=m.querySelector('#recT'),cmpB=m.querySelector('#cmpB'),recN=m.querySelector('#recN'),mine=null,busy=false;
  function count(sec,done){var n=sec;recT.textContent='● '+n;recT.className='rt on';var iv=setInterval(function(){n--;if(n<=0){clearInterval(iv);recT.className='rt';recT.textContent='';done();}else recT.textContent='● '+n;},1000);}
  function demo(){busy=true;recB.textContent='🎙 Говори…';count(3,function(){busy=false;recB.textContent='🎙 Ещё раз';cmpB.hidden=false;
    recN.hidden=false;recN.textContent='В этом макете микрофон не подключён — на платформе здесь будет твоя запись: «Образец и я» включит голос, а потом тебя.';});}

    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||typeof MediaRecorder==='undefined'){demo();return;}
    navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){busy=true;var ch=[],r=new MediaRecorder(st);
      r.ondataavailable=function(e){ch.push(e.data);};
      r.onstop=function(){st.getTracks().forEach(function(x){x.stop();});mine=URL.createObjectURL(new Blob(ch,{type:r.mimeType||'audio/webm'}));busy=false;recB.textContent='🎙 Ещё раз';cmpB.hidden=false;recN.hidden=true;};
      setTimeout(function(){recB.textContent='🎙 Говори…';r.start();count(3,function(){try{r.stop();}catch(e){}});},900);
    }).catch(function(){demo();});};
  cmpB.onclick=function(){say(word);if(!mine){toast('В макете своей записи нет — на платформе здесь прозвучит твой голос');return;}
    setTimeout(function(){var a=new Audio(mine);a.play().catch(function(){});},1400);};
}

    }
    function up(ev){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      if(g)g.remove();el.classList.remove('dragging');
      if(dead)return;if(!moved){o.tap();return;}if(o.drop)o.drop(ev.clientX,ev.clientY);}
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

/* ---------- ёлка картинкой ----------
   Рисуем ёлку с украшениями на canvas по тому, что сейчас на экране (фон, ёлка, каждое украшение с размером и поворотом).
   В артефакте файл скачать нельзя: показываем картинку в окне — её можно сохранить долгим нажатием или правой кнопкой.
   Где есть возможность downloads — ещё и кнопка «Скачать». В боевой версии будет обычное скачивание файла. */
function loadImg(s){return new Promise(function(ok,no){var i=new Image();i.onload=function(){ok(i);};i.onerror=no;i.src=s;});}
function fitRect(img,w,h,fill){if(fill)return [0,0,w,h];var k=Math.min(w/img.naturalWidth,h/img.naturalHeight),iw=img.naturalWidth*k,ih=img.naturalHeight*k;return [(w-iw)/2,(h-ih)/2,iw,ih];}
function snapTree(){
  var area=$('area');if(!area)return;sel=null;drawSel();
  var A=area.getBoundingClientRect(),K=2,cv=document.createElement('canvas');cv.width=Math.round(A.width*K);cv.height=Math.round(A.height*K+70*K);
  var cx=cv.getContext('2d');
  loadImg('img/bg_night.webp').then(function(bg){
    var k=Math.max(cv.width/bg.naturalWidth,(A.height*K)/bg.naturalHeight),bw=bg.naturalWidth*k,bh=bg.naturalHeight*k;
    cx.fillStyle='#1C2456';cx.fillRect(0,0,cv.width,cv.height);
    cx.save();cx.beginPath();cx.rect(0,0,cv.width,A.height*K);cx.clip();cx.drawImage(bg,(cv.width-bw)/2,A.height*K-bh,bw,bh);
    var ti=area.querySelector('.tree img'),TR=ti.getBoundingClientRect(),f=fitRect(ti,TR.width,TR.height);
    cx.drawImage(ti,(TR.left-A.left+f[0])*K,(TR.top-A.top+f[1])*K,f[2]*K,f[3]*K);
    $$('.placed',area).forEach(function(el){var pl=S.placed.filter(function(q){return q.id==el.dataset.id;})[0];if(!pl)return;
      var r=el.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight,img=el.querySelector('img');if(!img||!img.naturalWidth)return;
      var g=fitRect(img,w,h,!!F[pl.f].wide);
      cx.save();cx.translate((r.left-A.left+r.width/2)*K,(r.top-A.top+r.height/2)*K);cx.rotate(pl.r*Math.PI/180);
      cx.shadowColor='rgba(0,0,0,.4)';cx.shadowBlur=6*K;cx.shadowOffsetY=3*K;
      cx.drawImage(img,(-w/2+g[0])*K,(-h/2+g[1])*K,g[2]*K,g[3]*K);cx.restore();});
    cx.restore();
    cx.fillStyle='#fff';cx.textAlign='center';cx.font='800 '+(22*K)+'px Montserrat, Arial, sans-serif';
    cx.fillText('Моя новогодняя ёлка · Маша',cv.width/2,A.height*K+44*K);
    var url=cv.toDataURL('image/png');
    var m=modal('<div class="mcard wide snap"><h3>📸 Моя ёлка</h3><img src="'+url+'" alt="Моя ёлка с украшениями">'+
      '<p class="hint" style="margin:0">Чтобы сохранить: нажми на картинку и удерживай, а на компьютере — правой кнопкой мыши → «Сохранить картинку». Покажи её учителю и маме!</p>'+
      '<div class="btns"><button type="button" class="btn" id="dlB" hidden>⬇ Скачать</button><button type="button" class="btn ghost" data-close>Закрыть</button></div></div>');
    var use=window.claude&&window.claude.use;if(use){window.claude.use('downloads').then(function(dl){if(!dl)return;var b=m.querySelector('#dlB');b.hidden=false;
      b.onclick=function(){cv.toBlob(function(blob){dl.save({filename:'moya-yolka.png',data:blob}).catch(function(e){if(e&&e.code==='unavailable')b.hidden=true;});},'image/png');};}).catch(function(){});}
  }).catch(function(){toast('Не получилось собрать картинку');});
}

function kid(name,days,last,streak,nPlaced,tree){var s=blank('kid');s.day=20;s.tree=tree||'pine';var n=0;
  days.forEach(function(d){s.opened[d]=n;give(s,DAYS[n]);n++;});
  var own=[];ORDERF.forEach(function(f){if(s.own[f]&&!F[f].top)Object.keys(s.own[f]).forEach(function(c){own.push([f,c]);});});
  var SP=[[50,44],[38,52],[63,58],[45,66],[57,32],[35,70],[66,72],[50,57],[42,40],[60,46],[30,62],[54,78]];
  own.slice(0,nPlaced).forEach(function(o,i){var sp=SP[i%SP.length];s.placed.push({id:i+1,f:o[0],c:o[1],x:sp[0],y:sp[1],s:F[o[0]].wide?.7:1,r:0,sx:1,sy:1});});
  return {name:name,s:s,last:last,streak:streak};}
function range(a,b,skip){var r=[];for(var i=a;i<=b;i++)if(!skip||skip.indexOf(i)<0)r.push(i);return r;}
function kids(){var m=ALL.miss,md=[];for(var d in m.opened)md.push(+d);
  return [{name:'Маша',s:m,last:'сегодня',streak:5},kid('Тимур',range(1,20),'сегодня',20,12,'snowy'),kid('Алиса',range(1,12,[4,9]),'вчера',2,6),kid('Саша',range(1,4),'5 декабря',0,2)];}
function miniTree(s){
  var h='<div class="mini"><img class="mt" src="img/tree_'+s.tree+'.webp" alt="">';
  s.placed.forEach(function(pl){var fm=F[pl.f];if(!fm)return;var w=fm.sz*pl.s*(fm.wide?pl.sx:1);
    h+='<span class="mp'+(fm.wide?' pwide':'')+'" style="left:'+pl.x+'%;top:'+pl.y+'%;width:'+w+'%;aspect-ratio:'+(fm.wide?fm.wide*pl.sx/pl.sy:1)+';--r:'+pl.r+'deg">'+pic(src(pl.f,pl.c))+'</span>';});
  return h+'</div>';}
function praise(k){var n=Object.keys(k.s.opened).length,w=[];for(var d in k.s.opened)w.push(DAYS[k.s.opened[d]]);
  var lastW=w.length?dayEn(w[w.length-1]):'';
  if(k.last!=='сегодня'&&k.last!=='вчера')return 'Давно не заходил. Напомните мягко, без упрёка: вчерашнее и сегодняшнее окошко бесплатные, а за ранние у него хватит монеток. Можно открыть одно окошко вместе на уроке.';
  if(n>=15)return 'Открыто '+n+' окошек, на ёлке '+k.s.placed.length+' украшений — похвалите за то, что заходит каждый день. Спросите: «What’s on your tree?» — пусть назовёт три украшения по-английски.';
  return 'Похвалите за последнее слово — «'+lastW+'». Попросите сказать его вслух и показать, куда повесил(а) это украшение на ёлке.';}
var tSel=0;
function renderTeachView(){
  var K=kids(),rows=K.map(function(k,i){var n=Object.keys(k.s.opened).length;
    return '<button type="button" class="krow'+(i===tSel?' on':'')+'" data-k="'+i+'"><span class="ava">'+k.name[0]+'</span><span class="kn"><b>'+k.name+'</b><small>заходил(а): '+k.last+'</small></span>'+
      '<span class="kp"><span class="bar"><i style="width:'+Math.round(n/N*100)+'%"></i></span><small>'+n+' / 31 окошек</small></span><span class="ks">'+(k.streak?'🔥 '+k.streak+' '+(k.streak===1?'день':k.streak<5?'дня':'дней')+' подряд':'—')+'</span></button>';}).join('');
  var k=K[tSel],ws=[];for(var d in k.s.opened)ws.push([+d,DAYS[k.s.opened[d]]]);ws.sort(function(a,b){return a[0]-b[0];});
  var words=ws.map(function(x){var it=x[1];return '<button type="button" class="tw" data-w="'+esc(dayEn(it))+'"><span class="ti">'+pic(it.tree?'img/tree_'+it.tree+'.webp':doorImg(it))+'</span><span><b>'+esc(dayEn(it))+'</b><small>'+x[0]+' дек · '+esc(dayRu(it))+'</small></span><span class="sp">🔊</span></button>';}).join('');
  $('tview').innerHTML='<div class="plaque"><span class="vn">Вариант 6 · Глазами учителя</span><span class="vt">Так учитель видит адвент своих учеников: кто сколько окошек открыл, какие слова собрал, как выглядит ёлка — и за что похвалить на уроке. Имена вымышленные.</span></div>'+
   '<div class="tgrid"><div class="tcard"><h3>👩‍🏫 Группа Super Minds 2 · среда 17:00</h3><p class="hint" style="margin:0">Сегодня 20 декабря. Нажмите на ученика.</p><div class="klist">'+rows+'</div></div>'+
   '<div class="tcard"><div class="khead"><span class="ava big">'+k.name[0]+'</span><div><h3>'+k.name+'</h3><small class="hint">Открыто '+ws.length+' из 31 · на ёлке '+k.s.placed.length+' украшений · заходил(а): '+k.last+'</small></div></div>'+
