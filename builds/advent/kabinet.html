<title>Кабинет ученика — адвент</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Кабинет ученика на весь экран: слева меню, справа содержимое; на телефоне меню снизу.
   Стиль кабинета: кремово-персиковый фон, белые карточки ~26px, фиолетовый и розовый, жёлтые монеты.
   Один светлый вид намеренно — так выглядит настоящий кабинет. */
:root{
  --bg:#FFF4EC; --card:#FFFFFF; --ink:#2B2140; --muted:#6B6280; --line:#F0E2D6;
  --violet:#6A4DF4; --violet-soft:#EEE9FF; --pink:#F7628C; --pink-soft:#FFE6EE;
  --coin:#FFC83D; --coin-ink:#6E4A00; --green:#1F8F62; --green-soft:#E3F6EC; --red:#C8364D; --night:#1C2456;
  --ff-head:"Montserrat","Segoe UI",Arial,sans-serif; --ff-body:"Nunito","Segoe UI",Arial,sans-serif;
  --r:26px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff-body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--ff-head);margin:0;line-height:1.15;text-wrap:balance}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;padding-left:max(14px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--ff-head);font-weight:900;font-size:24px;color:var(--violet);padding:0 10px 14px}
.logo span{color:var(--pink)}
.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:16px;font-family:var(--ff-head);font-weight:700;font-size:15px;color:var(--muted);cursor:pointer;position:relative}
.nav .ic{font-size:20px;width:26px;text-align:center}
.nav:hover{background:var(--bg)}
.nav.on{background:var(--violet-soft);color:var(--violet)}
.nav:focus-visible{outline:3px solid var(--violet);outline-offset:1px}
.nav.xmas{color:#fff;background:linear-gradient(135deg,#2F3C8F,#1C2456);margin-top:6px;animation:glow 1.8s ease-in-out infinite}
.nav.xmas.on{outline:3px solid var(--coin)}
.dot{position:absolute;right:10px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;border-radius:11px;background:var(--pink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 6px;animation:pulse 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 6px rgba(255,200,61,.38)}}
@keyframes pulse{50%{transform:translateY(-50%) scale(1.18)}}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--bg)}
.ava{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-family:var(--ff-head);font-weight:900;display:grid;place-items:center;flex:none}
.me b{font-family:var(--ff-head);display:block;font-size:14px}
.me small{color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:16px 26px;padding-right:max(26px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:5;background:var(--bg)}
.top h1{font-size:24px;font-weight:900;flex:1;min-width:0}
.coins{font-family:var(--ff-head);font-weight:900;background:var(--coin);color:var(--coin-ink);padding:8px 14px;border-radius:999px;font-variant-numeric:tabular-nums;transition:transform .2s;white-space:nowrap;border:0;cursor:pointer}
.coins:hover{filter:brightness(1.05)}
.coins:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.coins.bump{transform:scale(1.2)}
.streak{font-family:var(--ff-head);font-weight:800;background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:999px;white-space:nowrap}
.page{padding:4px 26px 120px;padding-right:max(26px,env(safe-area-inset-right,0px));flex:1}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:17px}
.sub{color:var(--muted);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-head);font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;align-self:flex-start}
.p-coin{background:var(--coin);color:var(--coin-ink)}.p-violet{background:var(--violet-soft);color:var(--violet)}.p-pink{background:var(--pink-soft);color:#B8325C}.p-green{background:var(--green-soft);color:var(--green)}
.btn{font-family:var(--ff-head);font-weight:800;border:0;border-radius:14px;padding:11px 18px;cursor:pointer;background:var(--violet);color:#fff;font-size:14px;align-self:flex-start}
.btn.pink{background:var(--pink)}.btn.ghost{background:var(--violet-soft);color:var(--violet)}.btn.sm{padding:8px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.hero{border-radius:30px;padding:26px;color:#fff;position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:10px;cursor:pointer;margin-bottom:16px;background:linear-gradient(90deg,rgba(20,26,70,.92) 0%,rgba(20,26,70,.7) 45%,rgba(20,26,70,0) 75%),url(img/bg_night.webp) center 70%/cover no-repeat,var(--night);animation:heroGlow 2.2s ease-in-out infinite}
@keyframes heroGlow{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,0)}50%{box-shadow:0 0 0 7px rgba(255,200,61,.45)}}
.hero h2{font-size:clamp(22px,3vw,30px);font-weight:900;max-width:60%}
.hero p{max-width:55%;color:#E4E8FF;margin:0}
.hero .tr{position:absolute;right:4%;bottom:-4%;height:118%;max-width:40%;object-fit:contain;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.hero .new{background:var(--pink);font-family:var(--ff-head);font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;align-self:flex-start;animation:bounce 1.2s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-3px) scale(1.05)}}
.hero:focus-visible{outline:4px solid var(--coin);outline-offset:3px}
.hw{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--bg)}
.hw .em{font-size:26px}
.hw b{font-family:var(--ff-head);font-size:14px;display:block}
.wheel{width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--pink) 0 60deg,var(--coin) 0 120deg,var(--violet) 0 180deg,#3E9BEA 0 240deg,var(--green) 0 300deg,#FF8A3D 0);border:6px solid #fff;box-shadow:0 0 0 2px var(--line);align-self:center}
.bigcoin{font-family:var(--ff-head);font-weight:900;font-size:34px;color:var(--coin-ink);font-variant-numeric:tabular-nums}
.adv-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.adv-tabs button{font-family:var(--ff-head);font-weight:800;font-size:15px;border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:999px;cursor:pointer}
.adv-tabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.today{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;margin-bottom:12px}
.today .date{font-family:var(--ff-head);font-weight:900;font-size:16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-left:auto}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:18px;height:18px;border-radius:6px;display:inline-block}
.scene{position:relative;border-radius:26px;overflow:hidden;background:var(--night) url(img/bg_night.webp) center bottom/cover no-repeat;aspect-ratio:16/9;max-height:calc(100vh - 230px);margin-inline:auto;max-width:100%}
.snowfall{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(2px 2px at 20% 30%,#fff9,transparent),radial-gradient(2px 2px at 70% 20%,#fff9,transparent),radial-gradient(3px 3px at 40% 70%,#fff7,transparent),radial-gradient(2px 2px at 85% 60%,#fff9,transparent);background-size:240px 240px;animation:snow 16s linear infinite}
@keyframes snow{to{background-position:0 240px,0 240px,0 240px,0 240px}}
.door{position:absolute;width:7%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:none;padding:0;cursor:pointer;transition:transform .15s}
.door:hover{transform:translate(-50%,-50%) scale(1.12) rotate(-3deg)}
.door:focus-visible{outline:3px solid var(--coin);outline-offset:3px;border-radius:14px}
.door img{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.door .num{position:absolute;left:-6%;top:-8%;min-width:30%;aspect-ratio:1;border-radius:50%;background:#fff;color:var(--night);font-family:var(--ff-head);font-weight:900;font-size:clamp(10px,1.1vw,14px);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.35);padding:2px}
.door.today .num{background:var(--pink);color:#fff}
.door.today{animation:todayGlow 1.4s ease-in-out infinite}
@keyframes todayGlow{50%{transform:translate(-50%,-50%) scale(1.12)}}
.door.today::before{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(255,220,120,.55),transparent 65%)}
.door.missed img{filter:grayscale(.9) brightness(.75) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.door .coinb{position:absolute;right:-8%;bottom:-6%;background:var(--coin);color:var(--coin-ink);font-family:var(--ff-head);font-weight:900;font-size:clamp(9px,1vw,12px);border-radius:999px;padding:2px 6px;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.door.future img{filter:grayscale(1) brightness(1.6) opacity(.38)}
.door.future .num{background:#ffffffaa}
.door .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(14px,1.8vw,22px)}
.door.shake{animation:shake .5s}
@keyframes shake{25%{transform:translate(-50%,-50%) rotate(-12deg)}75%{transform:translate(-50%,-50%) rotate(12deg)}}
.dopen{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#ffffff22;box-shadow:inset 0 0 0 2px #ffffff77;padding:16%}
img.pic{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none}
.treebox{display:grid;grid-template-columns:minmax(290px,1fr) minmax(0,1.35fr);gap:16px;align-items:start}
.treearea{position:relative;border-radius:26px;background:var(--night) url(img/bg_night.webp) center bottom/cover no-repeat;height:calc(100vh - 190px);min-height:460px;overflow:hidden;touch-action:none}
.treearea .tree{position:absolute;left:10%;right:10%;top:7%;bottom:3%}
.placed{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none}
.placed.wide{width:30%;aspect-ratio:4/1}
.placed.top{width:18%}
.placed img{filter:drop-shadow(0 4px 5px rgba(0,0,0,.4))}
.placed.dragging{cursor:grabbing;z-index:5}
.placed.sel{outline:3px dashed #fff;outline-offset:3px;border-radius:12px}
.tool{position:absolute;z-index:6;display:flex;gap:6px;transform:translate(-50%,0)}
.tool button{border:0;border-radius:12px;background:#fff;padding:7px 10px;font-family:var(--ff-head);font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);white-space:nowrap}
.chest{background:var(--card);border-radius:26px;border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.chest-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chest-head h3{flex:1}
.chest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;padding:2px}
.slot{position:relative;background:var(--bg);border-radius:18px;aspect-ratio:1;border:2px solid var(--line);display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;padding:10px 10px 16px}
.slot .cnt{position:absolute;right:5px;top:5px;background:var(--violet);color:#fff;font-family:var(--ff-head);font-weight:800;font-size:11px;border-radius:999px;padding:1px 7px}
.slot .nm{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:10px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slot.none .pic{filter:grayscale(1);opacity:.4}
.slot.none .cnt{background:var(--coin);color:var(--coin-ink)}
.slot.locked{cursor:pointer;background:#F3EEF8}
.slot.locked .pic{filter:grayscale(1) brightness(.2);opacity:.25}
.slot.locked::after{content:"🔒";position:absolute;font-size:18px}
.slot.open{border-color:var(--violet)}
.slot:focus-visible{outline:3px solid var(--violet)}
.pop{position:absolute;z-index:20;background:#fff;border-radius:20px;box-shadow:0 16px 40px -12px rgba(40,20,90,.45);border:1px solid var(--line);padding:12px;width:min(340px,calc(100% - 8px));left:4px}
.pop::after{content:"";position:absolute;bottom:-8px;width:16px;height:16px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg);left:var(--ax,40px)}
.pop.below::after{bottom:auto;top:-8px;transform:rotate(225deg)}
.pop h4{margin:0 0 8px;font-family:var(--ff-head);font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.swi{position:relative;width:58px;height:58px;border-radius:14px;border:2px solid var(--line);background:var(--bg);padding:6px;cursor:pointer;touch-action:none}
.swi.own{border-color:var(--green);background:#F2FBF6;box-shadow:0 0 0 3px #1F8F6222}
.swi.not .pic{filter:grayscale(1);opacity:.35}
.swi.lockd .pic{filter:grayscale(1) brightness(.2);opacity:.25}
.swi.lockd::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:16px}
.swi.cur{outline:3px solid var(--violet);outline-offset:1px}
.swi .c{position:absolute;right:-6px;top:-6px;background:var(--green);color:#fff;font-size:10px;font-weight:900;border-radius:999px;padding:1px 6px}
.swi.not .c{background:var(--coin);color:var(--coin-ink)}
.act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.act b{font-family:var(--ff-head)}
.act .t{color:var(--muted);font-size:13px;flex:1;min-width:100px}
.mini-say{border:0;background:var(--violet-soft);color:var(--violet);border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none}
.dragghost{position:fixed;z-index:100;pointer-events:none;width:80px;height:80px;transform:translate(-50%,-50%)}
.dragghost img{filter:drop-shadow(0 10px 12px rgba(0,0,0,.35))}
.trees{display:flex;gap:8px;flex-wrap:wrap}
.trees button{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:4px;cursor:pointer;width:60px;height:74px;position:relative}
.trees button.on{border-color:var(--violet)}
.trees button:disabled{cursor:not-allowed}
.trees button:disabled .pic{filter:grayscale(1);opacity:.3}
.trees .lk{position:absolute;inset:0;display:grid;place-items:center}
.hint{font-size:13px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(28,36,86,.62);display:grid;place-items:center;padding:16px}
.mcard{background:var(--card);border-radius:30px;padding:24px;max-width:400px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .4s cubic-bezier(.2,1.5,.4,1);max-height:calc(100vh - 32px);overflow:auto}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}}
.mcard .eb{font-family:var(--ff-head);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--pink)}
.mcard .art{width:180px;height:180px}
.mcard .word{font-family:var(--ff-head);font-weight:900;font-size:30px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.say{border:0;background:var(--violet-soft);color:var(--violet);border-radius:50%;width:48px;height:48px;font-size:22px;cursor:pointer;flex:none}
.mcard .trn{color:var(--muted);font-size:19px}
.mcard .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mcard .btns .btn{align-self:auto}
.mcard.wide{max-width:520px;text-align:left;align-items:stretch}
.ledger{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.lrow .ic{font-size:20px;width:28px;text-align:center}
.lrow .w{flex:1;min-width:0}
.lrow .w small{display:block;color:var(--muted)}
.lrow .a{font-family:var(--ff-head);font-weight:900;font-variant-numeric:tabular-nums}
.lrow .a.plus{color:var(--green)}.lrow .a.minus{color:var(--red)}
.ctiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ct{background:var(--bg);border-radius:16px;padding:10px;text-align:center}
.ct b{display:block;font-family:var(--ff-head);font-size:22px;font-variant-numeric:tabular-nums}
.ct small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;z-index:80;max-width:90vw;text-align:center}
.demo{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;background:#fff;border:2px dashed var(--violet);border-radius:18px;padding:8px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;box-shadow:0 8px 24px -14px rgba(60,30,120,.5);max-width:calc(100vw - 28px)}
.demo b{font-family:var(--ff-head);color:var(--violet);padding:0 4px}
.demo .seg{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 10px;font-weight:800;cursor:pointer;font-family:var(--ff-head);font-size:12px}
.demo .seg.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.demo .x{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-weight:700;cursor:pointer}
.bnav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px}
  .top h1{font-size:19px}
  .page{padding:4px 16px 190px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bnav .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;width:auto;text-align:center}
  .bnav .nav .ic{font-size:22px}
  .bnav .dot{right:2px;top:6px;transform:none;animation:none}
  .demo{bottom:calc(74px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px))}
  .hero h2,.hero p{max-width:62%}
  .treebox{grid-template-columns:1fr}
  .treearea{height:60vh;order:-1}
  .scene{aspect-ratio:3/4;max-height:none}
  .door{width:13%}
  .streak{display:none}
  .legend{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <div class="top"><h1 id="ttl">Привет, Маша! 👋</h1><span class="streak">🔥 5 дней подряд</span><button type="button" class="coins" id="coins" title="Мои монетки">🪙 0</button></div>
    <div class="page" id="page"></div>
  </div>
</div>
<nav class="bnav" id="bnav"></nav>
<div class="demo" id="demo"></div>

<script>
(function(){
"use strict";
var HAVE=['red_ball','blue_ball','green_ball','gold_ball','purple_ball','silver_ball','bell','star','candy_cane','snowflake','gingerbread','bow','pine_cone','garland','fairy_lights','tinsel','tree_pine','tree_gold','tree_snowy','heart','stocking','present','snowman','reindeer','mitten','top_star','icicle','sweet','angel','cracker','clock','gift1','gift2','gift3','gift4','gift5','gift6'];

    var own=0,ever=0,unl=false;c.items.forEach(function(k){own+=S.chest[k]||0;ever+=(S.chest[k]||0)+onTree(k);if(unlocked(k))unl=true;});

    var st=ever>0?'own':unl?'none':'locked';
    var nm=c.items.length>1?c.name:(st==='locked'?'???':c.name);
    h+='<div class="slot '+st+(openCell===c.id?' open':'')+'" data-c="'+c.id+'" tabindex="0" aria-label="'+esc(nm)+'">'+art(byK(rep))+
      (st==='own'?'<span class="cnt">'+(own||'🎄')+'</span>':st==='none'?'<span class="cnt">🪙</span>':'')+'<span class="nm">'+esc(nm)+'</span></div>';});
  h+='</div><h3>Моя ёлка</h3><div class="trees">'+['pine','snowy','gold'].map(function(t){return '<button type="button" data-tree="'+t+'" class="'+(S.tree===t?'on':'')+'" '+(has[t]?'':'disabled title="Выпадет в календаре"')+' aria-label="Ёлка">'+pic('tree_'+t)+(has[t]?'':'<span class="lk">🔒</span>')+'</button>';}).join('')+'</div>'+
   '<div><button type="button" class="btn ghost sm" id="allBack">Снять всё в сундук</button></div></div>'+
   '<div class="treearea" id="area"><div class="snowfall"></div><div class="tree">'+pic('tree_'+S.tree)+'</div></div></div>';
  $('adv').innerHTML=h;
  var area=$('area');
  S.placed.forEach(function(pl){addPlaced(area,pl);});
  area.addEventListener('pointerdown',function(e){if(e.target===area||e.target.closest('.tree'))clearTool();});
  [].forEach.call(document.querySelectorAll('.trees button'),function(b){b.onclick=function(){S.tree=b.dataset.tree;save();renderTree();};});
  $('allBack').onclick=function(){if(!S.placed.length){toast('На ёлке пока ничего нет');return;}
    var m=modal('<div class="mcard"><h3>Снять все украшения с ёлки?</h3><p class="hint" style="margin:0">Они вернутся в сундук, ничего не пропадёт.</p><div class="btns"><button type="button" class="btn" id="y">Снять</button><button type="button" class="btn ghost" data-close>Нет</button></div></div>');
    m.querySelector('#y').onclick=function(){m.remove();S.placed.forEach(function(p){S.chest[p.k]=(S.chest[p.k]||0)+1;});S.placed=[];save();renderTree();};};
  var hover=window.matchMedia('(hover:hover)').matches;
  [].forEach.call(document.querySelectorAll('.slot'),function(sl){
    var c=cellOf(sl.dataset.c);
    if(hover)sl.addEventListener('mouseenter',function(){if(openCell!==c.id)openPop(c,sl);});
    drag(sl,{ok:function(){if(pickOf(c))return true;openPop(c,sl,true);return false;},ghost:function(){return art(byK(pickOf(c)));},
      tap:function(){openPop(c,sl,true);var k=pickOf(c)||c.items.filter(unlocked)[0];if(k)word(byK(k));else toast('Это украшение ещё не выпало — открывай окошки 🎁');},
      drop:function(x,y){placeAt(pickOf(c),x,y);}});
    sl.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openPop(c,sl,true);}};
  });
  if(openCell){var sl=document.querySelector('.slot[data-c="'+openCell+'"]');if(sl)openPop(cellOf(openCell),sl,true);}
}
function onTree(k){return S.placed.filter(function(p){return p.k===k;}).length;}
function pickOf(c){var k=curPick[c.id];if(k&&(S.chest[k]||0)>0)return k;for(var i=0;i<c.items.length;i++)if((S.chest[c.items[i]]||0)>0)return c.items[i];return null;}
function placeAt(k,x,y){
  if(!k)return;var it=byK(k),area=$('area'),r=area.getBoundingClientRect();
  if(x<r.left||x>r.right||y<r.top||y>r.bottom)return;
  var pl={id:Date.now(),k:k,x:cl((x-r.left)/r.width*100),y:cl((y-r.top)/r.height*100)};
  if(it.top){S.placed=S.placed.filter(function(p){if(byK(p.k).top){S.chest[p.k]=(S.chest[p.k]||0)+1;return false;}return true;});pl.x=50;pl.y=9;}
  S.chest[k]--;S.placed.push(pl);save();renderTree();say(it.w);
}
/* окошко над ячейкой: все цвета; свои — яркие, некупленные — серые, невыпавшие — с замком */
function openPop(c,sl,sticky){
  var old=document.querySelector('.pop');if(old)old.remove();openCell=c.id;
  [].forEach.call(document.querySelectorAll('.slot.open'),function(e){e.classList.remove('open');});sl.classList.add('open');
  var box=$('chestBox'),pop=document.createElement('div');pop.className='pop';
  if(!curPick[c.id]||c.items.indexOf(curPick[c.id])<0)curPick[c.id]=pickOf(c)||c.items.filter(unlocked)[0]||c.items[0];
  function sws(){return c.items.map(function(k){var n=S.chest[k]||0,ot=onTree(k),u=unlocked(k),cls=n+ot>0?'own':u?'not':'lockd';
    return '<div class="swi '+cls+(k===curPick[c.id]?' cur':'')+'" data-k="'+k+'" title="'+esc(u?byK(k).w:'ещё не выпало')+'">'+art(byK(k))+(n>0?'<span class="c">'+n+'</span>':ot>0?'<span class="c">🎄</span>':u?'<span class="c">🪙'+byK(k).p+'</span>':'')+'</div>';}).join('');}
  pop.innerHTML='<h4>'+esc(c.items.length>1?c.name+' — все цвета':(unlocked(c.items[0])?byK(c.items[0]).w:'Пока секрет 🤫'))+'</h4><div class="sw" id="sw">'+sws()+'</div><div class="act" id="act"></div>';
  box.appendChild(pop);
  var bR=box.getBoundingClientRect(),sR=sl.getBoundingClientRect();
  var top=sR.top-bR.top-pop.offsetHeight-12,below=false;if(top<4){top=sR.bottom-bR.top+12;below=true;}
  pop.style.top=top+'px';if(below)pop.classList.add('below');
  var left=Math.max(4,Math.min(sR.left-bR.left-10,bR.width-pop.offsetWidth-4));pop.style.left=left+'px';
  pop.style.setProperty('--ax',(sR.left-bR.left-left+sR.width/2-8)+'px');
  function act(){var k=curPick[c.id],it=byK(k),n=S.chest[k]||0,u=unlocked(k),a=pop.querySelector('#act');
    if(!u){a.innerHTML='<span class="t">🔒 Это украшение ещё не выпало. Открывай окошки в календаре — оно там есть!</span>';return;}
    a.innerHTML='<button type="button" class="mini-say" aria-label="Послушать">🔊</button><div class="t"><b>'+esc(it.w)+'</b> — '+esc(it.t)+'<br>в сундуке: '+n+(onTree(k)?' · на ёлке: '+onTree(k):'')+(n?' · тяни на ёлку':'')+'</div>'+(it.p?'<button type="button" class="btn sm" id="buy">'+(n?'Ещё одну':'Купить')+' · 🪙 '+it.p+'</button>':'');
    a.querySelector('.mini-say').onclick=function(){say(it.w);};
    var b=a.querySelector('#buy');if(b)b.onclick=function(){if(!spend(it.p,'🎄','Украшение: '+it.w))return;S.chest[k]=(S.chest[k]||0)+1;save();say(it.w);toast(it.w+' — в сундуке 🧰 (−'+it.p+' 🪙)');renderTree();};
  }
  act();
  [].forEach.call(pop.querySelectorAll('.swi'),function(s){var k=s.dataset.k;
    drag(s,{ok:function(){return (S.chest[k]||0)>0;},ghost:function(){return art(byK(k));},
      tap:function(){curPick[c.id]=k;[].forEach.call(pop.querySelectorAll('.swi'),function(e){e.classList.toggle('cur',e===s);});act();if(unlocked(k))say(byK(k).w);},
      drop:function(x,y){curPick[c.id]=k;placeAt(k,x,y);}});});
  if(!sticky&&window.matchMedia('(hover:hover)').matches){
    var leave=function(e){var to=e.relatedTarget;if(to&&(pop.contains(to)||sl.contains(to)))return;closePop();};
    pop.addEventListener('mouseleave',leave);sl.addEventListener('mouseleave',leave,{once:true});}
}
function closePop(){var p=document.querySelector('.pop');if(p)p.remove();openCell=null;[].forEach.call(document.querySelectorAll('.slot.open'),function(e){e.classList.remove('open');});}
document.addEventListener('pointerdown',function(e){if(!e.target.closest('.pop')&&!e.target.closest('.slot')&&!e.target.closest('.modal'))closePop();});
function cl(v){return Math.max(4,Math.min(96,v));}
function clearTool(){var t=document.querySelector('.tool');if(t)t.remove();[].forEach.call(document.querySelectorAll('.placed.sel'),function(e){e.classList.remove('sel');});}
function toChest(pl){S.placed=S.placed.filter(function(p){return p.id!==pl.id;});S.chest[pl.k]=(S.chest[pl.k]||0)+1;save();renderTree();toast(byK(pl.k).w+' — в сундуке 🧰');}
function addPlaced(area,pl){
  var it=byK(pl.k),el=document.createElement('div');
  el.className='placed'+(it.wide?' wide':'')+(it.top?' top':'');el.style.left=pl.x+'%';el.style.top=pl.y+'%';el.innerHTML=art(it);el.setAttribute('aria-label',it.w);
  area.appendChild(el);
  drag(el,{ok:function(){clearTool();return true;},move:true,
    tap:function(){word(it);clearTool();el.classList.add('sel');
      var t=document.createElement('div');t.className='tool';t.style.left=pl.x+'%';t.style.top='calc('+pl.y+'% + 38px)';
      t.innerHTML='<button type="button">🔊 '+esc(it.w)+'</button><button type="button">↩ В сундук</button>';
      area.appendChild(t);var bs=t.querySelectorAll('button');bs[0].onclick=function(){say(it.w);};bs[1].onclick=function(){toChest(pl);};},
    drop:function(x,y){var r=area.getBoundingClientRect();
      if(x<r.left||x>r.right||y<r.top||y>r.bottom){toChest(pl);return;}
      pl.x=cl((x-r.left)/r.width*100);pl.y=cl((y-r.top)/r.height*100);if(it.top){pl.x=50;pl.y=9;}save();renderTree();}});
}
/* перетаскивание пальцем и мышью: Pointer Events, призрак у курсора */
function drag(el,o){
  el.addEventListener('pointerdown',function(e){
    if(e.button>0)return;e.stopPropagation();var sx=e.clientX,sy=e.clientY,moved=false,g=null,dead=false;
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    function mv(ev){
      if(dead)return;if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)<6)return;
      if(!moved){if(!o.ok()){dead=true;return;}moved=true;
        if(o.move)el.classList.add('dragging');else{g=document.createElement('div');g.className='dragghost';g.innerHTML=o.ghost();document.body.appendChild(g);closePop();}}
      if(o.move){var r=el.parentNode.getBoundingClientRect();el.style.left=((ev.clientX-r.left)/r.width*100)+'%';el.style.top=((ev.clientY-r.top)/r.height*100)+'%';}
      else{g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';}
    }
    function up(ev){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);
      if(g)g.remove();el.classList.remove('dragging');
      if(dead)return;if(!moved){o.tap();return;}o.drop(ev.clientX,ev.clientY);}
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}

/* переключатель вариантов показа */
function renderDemo(){
  $('demo').innerHTML='<b>Показ:</b><button type="button" class="seg'+(ALL.cur==='test'?' on':'')+'" data-m="test">1 · Тест: всё открыто</button><button type="button" class="seg'+(ALL.cur==='miss'?' on':'')+'" data-m="miss">2 · 20 декабря, есть пропуски</button><button type="button" class="x" id="dReset" title="Начать этот вариант сначала">↺ сначала</button>';
  [].forEach.call(document.querySelectorAll('.demo .seg'),function(b){b.onclick=function(){var page=S.page,tab=S.tab;ALL.cur=b.dataset.m;S=ALL[ALL.cur];S.page=page;S.tab=tab;save();render();};});
  $('dReset').onclick=function(){var m=modal('<div class="mcard"><h3>Начать вариант «'+(ALL.cur==='test'?'Тест':'20 декабря')+'» сначала?</h3><div class="btns"><button type="button" class="btn" id="y">Да</button><button type="button" class="btn ghost" data-close>Нет</button></div></div>');
    m.querySelector('#y').onclick=function(){m.remove();var page=S.page,tab=S.tab;ALL[ALL.cur]=ALL.cur==='test'?freshTest():freshMiss();S=ALL[ALL.cur];S.page=page;S.tab=tab;save();render();};};
}

function render(){
  closePop();renderNav();renderDemo();showCoins(false);
  $('ttl').textContent=S.page==='advent'?'🎄 Мой адвент-календарь':S.page==='home'?'Привет, Маша! 👋':{hw:'Домашка',trainer:'Тренажёр',sched:'Расписание',shopw:'Колесо и призы'}[S.page];
  if(S.page==='home')renderHome();else if(S.page==='advent')renderAdvent();else renderStub(S.page);
}
$('coins').onclick=coinsModal;
HAVE.forEach(function(k){var i=new Image();i.src=IMG[k];});   // картинки заранее — без пауз
render();
})();
</script>
